// Faixa de volume semanal (km) por prova-alvo e nível — a progressão semanal nunca sai dessa faixa.
const VDOT_WEEKLY_KM_RANGE = {
  iniciante:    { 5:[15,25], 10:[20,30], '21.0975':[25,35], '42.195':[30,45] },
  intermediario:{ 5:[25,40], 10:[30,45], '21.0975':[35,55], '42.195':[45,70] },
  avancado:     { 5:[40,60], 10:[45,65], '21.0975':[55,80], '42.195':[70,110] },
};
// Daniels: o longão fica entre ~30-35% do volume semanal total — usa o meio da faixa como teto de conversão.
const VDOT_LONG_RUN_PCT = 0.32;
const VDOT_EASY_WOBBLE_PCT = [0, -0.15, 0.12, -0.08, 0.18, 0.05, -0.12];
// Teto por nível pro dia fácil — evita que escolher poucos dias de treino por semana infle
// demais cada corrida fácil só pra "encaixar" o volume da semana.
const VDOT_EASY_CEIL_KM = { iniciante:6, intermediario:10, avancado:14 };
// Aquecimento/desaquecimento em MINUTOS por nível (não km fixo) — assim a duração não encolhe/cresce
// sozinha conforme o pace melhora, e cada nível aquece pelo tempo que faz sentido pra ele.
const VDOT_WARMUP_MIN = { iniciante:7, intermediario:13, avancado:17 };
const VDOT_COOLDOWN_MIN = { iniciante:5, intermediario:10, avancado:12 };
function kmFromMinAtPace(min, paceDaysPerKm){ return (min*60) / (paceDaysPerKm*86400); }
// Duração do polimento depende da prova (não é uma fatia proporcional do total de semanas), e cada
// semana de polimento reduz uma % fixa em relação ao pico — nunca ao longão de treino que ela mesma teria.
const VDOT_TAPER_WEEKS_BY_GOAL = { 5:1, 10:1, '21.0975':2, '42.195':3 };
const VDOT_TAPER_PCT = { 1:[-35], 2:[-20,-45], 3:[-20,-35,-55] };

function buildVdotPhases(totalWeeks, goal){
  const desiredTaper = VDOT_TAPER_WEEKS_BY_GOAL[goal] || 1;
  const taper = Math.min(desiredTaper, Math.max(1, totalWeeks-3));
  const remaining = totalWeeks - taper;
  let base = Math.round(remaining*0.35);
  let intro = Math.round(remaining*0.30);
  let peak = remaining - base - intro;
  if(peak < 1){ peak = 1; intro = Math.max(1, remaining - base - peak); }
  if(intro < 1) intro = 1;
  base = Math.max(1, remaining - intro - peak);
  return [
    { key:'base', nome:'Construção', weeks:base, cor:'var(--blue)', foco:'Só corrida fácil + longão crescendo aos poucos' },
    { key:'intro', nome:'Ganho de ritmo', weeks:intro, cor:'var(--accent)', foco:'Entra repetição leve (R), mantém longão' },
    { key:'peak', nome:'Intensidade máxima', weeks:peak, cor:'var(--amber)', foco:'Entra limiar (T) e intervalado (I)' },
    { key:'taper', nome:'Descanso pré-prova', weeks:taper, cor:'var(--danger)', foco:'Reduz volume, ritmo de prova, chega descansado' },
  ];
}
// Volume semanal total: cresce no máx +10%/semana a partir do piso da faixa, nunca passa do teto, e a
// cada 4 semanas dá uma semana de descarga (-25%, dentro dos 20-30% pedidos) antes de seguir subindo.
function buildWeeklyVolumeProgression(buildWeeks, minKm, maxKm){
  const targets = [];
  let current = minKm;
  for(let w=1; w<=buildWeeks; w++){
    const isDeload = (w % 4 === 0) && w < buildWeeks;
    if(isDeload) current = current * 0.75;
    else if(w > 1) current = Math.min(current * 1.10, maxKm);
    targets.push(Math.max(minKm*0.5, current));
  }
  return targets;
}
const VDOT_EASY_NAMES = ['Rodagem Leve', 'Corrida Regenerativa', 'Rodagem Base', 'Corrida Solta'];
function shortOf(label){ return label.split(',')[0]; }
function pickVariantWithCap(variants, weekNumber, maxKm){
  const eligible = variants.filter(v=>v.km <= maxKm);
  if(!eligible.length) return null;
  return eligible[weekNumber % eligible.length];
}
// Escolhe quais dias (índices, sempre excluindo o último — reservado pro longão) recebem sessão de
// qualidade, sem deixar 2 seguidos. "Longão nunca ao lado de treino intenso" é regra dura — o slot colado
// nele só entra em jogo se não sobrar nenhum outro jeito de encaixar nem 1 sessão de qualidade na semana;
// nesses casos preferimos entregar menos sessões de qualidade a violar essa regra.
function pickQualityIndices(numDays, qCount){
  if(qCount <= 0) return [];
  const candidates = [];
  for(let i=0;i<numDays-1;i++) candidates.push(i);
  const avoidLast = numDays-2;
  const safeCandidates = candidates.length>1 ? candidates.filter(i=>i!==avoidLast) : candidates;
  const chosen = [];
  for(let i=0; i<safeCandidates.length && chosen.length<qCount; i++){
    const idx = safeCandidates[i];
    if(chosen.some(c=>Math.abs(c-idx)<=1)) continue;
    chosen.push(idx);
  }
  return chosen.sort((a,b)=>a-b);
}
function buildVdotWeekDays(weekMeta, nivel, paces, goal, diasArr, isLastWeek, raceTimeSec, weeklyTotalKm, longKm){
  const { phaseKey, weekNumber } = weekMeta;
  const days = diasArr;
  const otherDaysCount = Math.max(1, days.length - 1);
  // Com poucos dias de corrida (3-4/semana) não sobra espaço pra "dia de enchimento" — sobe 1 sessão de
  // qualidade extra, mas só pro avançado (intermediário nunca passa de 1/semana, iniciante nunca tem
  // sessão de intensidade de verdade) — e nunca estoura o teto do próprio nível.
  const baseQCount = phaseKey==='base' ? 0 : phaseKey==='peak' ? VDOT_QUALITY_BY_LEVEL[nivel] : Math.min(1, VDOT_QUALITY_BY_LEVEL[nivel]);
  const freqBonus = (nivel==='avancado' && phaseKey!=='taper' && phaseKey!=='base' && days.length<=4) ? 1 : 0;
  const qCount = nivel==='iniciante' ? 0 : Math.min(otherDaysCount, VDOT_QUALITY_BY_LEVEL[nivel], baseQCount + freqBonus);
  const easyPaceStr = `${daysToPaceStr(paces.Ef)} ~ ${daysToPaceStr(paces.Es)}/km`;

  function easyStep(km, pace, name){ return { name, km, pace, desc:`Trote leve, ${fmtKm(km)}` }; }

  // Na semana da prova, os outros dias precisam ser leves em relação à PROVA (não ao longão de treino
  // que a fórmula de polimento calcularia) — ninguém treina mais forte que a própria prova na semana dela.
  const derivationLongKm = isLastWeek ? Math.min(longKm, Math.max(3, goal*0.5)) : longKm;
  const easyDaysCount = Math.max(1, days.length - 1);
  const easyBaseThisWeek = Math.min(VDOT_EASY_CEIL_KM[nivel], Math.max(2, (weeklyTotalKm - derivationLongKm) / easyDaysCount));

  // O longão precisa continuar sendo o maior treino da semana — mesmo que isso signifique não bater
  // o piso da faixa de volume logo nas primeiras semanas (o longão ainda está subindo do que a pessoa
  // já corre hoje). O volume real alcança a faixa conforme o longão cresce ao longo do plano.
  const workouts = days.map((d,i)=>{
    const wobblePct = VDOT_EASY_WOBBLE_PCT[(weekNumber+i) % VDOT_EASY_WOBBLE_PCT.length];
    let km = roundToHalf(Math.max(2, easyBaseThisWeek * (1+wobblePct)));
    km = Math.min(km, derivationLongKm - 0.5);
    // Tiros introdutórios: a única forma de "velocidade" do iniciante (nunca R/T/I de verdade) — e uma
    // variação leve pros demais níveis nos dias fora da sessão de qualidade da semana.
    const isStrideDay = (weekNumber+i) % 3 === 0 && phaseKey !== 'taper';
    const baseName = VDOT_EASY_NAMES[(weekNumber+i) % VDOT_EASY_NAMES.length];
    const title = isStrideDay ? `${baseName} + Tiros` : baseName;
    const mainDesc = `${fmtKm(km)} fácil${isStrideDay ? ' + 4-6 tiros de 20s soltos no final' : ''}`;
    return {
      type:'Fácil', cor:'var(--blue)', label:'Fácil', title,
      mainDesc, mainPace: easyPaceStr,
      warmupDesc:'', warmupPace:'', cooldownDesc:'', cooldownPace:'',
      totalKm: km, totalMin: minFromKmAtPace(km, (paces.Es+paces.Ef)/2),
      steps: [{ name:'Corrida', km, pace:easyPaceStr, desc:mainDesc }],
    };
  });

  workouts[workouts.length-1] = {
    type:'Longão', cor:'var(--green)', label:'Longão', title:`Longão ${fmtKm(longKm)}`,
    mainDesc:`Corrida longa, ${fmtKm(longKm)}`,
    mainPace:`${daysToPaceStr(paces.Es)}/km`,
    warmupDesc:'', warmupPace:'', cooldownDesc:'', cooldownPace:'',
    totalKm: longKm, totalMin: minFromKmAtPace(longKm, paces.Es),
    steps: [{ name:'Corrida longa', km:longKm, pace:`${daysToPaceStr(paces.Es)}/km`, desc:`${fmtKm(longKm)} contínuos` }],
  };

  // Intermediário só revezA T/I (nunca R como foco). Avançado pode revezar T/I/R quando tem 2 sessões
  // na semana. No polimento reduz pra só Limiar (ritmo de prova, sem estímulo novo tão perto da prova).
  const qTypes = phaseKey==='taper' ? ['T'] : nivel==='avancado' && qCount>=2 ? ['T','I','R'] : ['T','I'];
  function tryQualitySession(t){
    const isR = t==='R';
    const warmMin = isR ? Math.round(VDOT_WARMUP_MIN[nivel]*0.6) : VDOT_WARMUP_MIN[nivel];
    const coolMin = isR ? Math.round(VDOT_COOLDOWN_MIN[nivel]*0.6) : VDOT_COOLDOWN_MIN[nivel];
    const wKm = roundToHalf(kmFromMinAtPace(warmMin, paces.Ef));
    const cKm = roundToHalf(kmFromMinAtPace(coolMin, paces.Ef));
    const wStep = easyStep(wKm, easyPaceStr, 'Aquecimento');
    const cStep = easyStep(cKm, easyPaceStr, 'Desaquecimento');
    const maxMainKm = derivationLongKm - wKm - cKm - 0.5;
    let v, type, label, mainPace, titlePrefix, pace;
    if(t==='T'){ v = pickVariantWithCap(VDOT_T_VARIANTS, weekNumber, maxMainKm); type='Limiar'; label='Limiar'; titlePrefix='Limiar'; mainPace = paceRangeWithMargin(paces.T,3)+'/km'; pace = paces.T; }
    else if(t==='I'){ v = pickVariantWithCap(VDOT_I_VARIANTS, weekNumber, maxMainKm); type='Intervalado'; label='Intervalado'; titlePrefix='Intervalado'; mainPace = paceRangeWithMargin(paces.I,3)+'/km'; pace = paces.I; }
    else { v = pickVariantWithCap(VDOT_R_VARIANTS, weekNumber, maxMainKm); type='Repetição'; label='Repetição'; titlePrefix='Repetição'; mainPace = paceRangeWithMargin(paces.R,3)+'/km'; pace = paces.R; }
    if(!v) return null;
    const cor = type==='Limiar' ? 'var(--amber)' : type==='Intervalado' ? 'var(--danger)' : 'var(--rep)';
    const title = `${titlePrefix} ${shortOf(v.label)}`;
    const mStep = { name:'Principal', km:v.km, pace:mainPace, desc:v.label };
    const totalKm = roundToHalf(wStep.km + v.km + cStep.km);
    const totalMin = minFromKmAtPace(wStep.km, paces.Ef) + minFromKmAtPace(cStep.km, paces.Ef) + minFromKmAtPace(v.km, pace);
    return { type, cor, label, title,
      warmupDesc:wStep.desc, warmupPace:wStep.pace, mainDesc:v.label, mainPace, cooldownDesc:cStep.desc, cooldownPace:cStep.pace,
      totalKm, totalMin, steps:[wStep, mStep, cStep] };
  }
  const qIndices = pickQualityIndices(workouts.length, qCount);
  qIndices.forEach((idx, qi)=>{
    const t = qTypes[(weekNumber+qi) % qTypes.length];
    const session = tryQualitySession(t) || tryQualitySession('T');
    if(session) workouts[idx] = session;
  });
  if(isLastWeek){
    workouts[workouts.length-1] = { type:'Prova', cor:'var(--accent)', label:'Dia da prova', title:`Prova · ${VDOT_GOAL_NAME[goal]}`,
      mainDesc:`${VDOT_GOAL_NAME[goal]}`, mainPace:`ritmo alvo ${daysToPaceStr(paces.M)}/km`,
      warmupDesc:'', warmupPace:'', cooldownDesc:'', cooldownPace:'',
      totalKm: goal, totalMin: raceTimeSec/60,
      steps: [{ name:'Prova', km:goal, pace:`${daysToPaceStr(paces.M)}/km`, desc:`${VDOT_GOAL_NAME[goal]} — tempo estimado ${formatClock(raceTimeSec)}` }] };
  }
  return days.map((d,i)=>({ day:d, ...workouts[i] }));
}
function buildAllVdotWeeks(phases, nivel, paces, goal, diasArr, raceTimeSec, startLongKm){
  const weeks = [];
  let weekNumber = 1;
  const totalWeeks = phases.reduce((s,p)=>s+p.weeks,0);
  const taperWeeks = phases[phases.length-1].weeks;
  const buildWeeks = totalWeeks - taperWeeks;
  phases.forEach(p=>{
    for(let w=0; w<p.weeks; w++){
      weeks.push({ weekNumber, phaseKey:p.key, phaseName:p.nome, cor:p.cor, totalWeeks, taperWeeks });
      weekNumber++;
    }
  });

  // Volume semanal: faixa por prova+nível, crescendo no máx 10%/semana com descarga a cada 4 semanas.
  const [minKm, maxKm] = VDOT_WEEKLY_KM_RANGE[nivel][goal] || VDOT_WEEKLY_KM_RANGE[nivel][10];
  const weeklyBuildTargets = buildWeeklyVolumeProgression(buildWeeks, minKm, maxKm);

  // Longão: rampa do que a pessoa já corre hoje até o teto por prova+nível, mas nunca passa de ~32%
  // do volume semanal daquela semana (Daniels) — os dois tetos valem, prevalece o menor.
  const freqFactor = diasArr.length>=5 ? 1 : diasArr.length===4 ? 0.95 : 0.88;
  const longMaxTable = (VDOT_LONG_RUN_MAX_KM[nivel][goal] || VDOT_LONG_RUN_MAX_KM[nivel][10]) * freqFactor;
  const longStart = startLongKm || VDOT_LONG_RUN_START_KM[nivel][goal] || VDOT_LONG_RUN_START_KM[nivel][10];
  const longMax = Math.max(longMaxTable, longStart);
  const longBuildTargets = [];
  for(let w=1; w<=buildWeeks; w++){
    const t = buildWeeks<=1 ? 1 : (w-1)/(buildWeeks-1);
    const ramped = longStart + t*(longMax-longStart);
    longBuildTargets.push(Math.min(ramped, weeklyBuildTargets[w-1]*VDOT_LONG_RUN_PCT));
  }

  const peakWeekly = weeklyBuildTargets[buildWeeks-1];
  const peakLong = longBuildTargets[buildWeeks-1];
  const taperPcts = VDOT_TAPER_PCT[taperWeeks] || VDOT_TAPER_PCT[1];

  return weeks.map(w=>{
    let weeklyTotalKm, longKm;
    if(w.weekNumber <= buildWeeks){
      weeklyTotalKm = weeklyBuildTargets[w.weekNumber-1];
      longKm = longBuildTargets[w.weekNumber-1];
    }else{
      const taperIdx = w.weekNumber - buildWeeks;
      const pct = taperPcts[Math.min(taperIdx-1, taperPcts.length-1)] / 100;
      weeklyTotalKm = Math.max(minKm*0.4, peakWeekly*(1+pct));
      longKm = Math.max(3, peakLong*(1+pct));
    }
    weeklyTotalKm = roundToHalf(weeklyTotalKm);
    longKm = roundToHalf(longKm);
    return { ...w, days: buildVdotWeekDays(w, nivel, paces, goal, diasArr, w.weekNumber===totalWeeks, raceTimeSec, weeklyTotalKm, longKm) };
  });
}
function vdotMondayOf(date){
  const d = new Date(date);
  const dow = (d.getDay()+6)%7; // 0=Mon..6=Sun
  d.setDate(d.getDate()-dow);
  d.setHours(0,0,0,0);
  return d;
}
// Segunda-feira de PARTIDA pra um plano novo: se hoje já é segunda, começa hoje; senão pula pra
// próxima segunda. Nunca usa uma segunda que já passou — gerar um plano no domingo não pode
// preencher a semana com dias de segunda a sábado que já ficaram pra trás (bug real reportado).
function vdotStartMonday(date){
  const d = new Date(date);
  const dow = (d.getDay()+6)%7; // 0=Mon..6=Sun
  if(dow>0) d.setDate(d.getDate() + (7-dow));
  d.setHours(0,0,0,0);
  return d;
}
// Pra agendar UM dia avulso (não a semana 1 de um plano inteiro): a próxima ocorrência daquele dia
// da semana que seja hoje ou no futuro — nunca no passado, e sem pular a semana toda à toa quando
// o próprio dia de hoje já serve (ex: agendar "Domingo" logo no domingo mantém hoje, não empurra
// pra semana que vem).
function nextOccurrenceOfDay(dayAbbrev, fromDate){
  const from = new Date(fromDate);
  from.setHours(0,0,0,0);
  const fromDow = (from.getDay()+6)%7;
  const targetDow = DAY_ABBR.indexOf(dayAbbrev);
  let delta = targetDow - fromDow;
  if(delta<0) delta += 7;
  const d = new Date(from);
  d.setDate(d.getDate()+delta);
  return d;
}
function vdotFormatDDMM(date){
  return String(date.getDate()).padStart(2,'0')+'/'+String(date.getMonth()+1).padStart(2,'0');
}
function vdotISODate(date){
  return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
}
function materializeVdotWeekIntoTreinos(week, startMondayISO){
  const start = new Date(startMondayISO+'T00:00:00');
  const monday = new Date(start);
  monday.setDate(monday.getDate() + (week.weekNumber-1)*7);
  const newEntries = week.days.map(w=>{
    const idx = DAY_ABBR.indexOf(w.day);
    const d = new Date(monday);
    d.setDate(d.getDate()+idx);
    return {
      day: w.day+' '+vdotFormatDDMM(d),
      type: w.title || w.type,
      warmupDesc: w.warmupDesc||'', warmupPace: w.warmupPace||'',
      mainDesc: w.mainDesc||'', mainPace: w.mainPace||'',
      cooldownDesc: w.cooldownDesc||'', cooldownPace: w.cooldownPace||'',
      totalKm: w.totalKm ? Math.round(w.totalKm*10)/10 : '',
      zone: '', objetivo: VDOT_OBJETIVO[w.type] || '', cor: w.cor || 'var(--blue)',
      steps: w.steps || null, totalMin: w.totalMin || null,
      origem: 'vdotplan',
    };
  });
  const activeDays = week.days.map(w=>w.day);
  state.treinos = state.treinos.filter(t => !activeDays.includes(dayAbbrevOf(t.day)));
  state.treinos = state.treinos.concat(newEntries);
  state.isDemo = false;
  saveTreinos();
}

async function saveHistoricoCarga(){ try{ await window.storage.set('historicoCarga', JSON.stringify(state.historicoCarga), false); }catch(e){} }
// Um registro por dia (não só quando o valor muda) — assim toda vez que você loga vira um ponto na
// evolução, mesmo repetindo o mesmo peso/medida de antes.
function logCargaHistory(key, carga){
  if(!key || carga === '' || carga == null) return;
  if(!state.historicoCarga) state.historicoCarga = {};
  const hist = state.historicoCarga[key] || (state.historicoCarga[key]=[]);
  const today = todayISO();
  const last = hist[hist.length-1];
  if(last && last.data === today) last.carga = carga;
  else hist.push({ data: today, carga });
  if(hist.length>200) hist.shift();
  saveHistoricoCarga();
}
// Registro por série (peso+reps de cada uma), igual apps de treino de força de verdade — substitui um
// único valor de carga por sessão. Entradas antigas com só "carga" continuam legíveis (compatibilidade).
function logSetsHistory(key, sets){
  if(!key || !sets || !sets.length) return;
  if(!state.historicoCarga) state.historicoCarga = {};
  const hist = state.historicoCarga[key] || (state.historicoCarga[key]=[]);
  const today = todayISO();
  const last = hist[hist.length-1];
  if(last && last.data === today){ last.sets = sets; delete last.carga; }
  else hist.push({ data: today, sets });
  if(hist.length>200) hist.shift();
  saveHistoricoCarga();
}
function topSetWeight(entry){
  if(entry.sets && entry.sets.length) return Math.max(...entry.sets.map(s=>parseFloat(s.peso)||0));
  return parseFloat(entry.carga)||0;
}
function setsSummaryText(entry){
  if(entry.sets && entry.sets.length) return entry.sets.map(s=>`${s.peso}kg${s.reps?'×'+s.reps:''}`).join(', ');
  return entry.carga ? entry.carga+'kg' : '—';
}
function cargaHistFor(ex){
  const key = ex.repdbId || ex.nome;
  const hist = key ? state.historicoCarga[key] : null;
  return hist && hist.length ? hist : null;
}
// Junta o texto "Meta NxM · ..." e o botão de registrar num só lugar pra não repetir a busca no histórico.
// Recorde pessoal (maior carga já registrada nesse exercício, em qualquer data) — não confundir com
// "última vez" do exCardInfo, que é só o registro mais recente.
function exercisePR(ex){
  const hist = cargaHistFor(ex);
  if(!hist || !hist.length) return null;
  const max = Math.max(...hist.map(h=>topSetWeight(h)));
  return max>0 ? max : null;
}
// Estimativa grosseira de duração do treino: cada série leva ~35s de execução + o descanso configurado
// depois dela (a última série de cada exercício não conta descanso, já que não tem próxima série).
function estimateWorkoutMinutes(list){
  let totalSec = 0;
  list.forEach(ex=>{
    const series = parseInt(ex.series,10)||1;
    const restSec = parseDescansoSec(ex.descanso);
    totalSec += series*35 + Math.max(0, series-1)*restSec;
  });
  return Math.round(totalSec/60);
}
function exCardInfo(ex){
  const hist = cargaHistFor(ex);
  const today = todayISO();
  const last = hist ? hist[hist.length-1] : null;
  const meta = `Meta ${ex.series}×${ex.reps}${ex.descanso ? ' · descanso '+ex.descanso : ''}`;
  if(last && last.data === today){
    const n = last.sets ? last.sets.length : (last.carga!=null && last.carga!=='' ? 1 : 0);
    const w = topSetWeight(last);
    return { metaText: `${meta} · ${n} série${n===1?'':'s'} feita${n===1?'':'s'}`, btnText: w ? w+' kg' : 'Feito', filled:true };
  }
  if(last){
    const w = topSetWeight(last);
    return { metaText: w ? `${meta} · Última vez: ${w}kg` : `${meta} · sem histórico ainda`, btnText:'Registrar', filled:false };
  }
  return { metaText: `${meta} · sem histórico ainda`, btnText:'Registrar', filled:false };
}

// Quantidade de séries "efetiva" de um exercício NA SESSÃO DE HOJE — a meta do exercício (ex.series)
// mais séries extras que a pessoa decidiu fazer hoje (botão "+ Adicionar série"), guardadas só na sessão
// (não mexe na meta cadastrada do exercício, que continua igual pros próximos dias).
function workoutSeriesCountFor(ex, ws){
  const base = parseInt(ex.series,10)||1;
  const extra = (ws && ws.extraSeries && ws.extraSeries[ex.id]) || 0;
  return base+extra;
}
function addExtraSerie(){
  const ws = state.workoutSession; if(!ws) return;
  const ex = currentWorkoutExercise(); if(!ex) return;
  if(!ws.extraSeries) ws.extraSeries = {};
  ws.extraSeries[ex.id] = (ws.extraSeries[ex.id]||0)+1;
  saveWorkoutSession(); render();
}
/* ---------- Execução de treino guiada ---------- */
async function saveWorkoutSession(){
  try{ await window.storage.set('workoutSession', state.workoutSession ? JSON.stringify(state.workoutSession) : '', false); }catch(e){}
}
async function saveWorkoutSessionsLog(){

  try{ await window.storage.set('workoutSessionsLog', JSON.stringify(state.workoutSessionsLog), false); }catch(e){}
}
// Registra uma série de cada vez (não o dia inteiro de uma vez) — é assim que a execução guiada anota,
// diferente do modal de registro rápido que grava o dia inteiro junto.
function logSingleSet(key, set){
  if(!key) return;
  if(!state.historicoCarga) state.historicoCarga = {};
  const hist = state.historicoCarga[key] || (state.historicoCarga[key]=[]);
  const today = todayISO();
  let last = hist[hist.length-1];
  if(!last || last.data !== today){ last = { data:today, sets:[] }; hist.push(last); }
  if(!last.sets) last.sets = [];
  last.sets.push(set);
  if(hist.length>200) hist.shift();
  saveHistoricoCarga();
}
function parseDescansoSec(descanso){
  const nums = String(descanso||'').match(/\d+/g);
  if(!nums || !nums.length) return 90;
  const vals = nums.map(Number);
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}
// 1ª vez no exercício: usa a meta (carga/reps sugeridas por outra parte do sistema). Da 2ª vez em diante,
// puxa a última carga realizada e aplica progressão dupla: sobe a carga quando TODAS as séries bateram a
// meta de reps E o esforço (PSE, 1-10) não estava no limite; mantém quando ficou na média; reduz quando o
// PSE veio muito alto ou as reps ficaram bem abaixo da meta — nunca sobe sozinho quando a pessoa forçou
// demais ou não completou a série. PSE é opcional: sem ele, cai no critério antigo (só reps).
function suggestedForExercise(ex){
  const hist = cargaHistFor(ex);
  const metaReps = parseFloat(ex.reps) || 0;
  if(!hist) return { peso: ex.carga || 0, reps: ex.reps || 0, direction:null, motivo:null };
  const last = hist[hist.length-1];
  const lastSets = last && last.sets && last.sets.length ? last.sets
    : (last && last.carga!=null && last.carga!=='' ? [{ peso:last.carga, reps:ex.reps }] : null);
  if(!lastSets || !lastSets.length) return { peso: ex.carga || 0, reps: ex.reps || 0, direction:null, motivo:null };
  // Ponto de partida é sempre a PRIMEIRA série registrada (não a mais pesada) — numa pirâmide
  // ascendente, começar já pela série mais pesada bagunça os ajustes de +/- daí pra frente.
  const firstPeso = parseFloat(lastSets[0].peso) || 0;
  const firstReps = lastSets[0].reps || ex.reps || metaReps;
  if(last.data === todayISO()){
    // Já editado/registrado hoje — retoma exatamente esse valor. A sugestão de progressão é
    // pra sessão seguinte, não faz sentido recalcular em cima do que você acabou de digitar agora.
    return { peso: firstPeso || ex.carga || 0, reps: firstReps, direction:null, motivo:null };
  }
  const allMetTarget = lastSets.every(s => (parseFloat(s.reps)||0) >= metaReps);
  const avgReps = lastSets.reduce((s,x)=>s+(parseFloat(x.reps)||0),0)/lastSets.length;
  const pseVals = lastSets.map(s=>parseFloat(s.pse)).filter(v=>!isNaN(v));
  const avgPse = pseVals.length ? pseVals.reduce((a,b)=>a+b,0)/pseVals.length : null;
  let direction = 'manter', motivo = 'Repetiu a mesma carga da última vez.', nextPeso = firstPeso;
  if(avgPse!=null && avgPse>=9){
    direction = 'reduzir'; motivo = 'O esforço (PSE) ficou muito alto na última vez — reduzindo a carga.';
    nextPeso = Math.round(firstPeso*0.90*2)/2;
  }else if(avgReps < metaReps*0.8){
    direction = 'reduzir'; motivo = 'Ficou bem abaixo da meta de reps na última vez — reduzindo a carga.';
    nextPeso = Math.round(firstPeso*0.90*2)/2;
  }else if(allMetTarget && (avgPse==null || avgPse<=8)){
    direction = 'subir'; motivo = avgPse!=null ? 'Bateu a meta com esforço controlado — hora de subir.' : 'Bateu a meta de reps na última vez.';
    nextPeso = Math.round(firstPeso*1.025*2)/2;
  }else{
    motivo = 'Quase lá — mantendo a carga por mais uma sessão.';
  }
  return { peso: nextPeso || ex.carga || 0, reps: ex.reps || metaReps, direction, motivo };
}
function startWorkoutSession(day){
  const list = state.musculacao[day] || [];
  if(!list.length) return;
  const sug = suggestedForExercise(list[0]);
  state.workoutSession = {
    day, exIdx:0, serieIdx:0, phase:'exercise',
    curPeso: sug.peso, curReps: sug.reps, curPse:null, restEndAt:null, restTotalSec:0,
    startedAt: Date.now(), doneSeries:0, totalVolume:0,
  };
  saveWorkoutSession();
  render();
}
function currentWorkoutExercise(){
  const ws = state.workoutSession;
  if(!ws) return null;
  return (state.musculacao[ws.day]||[])[ws.exIdx] || null;
}
// Contexto de áudio só pode "destravar" com um gesto do usuário — cria/retoma aqui (chamado a partir de
// um clique real) pra já estar pronto quando o descanso zerar sozinho, sem interação nenhuma.
let __audioCtx = null;
function getAudioCtx(){
  if(!__audioCtx){
    try{ __audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(__audioCtx.state === 'suspended') __audioCtx.resume().catch(()=>{});
  return __audioCtx;
}
// Som de "descanso acabou" — dois tons curtos ascendentes (tipo "pliiinnn"), mais uma vibração como
// reforço caso o volume esteja baixo/mudo.
function playRestEndSound(){
  const ctx = getAudioCtx();
  if(ctx){
    const now = ctx.currentTime;
    [[880, now, 0.15], [1320, now+0.13, 0.22]].forEach(([freq, start, dur])=>{
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.25, start+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start+dur);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(start); osc.stop(start+dur+0.02);
    });
  }
  if(navigator.vibrate){ try{ navigator.vibrate([80,40,80]); }catch(e){} }
}
function concluirSerieAction(peso, reps, pse){
  getAudioCtx();
  const ws = state.workoutSession;
  if(!ws) return;
  const ex = currentWorkoutExercise();
  if(!ex) return;
  const pesoNum = parseFloat(peso)||0, repsNum = parseFloat(reps)||0;
  const set = { peso:pesoNum, reps:repsNum };
  if(pse!=null) set.pse = pse;
  logSingleSet(ex.repdbId || ex.nome, set);
  ws.curPse = null;
  ws.doneSeries++;
  ws.totalVolume += pesoNum*repsNum;
  const seriesCount = workoutSeriesCountFor(ex, ws);
  const list = state.musculacao[ws.day]||[];
  const isLastSerieOfEx = ws.serieIdx >= seriesCount-1;
  const isLastEx = ws.exIdx >= list.length-1;
  if(isLastSerieOfEx){ ex.done = true; saveMusc(); }
  if(isLastSerieOfEx && isLastEx){ finishWorkoutSession(); return; }
  const restSec = parseDescansoSec(ex.descanso);
  ws.phase = 'rest';
  ws.restTotalSec = restSec;
  ws.restEndAt = Date.now() + restSec*1000;
  saveWorkoutSession();
  render();
  ensureRestTicking();
}
// Pula a série sem registrar peso/reps nem contar no volume — vai direto pra próxima série/exercício,
// sem passar pelo descanso (não fez esforço nenhum, não tem por que descansar).
function pularSerieAction(){
  const ws = state.workoutSession;
  if(!ws) return;
  const list = state.musculacao[ws.day]||[];
  const ex = list[ws.exIdx];
  if(!ex) return;
  const seriesCount = workoutSeriesCountFor(ex, ws);
  const isLastSerieOfEx = ws.serieIdx >= seriesCount-1;
  const isLastEx = ws.exIdx >= list.length-1;
  if(isLastSerieOfEx && isLastEx){ finishWorkoutSession(); return; }
  if(!isLastSerieOfEx){ ws.serieIdx++; }
  else{
    ws.exIdx++; ws.serieIdx=0;
    const nextEx = list[ws.exIdx];
    if(nextEx){ const sug = suggestedForExercise(nextEx); ws.curPeso = sug.peso; ws.curReps = sug.reps; }
  }
  ws.curPse = null;
  ws.phase = 'exercise';
  saveWorkoutSession();
  render();
}
// Volta pra série/exercício anterior sem encerrar o treino — não desfaz série já concluída
// (se ela foi registrada, continua contando), só reposiciona onde você está no treino.
function voltarWorkoutStep(){
  const ws = state.workoutSession;
  if(!ws) return;
  if(ws.serieIdx > 0){
    ws.serieIdx--;
  }else if(ws.exIdx > 0){
    ws.exIdx--;
    const list = state.musculacao[ws.day]||[];
    const prevEx = list[ws.exIdx];
    const seriesCount = prevEx ? workoutSeriesCountFor(prevEx, ws) : 1;
    ws.serieIdx = seriesCount-1;
    if(prevEx){ const sug = suggestedForExercise(prevEx); ws.curPeso = sug.peso; ws.curReps = sug.reps; }
  }else{
    return;
  }
  ws.curPse = null;
  ws.phase = 'exercise';
  saveWorkoutSession();
  render();
}
let workoutRestInterval = null;
function ensureRestTicking(){
  if(workoutRestInterval) return;
  workoutRestInterval = setInterval(()=>{
    if(!state.workoutSession || state.workoutSession.phase!=='rest'){ stopRestTicking(); return; }
    if(Date.now() >= state.workoutSession.restEndAt){ playRestEndSound(); advanceAfterRest(); }
    else render();
  }, 1000);
}
function stopRestTicking(){ if(workoutRestInterval){ clearInterval(workoutRestInterval); workoutRestInterval=null; } }
function advanceAfterRest(){
  const ws = state.workoutSession;
  if(!ws) return;
  stopRestTicking();
  const list = state.musculacao[ws.day]||[];
  const ex = list[ws.exIdx];
  const seriesCount = ex ? workoutSeriesCountFor(ex, ws) : 1;
  const movingToNewExercise = ws.serieIdx >= seriesCount-1;
  if(!movingToNewExercise){ ws.serieIdx++; }
  else{ ws.exIdx++; ws.serieIdx=0; }
  ws.curPse = null;
  ws.phase = 'exercise';
  ws.restEndAt = null;
  // Só recalcula a sugestão ao trocar de exercício — dentro do mesmo exercício, mantém a carga/reps que
  // a pessoa acabou de usar na série anterior (senão a sugestão subiria sozinha a cada série do treino,
  // já que a série recém-concluída passa a contar como "última carga registrada").
  if(movingToNewExercise){
    const nextEx = list[ws.exIdx];
    if(nextEx){
      const sug = suggestedForExercise(nextEx);
      ws.curPeso = sug.peso; ws.curReps = sug.reps;
    }
  }
  saveWorkoutSession();
  render();
}
function skipRest(){ advanceAfterRest(); }
function addRestTime(sec){
  const ws = state.workoutSession;
  if(!ws || ws.phase!=='rest') return;
  ws.restEndAt += sec*1000;
  ws.restTotalSec += sec;
  saveWorkoutSession();
  render();
}
// Fase 8 — Desafio de constância, só local por enquanto (sem backend/ranking). O modelo já reserva
// challengeId/participantId/checkins pra um dia dar pra plugar ranking entre pessoas sem migrar nada.
async function saveChallenge(){ try{ await window.storage.set('challenge', state.challenge?JSON.stringify(state.challenge):'', false); }catch(e){} }
function startChallenge(totalDays){
  state.challenge = {
    challengeId: 'solo_'+Date.now(), participantId: 'me',
    startDateISO: todayISO(), totalDays: totalDays, checkins: {},
  };
  saveChallenge();
  render();
}
function deleteChallenge(){
  if(!confirm('Cancelar o desafio atual? O progresso é perdido.')) return;
  state.challenge = null;
  saveChallenge();
  render();
}
// Marca o dia de hoje como concluído automaticamente quando uma sessão de treino é salva — a pessoa
// não precisa ir marcar o desafio na mão, só treinar.
function markChallengeCheckinToday(){
  if(!state.challenge) return;
  const iso = todayISO();
  if(state.challenge.checkins[iso]) return;
  state.challenge.checkins[iso] = true;
  saveChallenge();
}
function isoDateNDaysAgo(n){ return new Date(Date.now() - n*86400000).toISOString().slice(0,10); }
function challengeStreak(){
  if(!state.challenge) return 0;
  let streak = 0;
  for(let i=0; i<state.challenge.totalDays+7; i++){
    if(state.challenge.checkins[isoDateNDaysAgo(i)]) streak++;
    else break;
  }
  return streak;
}
function challengeDaysElapsed(){
  if(!state.challenge) return 1;
  const diff = Math.floor((Date.parse(todayISO()) - Date.parse(state.challenge.startDateISO))/86400000);
  return Math.max(1, diff+1);
}
function challengeDaysRemaining(){
  if(!state.challenge) return 0;
  return Math.max(0, state.challenge.totalDays - challengeDaysElapsed());
}
function challengeDoneCount(){
  if(!state.challenge) return 0;
  return Object.keys(state.challenge.checkins).length;
}
function challengePct(){
  if(!state.challenge) return 0;
  return Math.min(100, Math.round((challengeDoneCount()/state.challenge.totalDays)*100));
}
function finishWorkoutSession(){
  const ws = state.workoutSession;
  if(!ws) return;
  stopRestTicking();
  const elapsedSec = Math.round((Date.now()-ws.startedAt)/1000);
  // Guarda a lista de exercícios de hoje junto com a data real — assim, mesmo que a rotina de
  // Segunda mude depois, dá pra olhar pra trás e ver exatamente o que era Segunda nesse dia específico.
  const list = state.musculacao[ws.day] || [];
  const exercicios = list.map(ex=>({ nome:ex.nome, grupo:ex.grupo, series:ex.series, reps:ex.reps, carga:ex.carga }));
  state.workoutSessionsLog.push({ day:ws.day, data:todayISO(), volume:Math.round(ws.totalVolume), series:ws.doneSeries, duracaoSeg:elapsedSec, exercicios });
  saveWorkoutSessionsLog();
  markChallengeCheckinToday();
  markGroupCheckinsToday('fez musculação · '+ws.doneSeries+' séries');
  ws.phase = 'summary';
  ws.elapsedSec = elapsedSec;
  saveWorkoutSession();
  render();
}
function exitWorkoutSession(){
  if(state.workoutSession && state.workoutSession.phase!=='summary'){
    if(!confirm('Sair do treino agora? As séries já registradas ficam salvas, mas o cronômetro é interrompido.')) return;
  }
  stopRestTicking();
  state.workoutSession = null;
  saveWorkoutSession();
  render();
}
// Compara com a última vez que esse MESMO dia da semana foi treinado (o app não tem um conceito de
// "tipo de treino" separado do dia da semana) — ignora a entrada de hoje mesma.
function lastVolumeForDay(day, excludeDate){
  const entries = state.workoutSessionsLog.filter(e=>e.day===day && e.data!==excludeDate);
  return entries.length ? entries[entries.length-1] : null;
}

  const upcoming = list.slice(ws.exIdx+1);

function wireWorkoutSession(){
  const exitEl = document.querySelector('[data-wexexit]');
  if(exitEl) exitEl.onclick = exitWorkoutSession;
  const skipSerieEl = document.querySelector('[data-wexskipserie]');
  if(skipSerieEl) skipSerieEl.onclick = pularSerieAction;
  document.querySelectorAll('[data-wexadj]').forEach(el=>{
    el.onclick = ()=>{
      const ws = state.workoutSession; if(!ws) return;
      const field = el.getAttribute('data-wexadj');
      const delta = parseFloat(el.getAttribute('data-wexdelta'));
      if(field==='peso') ws.curPeso = Math.max(0, Math.round(((parseFloat(ws.curPeso)||0)+delta)*10)/10);
      else ws.curReps = Math.max(0, (parseInt(ws.curReps,10)||0)+delta);
      render();
    };
  });
  document.querySelectorAll('[data-wexpse]').forEach(el=>{
    el.onclick = ()=>{
      const ws = state.workoutSession; if(!ws) return;
      const n = parseInt(el.getAttribute('data-wexpse'),10);
      ws.curPse = ws.curPse===n ? null : n; // toca de novo no mesmo número desmarca
      render();
    };
  });
  const wexPseSelect = document.getElementById('wexPseSelect');
  if(wexPseSelect) wexPseSelect.onchange = ()=>{
    const ws = state.workoutSession; if(!ws) return;
    ws.curPse = wexPseSelect.value ? parseInt(wexPseSelect.value,10) : null;
  };
  const addSerieEl = document.querySelector('[data-wexaddserie]');
  if(addSerieEl) addSerieEl.onclick = addExtraSerie;
  const verExecEl = document.querySelector('[data-wexverexec]');
  if(verExecEl) verExecEl.onclick = ()=> openZoom(verExecEl.getAttribute('data-wexverexec'));
  const finishTopEl = document.querySelector('[data-wexfinishtop]');
  if(finishTopEl) finishTopEl.onclick = ()=>{
    const ws = state.workoutSession; if(!ws) return;
    const list = state.musculacao[ws.day]||[];
    const ex = list[ws.exIdx];
    const seriesCount = ex ? workoutSeriesCountFor(ex, ws) : 1;
    const atEnd = ws.exIdx>=list.length-1 && ws.serieIdx>=seriesCount-1;
    if(!atEnd && !confirm('Concluir o treino agora? Os exercícios restantes não ficam marcados como feitos.')) return;
    finishWorkoutSession();
  };
  // Além dos botões +/-, dá pra tocar no número e digitar o valor direto (ex: primeira vez no
  // exercício, indo de 0 pra 60kg — clicar em "+" 24 vezes seria péssimo).
  const wexPesoInput = document.getElementById('wexPesoInput');
  if(wexPesoInput) wexPesoInput.onchange = ()=>{
    const ws = state.workoutSession; if(!ws) return;
    ws.curPeso = Math.max(0, parseFloat(String(wexPesoInput.value).replace(',','.')) || 0);
    render();
  };
  const wexRepsInput = document.getElementById('wexRepsInput');
  if(wexRepsInput) wexRepsInput.onchange = ()=>{
    const ws = state.workoutSession; if(!ws) return;
    ws.curReps = Math.max(0, parseInt(wexRepsInput.value,10) || 0);
    render();
  };
  const concluirEl = document.querySelector('[data-wexconcluir]');
  if(concluirEl) concluirEl.onclick = ()=>{
    const ws = state.workoutSession; if(!ws) return;
    concluirSerieAction(ws.curPeso, ws.curReps, ws.curPse);
  };
  const addRestEl = document.querySelector('[data-wexaddrest]');
  if(addRestEl) addRestEl.onclick = ()=> addRestTime(15);
  const skipRestEl = document.querySelector('[data-wexskiprest]');
  if(skipRestEl) skipRestEl.onclick = ()=> skipRest();
  const finishEl = document.querySelector('[data-wexfinish]');
  if(finishEl) finishEl.onclick = ()=>{ state.workoutSession=null; saveWorkoutSession(); render(); };
}

function logMedidaHistory(key, valor){
  if(!key || valor === '' || valor == null) return;
  if(!state.historicoMedidas) state.historicoMedidas = {};
  const hist = state.historicoMedidas[key] || (state.historicoMedidas[key]=[]);
  const today = todayISO();
  const last = hist[hist.length-1];
  if(last && last.data === today) last.valor = valor;
  else hist.push({ data: today, valor });
  if(hist.length>200) hist.shift();
  saveHistoricoMedidas();
}
function lastMedida(key){
  const hist = (state.historicoMedidas||{})[key];
  return hist && hist.length ? hist[hist.length-1].valor : '';
}

// Método da Marinha americana (US Navy) — fórmula validada de %gordura por circunferências, sem precisar
// de balança de bioimpedância nem DEXA. Precisa de altura+sexo (Perfil) e pescoço+cintura(+quadril p/
// mulher) em Medidas. Todas as medidas em cm.
function calcBodyFatNavy(sexo, alturaCm, pescocoCm, cinturaCm, quadrilCm){
  if(!sexo || !alturaCm || !pescocoCm || !cinturaCm) return null;
  if(sexo==='feminino' && !quadrilCm) return null;
  const h = parseFloat(alturaCm), n = parseFloat(pescocoCm), w = parseFloat(cinturaCm), hip = parseFloat(quadrilCm);
  if(!h || !n || !w || (sexo==='feminino' && !hip)) return null;
  let pct;
  if(sexo==='masculino'){
    if(w<=n) return null; // fórmula exige cintura > pescoço, senão log fica indefinido
    pct = 495 / (1.0324 - 0.19077*Math.log10(w-n) + 0.15456*Math.log10(h)) - 450;
  }else{
    if((w+hip)<=n) return null;
    pct = 495 / (1.29579 - 0.35004*Math.log10(w+hip-n) + 0.22100*Math.log10(h)) - 450;
  }
  return Math.round(pct*10)/10;
}

// Recorta em quadrado e reduz a imagem antes de guardar — uma foto de câmera direto passaria de vários
// MB em base64, o que pesaria demais salva no localStorage.
function readAndResizeImage(file, size, cb){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const cropSize = Math.min(img.width, img.height);
      const sx = (img.width-cropSize)/2, sy = (img.height-cropSize)/2;
      ctx.drawImage(img, sx, sy, cropSize, cropSize, 0, 0, size, size);
      cb(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

  const obj = {};
  for(const k of BACKUP_KEYS){
    try{ const r = await window.storage.get(k, false); if(r && r.value!=null) obj[k] = r.value; }catch(e){}
  }
  const blob = new Blob([JSON.stringify(obj)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'treino-app-backup-'+todayISO()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function importBackupFile(file){
  let obj;
  try{ obj = JSON.parse(await file.text()); }catch(e){ alert('Arquivo inválido.'); return; }
  if(!confirm('Isso substitui todos os dados atuais do app pelos do backup. Continuar?')) return;
  for(const k of Object.keys(obj)){
    try{ await window.storage.set(k, obj[k], false); }catch(e){}
  }
  alert('Backup importado! O app vai recarregar.');
  location.reload();
}

  const key = corridaProgressKey(day);
  const prev = corridaEntryProgress(day) || {};
  const willBeDone = !isCorridaDone(day);

    const km = entry && entry.totalKm ? parseFloat(entry.totalKm) : 0;
    const ativo = state.equipamentos.tenis.find(t=>t.ativo);
    if(ativo && km){
      ativo.km = Math.round((ativo.km+km)*10)/10;
      saveEquipamentos();
    }
    state.corridaProgress[key] = { ...prev, done:true, shoeCredit: (ativo && km) ? {tenisId:ativo.id, km} : null };
    if(isTodayDayAbbrev(day)){ markChallengeCheckinToday(); markGroupCheckinsToday('fez corrida'+(km?' · '+fmtKm(km):'')); }

// 'done' = tem algo feito naquele dia, 'pending' = tem treino agendado mas ainda não feito, 'none' = dia livre.
function dayStatus(d, tab){
  const hasCorrida = !!treinoEntryForDay(d);
  const muscList = muscListForDay(d);
  const hasMusc = muscList.length>0;
  const hasOutros = (state.outros[d]||[]).length>0;
  const outrosDone = hasOutros && (state.outros[d]||[]).some(a=>a.done);
  if(tab==='corrida') return !hasCorrida ? 'none' : (isCorridaDone(d) ? 'done' : 'pending');
  if(tab==='musculacao') return !hasMusc ? 'none' : (muscList.some(e=>e.done) ? 'done' : 'pending');
  if(!hasCorrida && !hasMusc && !hasOutros) return 'none';
  const corridaDone = hasCorrida && isCorridaDone(d);
  const muscDone = hasMusc && muscList.some(e=>e.done);
  return (corridaDone || muscDone || outrosDone) ? 'done' : 'pending';
}
// Data real do dia da semana pra mostrar na faixa — usa a data do treino de corrida quando existe
// (assim acompanha a semana certa do plano), senão calcula a partir da semana corrente de verdade.
// Sempre calcula a data a partir da semana atual (segunda-feira real de hoje) — nunca deve "adivinhar"
// pegando a data de um treino existente só porque a abreviação do dia bate, porque state.treinos
// acumula entradas de semanas diferentes (passadas e futuras) com a mesma abreviação de dia, e pegar
// a primeira que combinar mistura datas de semanas erradas na faixa (bug real, visto em produção).
// Semana atualmente exibida na tira de dias — "esta semana real" + state.weekOffset semanas (0 =
// semana atual, 1 = semana que vem, -1 = semana passada). As setas de navegação mexem nesse offset.
function displayedWeekMonday(){
  const monday = vdotMondayOf(new Date());
  monday.setDate(monday.getDate() + (state.weekOffset||0)*7);
  return monday;
}
function dayDateLabel(d){
  const monday = displayedWeekMonday();
  const idx = DAY_ABBR.indexOf(d);
  const dt = new Date(monday);
  dt.setDate(dt.getDate()+idx);
  return vdotFormatDDMM(dt);
}
// Acha o treino de corrida de um dia da SEMANA QUE ESTÁ SENDO EXIBIDA (não só "qualquer treino com
// esse dia da semana") — state.treinos pode ter mais de uma entrada com a mesma abreviação (semana
// atual E semanas futuras já geradas), então bater só pelo nome do dia pega a errada quando as duas
// existem ao mesmo tempo (bug real: gerar um plano pra semana que vem fazia a terça de HOJE mostrar
// o treino da terça de outra semana, só porque as duas se chamam "Ter"). Bate pela data completa.
function treinoEntryForDay(day){
  const expectedDate = dayDateLabel(day);
  return state.treinos.find(t => dayAbbrevOf(t.day)===day && t.day.includes(expectedDate));
}
// Musculação não tem data própria (é "toda Segunda", pra sempre) — diferente da corrida, que sempre
// tem uma data real. Isso é normal pro uso comum, mas quebra quando um plano híbrido tem início
// marcado no futuro: sem essa checagem, a musculação daquele plano "vazava" pra qualquer semana
// anterior também, porque pro sistema não existe "a segunda de tal semana", só "segunda". Aqui a
// gente esconde só os exercícios do híbrido (modo:'hibrido') em dias anteriores ao início real do
// plano — o resto da musculação (manual, template, gerada avulsa) continua igual, sempre recorrente.
function hybridMuscHiddenForDay(day){
  const hp = state.hybridPlanData;
  if(!hp || !hp.startMonday) return false;
  const monday = displayedWeekMonday();
  const idx = DAY_ABBR.indexOf(day);
  const shown = new Date(monday);
  shown.setDate(shown.getDate()+idx);
  const start = new Date(hp.startMonday+'T00:00:00');
  return shown < start;
}
function muscListForDay(day){
  const list = state.musculacao[day] || [];
  if(!hybridMuscHiddenForDay(day)) return list;
  return list.filter(e => e.modo !== 'hibrido');
}
// Conta quantos dias da semana têm treino marcado (agendado) e quantos já foram feitos — usado tanto
// no resumo geral quanto nos cards de Musculação/Corrida do dashboard da aba Hoje.
function weekCounts(tab){
  let scheduled = 0, done = 0;
  DAY_ABBR.forEach(d=>{
    const st = dayStatus(d, tab);
    if(st !== 'none') scheduled++;
    if(st === 'done') done++;
  });
  return { scheduled, done };
}
function weekSummaryText(){
  const { scheduled, done } = weekCounts();
  if(scheduled === 0) return 'Nenhum treino agendado ainda';
  return done+' de '+scheduled+' dias treinados essa semana';
}
// Sequência dentro da semana atual (não temos histórico de dia-a-dia de semanas passadas pra musculação,
// então só conta de forma honesta o que dá pra verificar: os dias seguidos até hoje, nesta semana).
function currentStreakDays(){
  const todayIdx = (new Date().getDay()+6)%7;
  let streak = 0;
  for(let i=todayIdx; i>=0; i--){
    const st = dayStatus(DAY_ABBR[i]);
    if(st === 'done') streak++;
    else if(st === 'pending') break;
  }
  return streak;
}

// Navegação por MOMENTO DE USO, não por modalidade: Hoje (o que treinar agora, seja qual for o modo),
// Treinos (onde CRIA — Musculação/Corrida/Híbrido lado a lado — e gerencia templates), Perfil. Corrida
// e Musculação deixaram de ser abas fixas na base — viraram telas de detalhe de um dia específico,
// alcançadas ao tocar num card em Hoje (por isso "voltam" pra Hoje, igual vdot volta pra corrida).
const PRIMARY_TABS = ['hoje','meusTreinos','perfil'];
const PERFIL_SUB_TABS = ['progresso','comparativo','medidas','equipamentos','alunas'];
const BACK_TARGET = { vdot:'corrida', corrida:'hoje', musculacao:'hoje', progresso:'perfil', comparativo:'perfil', medidas:'perfil', equipamentos:'perfil', alunas:'perfil' };
function goBack(){
  if(state.tab==='vdot' && state.vdotStep === 2){ state.vdotStep = 1; render(); return; }
  if(PRIMARY_TABS.includes(state.tab)) return;
  state.tab = BACK_TARGET[state.tab] || 'hoje';
  render();
}
// Arrastar da borda esquerda pra direita volta uma tela, igual o gesto nativo do iOS — registrado uma
// única vez (fora do render) já que não depende de nenhum elemento do DOM recriado a cada render.
(function setupSwipeBack(){
  let startX=null, startY=null;
  document.addEventListener('touchstart', (e)=>{
    if(e.touches.length!==1){ startX=null; return; }
    const t = e.touches[0];
    if(t.clientX > 24){ startX=null; return; }
    startX = t.clientX; startY = t.clientY;
  }, {passive:true});
  document.addEventListener('touchend', (e)=>{
    if(startX==null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - startX, dy = t.clientY - startY;
    startX = null;
    if(dx > 80 && Math.abs(dy) < 60 && !PRIMARY_TABS.includes(state.tab) && !state.modalOpen) goBack();
  }, {passive:true});
})();
function render(){
  if(state.workoutSession){
    root.innerHTML = renderWorkoutSession();
    wireWorkoutSession();
    return;
  }
  if(state.gpsRun){
    root.innerHTML = renderGpsRunScreen();
    wireGpsRunScreen();

      document.querySelectorAll('[data-blkhandle]').forEach(handle=>{

          const cards = Array.from(list.querySelectorAll('.blk-card'));
          const id = handle.getAttribute('data-blkhandle');
          const startIndex = cards.findIndex(c=>c.getAttribute('data-blkid')===id);
          if(startIndex===-1) return;
          const gap = 8;
          const heights = cards.map(c=>c.getBoundingClientRect().height);
          function layout(ord){
            const tops = {}; let y = 0;
            ord.forEach(origIdx=>{ tops[origIdx] = y; y += heights[origIdx] + gap; });
            return tops;
          }
          const originalTops = layout(cards.map((_,i)=>i));
          let order = cards.map((_,i)=>i);
          const draggedCard = cards[startIndex];
          const startY = downEv.clientY;
          draggedCard.classList.add('dragging');
          cards.forEach((c,i)=>{ if(i!==startIndex) c.classList.add('drag-anim'); });
          handle.setPointerCapture(downEv.pointerId);

          function onMove(moveEv){
            const dy = moveEv.clientY - startY;
            draggedCard.style.transform = `translateY(${dy}px)`;
            const draggedCenter = originalTops[startIndex] + dy + heights[startIndex]/2;
            const currentTops = layout(order);
            const others = order.filter(i=>i!==startIndex);
            let insertAt = others.length;
            for(let k=0;k<others.length;k++){
              const idx = others[k];
              if(draggedCenter < currentTops[idx] + heights[idx]/2){ insertAt = k; break; }
            }
            const newOrder = others.slice(0,insertAt).concat([startIndex]).concat(others.slice(insertAt));
            if(newOrder.join(',') !== order.join(',')){
              order = newOrder;
              const newTops = layout(order);
              cards.forEach((c,i)=>{ if(i!==startIndex) c.style.transform = `translateY(${newTops[i]-originalTops[i]}px)`; });
            }
          }
          function onUp(upEv){
            document.removeEventListener('pointermove', onMove);
            document.removeEventListener('pointerup', onUp);
            try{ handle.releasePointerCapture(upEv.pointerId); }catch(e){}
            draft.blocks = order.map(i=>draft.blocks[i]);
            render();

          document.addEventListener('pointermove', onMove);
          document.addEventListener('pointerup', onUp);

    if(state.modalType === 'editMuscTemplate'){

      if(nomeEl) nomeEl.onchange = ()=>{ draft.tipo = nomeEl.value; };
      document.querySelectorAll('[data-mtplexedit]').forEach(el=>{
        el.onclick = ()=>{
          state.editingExId = el.getAttribute('data-mtplexedit');
          state.editingExTemplateMode = true;
          state.modalType = 'musc';
          render();
        };
      });
      document.querySelectorAll('[data-mtplexdel]').forEach(el=>{
        el.onclick = (ev)=>{
          ev.stopPropagation();
          draft.exercicios = draft.exercicios.filter(e=>e.id!==el.getAttribute('data-mtplexdel'));
          render();
        };
      });
      const btnAddEx = document.getElementById('btnMtplAddEx');
      if(btnAddEx) btnAddEx.onclick = ()=>{
        state.editingExId = null;
        state.editingExTemplateMode = true;
        state.modalType = 'musc';
        render();
      };
      const btnSaveTpl = document.getElementById('btnSaveMuscTemplate');
      if(btnSaveTpl) btnSaveTpl.onclick = ()=>{
        const tipo = (document.getElementById('mtplNome').value||'').trim();
        if(!tipo){ document.getElementById('mtplNome').focus(); return; }
        if(draft.id){
          const idx = state.muscTemplates.findIndex(t=>t.id===draft.id);
          if(idx>-1) state.muscTemplates[idx] = { ...state.muscTemplates[idx], tipo, exercicios: draft.exercicios, updatedAt:Date.now() };
        }else{
          state.muscTemplates.push({ id:newMuscTemplateId(), tipo, exercicios: draft.exercicios, createdAt:Date.now(), updatedAt:Date.now() });
        }
        saveMuscTemplates();
        state.muscTemplateDraft = null;
        state.modalOpen = false;
        state.modalType = null;
        state.tab = 'meusTreinos';
        render();
      };
    }

    if(state.modalType === 'scheduleMuscTemplate'){
      document.querySelectorAll('#scheduleMuscDiasPicker .day-pill').forEach(el=>{
        el.onclick = ()=> el.classList.toggle('active');
      });
      document.querySelectorAll('#muscScheduleModePicker .day-pill').forEach(el=>{
        el.onclick = ()=>{
          document.querySelectorAll('#muscScheduleModePicker .day-pill').forEach(p=>p.classList.remove('active'));
          el.classList.add('active');
        };
      });
      const btnConfirmMuscSchedule = document.getElementById('btnConfirmMuscSchedule');
      if(btnConfirmMuscSchedule) btnConfirmMuscSchedule.onclick = ()=>{
        const tpl = state.muscTemplates.find(t=>t.id===state.scheduleMuscTemplateId);
        if(!tpl) return;
        const diasArr = DAY_ABBR.filter(d=>document.querySelector(`[data-schedulemuscdia="${d}"]`).classList.contains('active'));
        if(diasArr.length===0){ alert('Escolhe pelo menos um dia.'); return; }
        const modeEl = document.querySelector('#muscScheduleModePicker .day-pill.active');
        const mode = modeEl ? modeEl.getAttribute('data-schedulemuscmode') : 'replace';
        diasArr.forEach(day=>{
          const novos = tpl.exercicios.map(e=>({ ...e, id:'ex'+Date.now().toString(36)+Math.random().toString(36).slice(2,4), done:false }));
          state.musculacao[day] = mode==='add' ? [...(state.musculacao[day]||[]), ...novos] : novos;
          // "Substituir" deixa o dia igual ao modelo — marca o vínculo. "Acrescentar" mistura com o que
          // já tinha, então não é mais "o modelo puro".
          if(mode==='add') state.muscDayOrigin[day] = null; else markMuscDayFromTemplate(day, tpl);
        });
        saveMusc();
        saveMuscDayOrigin();
        state.modalOpen = false;
        state.modalType = null;
        state.scheduleMuscTemplateId = null;
        state.tab = 'musculacao';
        state.selectedDayMusc = diasArr[0];
        render();
      };
      const btnClearMusc = document.getElementById('btnClearAllMusc');
      if(btnClearMusc) btnClearMusc.onclick = ()=>{
        state.modalOpen = false;
        state.modalType = null;
        clearAllMusculacao();
      };
    }

    if(state.modalType === 'muscWeekPlan'){
      document.querySelectorAll('#weekPlanModePicker .day-pill').forEach(el=>{
        el.onclick = ()=>{
          document.querySelectorAll('#weekPlanModePicker .day-pill').forEach(p=>p.classList.remove('active'));
          el.classList.add('active');
        };
      });
      const btnConfirmWeekPlan = document.getElementById('btnConfirmWeekPlan');
      if(btnConfirmWeekPlan) btnConfirmWeekPlan.onclick = ()=>{
        let changed = false;
        const modeEl = document.querySelector('#weekPlanModePicker .day-pill.active');
        const mode = modeEl ? modeEl.getAttribute('data-weekplanmode') : 'replace';
        DAY_ABBR.forEach(d=>{
          const sel = document.querySelector(`[data-weekdaysel="${d}"]`);
          const val = sel ? sel.value : '';
          if(val === '') return;
          changed = true;
          if(val === '__rest__'){ state.musculacao[d] = []; state.muscDayOrigin[d] = null; return; }
          const tpl = state.muscTemplates.find(t=>t.id===val);
          if(!tpl) return;
          const novos = tpl.exercicios.map(e=>({ ...e, id:'ex'+Date.now().toString(36)+Math.random().toString(36).slice(2,4), done:false }));
          state.musculacao[d] = mode==='add' ? [...(state.musculacao[d]||[]), ...novos] : novos;
          if(mode==='add') state.muscDayOrigin[d] = null; else markMuscDayFromTemplate(d, tpl);
        });
        if(!changed){ alert('Escolhe pelo menos um dia pra mudar (ou "Descanso").'); return; }
        saveMusc();
        saveMuscDayOrigin();
        state.modalOpen = false;
        state.modalType = null;
        state.tab = 'musculacao';
        render();
      };
    }

    if(state.modalType === 'importTreinos'){
      document.querySelectorAll('[data-importweek]').forEach(el=>{
        el.onchange = ()=>{
          const i = parseInt(el.getAttribute('data-importweek'),10);
          state.importTreinosDraft[i].weekNumber = parseInt(el.value,10) || 1;
          render();
        };
      });
      document.querySelectorAll('[data-importday]').forEach(el=>{
        el.onchange = ()=>{
          const i = parseInt(el.getAttribute('data-importday'),10);
          state.importTreinosDraft[i].day = el.value;
          render();
        };
      });
      document.querySelectorAll('[data-removeimport]').forEach(el=>{
        el.onclick = ()=>{
          const i = parseInt(el.getAttribute('data-removeimport'),10);
          state.importTreinosDraft.splice(i,1);
          render();
        };
      });

      const btnConfirmImport = document.getElementById('btnConfirmImportTreinos');
      if(btnConfirmImport) btnConfirmImport.onclick = ()=>{
        const draft = state.importTreinosDraft || [];
        const valid = draft.filter(d=>!d.invalid);
        if(valid.length===0){ alert('Nenhum arquivo válido pra importar.'); return; }
        if(valid.some(d=>!d.day)){ alert('Escolhe o dia da semana de cada treino antes de confirmar.'); return; }
        const seen = new Set();
        for(const d of valid){
          const key = d.weekNumber+'|'+d.day;
          if(seen.has(key)){ alert(`Tem dois treinos pra Semana ${d.weekNumber} · ${d.day}. Ajusta antes de confirmar.`); return; }
          seen.add(key);
        }
        if(state.corridaVdotData && state.corridaVdotData.plan){
          if(!confirm('Isso substitui o plano de corrida atual pelos treinos importados. Continuar?')) return;
        }
        const weekNumbers = [...new Set(valid.map(d=>d.weekNumber))].sort((a,b)=>a-b);
        const plan = weekNumbers.map(wn => ({
          weekNumber: wn,
          phaseName: 'Treino importado',
          days: valid.filter(d=>d.weekNumber===wn).map(d=>({
            day: d.day, title: d.workoutName, steps: d.steps, totalKm: d.totalKm,
            cor: inferCorTipo(d.workoutName),
          })),
        }));
        const startMonday = vdotISODate(vdotStartMonday(new Date()));
        state.corridaVdotData = { ...(state.corridaVdotData||{}), plan, startMonday, currentWeekIndex:1 };
        saveCorridaVdotData();
        materializeVdotWeekIntoTreinos(plan[0], startMonday);
        state.importTreinosDraft = null;
        state.modalOpen = false;
        state.modalType = null;
        state.tab = 'corrida';
        render();
      };
    }

    const saveBtn = document.getElementById('modalSave');
    if(saveBtn) saveBtn.onclick = ()=>{
      if(state.modalType === 'quickSets'){
        const day = state.selectedDayMusc;
        const ex = (state.musculacao[day]||[]).find(e=>e.id===state.quickWeightExId);
        const sets = (state.quickSetsDraft||[]).filter(s=>s.peso!=='' && s.peso!=null);
        state.modalOpen = false;
        state.quickWeightExId = null;
        state.quickSetsDraft = null;
        state.quickSetsPrevSets = null;
        if(ex && sets.length){
          logSetsHistory(ex.repdbId || ex.nome, sets);
          const topPeso = Math.max(...sets.map(s=>parseFloat(s.peso)||0));
          updateExercicio(day, ex.id, { carga: String(topPeso) });
        }else{
          render();
        }
        return;
      }else if(state.modalType === 'musc'){
        const grupo = document.getElementById('inGrupo').value;
        const selVal = document.getElementById('inExercicioSelect').value;
        let nome, repdbId;
        if(selVal === '__custom__'){
          nome = document.getElementById('inNomeCustom').value.trim();
          if(!nome){ document.getElementById('inNomeCustom').focus(); return; }
          repdbId = guessRepdbId(grupo, nome);
        }else{
          const found = exercisesForGroup(grupo).find(e=>e.id===selVal);
          nome = found ? found.nome : selVal;
          repdbId = selVal;
        }
        const series = document.getElementById('inSeries').value.trim();
        const reps = document.getElementById('inReps').value.trim();
        const carga = document.getElementById('inCarga').value.trim();
        const payload = { nome, series, reps, carga, grupo, repdbId };
        if(state.editingExTemplateMode){
          // Editando um exercício dentro de uma rotina salva (biblioteca) — não é um registro real de
          // hoje, então não mexe no histórico de carga, só no rascunho da rotina.
          const draft = state.muscTemplateDraft;
          if(state.editingExId){
            const idx = draft.exercicios.findIndex(e=>e.id===state.editingExId);
            if(idx>-1) draft.exercicios[idx] = { ...draft.exercicios[idx], ...payload };
          }else{
            draft.exercicios.push({ id:'ex'+Date.now().toString(36)+Math.random().toString(36).slice(2,4), done:false, ...payload });
          }
          state.editingExId = null;
          state.editingExTemplateMode = false;
          state.modalType = 'editMuscTemplate';
          render();
          return;
        }
        logCargaHistory(repdbId || nome, carga);
        if(state.editingExId) updateExercicio(state.selectedDayMusc, state.editingExId, payload);
        else addExercicio(state.selectedDayMusc, payload);
        state.editingExId = null;
      }else if(state.modalType === 'outros'){
        const nome = document.getElementById('inNomeAt').value.trim();
        const duracao = document.getElementById('inDuracao').value.trim();
        const notas = document.getElementById('inNotas').value.trim();
        if(!nome){ document.getElementById('inNomeAt').focus(); return; }
        if(state.editingAtId) updateAtividade(state.selectedDayOutros, state.editingAtId, { nome, duracao, notas });
        else addAtividade(state.selectedDayOutros, { nome, duracao, notas });
        state.editingAtId = null;
      }else if(state.modalType === 'gerar'){
        const nivel = document.getElementById('inNivel').value;
        const diasArr = DAY_ABBR.filter(d => document.querySelector(`[data-gerardia="${d}"]`).classList.contains('active'));
        if(diasArr.length === 0){ alert('Escolha pelo menos um dia da semana.'); return; }
        const equip = document.getElementById('inEquip').value;
        const objetivoEl = document.getElementById('inObjetivoAvancado');
        const objetivo = objetivoEl ? objetivoEl.value : 'forca';
        const plan = buildPlan(nivel, diasArr, equip, objetivo);
        const hasExisting = DAY_ABBR.some(d => (state.musculacao[d]||[]).length > 0);
        if(hasExisting){
          const ok = confirm('Isso substitui a semana inteira de musculação (todos os dias) pelo novo treino gerado. Continuar?');
          if(!ok) return;
        }
        DAY_ABBR.forEach(d=>{ state.musculacao[d] = []; state.muscDayOrigin[d] = null; });
        Object.keys(plan).forEach(d=>{
          state.musculacao[d] = plan[d].map(e => ({ id: Date.now().toString()+Math.random().toString(36).slice(2), ...e }));
        });
        saveMusc();
        saveMuscDayOrigin();
        state.modalOpen = false;
        render();
        return;
      }else if(state.modalType === 'editCorrida'){
        const day = state.selectedDayCorrida;
        const draft = state.corridaBuilderDraft;
        const type = (draft.tipo||'').trim();
        if(!type){ document.getElementById('ecTipo').focus(); return; }
        const steps = draft.blocks.map(blockToStep);
        const totalKmSum = steps.reduce((s,x)=>s+x.km, 0);
        const totalMinSum = steps.reduce((s,x)=>s+x.min, 0);
        const fields = {
          type,
          totalKm: totalKmSum ? Math.round(totalKmSum*10)/10 : '',
          totalMin: totalMinSum ? Math.round(totalMinSum) : null,
          steps: steps.length ? steps.map(s=>({ name:s.name, km:Math.round(s.km*100)/100, pace:s.pace, desc:s.desc })) : null,
          cor: inferCorTipo(type),
          objetivo: inferObjetivo(type),
          builderBlocks: draft.blocks,
          warmupDesc:'', warmupPace:'', mainDesc:'', mainPace:'', cooldownDesc:'', cooldownPace:'',
        };
        if(draft.mode === 'template'){
          if(draft.templateId){
            const tIdx = state.treinoTemplates.findIndex(t=>t.id===draft.templateId);
            if(tIdx>-1) state.treinoTemplates[tIdx] = { ...state.treinoTemplates[tIdx], tipo:type, steps:fields.steps, builderBlocks:draft.blocks, totalKm:fields.totalKm, totalMin:fields.totalMin, cor:fields.cor, objetivo:fields.objetivo };
          }else{
            state.treinoTemplates.push({ id:newTemplateId(), tipo:type, steps:fields.steps, builderBlocks:draft.blocks, totalKm:fields.totalKm, totalMin:fields.totalMin, cor:fields.cor, objetivo:fields.objetivo, createdAt:Date.now() });
          }
          saveTreinoTemplates();
          state.modalOpen = false;
          state.corridaBuilderDraft = null;
          state.tab = 'meusTreinos';
          render();
          return;
        }
        // Bate pela data da semana que está sendo exibida (mesma que o modal de edição mostrou) —
        // não só pelo nome do dia, senão isso sobrescreveria por engano o treino de outra semana
        // que por acaso caia no mesmo dia da semana.
        const idx = state.treinos.findIndex(t=>dayAbbrevOf(t.day)===day && t.day.includes(dayDateLabel(day)));
        if(idx > -1) state.treinos[idx] = { ...state.treinos[idx], ...fields };
        else{
          // Treino criado na mão também ganha uma data real (não só o dia da semana abstrato) — assim
          // o rótulo de data e o histórico por-dia funcionam igual aos treinos gerados pelo plano.
          const dNew = nextOccurrenceOfDay(day, new Date());
          state.treinos.push({ day: day+' '+vdotFormatDDMM(dNew), ...fields });
        }
        state.isDemo = false;
        saveTreinos();
        state.modalOpen = false;
        state.corridaBuilderDraft = null;
        render();
        return;
      }else if(state.modalType === 'corridaLog'){
        let daySel = state.corridaLogDay || document.getElementById('inCorridaDay').value;
        if(daySel && daySel.startsWith('W') && daySel.includes('|')){
          // Veio da sugestão por formato da corrida (voltas), de uma semana diferente da que está aberta —
          // materializa aquela semana primeiro pra poder gravar o resultado no dia certo.
          const [wPart, dayPart] = daySel.split('|');
          const wn = parseInt(wPart.slice(1),10);
          const cv = state.corridaVdotData;
          const week = cv && cv.plan ? cv.plan.find(w=>w.weekNumber===wn) : null;
          if(week){
            materializeVdotWeekIntoTreinos(week, cv.startMonday || vdotISODate(vdotStartMonday(new Date())));
            state.corridaVdotData = { ...cv, currentWeekIndex: wn };
            saveCorridaVdotData();
          }
          daySel = dayPart;
        }
        const pace = document.getElementById('inPaceReal').value.trim();
        const tempo = document.getElementById('inTempoReal').value.trim();
        const km = document.getElementById('inKmReal').value.trim();
        const prev = corridaEntryProgress(daySel) || {};
        const dataField = (state.corridaLogPrefill && state.corridaLogPrefill.data) || prev.data || todayISO();
        // desfaz um crédito de tênis de um log anterior dessa mesma data, pra não contar km em dobro
        if(prev.shoeCredit){
          const prevT = state.equipamentos.tenis.find(x=>x.id===prev.shoeCredit.tenisId);
          if(prevT) prevT.km = Math.max(0, Math.round((prevT.km-prev.shoeCredit.km)*10)/10);
        }
        const entryForShoe = state.treinos.find(t=>dayAbbrevOf(t.day)===daySel);
        const realKm = parseFloat(km) || (entryForShoe && entryForShoe.totalKm ? parseFloat(entryForShoe.totalKm) : 0);
        const ativoTenis = state.equipamentos.tenis.find(t=>t.ativo);
        let shoeCredit = null;
        if(ativoTenis && realKm){ ativoTenis.km = Math.round((ativoTenis.km+realKm)*10)/10; shoeCredit = {tenisId:ativoTenis.id, km:realKm}; }
        saveEquipamentos();
        state.corridaProgress[corridaProgressKey(daySel)] = { ...prev, done:true, pace, tempo, km, data: dataField, shoeCredit };
        saveCorridaProgress();
        state.selectedDayCorrida = daySel;
        state.corridaLogDay = null; state.corridaLogPrefill = null;
        state.modalOpen = false;
        render();
        return;
      }
      state.modalOpen = false;
      render();
    };
  }
}

  const btnAuthEntrar = document.getElementById('btnAuthEntrar');

    render();
    auth.sendPasswordResetEmail(email).then(function(){
      state.authInfo = 'Mandei um e-mail pra você definir uma senha nova. Depois de definir, volta aqui e usa "Entrar".';
    }).catch(function(e){
      state.authError = authErrorMessage(e.code, e.message);
    }).finally(function(){
      state.authBusy = null;
      render();
    });
  };
  const souPersonalToggle = document.getElementById('souPersonalToggle');
  if(souPersonalToggle) souPersonalToggle.onclick = async ()=>{
    if(state.perfil.souPersonal){
      state.perfil = { ...state.perfil, souPersonal:false };
      savePerfil(); render();
      return;
    }
    const allowed = await checkIsAllowedTrainer(state.authUser.email);
    if(!allowed){ alert('Fala com o suporte pra virar personal trainer.'); return; }
    state.perfil = { ...state.perfil, souPersonal:true };
    savePerfil(); render();
  };
  const btnGenShareCode = document.getElementById('btnGenShareCode');
  if(btnGenShareCode) btnGenShareCode.onclick = async ()=>{
    btnGenShareCode.textContent = 'Gerando...';
    try{
      const code = await generateShareCode();
      state.shareCodeShown = code;
    }catch(e){ alert('Não consegui gerar o código: '+e.message); }
    render();
  };
  const btnCopyShareCode = document.getElementById('btnCopyShareCode');
  if(btnCopyShareCode) btnCopyShareCode.onclick = ()=>{
    navigator.clipboard.writeText(state.shareCodeShown).then(()=>{
      btnCopyShareCode.textContent = 'Copiado!';
      setTimeout(()=>{ btnCopyShareCode.textContent = 'Copiar'; }, 1500);
    });
  };
  document.querySelectorAll('[data-revokeaccess]').forEach(el=>{
    el.onclick = async ()=>{
      if(!confirm('Remover o acesso desse personal ao seu treino?')) return;
      await revokeAccess(el.getAttribute('data-revokeaccess'));
      state.clientTrainers = await listWhoHasAccessToMe();
      render();
    };
  });
  if(!state._clientTrainersFetched){
    state._clientTrainersFetched = true;
    listWhoHasAccessToMe().then(list=>{ state.clientTrainers = list; render(); }).catch(()=>{});
  }
}

// Uma sessão por modalidade agendada hoje (corrida e/ou musculação), com as mesmas 3 métricas que os
// cards da tela Treino já usam — o card grande do Início é literalmente o mesmo resumo, só que do dia
// de hoje em vez do dia selecionado na tira de dias.
function mrtHeroSessions(day){
  const sessions = [];
  const corridaEntry = treinoEntryForDay(day);
  if(corridaEntry){
    sessions.push({
      tipo:'corrida', label:'CORRIDA', titulo:corridaEntry.type||'Treino', cor: mrtRunColor(corridaEntry.type),
      metrics:[
        {k:'Duração', v: corridaEntry.totalMin?formatDuration(corridaEntry.totalMin*60):'—'},
        {k:'Ritmo', v: corridaAvgPaceLabel(corridaEntry)},
        {k:'Distância', v: corridaEntry.totalKm?fmtKm(corridaEntry.totalKm):'—'},
      ],
      done: isCorridaDone(day),
    });
  }
  const muscList = muscListForDay(day);
  if(muscList.length){
    const totalSeries = muscList.reduce((s,ex)=>s+(parseInt(ex.series,10)||0), 0);
    sessions.push({
      tipo:'musculacao', label:'MUSCULAÇÃO', titulo:'Treino de musculação', cor:'var(--mrt-blue)',
      metrics:[
        {k:'Duração', v:'~'+estimateWorkoutMinutes(muscList)+'min'},
        {k:'Exercícios', v:String(muscList.length)},
        {k:'Volume', v:totalSeries+' séries'},
      ],
      done: muscList.every(e=>e.done),
    });
  }
  return sessions;
}
// Desafio da TURMA (grupo), não o desafio solo antigo — só aparece se o grupo já foi carregado (a
// própria tela Turma que dispara esse carregamento; aqui só lê o que já estiver em memória).
function mrtTurmaCard(){
  const detail = state.turmaGroupDetail;
  if(!detail || !detail.challenge) return '';
  const challenge = detail.challenge;
  const members = detail.members||[];
  const sorted = [...members].sort((a,b)=>Object.keys(b.checkins||{}).length-Object.keys(a.checkins||{}).length);
  const me = state.authUser && members.find(m=>m.uid===state.authUser.uid);
  const meCount = me ? Object.keys(me.checkins||{}).length : 0;
  const posicao = me ? sorted.findIndex(m=>m.uid===me.uid)+1 : null;
  const daysElapsed = Math.max(1, Math.floor((Date.parse(todayISO())-Date.parse(challenge.startDateISO))/86400000)+1);
  const daysRemaining = Math.max(0, challenge.totalDays-daysElapsed);
  return `<div class="mrt-card" data-tabgo="turma">
    <div class="mrt-runlabel" style="color:var(--mrt-amber);">🔥 ${challenge.name}</div>
    <div class="mrt-metricsrow" style="margin-top:10px;">
      <div class="mrt-metric"><div class="mrt-metrick">Posição</div><div class="mrt-metricv">${posicao?posicao+'º':'—'}</div></div>
      <div class="mrt-metric"><div class="mrt-metrick">Check-ins</div><div class="mrt-metricv">${meCount}</div></div>
      <div class="mrt-metric"><div class="mrt-metrick">Restam</div><div class="mrt-metricv">${daysRemaining}d</div></div>
    </div>
  </div>`;
}

/* ============================================================================================
   TELA TREINO (V2) — reaproveita só dados/funções que já existiam (treinoEntryForDay,
   muscListForDay, isCorridaDone, weekCounts, dayStatus, estimateWorkoutMinutes, exercisePR,
   isExercicioComposto, openGpsIntro/openEsteiraIntro, toggleCorridaDone, toggleExDone,
   openQuickWeightModal, hybridPlanData/corridaVdotData) — nada de tela/CSS antigo.
   ============================================================================================ */
const DAY_FULLNAME = { Seg:'Segunda-feira', Ter:'Terça-feira', Qua:'Quarta-feira', Qui:'Quinta-feira', Sex:'Sexta-feira', 'Sáb':'Sábado', Dom:'Domingo' };
// Mesmos dados de "Semana X de Y · Fase" que treinoPhaseLabel() já calculava, só que em partes
// separadas (em vez de uma string pronta) pra poder montar o layout novo (navegação + rótulo da fase
// em blocos distintos) sem duplicar a lógica de qual plano manda (híbrido tem prioridade sobre o VDOT solo).
function treinoPhaseParts(){
  const hp = state.hybridPlanData;
  if(hp && hp.plan && hp.plan.length){
    const total = hp.plan.length, cur = hp.currentWeekIndex||1;
    const w = hp.plan.find(x=>x.weekNumber===cur);
    if(w) return { weekNumber:cur, totalWeeks: total, phaseName: w.phaseLabel, plan: hp.plan };
  }
  const cv = state.corridaVdotData;
  if(cv && cv.plan && cv.plan.length){
    const total = cv.plan.length, cur = cv.currentWeekIndex||1;
    const w = cv.plan.find(x=>x.weekNumber===cur);
    if(w) return { weekNumber:cur, totalWeeks: total, phaseName: w.phaseName, plan: cv.plan };
  }
  return null;
}
// Chips "T1 T2 T3…" = a posição da semana atual dentro da fase atual do plano (não é um dado novo,
// é só agrupar as semanas do plano que já existe pelo nome da fase).
function treinoProgressaoChips(parts){
  if(!parts) return [];
  const phaseWeeks = parts.plan.filter(w=>(w.phaseLabel||w.phaseName)===parts.phaseName);
  return phaseWeeks.map((w,i)=>({ label:'T'+(i+1), current: w.weekNumber===parts.weekNumber }));
}
function treinoNextWorkoutHint(day){
  const idx = DAY_ABBR.indexOf(day);
  for(let i=1;i<=7;i++){
    const d = DAY_ABBR[(idx+i)%7];
    if(dayStatus(d)!=='none'){
      const hasCorrida = !!treinoEntryForDay(d);
      const hasMusc = muscListForDay(d).length>0;
      const tipo = hasCorrida && hasMusc ? 'Corrida e musculação' : hasCorrida ? 'Corrida' : 'Musculação';
      return `Próximo treino: ${tipo} · ${DAY_FULLNAME[d]||d}`;
    }
  }
  return 'Nenhum outro treino agendado essa semana.';
}
// Mesma categoria que stepColorFor() já usava (Aquecimento/Desaquecimento/resto), só que devolvendo os
// tokens da paleta nova em vez de var(--blue)/var(--teal) do tema antigo (que aqui dentro ficariam com
// a cor errada, herdada do :root de fora do .mrt-root).
function mrtStepColor(name){
  if(name==='Aquecimento') return 'var(--mrt-amber)';
  if(name==='Desaquecimento') return 'var(--mrt-bluelight)';
  return 'var(--mrt-blue)';
}
// Mesmas palavras-chave que inferCorTipo() usa pra colorir o treino (entry.cor guarda um var(--verde
// antigo)/etc. do tema velho) — recalcula a categoria a partir do tipo e devolve um token da paleta nova.
function mrtRunColor(tipo){
  const t = String(tipo||'').toLowerCase();
  if(/long/.test(t)) return 'var(--mrt-green)';
  if(/limiar/.test(t)) return 'var(--mrt-amber)';
  if(/interval/.test(t)) return 'var(--mrt-red)';
  if(/repeti|tiro/.test(t)) return 'var(--mrt-bluelight)';
  return 'var(--mrt-blue)';
}
function corridaAvgPaceLabel(entry){
  if(!entry.steps || !entry.steps.length) return entry.mainPace || '—';
  let totalKm=0, totalSec=0;
  entry.steps.forEach(s=>{
    const range = parsePaceRangeToSec(s.pace);
    if(range && s.km){ totalSec += ((range.lo+range.hi)/2)*s.km; totalKm += s.km; }
  });
  return totalKm>0 ? formatPace(totalSec/totalKm)+'/km' : '—';
}

function renderTreinoV2Musc(day){
  const list = muscListForDay(day);
  if(list.length===0){
    return `<div class="mrt-restcard">${ICONS.dumbbell}<div class="t">Dia de descanso</div><div class="s">${treinoNextWorkoutHint(day)}</div></div>`;
  }
  const compostos = list.filter(ex => isExercicioComposto(ex.nome) !== false);
  const isolamentos = list.filter(ex => isExercicioComposto(ex.nome) === false);
  // Plano gerado pelo híbrido já vem na ordem BASE → AUXILIAR → ISOLADO; o resto segue "compostos primeiro".
  const PAPEL_RANK = { base:0, auxiliar:1, isolado:2 };
  const ordered = list.every(e=>e.papel) ? [...list].sort((a,b)=>PAPEL_RANK[a.papel]-PAPEL_RANK[b.papel]) : compostos.concat(isolamentos);
  const totalSeries = list.reduce((s,ex)=>s+(parseInt(ex.series,10)||0), 0);

      ${ex.repdbId ? `<img class="mrt-exthumb" src="${repdbImg(ex.repdbId)}" alt="">` : `<div class="mrt-exthumb"></div>`}

      </div>
      <div class="mrt-excheck ${ex.done?'done':''}" data-mrtexdone="${ex.id}">${ex.done?CHECK_SVG:''}</div>
    </div>`;

  return summary + cards;

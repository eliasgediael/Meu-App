function wirePerfilV2(){
  document.querySelectorAll('[data-tabgo]').forEach(el=>{
    el.onclick = ()=>{
      const destTab = el.getAttribute('data-tabgo');
      if(destTab==='hoje' || destTab==='meusTreinos'){
        const todayAbbr = DAY_ABBR[(new Date().getDay()+6)%7];
        state.selectedDayHoje = todayAbbr; state.selectedDayMusc = todayAbbr; state.selectedDayCorrida = todayAbbr;
        state.weekOffset = 0;
      }
      if(destTab!=='perfil'){ state._clientTrainersFetched = false; }
      state.tab = destTab;
      render();
    };
  });
  const editDadosBtn = document.getElementById('mrtEditDadosBtn');
  if(editDadosBtn) editDadosBtn.onclick = ()=>{ state.modalType='dadosPessoais'; state.modalOpen=true; render(); };
  const closeDadosBtn = document.getElementById('mrtCloseDadosPessoais');
  if(closeDadosBtn) closeDadosBtn.onclick = ()=>{ state.modalOpen=false; state.modalType=null; render(); };
  const dadosOverlay = document.getElementById('mrtDadosOverlay');
  if(dadosOverlay) dadosOverlay.onclick = (ev)=>{ if(ev.target===ev.currentTarget){ state.modalOpen=false; state.modalType=null; render(); } };
  const redoDiagBtn = document.getElementById('mrtRedoDiagBtn');
  if(redoDiagBtn) redoDiagBtn.onclick = openHybridCreate;
  const vozToggle = document.getElementById('mrtPrefVoz');
  if(vozToggle) vozToggle.onclick = ()=>{ state.vozAtiva = state.vozAtiva===false; render(); };
  document.querySelectorAll('[data-mrtprefstub]').forEach(el=>{
    el.onclick = ()=> alert(`"${el.getAttribute('data-mrtprefstub')}" ainda não é personalizável nesta versão.`);
  });
  document.querySelectorAll('[data-mrtintegrar]').forEach(el=>{
    el.onclick = ()=> alert(`Integração com ${el.getAttribute('data-mrtintegrar')} ainda não existe no app.`);
  });
  wirePerfilExtras();
}

function mrtRingSvg(pct, color, size){
  size = size||82;
  const stroke=9, r=(size-stroke)/2, c=2*Math.PI*r;
  const off = c*(1-Math.max(0,Math.min(100,pct))/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--mrt-card2)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>
  </svg>`;
}

function renderTurma(){

  let challengeHtml;

        <div class="turma-cardtitle">Bora começar um desafio de constância?</div>

        ${state.turmaShowNewChallenge ? `
          <div class="turma-inlineform" style="margin-top:12px;flex-direction:column;align-items:stretch;">
            <input type="text" id="turmaChallengeName" placeholder="Nome do desafio (ex: Desafio 21 dias)">
            <div class="challenge-startrow" style="margin-top:8px;">${[7,14,21,30].map(n=>`<button class="challenge-startbtn" data-turmachallengedays="${n}">${n}d</button>`).join('')}</div>
          </div>` : ''}
      </div>`;
  }else{

    const daysRemaining = Math.max(0, challenge.totalDays-daysElapsed);
    const groupDone = members.reduce((s,m)=>s+Object.keys(m.checkins||{}).length,0);

          </div>`).join('')}

  }

  const feedHtml = `
    <div class="turma-feedlabel">Check-ins recentes</div>
    ${!detail.feed.length ? `<div class="turma-feedempty">Ninguém fez check-in ainda.</div>` : detail.feed.map(f=>`
      <div class="turma-feeditem">
        <div class="turma-avatar small">${(f.name||'?')[0].toUpperCase()}</div>
        <div class="turma-feedtext"><b>${f.name||'Atleta'}</b> ${f.text}</div>
      </div>`).join('')}

  return createJoinRow + inviteRow + challengeHtml + `<div style="margin-top:18px;">${feedHtml}</div>`;

function stepColorFor(name){
  if(name==='Aquecimento') return 'var(--amber)';
  if(name==='Desaquecimento') return 'var(--teal)';
  return 'var(--blue)';
}
function corridaDayCard(entry, zoneInfo, done, day){
  const open = state.expandedPhase === day;
  const cor = entry.cor || 'var(--blue)';
  const prog = corridaEntryProgress(day);
  const hasReal = prog && (prog.pace || prog.tempo || prog.km);
  const extras = `
    ${entry.zone ? `<div>Zona: ${entry.zone}${zoneInfo?' · '+zoneInfo.nome:''}</div>` : ''}
    ${hasReal ? `<div style="color:var(--accent);margin-top:4px;">Real: ${prog.pace?prog.pace+'/km':''}${prog.tempo?' · '+prog.tempo:''}${prog.km?' · '+prog.km+'km':''}</div>` : ''}
  `;
  const body = (entry.steps && entry.steps.length) ? `
    <div style="display:flex;gap:3px;height:34px;margin-bottom:4px;">
      ${entry.steps.map(s=>`<div style="flex:${Math.max(s.km,0.3)};background:${stepColorFor(s.name)};border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:800;overflow:hidden;white-space:nowrap;">${s.pace ? s.pace.replace('/km','') : ''}</div>`).join('')}
    </div>
    <div style="display:flex;gap:3px;margin-bottom:16px;">
      ${entry.steps.map(s=>`<div style="flex:${Math.max(s.km,0.3)};text-align:center;font-size:10px;color:var(--text-dim);line-height:1.4;">${s.name}<br>${fmtKm(s.km)}</div>`).join('')}
    </div>
    <div style="display:flex;gap:28px;margin-bottom:16px;">
      ${entry.totalMin ? `<div><div style="font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.3px;">Tempo estimado</div><div style="font-size:17px;font-weight:800;color:var(--text);">${formatDuration(entry.totalMin*60)}</div></div>` : ''}
      <div><div style="font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.3px;">Distância total</div><div style="font-size:17px;font-weight:800;color:var(--text);">${fmtKm(entry.totalKm)}</div></div>
    </div>
    ${entry.objetivo ? `<div style="color:var(--text-dim);font-size:12.5px;margin-bottom:14px;">${entry.objetivo}</div>` : ''}
    <div style="font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.3px;margin-bottom:8px;">Passos</div>
    ${entry.steps.map(s=>`
      <div style="display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);">
        <div style="width:3px;border-radius:2px;background:${stepColorFor(s.name)};flex-shrink:0;"></div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:700;font-size:13.5px;color:var(--text);">${s.name}</div>
          <div style="font-size:12px;color:var(--text-dim);margin-top:1px;">${fmtKm(s.km)}${s.pace?' · Ritmo '+s.pace:''}</div>
        </div>
      </div>
    `).join('')}
    <div style="margin-top:10px;">${extras}</div>
  ` : `
    ${entry.warmupDesc ? `<div style="margin-bottom:5px;"><b style="color:var(--text);">Aquecimento:</b> ${entry.warmupDesc}${entry.warmupPace?' — '+entry.warmupPace:''}</div>` : ''}
    <div style="margin-bottom:5px;"><b style="color:var(--text);">Principal:</b> ${entry.mainDesc||'—'}${entry.mainPace?' — '+entry.mainPace:''}</div>
    ${entry.cooldownDesc ? `<div style="margin-bottom:5px;"><b style="color:var(--text);">Desaquecimento:</b> ${entry.cooldownDesc}${entry.cooldownPace?' — '+entry.cooldownPace:''}</div>` : ''}
    ${extras}
  `;
  return `
    <div class="wk-card" id="wkcard-${day}">
      <div class="wk-head" data-toggle="${day}">
        <div class="wk-bar" style="background:${cor};"></div>
        <div class="wk-body">
          <div class="wk-tag" style="color:${cor};">${day.toUpperCase()} · ${dayDateLabel(day)}</div>
          <div class="wk-title ${done?'done':''}">${entry.type || 'Treino'}</div>
          ${entry.objetivo && !open ? `<div class="wk-why">${entry.objetivo}</div>` : ''}
        </div>
        <div class="wk-km">${entry.totalKm ? fmtKm(entry.totalKm) : ''}</div>
        <div class="phase-check ${done?'done':''}" data-donetoggle="${day}" title="Marcar treino como concluído">${done?CHECK_SVG:''}</div>
        <button class="del-btn" data-delcorrida="${day}" title="Excluir treino">×</button>
        <div class="phase-chevron ${open?'open':''}">${CHEVRON_SVG}</div>
      </div>
      ${open ? `<div class="phase-body" style="padding:0 14px 14px;">${body}
        <div class="corrida-start-row">
          ${(state.hybridPlanData && state.hybridPlanData.draft && state.hybridPlanData.draft.localCorrida==='esteira') ? `
            <button class="corrida-gps-btn corrida-esteira-btn" data-startesteira="${day}">${ICONS.run}Esteira</button>
            <button class="corrida-gps-btn corrida-esteira-btn" data-startgps="${day}">${ICONS.run}GPS</button>
          ` : `
            <button class="corrida-gps-btn" data-startgps="${day}">${ICONS.run}GPS</button>
            <button class="corrida-gps-btn corrida-esteira-btn" data-startesteira="${day}">${ICONS.run}Esteira</button>
          `}
        </div>
      </div>` : ''}
    </div>`;
}

function svgLineChart(points, opts){
  const { width=300, height=140, color='var(--accent)', formatY=(v)=>v } = opts || {};
  if(!points || points.length===0) return `<div class="empty-state">Sem dados ainda.</div>`;
  const pad = 30;
  const ys = points.map(p=>p.y);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const rangeY = (maxY-minY) || 1;
  const stepX = points.length>1 ? (width-2*pad)/(points.length-1) : 0;
  const coord = (i,y)=>{
    const px = pad + i*stepX;
    const t = (y-minY)/rangeY;
    const py = height-pad - t*(height-2*pad);
    return [px,py];
  };
  const pathD = points.map((p,i)=>{ const [x,y]=coord(i,p.y); return (i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1); }).join(' ');
  const dots = points.map((p,i)=>{ const [x,y]=coord(i,p.y); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${color}"></circle>`; }).join('');
  const showEvery = points.length > 8 ? Math.ceil(points.length/8) : 1;
  const labels = points.map((p,i)=>{
    if(i % showEvery !== 0 && i !== points.length-1) return '';
    const [x] = coord(i,p.y);
    return `<text x="${x.toFixed(1)}" y="${height-8}" font-size="9" fill="var(--text-dim)" text-anchor="middle">${p.x}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" style="overflow:visible;">
    <path d="${pathD}" fill="none" stroke="${color}" stroke-width="2"/>
    ${dots}
    ${labels}
    <text x="${pad}" y="14" font-size="10" fill="var(--text-dim)">${formatY(maxY)}</text>
    <text x="${pad}" y="${height-pad+4}" font-size="10" fill="var(--text-dim)">${formatY(minY)}</text>
  </svg>`;
}

// Fase 5 (Meu Ritmo) — feedback qualitativo, não só o delta de pace bruto: o mesmo "mais rápido que o
// planejado" é BOM num treino de qualidade e RUIM num treino leve (não respeitou a recuperação), então o
// veredito depende do tipo do treino. Quando vem mais rápido que o alvo NUM treino de qualidade, é sinal
// de que o VDOT pode estar desatualizado — sinaliza (não recalcula sozinho: mudar o VDOT afeta todos os
// paces futuros, então pede pra pessoa refazer o teste em Corrida > VDOT quando quiser confirmar isso).
function corridaFeedbackText(entry, prog){
  const plannedPaceSec = parsePaceToSec(entry.mainPace || (entry.steps && entry.steps[0] && entry.steps[0].pace));
  const realPaceSec = parsePaceToSec(prog.pace);
  if(!plannedPaceSec || !realPaceSec) return null;
  const diff = realPaceSec - plannedPaceSec; // negativo = ficou mais rápido que o planejado
  const tol = 15; // seg/km de tolerância antes de considerar "fora" do alvo
  const tipo = (entry.type||'').toLowerCase();
  const isEasy = /leve|f[aá]cil|long[aã]o|regenerativa|solta/.test(tipo);
  const isQuality = /limiar|interval|repeti[cç][aã]o|tempo run/.test(tipo);
  if(isEasy){
    if(diff < -tol) return { text:'Foi rápido demais pro treino leve — aqui o objetivo é ir devagar (recuperação/base aeróbica), não bater recorde.', suggestVdot:false };
    return { text:'Executou dentro do esperado pro treino leve.', suggestVdot:false };
  }
  if(isQuality){
    if(diff > tol) return { text:'Não sustentou o ritmo de qualidade — ficou mais lento que o alvo nesse treino.', suggestVdot:false };
    if(diff < -tol) return { text:'Foi mais rápido que o alvo no treino de qualidade — seu VDOT pode estar desatualizado. Vale refazer o teste em Corrida, opção VDOT.', suggestVdot:true };
    return { text:'Executou dentro da zona de qualidade planejada.', suggestVdot:false };
  }
  return null;
}
function renderComparativo(){
  const rows = [];
  DAY_ABBR.forEach(d=>{
    const entry = treinoEntryForDay(d);
    const prog = corridaEntryProgress(d);
    if(!entry || !prog || !(prog.pace || prog.tempo || prog.km)) return;
    const plannedPaceSec = parsePaceToSec(entry.mainPace);
    const realPaceSec = parsePaceToSec(prog.pace);
    let deltaHtml = '';
    if(plannedPaceSec && realPaceSec){
      const diff = realPaceSec - plannedPaceSec;
      const diffAbs = Math.abs(diff);
      const diffStr = Math.floor(diffAbs/60)+':'+String(Math.round(diffAbs%60)).padStart(2,'0');
      deltaHtml = diff<0
        ? `<div style="font-size:12px;font-weight:700;color:var(--accent);">${diffStr}/km mais rápido</div>`
        : diff>0
          ? `<div style="font-size:12px;font-weight:700;color:var(--amber);">${diffStr}/km mais lento</div>`
          : `<div style="font-size:12px;font-weight:700;color:var(--text-dim);">no ritmo planejado</div>`;
    }
    const feedback = corridaFeedbackText(entry, prog);
    rows.push(`
      <div class="leg-card" style="flex-direction:column;align-items:stretch;gap:8px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div class="leg-tag">${entry.day} · ${entry.type||'Treino'}</div>
          ${deltaHtml}
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div>
            <div style="font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.3px;">Planejado</div>
            <div style="font-weight:700;font-size:15px;">${entry.totalKm ? entry.totalKm+'km' : '—'}</div>
            <div style="font-size:12px;color:var(--text-dim);">${entry.mainPace||'—'}</div>
          </div>
          <div>
            <div style="font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.3px;">Real</div>
            <div style="font-weight:700;font-size:15px;color:var(--accent);">${prog.km ? prog.km+'km' : '—'}</div>
            <div style="font-size:12px;color:var(--accent);">${prog.pace ? prog.pace+'/km' : (prog.tempo||'—')}</div>
          </div>
        </div>
        ${feedback ? `<div style="font-size:12px;font-weight:600;color:${feedback.suggestVdot?'var(--amber)':'var(--text-dim)'};line-height:1.4;">${feedback.text}</div>` : ''}
      </div>
    `);
  });
  if(rows.length===0){
    return `<div class="empty-state">Ainda sem treinos com dado real registrado essa semana.<br>Marque um treino como concluído ou importe um .FIT pra comparar com o planejado.</div>`;
  }
  return rows.join('');
}

// Reconstrói o histórico de %gordura cruzando as medidas já salvas por data (pescoço é sempre exigido;
// quadril só entra pra fórmula feminina) — não precisa de uma coleção própria, deriva do que já existe.
function bodyFatHistory(){
  const sexo = state.perfil.sexo, altura = state.perfil.altura;
  if(!sexo || !altura) return [];
  const hist = state.historicoMedidas || {};
  const pescocoHist = hist.pescoco || [];
  const out = [];
  pescocoHist.forEach(p=>{
    const cinturaEntry = (hist.cintura||[]).find(c=>c.data===p.data);
    const quadrilEntry = (hist.quadril||[]).find(q=>q.data===p.data);
    if(!cinturaEntry) return;
    const pct = calcBodyFatNavy(sexo, altura, p.valor, cinturaEntry.valor, quadrilEntry?quadrilEntry.valor:null);
    if(pct!=null) out.push({ data:p.data, pct });
  });
  return out;
}
function renderMedidasTab(){
  const hist = bodyFatHistory();
  const current = hist.length ? hist[hist.length-1] : null;
  const previous = hist.length>1 ? hist[hist.length-2] : null;

  const missingProfile = !state.perfil.sexo || !state.perfil.altura;
  return `
    ${missingProfile ? `<div class="gps-warnbanner" style="margin-bottom:16px;">Preenche sexo e altura no Perfil pra calcular o percentual de gordura automaticamente.</div>` : ''}
    ${current ? `

// A intensidade (quem ganha mais volume/dias, corrida ou força) não é mais uma pergunta separada —
// vem direto do objetivo principal que a pessoa já escolheu, então o quiz fica mais curto e mais

function focoFromObjetivo(objetivo){

  const nextBtnHyb = document.getElementById('hybQuizNext');
  if(nextBtnHyb) nextBtnHyb.onclick = ()=>{

    if((hd.step||0)===4){
      const avail = hd.availableDays||[];
      if(avail.length===0){ alert('Marca pelo menos 1 dia disponível pra treinar.'); return; }

    }
    const corridaDays = DAY_ABBR.filter(d => dayPicks[d]==='corrida' || dayPicks[d]==='ambos');
    const muscDays = DAY_ABBR.filter(d => dayPicks[d]==='musc' || dayPicks[d]==='ambos');
    if(corridaDays.length===0 && muscDays.length===0){ alert('Marca pelo menos 1 dia disponível pra treinar.'); return; }

    const warnings = [];
    const consecWarn = hybridConsecutiveRunWarning(corridaDays);
    if(consecWarn) warnings.push(consecWarn);

    const longaoDay = corridaDays.length ? pickLongaoDay(corridaDays) : null;
    const sched = { corridaDays, muscDays, longaoDay };
    const totalWeeks = hd.weeksChoice || 8;
    const draft = {
      nivelCorrida:hd.nivelCorrida, nivelMusc:hd.nivelMusc, objetivo:hd.objetivo,
      corridaGoal:hd.corridaGoal, corridaCurrentLong:hd.corridaCurrentLong,
      equip:hd.equip, lesao:hd.lesao, tempoMaxMin:hd.tempoMaxMin,
      temRelogio:hd.temRelogio, localCorrida:hd.localCorrida,

    const week1 = plan[0];
    const sameDayNotes = buildHybridSameDayNotes(week1.corridaWeek, week1.muscPlan, foco);

    const startMonday = vdotISODate(vdotStartMonday(new Date()));
    materializeHybridWeekIntoState(week1, startMonday);
    state.hybridPlanData = { draft, sched, totalWeeks, checkins, foco, dayPicks, plan, startMonday, currentWeekIndex:1 };
    saveHybridPlanData();
    hd.previewDayPicks = dayPicks;
    hd.previewNotes = [...warnings, ...week1.legEasingNotes, ...sameDayNotes];
    hd.step = 'preview';
    render();
  };
}
// Ajusta quantos dias viram musculação SEM mexer em autoDistributeHybridDays (que continua sendo a
// única fonte de verdade da distribuição automática) — só corta ou completa a partir do que ela já
// decidiu, usado quando a pessoa escolhe uma frequência diferente da recomendada na tela de resultado.
function adjustMuscFrequency(dayPicks, availableDays, targetCount){
  const picks = { ...dayPicks };
  const muscDays = DAY_ABBR.filter(d=>picks[d]==='musc'||picks[d]==='ambos');
  if(muscDays.length > targetCount){
    muscDays.slice(targetCount).forEach(d=>{ picks[d] = picks[d]==='ambos' ? 'corrida' : 'descanso'; });
  }else if(muscDays.length < targetCount){
    const need = targetCount - muscDays.length;
    const candidates = (availableDays||[]).filter(d=>picks[d]==='descanso'||!picks[d]);
    candidates.slice(0, need).forEach(d=>{ picks[d] = 'musc'; });
  }
  return picks;
}

      ${opt(hd.localCorrida==='ambos','hyblocalcorrida','ambos','Os dois')}`;
  }else if(step===10){
    body = `<div class="mrt-quiz-title">Duração do plano</div>
      ${opt(hd.weeksChoice==8,'hybweeks',8,'8 semanas')}
      ${opt(hd.weeksChoice==12,'hybweeks',12,'12 semanas')}
      ${opt(hd.weeksChoice==16,'hybweeks',16,'16 semanas')}
      <div class="mrt-sub" style="margin-top:10px;">A corrida e a musculação nunca sobem juntas na mesma semana — revezam em blocos de 4 semanas, com descarga a cada 4ª.</div>`;
  }else{
    body = renderHybridResultBody(hd);
  }
  const isFirst = step===0, isLast = step===total-1;
  return `
    <div class="mrt-root">
      <div class="mrt-scroll">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-top:calc(14px + env(safe-area-inset-top));">
          <button class="mrt-wex-x" id="${isFirst?'hybQuizExit':'hybQuizBack'}">${isFirst?'✕':'‹'}</button>
          <div class="mrt-sub">Passo ${step+1} de ${total}</div>
          <div style="width:34px;"></div>
        </div>
        <div class="mrt-counterbar" style="height:6px;margin-bottom:24px;"><div class="fill" style="width:${pct}%"></div></div>
        ${body}
      </div>
      <div style="padding:14px 18px calc(14px + env(safe-area-inset-bottom));">
        <button class="mrt-btnprimary" style="width:100%;" id="${isLast?'btnGerarHibrido':'hybQuizNext'}">${isLast?'Gerar meu plano':'Próximo'}</button>
      </div>
    </div>`;
}

    const d = state.hybridCheckinDraft || (state.hybridCheckinDraft = { fadiga:null, sono:null, percepcao:null, dor:false, dorRegiao:null, motivos:[] });
    const wk = weekCounts();
    const scale5 = (field, atual)=>Array.from({length:5},(_,i)=>i+1).map(n=>`<button class="quiz-optrow ${atual===n?'active':''}" style="display:inline-flex;width:auto;padding:8px 16px;margin-right:6px;" data-hcscale="${field}" data-hcval="${n}">${n}</button>`).join('');
    const motivoChip = (val,label)=>`<div class="quiz-optrow ${d.motivos.includes(val)?'active':''}" data-hcmotivo="${val}">${label}</div>`;
    const regiaoChip = (val)=>`<div class="quiz-optrow ${d.dorRegiao===val?'active':''}" data-hcregiao="${val}" style="display:inline-block;width:auto;padding:8px 14px;margin:0 6px 6px 0;">${val}</div>`;
    return `
      <div class="modal-overlay">
        <div class="modal">
          <h3>Como foi a semana ${week}?</h3>
          <p class="modal-sub">Aderência: ${wk.done}/${wk.scheduled} treinos feitos essa semana (calculado sozinho).</p>
          <p class="modal-sub" style="margin-top:14px;">Fadiga geral (1 = descansado, 5 = exausto)</p>
          <div>${scale5('fadiga', d.fadiga)}</div>
          <p class="modal-sub" style="margin-top:14px;">Qualidade do sono (1 = péssimo, 5 = ótimo)</p>
          <div>${scale5('sono', d.sono)}</div>
          <p class="modal-sub" style="margin-top:14px;">Percepção geral dos treinos (1 = fácil demais, 5 = difícil demais)</p>
          <div>${scale5('percepcao', d.percepcao)}</div>
          <p class="modal-sub" style="margin-top:14px;">Sentiu dor muscular ou articular?</p>
          <div style="display:flex;gap:8px;">
            <div class="quiz-optrow ${d.dor?'active':''}" data-hcdor="1" style="width:auto;padding:8px 16px;">Sim</div>
            <div class="quiz-optrow ${!d.dor?'active':''}" data-hcdor="0" style="width:auto;padding:8px 16px;">Não</div>
          </div>
          ${d.dor ? `<div style="margin-top:8px;">${['joelho','ombro','lombar','costas','punho','tornozelo'].map(regiaoChip).join('')}</div>` : ''}
          <p class="modal-sub" style="margin-top:14px;">O que mais pesou (pode marcar mais de um)?</p>
          <div style="display:flex;flex-wrap:wrap;gap:8px;">
            ${motivoChip('pesado','Treino muito pesado')}
            ${motivoChip('leve','Treino muito leve')}
            ${motivoChip('sem_tempo','Sem tempo')}
            ${motivoChip('enjoei','Enjoei do treino')}
          </div>
          <div class="modal-actions"><button class="secondary" id="modalCancel" style="flex:1;">Cancelar</button><button class="primary" id="hcSalvar" style="flex:1;">Salvar check-in</button></div>
        </div>
      </div>`;
  }
  if(state.modalType === 'corridaLog'){
    const day = state.corridaLogDay;
    const entry = day ? (state.treinos.find(t=>dayAbbrevOf(t.day)===day) || {}) : {};
    const pre = state.corridaLogPrefill || {};
    const needsDaySelect = !day;
    return `
      <div class="modal-overlay">
        <div class="modal">
          <h3>${pre.fromFit ? 'Corrida importada (.FIT)' : 'Concluir treino'}${day ? ' · '+day : ''}</h3>
          ${pre.fromFit ? `<p class="modal-sub">${entry.type ? entry.type+' — ' : ''}confira os dados antes de salvar</p>` : (entry.type ? `<p class="modal-sub">${entry.type}</p>` : '')}
          ${needsDaySelect ? `<div class="field"><label>${state.corridaLogSuggested ? 'Não achei a data exata — pelo formato da corrida, acho que é esse treino (pode trocar):' : 'Não achei a data no seu plano — em qual dia lançar?'}</label>
            <select id="inCorridaDay">${
              (state.corridaLogCandidates && state.corridaLogCandidates.length
                ? state.corridaLogCandidates
                : state.treinos.map(t=>({ value: dayAbbrevOf(t.day), label: `${t.day} — ${t.type||'Treino'}` }))
              ).map(o=>`<option value="${o.value}" ${o.value===state.corridaLogSuggested?'selected':''}>${o.label}</option>`).join('')
            }</select>
          </div>` : ''}
          <div class="field-row">
            <div class="field"><label>Pace real (min/km)</label><input type="text" id="inPaceReal" value="${pre.pace||''}" placeholder="5:20"></div>
            <div class="field"><label>Tempo real</label><input type="text" id="inTempoReal" value="${pre.tempo||''}" placeholder="45min"></div>
          </div>
          <div class="field"><label>Distância real (km)</label><input type="text" id="inKmReal" value="${pre.km||''}" inputmode="decimal" placeholder="${entry.totalKm||''}"></div>
          <div class="modal-actions"><button class="secondary" id="modalCancel">Cancelar</button><button class="primary" id="modalSave">Salvar</button></div>
        </div>
      </div>`;
  }
  if(state.modalType === 'vdotPlan'){
    const cv = state.corridaVdotData || {};
    return `
      <div class="modal-overlay">
        <div class="modal">
          <h3>Gerar plano automático</h3>
          <p class="modal-sub">Monta as semanas de corrida usando seu VDOT ${cv.vdot ? cv.vdot.toFixed(1) : ''}.</p>
          ${cv.plan ? `<div class="leg-desc" style="white-space:normal;background:var(--accent-soft);color:var(--accent);padding:9px 12px;border-radius:8px;margin-bottom:12px;">Você já tem um plano ativo (semana ${cv.currentWeekIndex||1} de ${cv.plan.length}). Gerar de novo substitui esse plano.</div>` : ''}
          ${vdotPlanFormHtml()}
          <div class="modal-actions"><button class="secondary" id="modalCancel">Cancelar</button><button class="primary" id="vdotBtnPlan">Gerar plano</button></div>
          ${cv.plan ? `<button id="vdotBtnDeletePlan" style="width:100%;background:none;border:none;color:var(--danger);font-size:12.5px;padding:10px 0 0;cursor:pointer;">Apagar plano atual</button>` : ''}
          ${state.treinos.length ? `<button id="vdotBtnClearWeek" style="width:100%;background:none;border:none;color:var(--danger);font-size:12.5px;padding:10px 0 0;cursor:pointer;">Limpar todos os treinos da semana</button>` : ''}
        </div>
      </div>`;
  }
  if(state.modalType === 'scheduleTemplate'){
    const tpl = state.treinoTemplates.find(t=>t.id===state.scheduleTemplateId);
    return `
      <div class="modal-overlay">
        <div class="modal">
          <h3>Agendar treino</h3>
          <p class="modal-sub">${tpl ? tpl.tipo : ''}${tpl && tpl.totalKm ? ' · '+fmtKm(tpl.totalKm) : ''}</p>
          <div class="field"><label>Em quais dias dessa semana?</label>
            <div class="day-strip" style="padding:0;" id="scheduleDiasPicker">
              ${DAY_ABBR.map(d=>`<div class="day-pill" data-scheduledia="${d}">${d}</div>`).join('')}
            </div>
            <div class="leg-desc" style="white-space:normal;font-size:12px;color:var(--text-dim);margin-top:8px;">Escolhendo mais de um dia, esse treino é agendado igual em todos eles. Se já tiver algo nesse dia, é substituído.</div>
          </div>
          <div class="modal-actions"><button class="secondary" id="modalCancel">Cancelar</button><button class="primary" id="btnConfirmSchedule">Agendar</button></div>
        </div>
      </div>`;
  }
  if(state.modalType === 'editMuscTemplate'){
    const draft = state.muscTemplateDraft || { tipo:'', exercicios:[] };
    return `
      <div class="modal-overlay">
        <div class="modal">
          <h3>${draft.id ? 'Editar rotina salva' : 'Nova rotina salva'}</h3>
          <div class="field"><label>Nome da rotina</label><input type="text" id="mtplNome" value="${draft.tipo}" placeholder="Treino A - Peito" autofocus></div>
          <div class="blk-section-label">Exercícios</div>
          ${draft.exercicios.length ? draft.exercicios.map(ex=>`
            <div class="leg-card" style="cursor:pointer;" data-mtplexedit="${ex.id}">
              <div class="leg-left"><div class="leg-tag">${ex.grupo}</div><div class="leg-desc">${ex.nome} · ${ex.series}×${ex.reps}${ex.carga?' · '+ex.carga+'kg':''}</div></div>
              <button class="del-btn" data-mtplexdel="${ex.id}" title="Remover">×</button>
            </div>
          `).join('') : `<div style="font-size:12.5px;color:var(--text-dim);margin-bottom:8px;">Nenhum exercício ainda.</div>`}
          <button class="secondary" id="btnMtplAddEx" style="width:100%;margin:10px 0 16px;">+ Adicionar exercício</button>
          <div class="modal-actions"><button class="secondary" id="modalCancel">Cancelar</button><button class="primary" id="btnSaveMuscTemplate">Salvar</button></div>
        </div>
      </div>`;
  }
  if(state.modalType === 'scheduleMuscTemplate'){
    const tpl = state.muscTemplates.find(t=>t.id===state.scheduleMuscTemplateId);
    const hasAnyMusc = DAY_ABBR.some(d=>(state.musculacao[d]||[]).length>0);
    return `
      <div class="modal-overlay">
        <div class="modal">
          <h3>Agendar rotina</h3>
          <p class="modal-sub">${tpl ? tpl.tipo : ''}${tpl ? ' · '+tpl.exercicios.length+' exercícios' : ''}</p>
          <div class="field"><label>Como aplicar?</label>
            <div style="display:flex;gap:8px;" id="muscScheduleModePicker">
              <div class="day-pill active" data-schedulemuscmode="replace">Substituir</div>
              <div class="day-pill" data-schedulemuscmode="add">Acrescentar</div>
            </div>
          </div>
          <div class="field"><label>Em quais dias da semana?</label>
            <div class="day-strip" style="padding:0;" id="scheduleMuscDiasPicker">
              ${DAY_ABBR.map(d=>`<div class="day-pill" data-schedulemuscdia="${d}">${d}</div>`).join('')}
            </div>
            <div class="leg-desc" style="white-space:normal;font-size:12px;background:var(--amber-soft);color:var(--amber);padding:9px 12px;border-radius:8px;margin-top:8px;">"Substituir" troca os exercícios desses dias pelo modelo. "Acrescentar" mantém o que já tem e junta os exercícios do modelo. Continua se repetindo toda semana.</div>
          </div>
          <div class="modal-actions"><button class="secondary" id="modalCancel">Cancelar</button><button class="primary" id="btnConfirmMuscSchedule">Agendar</button></div>
          ${hasAnyMusc ? `<button id="btnClearAllMusc" style="width:100%;background:none;border:none;color:var(--danger);font-size:12.5px;padding:10px 0 0;cursor:pointer;">Limpar toda a musculação da semana</button>` : ''}
        </div>
      </div>`;
  }
  if(state.modalType === 'muscWeekPlan'){
    return `
      <div class="modal-overlay">
        <div class="modal">
          <h3>Montar minha semana</h3>
          <p class="modal-sub">Escolhe o modelo de cada dia. Deixa "Não alterar" pra manter o que já está lá.</p>
          <div class="field"><label>Como aplicar os dias escolhidos?</label>
            <div style="display:flex;gap:8px;" id="weekPlanModePicker">
              <div class="day-pill active" data-weekplanmode="replace">Substituir</div>
              <div class="day-pill" data-weekplanmode="add">Acrescentar</div>
            </div>
            <div class="leg-desc" style="white-space:normal;font-size:12px;background:var(--amber-soft);color:var(--amber);padding:9px 12px;border-radius:8px;margin-top:8px;">Vale pra todos os dias que você escolher um modelo abaixo (não afeta "Descanso").</div>
          </div>
          ${DAY_ABBR.map(d=>`
            <div class="field"><label>${d}</label>
              <select data-weekdaysel="${d}">
                <option value="">Não alterar</option>
                <option value="__rest__">Descanso (limpar)</option>
                ${state.muscTemplates.map(t=>`<option value="${t.id}">${t.tipo}</option>`).join('')}
              </select>
            </div>
          `).join('')}
          <div class="modal-actions"><button class="secondary" id="modalCancel">Cancelar</button><button class="primary" id="btnConfirmWeekPlan">Aplicar semana</button></div>
        </div>
      </div>`;
  }
  if(state.modalType === 'importTreinos'){
    const draft = state.importTreinosDraft || [];
    const seen = {};
    draft.forEach(d=>{ if(d.day){ const k = d.weekNumber+'|'+d.day; seen[k] = (seen[k]||0)+1; } });
    const validCount = draft.filter(d=>!d.invalid).length;
    return `
      <div class="modal-overlay">
        <div class="modal">
          <h3>Confirmar importação</h3>
          <p class="modal-sub">${draft.length} arquivo${draft.length===1?'':'s'} selecionado${draft.length===1?'':'s'}. Confira a semana e o dia de cada treino antes de importar.</p>
          ${draft.map((d,i)=>{
            const dup = d.day && seen[d.weekNumber+'|'+d.day] > 1;
            const warn = d.invalid || !d.day || dup;
            return `
            <div class="leg-card" style="flex-direction:column;align-items:stretch;gap:8px;${warn?'border-color:var(--danger);':''}">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
                <div style="min-width:0;">
                  <div class="leg-tag">${d.fileName}</div>
                  <div class="leg-desc" style="white-space:normal;">${d.invalid ? 'Não parece ser um arquivo de treino Garmin.' : (d.workoutName + (d.totalKm ? ' · '+fmtKm(d.totalKm) : ''))}</div>
                </div>
                <button data-removeimport="${i}" class="del-btn" title="Remover">×</button>
              </div>
              ${!d.invalid ? `
              <div class="field-row" style="margin-bottom:0;">
                <div class="field" style="margin-bottom:0;"><label>Semana</label><input type="text" inputmode="numeric" data-importweek="${i}" value="${d.weekNumber||1}"></div>
                <div class="field" style="margin-bottom:0;"><label>Dia</label>
                  <select data-importday="${i}">
                    <option value="">Escolher…</option>
                    ${DAY_ABBR.map(dd=>`<option value="${dd}" ${d.day===dd?'selected':''}>${dd}</option>`).join('')}
                  </select>
                </div>
              </div>
              ${dup ? `<div class="leg-desc" style="color:var(--danger);white-space:normal;">Conflita com outro arquivo na mesma semana/dia.</div>` : ''}
              ` : ''}
            </div>`;
          }).join('')}
          <div class="modal-actions"><button class="secondary" id="modalCancel">Cancelar</button><button class="primary" id="btnConfirmImportTreinos">Importar ${validCount} treino${validCount===1?'':'s'}</button></div>
        </div>
      </div>`;
  }
  if(state.modalType === 'gerarHibrido'){
    return renderHybridQuizModal(state.hybridDraft || {});
  }
  if(state.modalType === 'gerar'){
    return `
      <div class="modal-overlay">
        <div class="modal">
          <h3>Gerar treino automático</h3>
          <p class="modal-sub">Monta a semana inteira de musculação pra você, com fotos incluídas.</p>
          <div class="field"><label>Nível</label>
            <select id="inNivel">
              <option value="iniciante">Iniciante (nunca treinei ou &lt; 6 meses)</option>
              <option value="intermediario">Intermediário (6 meses a 2 anos)</option>
              <option value="avancado">Avançado (2+ anos)</option>
            </select>
          </div>
          <div class="field" id="fieldObjetivoAvancado" style="display:none;"><label>Foco</label>
            <select id="inObjetivoAvancado">
              <option value="forca">Força (5×6–10, descanso maior)</option>
              <option value="hipertrofia">Hipertrofia/resistência (4×12–20)</option>
            </select>
          </div>
          <div class="field"><label>Dias da semana</label>
            <div class="day-strip" style="padding:0;">
              ${DAY_ABBR.map(d=>`<div class="day-pill ${['Seg','Qua','Sex'].includes(d)?'active':''}" data-gerardia="${d}">${d}</div>`).join('')}
            </div>
          </div>
          <div class="field"><label>Onde vai treinar</label>
            <select id="inEquip">
              <option value="academia">Academia completa</option>
              <option value="halteres">Casa com halteres</option>
              <option value="corpo">Só peso do corpo</option>
            </select>
          </div>
          <div class="modal-actions"><button class="secondary" id="modalCancel">Cancelar</button><button class="primary" id="modalSave">Gerar treino</button></div>
        </div>
      </div>`;
  }
  const editingAt = state.editingAtId ? (state.outros[state.selectedDayOutros]||[]).find(a=>a.id===state.editingAtId) : null;
  return `
    <div class="modal-overlay">
      <div class="modal">
        <h3>${editingAt ? 'Editar atividade' : 'Nova atividade'} · ${state.selectedDayOutros}</h3>
        <div class="field"><label>Nome da atividade</label><input type="text" id="inNomeAt" value="${editingAt?editingAt.nome:''}" placeholder="Muay Thai" autofocus></div>
        <div class="field"><label>Duração</label><input type="text" id="inDuracao" value="${editingAt?(editingAt.duracao||''):''}" placeholder="1h"></div>
        <div class="field"><label>Notas (opcional)</label><input type="text" id="inNotas" value="${editingAt?(editingAt.notas||''):''}" placeholder="Sparring leve"></div>
        <div class="modal-actions"><button class="secondary" id="modalCancel">Cancelar</button><button class="primary" id="modalSave">Salvar</button></div>
      </div>
    </div>`;
}

// Login deixou de ser obrigatório pra abrir o app — trava demais em navegador mobile (Safari em
// especial) pra valer a pena bloquear o uso por causa disso. O app já abre local (window.storage
// default é local, definido lá em cima), e o login vira só um extra pra sincronizar/compartilhar.
// Se alguém usou o app sem login e DEPOIS consegue logar, migra o que já tinha salvo local pra nuvem
// (só preenchendo o que a nuvem ainda não tem — nunca sobrescreve dado que já existia lá).
async function migrateLocalDataToCloud(uid){
  const localStore = window.storage;
  const cloudStore = makeFirestoreStorage(uid);
  for(const key of BACKUP_KEYS){
    try{
      const cloudExisting = await cloudStore.get(key, false);
      if(cloudExisting && cloudExisting.value!=null) continue;
      const local = await localStore.get(key, false);
      if(local && local.value!=null) await cloudStore.set(key, local.value, false);
    }catch(e){}
  }
  return cloudStore;
}
init();
auth.onAuthStateChanged(async function(user){
  if(user){
    window.storage = await migrateLocalDataToCloud(user.uid);
    state.authUser = { uid:user.uid, name:user.displayName, email:user.email, photo:user.photoURL };
    state.authError = null;
  }else{
    window.storage = makeLocalStorage();
    state.authUser = null;
  }
  init();
});
</script>
</body>

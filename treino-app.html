<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Treino</title>
<link rel="icon" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Treino">
<meta name="theme-color" content="#0A0F0D">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<!-- Só existe dentro do app nativo (gerado pelo build do Capacitor); no PWA/web esse arquivo não existe
     e o 404 é inofensivo — window.NativeBridge fica undefined e o app usa as APIs web normalmente. -->
<script src="native-bridge.js"></script>
<style>

/* Tema escuro fixo (não depende do modo claro/escuro do sistema) — Meu Ritmo, paleta "Noite + esmeralda"
   (escolhida entre 3 opções): tom frio profundo, esmeralda como única cor de ação/corrida, rosa-coral
   como tom secundário de musculação — cada cor com uma função só, nunca em fundo inteiro. */
:root{
  --bg:#0A0F0D;
  --surface:#131B18;
  --surface-2:#1D2823;
  --accent:#10B981;
  --accent-soft:rgba(16,185,129,0.20);
  --blue:#10B981;
  --blue-soft:rgba(16,185,129,0.20);
  --amber:#FFC24B;
  --amber-soft:rgba(255,194,75,0.18);
  --text:#F5F7FA;
  --text-dim:#8A94A6;
  --border:#243330;
  --danger:#FF4D5E;
  --rep:#FB7185;
  --green:#10B981;
  --green-soft:rgba(16,185,129,0.20);
  --strength:#FB7185;
  --strength-soft:rgba(251,113,133,0.18);
  --teal:#10B981;
  --teal-soft:rgba(16,185,129,0.20);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.3), 0 2px 8px rgba(0,0,0,0.28);
  --shadow-md:0 6px 16px rgba(0,0,0,0.4), 0 14px 30px -10px rgba(0,0,0,0.5);
  --shadow-accent:0 10px 24px -8px rgba(16,185,129,0.5);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100vh;
  display:flex; justify-content:center;
}
#app{ width:100%; max-width:440px; min-height:100vh; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); }

/* Números e títulos grandes (peso 800 do Manrope) usam dígitos tabulares — não "pulam" de largura,
   importante pra pace/tempo em execução ao vivo. */
.header-title, .next-step-title, .week-overview-value, .challenge-stat .v, .wex-title, .wex-stepper .val,
.wex-resttimer, .wex-summarytitle, .gps-permtitle, .gps-steptitle, .gps-bigfield, .esteira-remainhero .v,
.esteira-speedrow .v, .gps-statcard .v, .statchip .v, .calc-weightval, .keypad-preview, .wk-title,
.hoje-card-main, .week-list-frac, .hoje-sessioncard-nome, .hoje-context-title, .hoje-greeting-date{
  font-variant-numeric:tabular-nums;
}

/* HEADER */
.header{ display:flex; justify-content:space-between; align-items:center; padding:20px 20px 4px; min-height:46px; }
.header-title{ font-size:23px; font-weight:800; letter-spacing:-0.4px; }
.header-sub{ font-size:12.5px; color:var(--text-dim); margin-top:3px; font-weight:500; }
.icon-btn{
  width:40px; height:40px; border-radius:13px; background:var(--surface); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text); flex-shrink:0;
  box-shadow:var(--shadow-sm);
}
.icon-btn:hover{ border-color:var(--accent); }
.icon-btn svg{ width:18px; height:18px; }
.icon-btn.accent{ color:var(--modocor, var(--accent)); border-color:color-mix(in srgb, var(--modocor, var(--accent)) 20%, transparent); background:color-mix(in srgb, var(--modocor, var(--accent)) 14%, transparent); }
.header-actions{ display:flex; gap:8px; position:relative; }
.header-more-wrap{ position:relative; }
.header-more-menu{
  position:absolute; top:46px; right:0; background:var(--surface); border:1px solid var(--border); border-radius:16px;
  box-shadow:var(--shadow-md); padding:6px; display:none; flex-direction:column; gap:2px; z-index:15; min-width:210px;
}
.header-more-menu.open{ display:flex; }
.header-more-menu button{
  display:flex; align-items:center; gap:10px; background:none; border:none; text-align:left; font-family:inherit;
  font-size:13.5px; font-weight:600; color:var(--text); padding:10px 10px; border-radius:8px; cursor:pointer; width:100%;
}
.header-more-menu button:hover{ background:var(--surface-2); }
.header-more-menu button svg{ width:17px; height:17px; flex-shrink:0; color:var(--text-dim); }

/* DASHBOARD DA SEMANA (aba Hoje) */
.week-overview{ padding:10px 20px 4px; }
.week-overview-progresstop{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:9px; }
.week-overview-progresslabel{ font-size:11px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.6px; }
.week-overview-progresspct{ font-size:12.5px; font-weight:800; color:var(--text); }
.week-overview-progressbar{ height:9px; width:100%; background:var(--surface-2); border-radius:999px; overflow:hidden; margin-bottom:16px; }
.week-overview-progressbar .fill{ height:100%; background:linear-gradient(90deg, var(--accent), var(--teal)); border-radius:999px; transition:width .4s ease; }
.week-overview-cards{ display:flex; gap:10px; }
.week-overview-card{ flex:1; background:var(--surface); border:1px solid color-mix(in srgb, var(--modocor) 30%, var(--border)); border-radius:18px; padding:16px 16px 14px; cursor:pointer; box-shadow:0 4px 14px -6px color-mix(in srgb, var(--modocor) 45%, transparent); }
.week-overview-card.full{ border-color:var(--modocor); background:color-mix(in srgb, var(--modocor) 12%, var(--surface)); box-shadow:0 6px 20px -6px color-mix(in srgb, var(--modocor) 65%, transparent); }
.week-overview-icon{ width:38px; height:38px; border-radius:12px; background:color-mix(in srgb, var(--modocor) 18%, transparent); color:var(--modocor); display:flex; align-items:center; justify-content:center; margin-bottom:12px; }
/* Anel de progresso da semana no header da aba Hoje, com iniciais no centro */
.hoje-ringbadge{ position:relative; width:42px; height:42px; flex-shrink:0; cursor:pointer; }
.hoje-ringbadge svg{ width:42px; height:42px; transform:rotate(-90deg); }
.hoje-ringbadge .bg{ fill:none; stroke:var(--surface-2); stroke-width:4; }
.hoje-ringbadge .fg{ fill:none; stroke:var(--accent); stroke-width:4; stroke-linecap:round; transition:stroke-dashoffset .4s ease; }
.hoje-ringbadge .initial{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; color:var(--text); }
.hoje-headeractions{ display:flex; align-items:center; gap:10px; }
.streak-badge{ display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:800; color:var(--amber); background:var(--amber-soft); padding:3px 9px 3px 7px; border-radius:999px; }
.streak-badge svg{ width:12px; height:12px; flex-shrink:0; }
.hoje-greet-label{ font-size:11px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:2px; }
.next-step-card{ background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:18px; margin:14px 20px 0; box-shadow:var(--shadow-sm); }
.next-step-label{ font-size:11px; font-weight:800; color:var(--accent); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:8px; }
.next-step-title{ font-size:20px; font-weight:800; letter-spacing:-0.3px; margin-bottom:6px; }
.next-step-desc{ font-size:13px; color:var(--text-dim); font-weight:500; }
/* QUIZ PASSO-A-PASSO (criar treino híbrido) */
.quiz-progress{ height:5px; background:var(--surface-2); border-radius:999px; overflow:hidden; margin-bottom:14px; }
.quiz-progress .fill{ height:100%; background:var(--accent); border-radius:999px; transition:width .3s ease; }
.quiz-steplabel{ font-size:11px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px; }
.quiz-optlist{ display:flex; flex-direction:column; gap:8px; }
.quiz-optrow{ padding:14px 15px; border-radius:13px; border:1px solid var(--border); background:var(--surface-2); font-size:14px; font-weight:600; cursor:pointer; }
.quiz-optrow.active{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:700; }
.quiz-daygrid{ display:flex; gap:6px; flex-wrap:wrap; }
.quiz-summary-row{ display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px; }
.quiz-summary-row:last-child{ border-bottom:none; }
.quiz-summary-row .k{ color:var(--text-dim); font-weight:600; }
.quiz-summary-row .v{ font-weight:700; text-align:right; }
.week-overview-icon svg{ width:19px; height:19px; }
.week-overview-label{ font-size:12px; font-weight:700; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.3px; }
.week-overview-value{ font-size:26px; font-weight:800; color:var(--text); letter-spacing:-0.3px; font-variant-numeric:tabular-nums; }
.week-overview-value span{ font-size:16px; font-weight:700; color:var(--text-dim); }
.week-list{ display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:4px 16px; box-shadow:var(--shadow-sm); }
.week-list-row{ display:flex; align-items:center; gap:11px; padding:11px 0; border-bottom:1px solid var(--border); cursor:pointer; }
.week-list-row:last-child{ border-bottom:none; }
.week-list-icon{ width:30px; height:30px; border-radius:9px; background:color-mix(in srgb, var(--modocor) 16%, transparent); color:var(--modocor); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.week-list-icon svg{ width:14px; height:14px; }
.week-list-label{ flex:1; font-size:14px; font-weight:700; color:var(--text); }
.week-list-frac{ font-size:15px; font-weight:800; color:var(--text); font-variant-numeric:tabular-nums; margin-right:10px; }
.week-list-pct{ font-size:12.5px; font-weight:800; color:var(--modocor); min-width:36px; text-align:right; }

/* CHECK-IN DO DIA SEGUINTE AO ONBOARDING (fase 1) */
.onboarding-checkin-banner{ background:var(--accent-soft); color:var(--accent); padding:12px 20px; font-size:12.5px; font-weight:700; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
.onboarding-checkin-banner button{ background:none; border:1px solid var(--accent); color:var(--accent); border-radius:8px; padding:6px 11px; font-size:11.5px; font-weight:700; cursor:pointer; font-family:inherit; }

/* HOJE — redesign Meu Ritmo: uma saudação curta, um card de sessão com UMA ação principal, e no
   máximo um card contextual por vez (nunca dois competindo por atenção). */
.hoje-greeting{ padding:18px 20px 4px; }
.hoje-greeting-sub{ font-size:13px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; }
.hoje-greeting-date{ font-size:22px; font-weight:700; color:var(--text); margin-top:2px; }
.hoje-sessioncard{ margin:14px 20px 0; padding:20px; background:var(--surface); border-radius:16px; }
.hoje-sessioncard.done{ opacity:0.6; }
.hoje-sessioncard-compact{ margin-top:8px; padding:12px 16px; display:flex; flex-direction:column; gap:2px; }
.hoje-sessioncard-modo{ display:flex; align-items:center; gap:8px; font-size:11.5px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:8px; }
.hoje-sessioncard-compact .hoje-sessioncard-modo{ margin-bottom:2px; }
.hoje-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.hoje-sessioncard-nome{ font-size:19px; font-weight:700; color:var(--text); margin-bottom:4px; }
.hoje-sessioncard-compact .hoje-sessioncard-nome{ font-size:14.5px; font-weight:600; margin-bottom:0; }
.hoje-sessioncard-foco{ font-size:13px; color:var(--text-dim); font-weight:600; margin-bottom:16px; }
.hoje-sessioncard-btn{ width:100%; padding:16px; border:none; border-radius:12px; color:#111214; font-size:15px; font-weight:800; cursor:pointer; font-family:inherit; }
.hoje-restcard{ text-align:left; }
.hoje-context-card{ margin:14px 20px 0; padding:16px 18px; background:var(--surface-2); border-radius:16px; }
.hoje-context-label{ font-size:10.5px; font-weight:800; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; }
.hoje-context-title{ font-size:16px; font-weight:700; color:var(--text); }
.hoje-context-sub{ font-size:12.5px; color:var(--text-dim); font-weight:600; margin-top:3px; }
.hoje-context-progressbar{ height:6px; width:100%; background:var(--surface); border-radius:999px; overflow:hidden; margin-top:10px; }
.hoje-context-progressbar .fill{ height:100%; background:var(--accent); border-radius:999px; }

/* TURMA (grupos + desafio coletivo) */
.turma-topbar{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
.turma-groupchips{ display:flex; gap:8px; flex-wrap:wrap; }
.turma-groupchip{ padding:8px 14px; border-radius:999px; background:var(--surface-2); color:var(--text-dim); font-size:12.5px; font-weight:700; cursor:pointer; }
.turma-groupchip.active{ background:var(--accent); color:#fff; }
.turma-inlineform{ display:flex; gap:8px; margin-bottom:14px; }
.turma-inlineform input{ flex:1; padding:11px 13px; border-radius:11px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-family:inherit; font-size:13.5px; }
.turma-inlineform button{ width:auto; padding:11px 16px; font-size:13px; }
.turma-invite{ font-size:12px; color:var(--text-dim); font-weight:600; margin-bottom:14px; }
.turma-invite b{ color:var(--text); letter-spacing:1px; }
.turma-card{ background:var(--surface); border-radius:16px; padding:18px; margin-bottom:14px; }
.turma-cardlabel{ font-size:11px; font-weight:800; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; }
.turma-cardtitle{ font-size:19px; font-weight:800; color:var(--text); }
.turma-grouppct{ font-size:13px; color:var(--text-dim); font-weight:600; margin:10px 0 8px; }
.turma-grouppct b{ color:var(--text); }
.turma-threerow{ display:flex; gap:10px; margin-bottom:16px; }
.turma-threecard{ flex:1; background:var(--surface); border-radius:15px; padding:14px 8px; text-align:center; }
.turma-threecard.highlight{ background:var(--accent-soft); }
.turma-threecard .k{ font-size:10px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.4px; margin-top:8px; }
.turma-threecard .v{ font-size:18px; font-weight:800; color:var(--text); margin-top:2px; }
.turma-avatar{ width:34px; height:34px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; margin:0 auto; }
.turma-avatar.small{ width:26px; height:26px; font-size:11px; flex-shrink:0; margin:0; }
.turma-ranklist{ background:var(--surface); border-radius:16px; padding:6px 14px; margin-bottom:14px; }
.turma-rankrow{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
.turma-rankrow:last-child{ border-bottom:none; }
.turma-rankrow.me{ color:var(--accent); }
.turma-rankpos{ font-size:12px; font-weight:800; color:var(--text-dim); width:22px; }
.turma-rankname{ flex:1; font-size:13.5px; font-weight:700; color:var(--text); }
.turma-rankrow.me .turma-rankname{ color:var(--accent); }
.turma-rankcount{ font-size:13px; font-weight:800; color:var(--text-dim); }
.turma-feedlabel{ font-size:11px; font-weight:800; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px; }
.turma-feedempty{ font-size:13px; color:var(--text-dim); }
.turma-feeditem{ display:flex; align-items:center; gap:10px; padding:9px 0; }
.turma-feedtext{ font-size:13px; color:var(--text-dim); font-weight:600; }
.turma-feedtext b{ color:var(--text); }

/* DESAFIO DE CONSTÂNCIA (Fase 8) */
.challenge-card{ margin:0 20px 16px; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:16px 18px; box-shadow:var(--shadow-sm); }
.challenge-empty{ display:flex; flex-direction:column; gap:10px; }
.challenge-empty > .challenge-empty-icon{ font-size:22px; }
.challenge-empty-body{ display:flex; flex-direction:column; }
.challenge-empty-title{ font-size:14.5px; font-weight:800; color:var(--text); margin-bottom:3px; }
.challenge-empty-sub{ font-size:12px; color:var(--text-dim); font-weight:600; line-height:1.4; }
.challenge-startrow{ display:flex; gap:8px; }
.challenge-startbtn{ flex:1; padding:10px 0; background:var(--accent-soft); color:var(--accent); border:none; border-radius:11px; font-size:13px; font-weight:800; cursor:pointer; font-family:inherit; }
.challenge-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.challenge-title{ font-size:14.5px; font-weight:800; color:var(--text); }
.challenge-cancel{ font-size:11.5px; font-weight:700; color:var(--text-dim); cursor:pointer; }
.challenge-statrow{ display:flex; margin-bottom:12px; }
.challenge-stat{ flex:1; text-align:center; }
.challenge-stat .v{ font-size:20px; font-weight:800; color:var(--text); font-variant-numeric:tabular-nums; }
.challenge-stat .k{ font-size:10px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.4px; margin-top:2px; }
.challenge-progressbar{ height:8px; width:100%; background:var(--surface-2); border-radius:999px; overflow:hidden; }
.challenge-progressbar .fill{ height:100%; background:var(--accent); border-radius:999px; transition:width .4s ease; }

/* NAVEGAÇÃO DE SEMANA (acima da tira de dias) */
.week-nav{ display:flex; align-items:center; justify-content:space-between; padding:14px 20px 0; }
.week-nav-btn{ width:32px; height:32px; border-radius:10px; background:var(--surface); border:1px solid var(--border); color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; box-shadow:var(--shadow-sm); }
.week-nav-label{ font-size:12.5px; font-weight:700; color:var(--text-dim); }

/* DAY STRIP */
.day-strip{ display:flex; gap:6px; padding:18px 20px 6px; }
.day-pill{
  flex:1; text-align:center; padding:10px 2px 8px; border-radius:13px;
  background:var(--surface); border:1px solid var(--border); font-size:12.5px; font-weight:700; color:var(--text-dim); cursor:pointer;
  box-shadow:var(--shadow-sm);
}
.day-pill.active{ background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:var(--shadow-accent); }
.day-pill .day-date{ font-size:9px; font-weight:600; color:var(--text-dim); margin-top:2px; opacity:0.75; }
.day-pill.active .day-date{ color:#fff; opacity:0.8; }
.day-pill .dot{ width:9px; height:9px; border-radius:50%; background:transparent; border:2px solid color-mix(in srgb, var(--text-dim) 45%, transparent); margin:6px auto 0; box-sizing:border-box; }
.day-pill .dot.pending{ border-color:color-mix(in srgb, var(--text-dim) 45%, transparent); }
.day-pill .dot.done{ background:var(--accent); border-color:var(--accent); box-shadow:0 0 6px color-mix(in srgb, var(--accent) 70%, transparent); }
.day-pill.active .dot.done{ background:#fff; border-color:#fff; box-shadow:none; }
.day-pill.corrida-chip{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 2px 8px; }
.day-pill.corrida-chip .chip-label{ font-size:10.5px; font-weight:700; color:var(--text-dim); text-transform:uppercase; }
.day-pill.corrida-chip.active .chip-label{ color:#fff; }
.day-pill.corrida-chip .chip-dot{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; color:#fff; flex-shrink:0; }
.day-pill.corrida-chip .chip-dot.rest{ background:var(--surface-2); color:var(--text-dim); font-size:14px; }
.day-pill.corrida-chip .day-date{ margin-top:0; }
.day-pill.active .dot.pending{ border-color:#fff; }

.content{ flex:1; padding:14px 20px calc(84px + env(safe-area-inset-bottom)); }

/* GENERIC LEG/LIST CARDS */
.leg-card{
  background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow-sm);
  padding:14px 16px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:10px;
}
.leg-left{ min-width:0; }

.wex-summarycheck{ width:68px; height:68px; border-radius:50%; background:var(--green-soft); color:var(--green); display:flex; align-items:center; justify-content:center; margin-bottom:18px; }
.wex-summarytitle{ font-size:20px; font-weight:800; margin-bottom:4px; letter-spacing:-0.3px; }
.wex-summarysub{ font-size:13px; color:var(--text-dim); margin-bottom:26px; font-weight:500; }
.wex-statgrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; margin-bottom:10px; }
.wex-statcard{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; text-align:left; box-shadow:var(--shadow-sm); }
.wex-statcard .k{ font-size:11px; color:var(--text-dim); font-weight:700; text-transform:uppercase; letter-spacing:0.4px; margin-bottom:7px; }
.wex-statcard .v{ font-size:18px; font-weight:800; font-variant-numeric:tabular-nums; }
.wex-comparecard{ width:100%; background:var(--green-soft); border-radius:16px; padding:15px 17px; text-align:left; margin-bottom:20px; }
.wex-comparecard.down{ background:var(--amber-soft); }
.wex-comparecard .k{ font-size:11px; color:var(--green); font-weight:700; text-transform:uppercase; letter-spacing:0.3px; margin-bottom:4px; }
.wex-comparecard .v{ font-size:16px; font-weight:800; color:var(--green); }
.wex-comparecard.down .k, .wex-comparecard.down .v{ color:var(--amber); }
.wex-finishbtn{ width:100%; padding:16px; background:var(--amber); color:#12141C; border:none; border-radius:15px; font-size:15px; font-weight:800; cursor:pointer; margin-top:auto; box-shadow:0 10px 24px -8px color-mix(in srgb, var(--amber) 55%, transparent); }

/* EXECUÇÃO DE CORRIDA COM GPS */
.gps-root{ align-items:center; text-align:center; }
.gps-icon{ width:68px; height:68px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; margin:30px auto 18px; }
.gps-icon svg{ width:30px; height:30px; }
.gps-permtitle{ font-size:20px; font-weight:800; margin-bottom:8px; letter-spacing:-0.3px; }
.gps-permtext{ font-size:13.5px; color:var(--text-dim); line-height:1.6; margin-bottom:26px; max-width:320px; font-weight:500; }
.gps-permtext b{ color:var(--text); }
.gps-warnbanner{ width:100%; background:var(--amber-soft); color:var(--amber); border-radius:14px; padding:12px 15px; font-size:12.5px; text-align:left; line-height:1.5; margin-bottom:16px; font-weight:600; }
.gps-startbtn{ width:100%; padding:17px; background:var(--accent); color:#fff; border:none; border-radius:16px; font-size:15.5px; font-weight:800; cursor:pointer; box-shadow:var(--shadow-accent); }
.gps-retrybtn{ width:100%; padding:14px; background:var(--surface-2); color:var(--text); border:none; border-radius:14px; font-size:14px; font-weight:700; cursor:pointer; margin-top:10px; }
.gps-steplabel{ font-size:12px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.6px; margin-top:24px; }
.gps-steptitle{ font-size:20px; font-weight:800; margin:5px 0 20px; letter-spacing:-0.3px; }
.gps-bigfield{ font-size:50px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--accent); line-height:1; letter-spacing:-1px; }
.gps-biglabel{ font-size:11px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; margin-top:9px; }
.gps-statrow{ display:flex; gap:10px; width:100%; }
.gps-statrow.cols4{ display:grid; grid-template-columns:repeat(2,1fr); }
.gps-statcard{ flex:1; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:15px 10px; box-shadow:var(--shadow-sm); }
.gps-statcard .k{ font-size:10.5px; color:var(--text-dim); font-weight:700; text-transform:uppercase; letter-spacing:0.4px; margin-bottom:6px; }
.gps-statcard .v{ font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; }
.gps-progressbar{ height:8px; width:100%; background:var(--surface-2); border-radius:999px; overflow:hidden; }
.gps-progressbar .fill{ height:100%; background:var(--green); border-radius:999px; transition:width .4s ease; }
.gps-actions{ display:flex; gap:10px; width:100%; }
.gps-actions button{ flex:1; padding:16px; border-radius:15px; font-size:14.5px; font-weight:800; cursor:pointer; font-family:inherit; border:none; }
.gps-btnpause{ background:var(--surface-2); color:var(--text); }
.gps-btnlap{ background:var(--accent-soft); color:var(--accent); }
.gps-btnfinish{ background:var(--danger); color:#fff; }
.gps-accuracybadge{ font-size:11px; font-weight:700; padding:5px 10px; border-radius:8px; background:rgba(20,22,26,0.55); color:#fff; backdrop-filter:blur(6px); }
.gps-accuracybadge.good{ background:rgba(63,190,138,0.55); }
.gps-accuracybadge.bad{ background:rgba(217,164,78,0.6); }
/* Tela de corrida: o mapa é o elemento dominante (ocupa o espaço que sobrar), com o essencial (etapa,
   progresso, precisão do GPS, sair) sobreposto nele — texto/números embaixo do mapa, sem disputar espaço. */
.gps-runroot{ align-items:stretch; text-align:left; padding-left:0; padding-right:0; gap:14px; box-shadow:inset 0 0 0 0 transparent; transition:box-shadow .3s ease; }
.gps-runroot.zone-ok{ box-shadow:inset 0 0 0 4px var(--green); }
.gps-runroot.zone-warn{ box-shadow:inset 0 0 0 4px var(--amber); }
.gps-mapwrap{ position:relative; flex:1 1 auto; min-height:200px; margin:0 -20px; overflow:hidden; background:var(--surface-2); }
.gps-mapslot{ width:100%; height:100%; }
.gps-mapoverlay-top{ position:absolute; top:calc(14px + env(safe-area-inset-top)); left:14px; right:14px; display:flex; justify-content:space-between; align-items:center; z-index:1000; }
.gps-mapoverlay-top .wex-exit{ background:rgba(20,22,26,0.55); border:none; color:#fff; backdrop-filter:blur(6px); }
.gps-mapoverlay-bottom{ position:absolute; left:0; right:0; bottom:0; padding:34px 20px 14px; background:linear-gradient(to top, rgba(0,0,0,0.6), rgba(0,0,0,0)); z-index:1000; }
.gps-mapoverlay-bottom .gps-steplabel{ color:rgba(255,255,255,0.75); margin-top:0; }
.gps-mapoverlay-bottom .gps-steptitle{ color:#fff; margin:2px 0 10px; font-size:19px; }
.gps-mapoverlay-bottom .gps-progressbar{ background:rgba(255,255,255,0.25); }
.gps-herostat{ text-align:center; padding:0 20px; }
.gps-statrow{ padding:0 20px; }
.gps-actions{ padding:0 20px calc(4px + env(safe-area-inset-bottom)); }
.gps-mapwrap .leaflet-tile-pane{ filter:brightness(0.65) invert(1) contrast(0.9) hue-rotate(200deg) saturate(0.35); }
/* Modo esteira: sem mapa (não faz sentido sem GPS), lista de blocos com velocidade em km/h em vez de pace. */
.esteira-steplist{ width:100%; margin-bottom:20px; }
.esteira-steprow{ display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border); }
.esteira-steprow:last-child{ border-bottom:none; }
.esteira-stepname{ font-size:13.5px; font-weight:700; color:var(--text); }
.esteira-kmh{ font-size:13.5px; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums; }
.esteira-runroot{ padding-left:20px; padding-right:20px; gap:12px; }
.esteira-runroot .wex-topbar{ margin-bottom:0; }
.esteira-runroot .gps-statrow, .esteira-runroot .gps-actions{ padding-left:0; padding-right:0; }
.esteira-stepbadge{ font-size:12.5px; font-weight:800; padding:7px 13px; border-radius:10px; }
.esteira-remainhero{ text-align:center; }
.esteira-remainhero .v{ font-size:44px; font-weight:800; letter-spacing:-1px; font-variant-numeric:tabular-nums; margin-bottom:10px; }
.esteira-remainhero .unit{ font-size:14px; font-weight:700; color:var(--text-dim); margin-left:8px; }
.esteira-nextrow{ display:flex; justify-content:space-between; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 14px; font-size:12.5px; color:var(--text-dim); font-weight:600; }
.esteira-nextrow b{ color:var(--text); }
.esteira-skipbtn{ background:var(--surface-2); color:var(--text); border:none; border-radius:9px; padding:7px 12px; font-size:12px; font-weight:800; cursor:pointer; font-family:inherit; flex-shrink:0; margin-left:10px; }
.esteira-speedcard{ width:100%; background:var(--accent-soft); border-radius:18px; padding:16px 18px; }
.esteira-speedcard .k{ font-size:11px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px; }
.esteira-speedrow{ display:flex; align-items:center; justify-content:center; gap:22px; }
.esteira-speedrow .v{ font-size:36px; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums; letter-spacing:-0.5px; min-width:110px; text-align:center; }
.esteira-speedrow .unit{ font-size:14px; font-weight:700; margin-left:4px; }
.esteira-adjbtn{ width:42px; height:42px; border-radius:50%; border:none; background:var(--accent); color:#fff; font-size:20px; font-weight:800; cursor:pointer; flex-shrink:0; font-family:inherit; }
.esteira-adjbtn.small{ width:30px; height:30px; font-size:16px; background:var(--surface-2); color:var(--text); }
.esteira-inclinerow{ display:flex; justify-content:space-between; align-items:center; }
.esteira-inclinerow .k{ font-size:11px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; }
.esteira-inclineval{ display:flex; align-items:center; gap:12px; font-size:14px; font-weight:800; color:var(--text); font-variant-numeric:tabular-nums; }
/* Alternador de topo na aba Treinos — acesso direto ao hub de Corrida (VDOT, plano) e Musculação,
   sem depender de já existir um treino agendado hoje (senão o VDOT do híbrido fica sem porta de entrada). */
.treino-phaselabel{ font-size:12.5px; font-weight:700; color:var(--text-dim); margin-bottom:12px; }
.seg-toggle{ display:flex; gap:4px; background:var(--surface-2); border-radius:15px; padding:4px; margin-bottom:18px; }
.seg-toggle-btn{ flex:1; display:flex; align-items:center; justify-content:center; gap:7px; padding:11px 6px; border:none; background:none; border-radius:11px; font-family:inherit; font-size:13px; font-weight:700; color:var(--text-dim); cursor:pointer; }
.seg-toggle-btn svg{ width:16px; height:16px; flex-shrink:0; }
.seg-toggle-btn.active{ background:var(--accent); color:#fff; box-shadow:var(--shadow-accent); }

/* Os 3 modos de criação, lado a lado, na aba Treinos */
.creation-row{ display:flex; gap:10px; margin-bottom:22px; }
.creation-card{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:11px; padding:20px 8px 18px;
  background:var(--surface); border:1px solid var(--border); border-radius:20px; cursor:pointer; font-family:inherit;
  font-size:12.5px; font-weight:700; box-shadow:var(--shadow-sm); transition:transform .1s ease;
}
.creation-icon{
  width:48px; height:48px; border-radius:15px; display:flex; align-items:center; justify-content:center;
  background:color-mix(in srgb, var(--modocor) 15%, transparent); color:var(--modocor);
}
.creation-icon svg{ width:23px; height:23px; }
.creation-icon.wide svg{ width:31px; height:23px; }
.hybrid-icon-inline{ display:inline-flex; flex-shrink:0; }
.hybrid-icon-inline svg{ width:26px; height:19px; }
.creation-card span{ color:var(--text); }
.corrida-start-row{ display:flex; gap:10px; margin-top:14px; }
.corrida-gps-btn{ flex:1; width:100%; margin-top:0; padding:14px; background:var(--accent); color:#fff; border:none; border-radius:15px; font-size:14px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; font-family:inherit; box-shadow:var(--shadow-accent); }
.corrida-gps-btn svg{ width:16px; height:16px; }
.corrida-esteira-btn{ background:var(--surface-2); color:var(--text); box-shadow:none; border:1px solid var(--border); }

/* DRAWER */
.drawer-avatar{ width:54px; height:54px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:19px; flex-shrink:0; }
.drawer-nav-row{ display:flex; align-items:center; gap:12px; cursor:pointer; padding:15px 2px; border-bottom:1px solid var(--border); }
.drawer-nav-icon{ width:20px; height:20px; color:var(--text-dim); flex-shrink:0; }
.drawer-nav-icon svg{ width:20px; height:20px; }
.drawer-nav-label{ flex:1; font-size:14.5px; font-weight:700; color:var(--text); }

input[type=file]{ display:none; }

/* ============================================================================================
   TELA NOVA (Início + Treino) — paleta azul, isolada do shell antigo. Tokens próprios (--mrt-*)
   pra não recolorir telas que ainda não foram refeitas nesta leva. Cresce tela por tela (chave
   UI_V2 no topo do script liga/desliga tudo de uma vez, pra rollback rápido se precisar).
   ============================================================================================ */
.mrt-root{
  --mrt-bg:#070B14; --mrt-card:#0F1626; --mrt-card2:#16203A; --mrt-border:#1E2A44;
  --mrt-text:#F3F6FB; --mrt-dim:#8B97AD;
  --mrt-blue:#3B82F6; --mrt-bluelight:#60A5FA;
  --mrt-green:#22C55E; --mrt-amber:#F59E0B; --mrt-red:#EF4444;
  position:fixed; inset:0; background:var(--mrt-bg); color:var(--mrt-text);
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  display:flex; flex-direction:column; max-width:440px; margin:0 auto;
  font-variant-numeric:tabular-nums;
}
.mrt-scroll{ flex:1; overflow-y:auto; padding:calc(18px + env(safe-area-inset-top)) 18px 110px; }

.mrt-header{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:18px; }
.mrt-title{ font-size:22px; font-weight:800; color:var(--mrt-text); }
.mrt-sub{ font-size:13px; font-weight:500; color:var(--mrt-dim); margin-top:2px; }
.mrt-morewrap{ position:relative; flex-shrink:0; }
.mrt-morebtn{
  width:38px; height:38px; border-radius:12px; background:var(--mrt-card); border:none; color:var(--mrt-text);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.mrt-morebtn svg{ width:19px; height:19px; }
.mrt-moremenu{
  display:none; position:absolute; top:44px; right:0; z-index:20; min-width:220px; background:var(--mrt-card2);
  border-radius:16px; padding:6px; box-shadow:0 16px 34px -10px rgba(0,0,0,0.6); flex-direction:column; gap:2px;
}
.mrt-moremenu.open{ display:flex; }
.mrt-moremenu button{
  display:flex; align-items:center; gap:10px; width:100%; padding:11px 12px; background:none; border:none;
  border-radius:11px; font-family:inherit; font-size:13.5px; font-weight:600; color:var(--mrt-text); text-align:left; cursor:pointer;
}
.mrt-moremenu button:hover{ background:rgba(255,255,255,0.06); }
.mrt-moremenu button svg{ width:16px; height:16px; flex-shrink:0; color:var(--mrt-dim); }

.mrt-counterrow{ display:flex; gap:12px; margin-bottom:16px; }
.mrt-countercard{ flex:1; background:var(--mrt-card); border-radius:20px; padding:16px; }
.mrt-counterhead{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.mrt-counterhead svg{ width:17px; height:17px; color:var(--mrt-bluelight); }
.mrt-counterlabel{ font-size:11px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase; color:var(--mrt-dim); }
.mrt-countervalue{ font-size:22px; font-weight:800; color:var(--mrt-text); margin-bottom:8px; }
.mrt-counterbar{ height:5px; border-radius:999px; background:var(--mrt-card2); overflow:hidden; }
.mrt-counterbar .fill{ height:100%; background:var(--mrt-blue); border-radius:999px; }

.mrt-daystrip{ display:flex; justify-content:space-between; margin-bottom:18px; }
.mrt-daycol{ display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; flex:1; }
.mrt-dayletter{ font-size:11px; font-weight:700; color:var(--mrt-dim); text-transform:uppercase; }
.mrt-daycircle{
  width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:11.5px; font-weight:800; color:var(--mrt-dim); background:transparent; border:2px solid var(--mrt-border);
}
.mrt-daycircle.has{ background:var(--mrt-blue); border-color:var(--mrt-blue); color:#fff; }
.mrt-daycircle.done{ background:var(--mrt-green); border-color:var(--mrt-green); color:#fff; }
.mrt-daycircle.done svg, .mrt-daycircle svg{ width:14px; height:14px; }
.mrt-daycol.active .mrt-daycircle{ width:40px; height:40px; box-shadow:0 0 0 3px rgba(59,130,246,0.25); }
.mrt-daydate{ font-size:9.5px; font-weight:700; color:var(--mrt-bluelight); }

.mrt-dayname{ font-size:17px; font-weight:800; color:var(--mrt-text); margin-bottom:12px; }

.mrt-toggle{ display:flex; gap:4px; background:var(--mrt-card); border-radius:15px; padding:4px; margin-bottom:18px; }
.mrt-togglebtn{
  flex:1; display:flex; align-items:center; justify-content:center; gap:7px; padding:11px 6px; border:none;
  background:none; border-radius:11px; font-family:inherit; font-size:13px; font-weight:700; color:var(--mrt-dim); cursor:pointer;
}
.mrt-togglebtn svg{ width:16px; height:16px; }
.mrt-togglebtn.active{ background:var(--mrt-blue); color:#fff; }

.mrt-weeknav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
.mrt-weeknavbtn{ background:none; border:none; color:var(--mrt-bluelight); font-size:20px; font-weight:700; cursor:pointer; padding:4px 10px; font-family:inherit; }
.mrt-weeklabel{ font-size:13.5px; font-weight:700; color:var(--mrt-text); }
.mrt-phaselabel{ text-align:center; font-size:12px; font-weight:600; color:var(--mrt-dim); margin-bottom:14px; }

.mrt-chips{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
.mrt-chip{ padding:6px 13px; border-radius:999px; background:rgba(59,130,246,0.12); color:var(--mrt-dim); font-size:12px; font-weight:700; }
.mrt-chip.current{ background:var(--mrt-blue); color:#fff; }

.mrt-card{ background:var(--mrt-card); border-radius:20px; padding:18px; margin-bottom:12px; }
.mrt-cardinner{ background:var(--mrt-card2); border-radius:14px; padding:14px; }

.mrt-summarytitle{ font-size:16px; font-weight:800; color:var(--mrt-text); margin-bottom:14px; }
.mrt-metricsrow{ display:flex; margin-bottom:16px; }
.mrt-metric{ flex:1; }
.mrt-metrick{ font-size:10.5px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase; color:var(--mrt-dim); margin-bottom:4px; }
.mrt-metricv{ font-size:16px; font-weight:800; color:var(--mrt-text); }

.mrt-btnprimary{
  width:100%; height:52px; border-radius:14px; background:var(--mrt-blue); color:#fff; border:none; font-family:inherit;
  font-size:15px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  box-shadow:0 14px 26px -10px rgba(59,130,246,0.65);
}
.mrt-btnprimary svg{ width:17px; height:17px; }
.mrt-btnsecondary{
  flex:1; height:48px; border-radius:14px; background:var(--mrt-card2); color:var(--mrt-text); border:none; font-family:inherit;
  font-size:13.5px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px;
}
.mrt-btnsecondary svg{ width:15px; height:15px; }
.mrt-btnrow{ display:flex; gap:10px; margin-top:10px; }

.mrt-exlist{ display:flex; flex-direction:column; gap:10px; }
.mrt-excard{ background:var(--mrt-card); border-radius:20px; padding:12px; display:flex; align-items:center; gap:12px; }
.mrt-exthumb{ width:52px; height:52px; border-radius:14px; object-fit:cover; background:var(--mrt-card2); flex-shrink:0; }
.mrt-exname{ font-size:14px; font-weight:700; color:var(--mrt-text); }
.mrt-exname.done{ text-decoration:line-through; color:var(--mrt-dim); }
.mrt-exmeta{ font-size:12.5px; color:var(--mrt-dim); margin-top:3px; }
.mrt-excheck{ width:26px; height:26px; border-radius:50%; border:2px solid var(--mrt-border); flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; }
.mrt-excheck.done{ background:var(--mrt-green); border-color:var(--mrt-green); }
.mrt-excheck svg{ width:13px; height:13px; }

.mrt-runlabel{ font-size:11px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; margin-bottom:6px; }
.mrt-runtitle{ font-size:19px; font-weight:800; color:var(--mrt-text); }
.mrt-runrow{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:14px; }
.mrt-donebtn{ width:38px; height:38px; border-radius:50%; background:var(--mrt-card2); border:none; color:var(--mrt-text); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
.mrt-donebtn.done{ background:var(--mrt-green); color:#fff; }
.mrt-donebtn svg{ width:16px; height:16px; }

<script>
// Sem login, o app funciona 100% local (esse era o único modo antes da nuvem existir). Login com Google
// vira opcional, só pra sincronizar/compartilhar — nunca mais bloqueia o uso do app.
function makeLocalStorage(){
  return {
    get: async function(key){
      try{ return { value: localStorage.getItem('treinoapp:'+key) }; }
      catch(e){ return { value: null }; }
    },
    set: async function(key, value){
      try{ localStorage.setItem('treinoapp:'+key, value); }catch(e){}
    },
  };
}
if(!window.storage) window.storage = makeLocalStorage();

/* ---------- Login com e-mail/senha + dados na nuvem (Firebase) ---------- */
// Trocado de Google Sign-In pra e-mail+senha: o login com Google nunca saiu confiável no Safari do
// iPhone (popup e redirect esbarram nas proteções de privacidade do próprio navegador, sem solução
// 100% client-side) — e-mail+senha nunca sai do domínio do app, então não depende de nada disso.
function authErrorMessage(code, fallback){
  const map = {
    'auth/invalid-email': 'E-mail inválido.',
    'auth/user-not-found': 'Não achei conta com esse e-mail. Toca em "Criar conta" se ainda não tem uma.',
    'auth/wrong-password': 'Senha incorreta.',
    'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/email-already-in-use': 'Já existe conta com esse e-mail. Toca em "Entrar" em vez de criar.',
    'auth/weak-password': 'Senha muito curta — usa pelo menos 6 caracteres.',
    'auth/operation-not-allowed': 'Login por e-mail/senha não está habilitado no projeto Firebase ainda.',
    'auth/too-many-requests': 'Muitas tentativas erradas seguidas — o Firebase bloqueou por alguns minutos como proteção. Espera um pouco e tenta de novo.',
  };
  return map[code] || fallback;
}
const firebaseConfig = {
  apiKey: "AIzaSyAQaN5Jquq5SGqDJZbE8lMdpPzP0yoNg4c",
  authDomain: "treino-app-5a07f.firebaseapp.com",
  projectId: "treino-app-5a07f",
  storageBucket: "treino-app-5a07f.firebasestorage.app",
  messagingSenderId: "679932143430",
  appId: "1:679932143430:web:c00bbb3c9195cffc7d2747",
  measurementId: "G-CHKSQ9DNG6",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// Cada campo que o app já salvava local (treinos, musculacao, perfil, historicoCarga...) vira um
// documento próprio dentro de users/{uid}/data/{chave} — o resto do app não precisa saber disso,
// já que só fala com window.storage.get/set, exatamente como falava com o localStorage antes.
function makeFirestoreStorage(uid){
  const col = db.collection('users').doc(uid).collection('data');
  return {
    get: async function(key){
      try{
        const snap = await col.doc(key).get();
        return { value: snap.exists ? snap.data().value : null };
      }catch(e){ return { value: null }; }
    },
    set: async function(key, value){
      try{ await col.doc(key).set({ value }); }catch(e){}
    },
  };
}
/* ---------- Personal x aluna: código de compartilhamento e troca de contexto ---------- */
function randomShareCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // sem 0/O e 1/I, pra não confundir na hora de digitar
  let s = '';
  for(let i=0;i<6;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
async function checkIsAllowedTrainer(email){
  if(!email) return false;
  try{
    const snap = await db.collection('allowedTrainers').doc(email.toLowerCase()).get();
    return snap.exists;
  }catch(e){ return false; }
}
async function generateShareCode(){
  const code = randomShareCode();
  await db.collection('shareCodes').doc(code).set({
    clientUid: state.authUser.uid,
    clientName: state.perfil.nome || '',
    clientEmail: state.authUser.email,
    createdAt: Date.now(),
  });
  return code;
}
// Resgata o código: cria o vínculo permanente em access/{clientUid}_{trainerUid} e apaga o código
// (uso único — depois de resgatado, ninguém mais consegue usar o mesmo código de novo).
async function redeemShareCode(rawCode){
  const code = String(rawCode||'').trim().toUpperCase();
  if(!code) throw new Error('Digita o código.');
  const codeRef = db.collection('shareCodes').doc(code);
  const snap = await codeRef.get();
  if(!snap.exists) throw new Error('Código inválido ou já usado.');
  const data = snap.data();
  const trainerUid = state.authUser.uid;
  if(data.clientUid === trainerUid) throw new Error('Você não pode adicionar a si mesmo.');
  const accessId = data.clientUid+'_'+trainerUid;
  await db.collection('access').doc(accessId).set({
    clientUid: data.clientUid, trainerUid: trainerUid,
    clientName: data.clientName||'', clientEmail: data.clientEmail||'',
    trainerName: state.perfil.nome||'', trainerEmail: state.authUser.email||'',
    createdAt: Date.now(),
  });
  await codeRef.delete();
}
async function listMyClients(){
  const snap = await db.collection('access').where('trainerUid','==', state.authUser.uid).get();
  return snap.docs.map(d=>({ id:d.id, ...d.data() }));
}
async function listWhoHasAccessToMe(){
  const snap = await db.collection('access').where('clientUid','==', state.authUser.uid).get();
  return snap.docs.map(d=>({ id:d.id, ...d.data() }));
}
async function revokeAccess(accessId){
  try{ await db.collection('access').doc(accessId).delete(); }catch(e){}
}

/* ---------- Turma (grupos + desafio coletivo) — Etapa 10 ---------- */
// Esquema no Firestore: groups/{id} = {name, ownerUid, memberUids[], inviteCode, createdAt}
//   groups/{id}/challenge/current = {name, totalDays, startDateISO} (1 desafio ativo por grupo)
//   groups/{id}/checkins/{uid} = {name, checkins:{isoDate:true}} (mesmo formato do desafio solo)
//   groups/{id}/feed/{auto} = {uid, name, text, createdAt}
// IMPORTANTE: isso precisa de regras de segurança no Firestore pra funcionar direito (um membro só
// pode escrever o PRÓPRIO doc de check-in, só quem tem o código entra no grupo). Não tenho como
// publicar regras do Firestore por aqui — vou te passar o texto pra colar no console do Firebase.
function genInviteCode(){ return Math.random().toString(36).slice(2,8).toUpperCase(); }
async function createGroup(name){
  if(!state.authUser || !name || !name.trim()) return;
  const ref = db.collection('groups').doc();
  const code = genInviteCode();
  const myName = state.authUser.name || state.perfil.nome || 'Atleta';
  await ref.set({ name:name.trim(), ownerUid:state.authUser.uid, memberUids:[state.authUser.uid], inviteCode:code, createdAt:Date.now() });
  await ref.collection('checkins').doc(state.authUser.uid).set({ name:myName, checkins:{} });
  state.turmaShowCreate = false;
  await loadMyGroups();
  state.turmaSelectedGroupId = ref.id;
  await loadGroupDetail(ref.id);
}
async function joinGroupByCode(code){
  if(!state.authUser || !code || !code.trim()) return;
  const snap = await db.collection('groups').where('inviteCode','==', code.toUpperCase().trim()).limit(1).get();
  if(snap.empty){ alert('Código não encontrado.'); return; }
  const doc = snap.docs[0];
  const myName = state.authUser.name || state.perfil.nome || 'Atleta';
  await doc.ref.update({ memberUids: firebase.firestore.FieldValue.arrayUnion(state.authUser.uid) });
  await doc.ref.collection('checkins').doc(state.authUser.uid).set({ name:myName, checkins:{} }, { merge:true });
  state.turmaShowJoin = false;
  await loadMyGroups();
  state.turmaSelectedGroupId = doc.id;
  await loadGroupDetail(doc.id);
}
async function loadMyGroups(){
  if(!state.authUser) return;
  try{
    const snap = await db.collection('groups').where('memberUids','array-contains', state.authUser.uid).get();
    state.turmaGroups = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    if(!state.turmaSelectedGroupId && state.turmaGroups.length) state.turmaSelectedGroupId = state.turmaGroups[0].id;
  }catch(e){ state.turmaGroups = []; }
}
async function loadGroupDetail(groupId){
  try{
    const gref = db.collection('groups').doc(groupId);
    const challengeDoc = await gref.collection('challenge').doc('current').get();
    const checkinsSnap = await gref.collection('checkins').get();
    const feedSnap = await gref.collection('feed').orderBy('createdAt','desc').limit(20).get();
    state.turmaGroupDetail = {
      groupId,
      challenge: challengeDoc.exists ? challengeDoc.data() : null,
      members: checkinsSnap.docs.map(d=>({ uid:d.id, ...d.data() })),
      feed: feedSnap.docs.map(d=>({ id:d.id, ...d.data() })),
    };
  }catch(e){ state.turmaGroupDetail = { groupId, challenge:null, members:[], feed:[] }; }
  render();
}
async function createGroupChallenge(groupId, name, totalDays){
  if(!name || !name.trim()) return;
  await db.collection('groups').doc(groupId).collection('challenge').doc('current').set({ name:name.trim(), totalDays, startDateISO:todayISO() });
  state.turmaShowNewChallenge = false;
  await loadGroupDetail(groupId);
}
// Chamado nos MESMOS pontos que já marcam o desafio solo (Fase 8) — de graça, sem pedir nada a mais
// do usuário: concluir um treino já conta pro desafio da Turma em todos os grupos que ele participa.
// Fire-and-forget (não trava a tela esperando a escrita no Firestore).
function markGroupCheckinsToday(sessionLabel){
  if(!state.authUser || !state.turmaGroups || !state.turmaGroups.length) return;
  const iso = todayISO();
  const myName = state.authUser.name || state.perfil.nome || 'Atleta';
  state.turmaGroups.forEach(g=>{
    (async ()=>{
      try{
        const ref = db.collection('groups').doc(g.id).collection('checkins').doc(state.authUser.uid);
        const snap = await ref.get();
        const data = snap.exists ? snap.data() : { name:myName, checkins:{} };
        if(data.checkins && data.checkins[iso]) return; // já contou hoje nesse grupo
        data.checkins = { ...(data.checkins||{}), [iso]:true };
        data.name = myName;
        await ref.set(data);
        await db.collection('groups').doc(g.id).collection('feed').add({ uid:state.authUser.uid, name:myName, text:sessionLabel, createdAt:Date.now() });
        if(state.turmaSelectedGroupId===g.id) loadGroupDetail(g.id);
      }catch(e){}
    })();
  });
}
// Guarda o storage/estado do próprio personal enquanto ele estiver "dentro" do treino de uma aluna,
// pra dar pra voltar exatamente de onde parou.
let ownStorageBackup = null;
async function enterClientView(clientUid, clientName){
  ownStorageBackup = window.storage;
  window.storage = makeFirestoreStorage(clientUid);
  state.viewingClient = { uid: clientUid, name: clientName||'' };
  state._clientTrainersFetched = false; state._trainerClientsFetched = false;
  await init();
}
async function exitClientView(){
  if(ownStorageBackup) window.storage = ownStorageBackup;
  ownStorageBackup = null;
  state.viewingClient = null;
  state._clientTrainersFetched = false; state._trainerClientsFetched = false;
  await init();
}
// UI_V2: interface nova, construída do zero ao lado da antiga (nenhuma tela/CSS/cor antiga é reaproveitada
// em telas v2 — só as funções de dados/lógica abaixo são importadas). true = tela Início já usa a v2;
// false = volta tudo pro shell de sempre. As telas antigas continuam intactas por baixo até aprovação.
const UI_V2 = true;
const DAY_ABBR = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const GROUPS = ['Peito','Costas','Pernas','Ombro','Braço','Core'];
function repdbImg(id){ return id ? ('gifs/'+id+'.gif') : null; }
function openZoom(src){
  if(!src) return;
  const overlay = document.createElement('div');
  overlay.className = 'zoom-overlay';
  const img = document.createElement('img');
  img.src = src; img.alt = '';
  overlay.appendChild(img);
  overlay.onclick = ()=> overlay.remove();
  document.body.appendChild(overlay);
}

/* ---------- Exercise pool for the automatic generator (ids reference gifs/<id>.gif) ---------- */

// Classifica um exercício como composto (multiarticular) ou isolamento, pelo nome — em vez de marcar
// os 140+ exercícios do POOL um por um na mão. Usado pelo Modo Híbrido pra priorizar compostos.
const COMPOSTO_KEYWORDS = [
  'agachamento','levantamento terra','stiff','bom dia','supino','remada','puxada','pulldown',
  'barra fixa','desenvolvimento','arnold','afundo','passada','step up','leg press','mergulho',
  'hack','elevação de quadril','flexão de braço','flexão diamante','flexão fechada','flexão arqueiro',
  'flexão pike','wall sit','crossover',
];
const ISOLAMENTO_KEYWORDS = [
  'rosca','tríceps','elevação lateral','elevação frontal','crucifixo','extensora','flexora',
  'adutora','abdutora','panturrilha','encolhimento','peck deck','voador','abdominal','prancha',
  'crunch','russian twist','escalador','mountain climber','elevação de pernas','hiperextensão',
  'cão-prancha','superman','ponte de glúteo','cadeira (wall sit)','pullover',
];
function isExercicioComposto(nome){
  const n = normalizeNoAccents(nome);
  if(ISOLAMENTO_KEYWORDS.some(k => n.includes(normalizeNoAccents(k)))) return false;
  if(COMPOSTO_KEYWORDS.some(k => n.includes(normalizeNoAccents(k)))) return true;
  return null; // não reconhecido — não conta nem a favor nem contra
}

function splitTemplate(nivel, diasCount){
  const fullBody = { Peito:1, Costas:1, Pernas:1, Ombro:1, Braço:1, Core:1 };
  if(diasCount <= 2) return Array(diasCount).fill(fullBody);
  if(diasCount === 3 && nivel === 'iniciante') return Array(3).fill(fullBody);
  if(diasCount === 3) return [
    { Peito:2, Ombro:2, Braço:1 },
    { Costas:3, Braço:1, Core:1 },
    { Pernas:4, Core:1 },
  ];
  if(diasCount === 4) return [
    { Peito:2, Costas:2, Ombro:1 },
    { Pernas:3, Core:1 },
    { Peito:1, Costas:1, Ombro:1, Braço:2 },
    { Pernas:3, Core:1 },
  ];
  const five = [
    { Peito:4 },
    { Costas:4 },
    { Pernas:4 },
    { Ombro:4 },
    { Braço:3, Core:1 },
  ];
  if(diasCount === 5) return five;
  const extended = [];
  for(let i=0;i<diasCount;i++) extended.push(five[i % 5]);
  return extended;
}
function buildPlan(nivel, diasArr, equip, objetivo){
  const pool = POOL[equip];
  const sr = nivel==='avancado' ? SETREPS.avancado[objetivo||'forca'] : SETREPS[nivel];
  const maxRank = NIVEL_RANK[nivel] || 1;
  const used = {};
  function pick(group, count){
    const full = pool[group] || [];
    const filtered = full.filter(e => (NIVEL_RANK[e.nivel] || 1) <= maxRank);
    const arr = filtered.length ? filtered : full;
    if(arr.length === 0) return [];
    // Prioriza exercícios do próprio nível pedido — só recorre a nível mais baixo pra completar
    // a contagem quando não há exercícios suficientes daquele nível nesse grupo (evita repetir
    // o mesmo exercício várias vezes só pra "forçar" o nível exato).
    const exact = arr.filter(e => e.nivel === nivel);
    const ordered = exact.length >= count ? exact : exact.concat(arr.filter(e => e.nivel !== nivel));
    const res = [];
    for(let i=0;i<count;i++){
      const idx = ((used[group]||0) + i) % ordered.length;
      res.push(ordered[idx]);
    }
    used[group] = (used[group]||0) + count;
    return res.map(e => ({ nome:e.nome, series:String(sr.series), reps:String(sr.reps), carga:'', grupo:group, repdbId:e.id, descanso:sr.descanso }));
  }
  const templates = splitTemplate(nivel, diasArr.length);
  const plan = {};
  diasArr.forEach((day, i)=>{
    const spec = templates[i] || templates[templates.length-1];
    let list = [];
    Object.keys(spec).forEach(g => list = list.concat(pick(g, spec[g])));
    plan[day] = list;
  });
  return plan;
}

  }catch(e){ state.muscDayOrigin = {}; }

  // Se a página recarregou no meio de uma corrida com GPS, o watchPosition/wakeLock antigos morreram,
  // mas os pontos gravados no IndexedDB não — restaura como "pausado" e deixa o usuário decidir se retoma.
  try{
    const activeRun = await gpsDbGet('activeRun');
    if(activeRun && activeRun.status !== 'finished'){
      state.gpsRun = { ...activeRun, status: 'paused', pauseBeganAt: activeRun.pauseBeganAt || Date.now() };
    }
  }catch(e){}

  // Planos materializados antes da cor-por-tipo existir ficaram sem "cor" salva, então toda a semana
  // aparecia azul mesmo tendo Limiar/Longão/etc — recompleta a cor da semana atual a partir do plano já salvo.
  if(state.corridaVdotData && state.corridaVdotData.plan && state.corridaVdotData.startMonday){
    const diasArr = state.corridaVdotData.diasArr || [];
    const missingCor = state.treinos.some(t => diasArr.includes(dayAbbrevOf(t.day)) && !t.cor);
    if(missingCor){
      const curWeek = state.corridaVdotData.plan.find(w=>w.weekNumber===(state.corridaVdotData.currentWeekIndex||1));
      if(curWeek) materializeVdotWeekIntoTreinos(curWeek, state.corridaVdotData.startMonday);
    }
  }

  let onboardingSeen = false;
  state.onboardingCheckinPending = false;
  try{
    const ob = await window.storage.get('onboardingDone', false);
    onboardingSeen = !!(ob && ob.value);
    // Valor antigo era só '1' (sem data) — instalações já existentes não ganham o check-in retroativo,
    // só quem completar o onboarding a partir de agora (data de verdade gravada).
    if(ob && ob.value && ob.value!=='1'){
      const [dateISO, answeredFlag] = ob.value.split('|');
      if(answeredFlag!=='answered' && dateISO === isoDateNDaysAgo(1)) state.onboardingCheckinPending = true;
    }
  }catch(e){ onboardingSeen = false; }

  // Musculação não tem data por exercício (é "o treino de tal dia da semana"), então quando a semana
  // vira, os "feitos" precisam resetar sozinhos — senão fica tudo marcado desde a semana passada.
  try{
    const wm = await window.storage.get('weekTrackMonday', false);
    const storedMonday = (wm && wm.value) || null;
    const currentMonday = vdotISODate(vdotMondayOf(new Date()));
    if(storedMonday && storedMonday !== currentMonday){
      DAY_ABBR.forEach(d=>{ (state.musculacao[d]||[]).forEach(ex=>{ ex.done = false; }); });
      saveMusc();
    }
    if(storedMonday !== currentMonday){
      await window.storage.set('weekTrackMonday', currentMonday, false);
    }
  }catch(e){}

  try{
    const wl = await window.storage.get('workoutSessionsLog', false);
    state.workoutSessionsLog = (wl && wl.value) ? JSON.parse(wl.value) : [];
  }catch(e){ state.workoutSessionsLog = []; }

  // O treino em execução (e o cronômetro de descanso) precisa sobreviver a fechar/reabrir o app — se o
  // descanso já zerou enquanto o app estava fechado, avança direto pro próximo passo assim que reabre.
  try{
    const ws = await window.storage.get('workoutSession', false);
    state.workoutSession = (ws && ws.value) ? JSON.parse(ws.value) : null;
    if(state.workoutSession && state.workoutSession.phase==='rest' && Date.now() >= state.workoutSession.restEndAt){
      advanceAfterRest();
    }
  }catch(e){ state.workoutSession = null; }

  try{
    const dm = await window.storage.get('domsPernas', false);
    state.domsPernas = (dm && dm.value) ? JSON.parse(dm.value) : {};
  }catch(e){ state.domsPernas = {}; }
  restaurarDomsAntigos();

  state.tab = 'hoje';
  state.modalOpen = false; state.modalType = null;
  render();
  if(state.workoutSession && state.workoutSession.phase==='rest') ensureRestTicking();
  // Enquanto o personal está "dentro" do treino de uma aluna, não faz sentido mostrar o onboarding
  // dela pra ele — só quando é a própria pessoa entrando na própria conta pela primeira vez.
  if(!onboardingSeen && !state.viewingClient){
    state.modalType = 'onboarding'; state.modalOpen = true; render();
  }
}

function dayAbbrevOf(dayStr){
  const first = (dayStr||'').split(' ')[0].trim();
  const norm = first.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const found = DAY_ABBR.find(d => d.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase() === norm);
  return found || first;
}

// A lib de XLSX é pesada (build "full" do SheetJS) e só é usada por quem importa planilha — carregar ela
// de cara no <head> deixava o app inteiro mais lento de abrir. Carrega sob demanda, só na primeira vez
// que alguém realmente usa essa função, e reaproveita a mesma Promise se for chamado de novo.
let _xlsxLoadPromise = null;
function loadXlsxLib(){
  if(window.XLSX) return Promise.resolve();
  if(_xlsxLoadPromise) return _xlsxLoadPromise;
  _xlsxLoadPromise = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = ()=>resolve();
    s.onerror = ()=>{ _xlsxLoadPromise = null; reject(new Error('Falha ao carregar a lib de planilha.')); };
    document.head.appendChild(s);
  });
  return _xlsxLoadPromise;
}

/* ---------- Import (corrida) ---------- */
function findByHeaderRow(rows, mustHave){
  for(let i=0;i<rows.length;i++){
    const row = (rows[i]||[]).map(c=> (c===undefined||c===null)?'':String(c).trim().toLowerCase());
    if(mustHave.every(h => row.includes(h))) return i;
  }
  return -1;
}
function parseWorkbook(wb){
  const sheetTreinos = wb.SheetNames.find(n => n.toLowerCase().includes('trein'));
  const sheetZonas = wb.SheetNames.find(n => n.toLowerCase().includes('zona'));
  let treinos = []; let zonas = [];
  if(sheetTreinos){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetTreinos], {header:1, defval:''});
    const hIdx = findByHeaderRow(rows, ['dia/data','tipo de treino']);
    if(hIdx >= 0){
      const headerRow = rows[hIdx].map(c=>String(c).trim().toLowerCase());
      const col = name => headerRow.indexOf(name);
      const idx = { day:col('dia/data'), type:col('tipo de treino'), warmupDesc:col('aquecimento'),
        warmupPace:col('pace aquecimento'), mainDesc:col('treino principal'), mainPace:col('pace principal'),
        cooldownDesc:col('desaquecimento'), cooldownPace:col('pace desaquecimento'),
        totalKm:col('distância total (km)'), zone:col('zona') };
      for(let r=hIdx+1; r<rows.length; r++){
        const row = rows[r];
        if(!row || row.every(c=>String(c).trim()==='')) break;
        if(String(row[idx.day]||'').trim().toLowerCase()==='legenda:') break;
        if(String(row[idx.day]||'').trim()==='') continue;
        treinos.push({
          day:String(row[idx.day]||'').trim(), type:String(row[idx.type]||'').trim(),
          warmupDesc:String(row[idx.warmupDesc]||'').trim(), warmupPace:String(row[idx.warmupPace]||'').trim(),
          mainDesc:String(row[idx.mainDesc]||'').trim(), mainPace:String(row[idx.mainPace]||'').trim(),
          cooldownDesc:String(row[idx.cooldownDesc]||'').trim(), cooldownPace:String(row[idx.cooldownPace]||'').trim(),
          totalKm:row[idx.totalKm]||'', zone:String(row[idx.zone]||'').trim(),
        });
      }
    }
  }
  if(sheetZonas){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetZonas], {header:1, defval:''});
    const hIdx = findByHeaderRow(rows, ['zona','nome']);
    if(hIdx >= 0){
      const headerRow = rows[hIdx].map(c=>String(c).trim().toLowerCase());
      const col = name => headerRow.indexOf(name);
      const idx = { zone:col('zona'), nome:col('nome'), pace:col('pace (min/km)'), fcmax:col('% fc máx') };
      for(let r=hIdx+1; r<rows.length; r++){
        const row = rows[r];
        if(!row || row.every(c=>String(c).trim()==='')) break;
        if(String(row[idx.zone]||'').trim().toLowerCase()==='legenda:') break;
        if(String(row[idx.zone]||'').trim()==='') continue;
        zonas.push({ zone:String(row[idx.zone]||'').trim(), nome:String(row[idx.nome]||'').trim(),
          pace:String(row[idx.pace]||'').trim(), fcmax:String(row[idx.fcmax]||'').trim() });
      }
    }
  }
  return { treinos, zonas: zonas.length ? zonas : DEMO_ZONAS };
}

/* ---------- FIT file parser (baixo nível compartilhado) ---------- */
// Percorre um arquivo .FIT (atividade OU treino, o formato de registros é o mesmo) chamando
// onMessage(globalNum, msg) pra cada mensagem de dados encontrada — quem chama decide o que aproveitar.
function walkFitMessages(buffer, onMessage){
  const view = new DataView(buffer);
  const headerSize = view.getUint8(0);
  const dataSize = view.getUint32(4, true);
  let offset = headerSize;
  const end = headerSize + dataSize;
  const localDefs = {};

  function readField(off, size, base, littleEndian){
    if(base === 0x07){ // string (terminada em \0)
      let str = '';
      for(let i=0;i<size;i++){ const c = view.getUint8(off+i); if(c===0) break; str += String.fromCharCode(c); }
      return { v: str, invalid:false };
    }
    switch(base){
      case 0x00: case 0x02: case 0x0A: { const v = view.getUint8(off); return { v, invalid: v===0xFF }; }
      case 0x01: { const v = view.getInt8(off); return { v, invalid: v===0x7F }; }
      case 0x83: { const v = view.getInt16(off, littleEndian); return { v, invalid: v===0x7FFF }; }
      case 0x84: case 0x8B: { const v = view.getUint16(off, littleEndian); return { v, invalid: v===0xFFFF }; }
      case 0x85: { const v = view.getInt32(off, littleEndian); return { v, invalid: v===0x7FFFFFFF }; }
      case 0x86: case 0x8C: { const v = view.getUint32(off, littleEndian); return { v, invalid: v===0xFFFFFFFF }; }
      case 0x88: return { v: view.getFloat32(off, littleEndian), invalid:false };
      case 0x89: return { v: view.getFloat64(off, littleEndian), invalid:false };
      case 0x0D: return { v: view.getUint8(off), invalid:false };
      default: return { v: null, invalid:true };
    }
  }

  function readDefinition(startOffset, hasDev){
    let off = startOffset + 1; // skip reserved byte
    const arch = view.getUint8(off); off += 1;
    const littleEndian = arch === 0;
    const globalNum = view.getUint16(off, littleEndian); off += 2;
    const numFields = view.getUint8(off); off += 1;
    const fields = [];
    for(let i=0;i<numFields;i++){
      fields.push({ num: view.getUint8(off), size: view.getUint8(off+1), base: view.getUint8(off+2) });
      off += 3;
    }
    const devFields = [];
    if(hasDev){
      const numDev = view.getUint8(off); off += 1;
      for(let i=0;i<numDev;i++){
        devFields.push({ size: view.getUint8(off+1) });
        off += 3;
      }
    }
    return { def: { globalNum, littleEndian, fields, devFields }, nextOffset: off };
  }

  function readDataMessage(startOffset, def){
    let off = startOffset;
    const msg = {};
    for(const f of def.fields){
      if(off + f.size > end) throw new Error('truncated');
      const r = readField(off, f.size, f.base, def.littleEndian);
      if(!r.invalid) msg[f.num] = r.v;
      off += f.size;
    }
    for(const f of def.devFields){ off += f.size; }
    return { msg, nextOffset: off };
  }

  while(offset < end){
    const headerByte = view.getUint8(offset); offset += 1;
    if(headerByte & 0x80){
      const localType = (headerByte >> 5) & 0x03;
      const def = localDefs[localType];
      if(!def) break;
      const { msg, nextOffset } = readDataMessage(offset, def);
      offset = nextOffset;
      onMessage(def.globalNum, msg);
      continue;
    }
    const isDefinition = (headerByte & 0x40) !== 0;
    const localType = headerByte & 0x0F;
    if(isDefinition){
      const hasDev = (headerByte & 0x20) !== 0;
      const { def, nextOffset } = readDefinition(offset, hasDev);
      localDefs[localType] = def;
      offset = nextOffset;
    }else{
      const def = localDefs[localType];
      if(!def) break;
      const { msg, nextOffset } = readDataMessage(offset, def);
      offset = nextOffset;
      onMessage(def.globalNum, msg);
    }
  }
}

function parseFitFile(buffer){
  let session = null;
  const records = [];
  const laps = [];
  walkFitMessages(buffer, (globalNum, msg)=>{
    if(globalNum === 18 && !session) session = msg;
    else if(globalNum === 20) records.push(msg);
    // lap: o relógio marca uma volta automática a cada troca de etapa quando você segue um treino
    // estruturado — o padrão de distância das voltas é quase uma "impressão digital" da estrutura do treino.
    else if(globalNum === 19) laps.push({ distanceM: msg[9]!=null ? msg[9]/100 : null, elapsedTimeS: msg[7]!=null ? msg[7]/1000 : null });
  });

  const FIT_EPOCH = 631065600;
  const toDate = (ts)=> ts!=null ? new Date((ts+FIT_EPOCH)*1000) : null;

  let totalDistanceM = null, totalElapsedTimeS = null, startTime = null;
  if(session){
    if(session[9]!=null) totalDistanceM = session[9]/100;
    if(session[8]!=null) totalElapsedTimeS = session[8]/1000;
    else if(session[7]!=null) totalElapsedTimeS = session[7]/1000;
    startTime = toDate(session[2] != null ? session[2] : session[253]);
  }
  if(records.length>1){
    const first = records[0], last = records[records.length-1];
    if(totalElapsedTimeS==null && first[253]!=null && last[253]!=null) totalElapsedTimeS = last[253]-first[253];
    if(totalDistanceM==null && last[5]!=null) totalDistanceM = last[5]/100;
    if(!startTime && first[253]!=null) startTime = toDate(first[253]);
  }
  return { totalDistanceM, totalElapsedTimeS, startTime, laps };
}

// Lê um arquivo .FIT de TREINO (não atividade) — o formato exportado pelo construtor de treinos do
// Garmin Connect: mensagem file_id (tipo 5 = treino), workout (nome/esporte) e workout_step (cada
// etapa, incluindo blocos "Repetir Nx" que apontam de volta pra um passo anterior).
function parseFitWorkoutFile(buffer){
  let fileType = null, workoutName = '';
  const stepMsgs = [];
  walkFitMessages(buffer, (globalNum, msg)=>{
    if(globalNum === 0 && fileType==null) fileType = msg[0];
    else if(globalNum === 26) workoutName = msg[8] || '';
    else if(globalNum === 27) stepMsgs.push(msg);
  });
  if(fileType !== 5) return { isWorkout:false };

  const paceStrFromSpeed = (mmPerSec)=>{
    if(!mmPerSec) return null;
    const mps = mmPerSec/1000;
    if(mps<=0) return null;
    const secPerKm = Math.round(1000/mps);
    return Math.floor(secPerKm/60)+':'+String(secPerKm%60).padStart(2,'0');
  };
  const INTENSITY_NAME = { 2:'Aquecimento', 3:'Desaquecimento' };
  function buildStep(msg){
    const durationType = msg[1];
    const durationValue = msg[2];
    const targetType = msg[3];
    const lowRaw = msg[5], highRaw = msg[6];
    const km = durationType===1 ? Math.round((durationValue/100000)*1000)/1000 : 0.3;
    let pace = null;
    if(targetType === 0 && (lowRaw || highRaw)){
      const paceSlow = paceStrFromSpeed(lowRaw), paceFast = paceStrFromSpeed(highRaw);
      pace = (paceSlow && paceFast && paceSlow!==paceFast) ? `${paceSlow}–${paceFast}/km` : ((paceFast||paceSlow) ? (paceFast||paceSlow)+'/km' : null);
    }
    const name = INTENSITY_NAME[msg[7]] || (msg[0] || 'Corrida');
    return { messageIndex: msg[254], durationType, name, km, pace };
  }

  stepMsgs.sort((a,b)=>(a[254]||0)-(b[254]||0));
  let flatSteps = [];
  const posByIndex = {};
  for(const msg of stepMsgs){
    if(msg[1] === 6){ // repeat_until_steps_cmplt: repete o bloco [duration_value..anterior] target_value vezes
      const fromIdx = msg[2];
      const repeatCount = msg[4] || 1;
      const sliceStart = posByIndex[fromIdx];
      if(sliceStart == null) continue;
      const slice = flatSteps.slice(sliceStart);
      flatSteps = flatSteps.slice(0, sliceStart);
      for(let r=0;r<repeatCount;r++){ slice.forEach(s=>flatSteps.push({ name:s.name, km:s.km, pace:s.pace })); }
    }else{
      const built = buildStep(msg);
      posByIndex[built.messageIndex] = flatSteps.length;
      flatSteps.push({ name: built.name, km: built.km, pace: built.pace });
    }
  }
  const totalKm = Math.round(flatSteps.reduce((sum,s)=>sum+(s.km||0),0)*10)/10;
  return { isWorkout:true, name: workoutName || 'Treino importado', steps: flatSteps, totalKm };
}

function normalizeNoAccents(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
const DAY_KEYWORDS = [
  ['segunda','Seg'], ['terca','Ter'], ['quarta','Qua'], ['quinta','Qui'], ['sexta','Sex'], ['sabado','Sáb'], ['domingo','Dom'],
  ['seg','Seg'], ['ter','Ter'], ['qua','Qua'], ['qui','Qui'], ['sex','Sex'], ['sab','Sáb'], ['dom','Dom'],
];
function detectDayFromFilename(filename){
  const n = normalizeNoAccents(filename);
  for(const [kw, abbr] of DAY_KEYWORDS){ if(n.includes(kw)) return abbr; }
  return null;
}
function detectWeekFromFilename(filename){
  const m = filename.match(/\bS(\d{1,2})(?!\d)/i) || filename.match(/semana\s*(\d{1,2})/i);
  return m ? parseInt(m[1],10) : null;
}

// Reúne todo dia de treino conhecido (do plano de várias semanas + o que já está materializado
// na semana atual) como candidato pra "isso deve ser esse treino" quando a data não bate.
function buildCorridaMatchCandidates(){
  const candidates = [];
  const cv = state.corridaVdotData;
  if(cv && cv.plan){
    cv.plan.forEach(week=>{
      (week.days||[]).forEach(d=>{
        candidates.push({
          weekNumber: week.weekNumber, day: d.day,
          label: `Semana ${week.weekNumber} · ${d.day} — ${d.title||'Treino'}`,
          steps: d.steps || null, totalKm: d.totalKm || null,
        });
      });
    });
  }
  const currentWeekNumber = cv ? (cv.currentWeekIndex||1) : null;
  state.treinos.forEach(t=>{
    const abbr = dayAbbrevOf(t.day);
    const jaVeioDoPlano = candidates.some(c=>c.weekNumber===currentWeekNumber && c.day===abbr);
    if(!jaVeioDoPlano) candidates.push({ weekNumber:null, day:abbr, label:`${t.day} — ${t.type||'Treino'}`, steps:t.steps||null, totalKm:t.totalKm||null });
  });
  return candidates;
}
function corridaCandidateValue(c){ return c.weekNumber!=null ? `W${c.weekNumber}|${c.day}` : c.day; }
// Compara a distância de cada volta (lap) da corrida real contra os passos do treino planejado —
// quanto mais parecido o "desenho" (quantidade de trechos + distância de cada um), menor a pontuação.
function scoreLapMatch(lapKms, candidate){
  const stepKms = (candidate.steps && candidate.steps.length) ? candidate.steps.map(s=>s.km||0) : (candidate.totalKm ? [candidate.totalKm] : null);
  if(!stepKms || !stepKms.length || !lapKms.length) return Infinity;
  const totalLap = lapKms.reduce((a,b)=>a+b,0);
  const totalStep = stepKms.reduce((a,b)=>a+b,0);
  const totalDiff = Math.abs(totalLap-totalStep);
  const n = Math.min(lapKms.length, stepKms.length);
  let seqDiff = 0;
  for(let i=0;i<n;i++) seqDiff += Math.abs(lapKms[i]-stepKms[i]);
  const lenPenalty = Math.abs(lapKms.length-stepKms.length)*0.3;
  return totalDiff*0.5 + seqDiff + lenPenalty;
}

document.getElementById('fitInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = parseFitFile(reader.result);
      if(!parsed.totalDistanceM && !parsed.startTime){
        alert('Não consegui ler dados desse arquivo .FIT.');
        return;
      }
      const km = parsed.totalDistanceM ? parsed.totalDistanceM/1000 : null;
      const secs = parsed.totalElapsedTimeS || null;
      let pace = '', tempo = '';
      if(km && secs){
        pace = formatPace(secs/km);
        tempo = formatDuration(secs);
      }
      let matchedDay = null;
      if(parsed.startTime){
        const dd = String(parsed.startTime.getDate()).padStart(2,'0');
        const mm = String(parsed.startTime.getMonth()+1).padStart(2,'0');
        const found = state.treinos.find(t=>{
          const m = t.day.match(/(\d{2})\/(\d{2})/);
          return m && m[1]===dd && m[2]===mm;
        });
        if(found) matchedDay = dayAbbrevOf(found.day);
      }
      state.corridaLogDay = matchedDay;
      state.corridaLogCandidates = null;
      state.corridaLogSuggested = null;
      if(!matchedDay){
        const candidates = buildCorridaMatchCandidates();
        if(candidates.length){
          const lapKms = (parsed.laps||[]).map(l=>l.distanceM/1000).filter(v=>v>0);
          const fallbackKms = (!lapKms.length && parsed.totalDistanceM) ? [parsed.totalDistanceM/1000] : [];
          const kmsToCompare = lapKms.length ? lapKms : fallbackKms;
          state.corridaLogCandidates = candidates.map(c=>({ value: corridaCandidateValue(c), label: c.label }));
          if(kmsToCompare.length){
            const scored = candidates.map(c=>({ c, score: scoreLapMatch(kmsToCompare, c) })).sort((a,b)=>a.score-b.score);
            if(scored[0] && isFinite(scored[0].score)) state.corridaLogSuggested = corridaCandidateValue(scored[0].c);
          }
        }
      }
      state.corridaLogPrefill = {
        pace, tempo,
        km: km ? km.toFixed(2) : '',
        fromFit: true,

const STOPWORDS = new Set(['com','de','da','do','na','no','em','a','o','e','para','sem','ao','à','um','uma']);
const ACCENT_MAP = {'á':'a','à':'a','â':'a','ã':'a','ä':'a','é':'e','è':'e','ê':'e','ë':'e','í':'i','ì':'i','î':'i','ï':'i','ó':'o','ò':'o','ô':'o','õ':'o','ö':'o','ú':'u','ù':'u','û':'u','ü':'u','ç':'c'};
function normalizeWords(s){
  let out = String(s||'').toLowerCase();
  out = out.replace(/[áàâãäéèêëíìîïóòôõöúùûüç]/g, ch => ACCENT_MAP[ch] || ch);
  return out.replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w && !STOPWORDS.has(w));
}
function guessRepdbId(grupo, typedName){
  const words = normalizeWords(typedName);
  if(words.length===0) return null;
  let best = null, bestScore = 0;
  exercisesForGroup(grupo).forEach(c=>{
    const shared = normalizeWords(c.nome).filter(w=>words.includes(w)).length;
    if(shared > bestScore){ bestScore = shared; best = c; }
  });
  return (best && bestScore >= 1) ? best.id : null;
}
function exercisesForGroup(grupo){
  const map = new Map();
  ['academia','halteres','corpo'].forEach(tier=>{
    (POOL[tier][grupo]||[]).forEach(e=>{ if(!map.has(e.id)) map.set(e.id, e.nome); });
  });
  return Array.from(map, ([id,nome])=>({id,nome}));
}

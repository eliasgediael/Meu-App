// ===== Corrida com GPS ao vivo (Web Geolocation API) =====
// Guarda os pontos brutos e a corrida em andamento no IndexedDB (não localStorage — um array de GPS de
// uma corrida longa passa fácil do limite prático de localStorage) pra sobreviver a um reload no meio do treino.
const GPS_DB_NAME = 'treinoAppGps';
const GPS_DB_STORE = 'runs';
function gpsDbOpen(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error('IndexedDB indisponível')); return; }
    const req = indexedDB.open(GPS_DB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(GPS_DB_STORE, {keyPath:'id'}); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function gpsDbPut(record){
  try{
    const db = await gpsDbOpen();
    return await new Promise((resolve,reject)=>{
      const tx = db.transaction(GPS_DB_STORE,'readwrite');
      tx.objectStore(GPS_DB_STORE).put(record);
      tx.oncomplete = ()=>resolve(true);
      tx.onerror = ()=>reject(tx.error);
    });
  }catch(e){ return false; }
}
async function gpsDbGet(id){
  try{
    const db = await gpsDbOpen();
    return await new Promise((resolve,reject)=>{
      const tx = db.transaction(GPS_DB_STORE,'readonly');
      const req = tx.objectStore(GPS_DB_STORE).get(id);
      req.onsuccess = ()=>resolve(req.result||null);
      req.onerror = ()=>reject(req.error);
    });
  }catch(e){ return null; }
}
async function gpsDbDelete(id){
  try{
    const db = await gpsDbOpen();
    return await new Promise((resolve)=>{
      const tx = db.transaction(GPS_DB_STORE,'readwrite');
      tx.objectStore(GPS_DB_STORE).delete(id);
      tx.oncomplete = ()=>resolve(true);
      tx.onerror = ()=>resolve(false);
    });
  }catch(e){ return false; }
}

function haversineKm(lat1,lng1,lat2,lng2){
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

const GPS_MAX_ACCURACY_M = 30;
const GPS_MAX_SPEED_KMH = 25;
const GPS_WATCH_OPTS = { enableHighAccuracy:true, maximumAge:0, timeout:10000 };
const GPS_PACE_WINDOW_SEC = 12;

// Pace "atual" suavizado por janela móvel — função pura (só depende dos argumentos, sem ler `state`),
// pra poder testar com traços de GPS fixos. `points` já vem filtrado (gpsOnPosition só empurra pontos
// com accuracy boa e sem salto de velocidade impossível), então aqui só falta a janela de tempo: pega
// os pontos dos últimos `windowSec`, mais o ponto imediatamente anterior à janela como âncora (senão o
// primeiro ponto da janela não tem de onde medir distância), e tira pace = tempo/distância dessa janela.
// Isso evita o pace "tremer" a cada fix de GPS, sem ficar preso à média desde o início do treino inteiro.
function movingWindowPaceSec(points, nowMs, windowSec){
  windowSec = windowSec || GPS_PACE_WINDOW_SEC;
  if(!points || points.length < 2) return null;
  const windowStartMs = nowMs - windowSec*1000;
  let anchorIdx = 0;
  for(let i=points.length-1;i>=0;i--){
    if(points[i].timestamp <= windowStartMs){ anchorIdx = i; break; }
  }
  const windowPoints = points.slice(anchorIdx);
  if(windowPoints.length < 2) return null;
  let distKm = 0;
  for(let i=1;i<windowPoints.length;i++){
    // mesmo filtro de salto de velocidade impossível do gpsOnPosition — sem isso, um ponto ruim que
    // passou no filtro de accuracy mas representa um teleporte (erro de GPS) distorceria a janela toda.
    const dtStepSec = (windowPoints[i].timestamp - windowPoints[i-1].timestamp)/1000;
    const dKm = haversineKm(windowPoints[i-1].lat, windowPoints[i-1].lng, windowPoints[i].lat, windowPoints[i].lng);
    const speedKmh = dtStepSec>0 ? (dKm/dtStepSec)*3600 : 0;
    if(speedKmh <= GPS_MAX_SPEED_KMH) distKm += dKm;
  }
  const dtSec = (windowPoints[windowPoints.length-1].timestamp - windowPoints[0].timestamp)/1000;
  if(dtSec<=0 || distKm<=0.003) return null; // pouca distância na janela = GPS parado/jitter, não dá pra confiar
  return dtSec/distKm; // segundos por km
}

// Mapa da corrida (Leaflet). Carregado sob demanda (só quem inicia uma corrida com GPS baixa a lib) e
// mantido num <div> criado UMA vez e guardado aqui — a tela de corrida re-renderiza inteira a cada
// segundo (pra atualizar o timer), e se o mapa estivesse dentro desse HTML ele seria destruído e
// recriado a cada tick (piscando e perdendo zoom). Em vez disso, o slot vazio no HTML só recebe esse
// elemento via appendChild a cada render — isso MOVE o nó existente, não recria o mapa por baixo.
let _leafletLoadPromise = null;
function loadLeafletLib(){
  if(window.L) return Promise.resolve();
  if(_leafletLoadPromise) return _leafletLoadPromise;
  _leafletLoadPromise = new Promise((resolve, reject)=>{
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
    document.head.appendChild(link);
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    script.onload = ()=>resolve();
    script.onerror = ()=>{ _leafletLoadPromise = null; reject(new Error('Falha ao carregar o mapa.')); };
    document.head.appendChild(script);
  });
  return _leafletLoadPromise;
}
let gpsMapEl = null, gpsMapInstance = null, gpsMapPolyline = null, gpsMapMarker = null;
async function ensureGpsMap(){
  if(gpsMapInstance){ attachGpsMapToSlot(); return; }

function updateGpsMapPoint(lat, lng){

// Hoje o gerador de corrida só produz etapas por distância (km) — o motor já suporta 'tempo' (contagem
// regressiva) e 'aberta' (avança só no botão de Lap, pra treino de pista) pra quando isso existir.
function gpsStepsFromEntry(entry){
  return (entry.steps||[]).map(s=>({
    name: s.name, km: s.km, pace: s.pace, desc: s.desc,
    tipo: s.tipo || 'distancia', metaSeg: s.metaSeg || null,
  }));
}
function gpsNewRunState(day, entry, mode){
  return {
    status: 'intro', day, mode: mode||'gps', steps: gpsStepsFromEntry(entry), stepIndex: 0,
    startedAt: null, pausedMs: 0, pauseBeganAt: null,
    stepStartedAt: null, stepPausedMs: 0,
    totalDistKm: 0, stepDistKm: 0,
    lastPoint: null, points: [], etapasExecutadas: [],
    lastAccuracy: null, denyReason: null, wakeLockOk: null,
  };
}
// Velocidade de esteira (km/h) a partir do pace prescrito (min/km) — é só matemática inversa.
function paceSecToKmh(secPerKm){
  if(!secPerKm) return null;
  return Math.round((3600/secPerKm)*10)/10;
}
// Muitos paces vêm como faixa ("5:46 ~ 6:21/km") — pega os dois extremos quando existirem.
function parsePaceRangeToSec(paceStr){
  const matches = String(paceStr||'').match(/\d+[:.]\d{1,2}/g) || [];
  if(!matches.length) return null;
  const toSec = (m)=>{ const mm=m.match(/(\d+)[:.](\d{1,2})/); return parseInt(mm[1],10)*60+parseInt(mm[2],10); };
  const lo = toSec(matches[0]), hi = toSec(matches[matches.length>1?1:0]);
  return { lo, hi };
}
// Velocidade padrão sugerida pra uma etapa: ponto médio da faixa de pace (ou o valor único, se não for faixa).
function esteiraDefaultKmhForStep(step){
  const range = step && parsePaceRangeToSec(step.pace);
  if(!range) return null;
  return paceSecToKmh((range.lo+range.hi)/2);
}
// Sem GPS, a distância na esteira vem do tempo decorrido × a velocidade alvo atual — que começa como
// sugestão calculada do pace, mas a pessoa pode ajustar com +/- caso rode em outra velocidade na esteira.
function esteiraUpdateDistance(){
  const gr = state.gpsRun;
  if(!gr || gr.mode!=='esteira' || gr.status!=='running') return;
  const kmh = gr.stepKmh;
  if(!kmh) return;
  const hours = gpsStepElapsedSec(gr)/3600;
  gr.stepDistKm = Math.round(kmh*hours*1000)/1000;
  const doneKm = gr.etapasExecutadas.reduce((s,e)=>s+(e.distancia_real_km||0), 0);
  gr.totalDistKm = Math.round((doneKm + gr.stepDistKm)*1000)/1000;
}
function esteiraAdjustKmh(delta){
  const gr = state.gpsRun;
  if(!gr) return;
  gr.stepKmh = Math.max(0.5, Math.round(((gr.stepKmh||0)+delta)*10)/10);
  render();
}
function esteiraAdjustIncline(delta){
  const gr = state.gpsRun;
  if(!gr) return;
  gr.inclinePct = Math.max(0, Math.round(((gr.inclinePct||0)+delta)*10)/10);
  render();
}
function esteiraSkipStep(){
  const gr = state.gpsRun;
  if(!gr) return;
  gpsAdvanceStep();
  render();
}
function openEsteiraIntro(day){
  const entry = treinoEntryForDay(day);
  if(!entry){ alert('Não achei o treino de corrida desse dia.'); return; }
  state.gpsRun = gpsNewRunState(day, entry, 'esteira');
  state.gpsRun.stepKmh = esteiraDefaultKmhForStep(gpsCurrentStep());
  state.gpsRun.inclinePct = 0;
  render();
}
// Guia por voz — Web Speech API (equivalente ao expo-speech). O primeiro speak() precisa vir de dentro
// de um clique do usuário (ex: botão Começar) pra "destravar" o áudio no Safari iOS; depois disso,
// chamadas assíncronas (geolocalização, timers) já funcionam sem gesto novo.
function speak(text){
  if(state.vozAtiva===false) return;
  if(window.NativeBridge && window.NativeBridge.isNative()){ window.NativeBridge.speak(text); return; }
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel(); // não deixa avisos se empilharem atrás um do outro
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'pt-BR';
    u.rate = 1.0;
    speechSynthesis.speak(u);
  }catch(e){}
}
function paceRangeLabel(step){
  const range = step && parsePaceRangeToSec(step.pace);
  if(!range) return null;
  return range.lo===range.hi ? formatPace(range.lo) : (formatPace(range.hi)+' a '+formatPace(range.lo));
}
// "Tiro" aqui cobre qualquer bloco de esforço forte (tiro/intervalado/repetição) — é nesses que faz
// sentido a contagem regressiva falada antes de começar (correr de verdade exige alguns segundos de
// preparo, diferente de um trote leve que já pode começar direto).
function gpsIsTiroStep(step){ return step && /tiro|interval|repeti/i.test(step.name||''); }
function gpsAnnounceStep(gr, step, isFirst){
  if(!step) return;
  const prefix = isFirst ? '' : 'Bloco concluído. ';
  const countdown = (!isFirst && gpsIsTiroStep(step)) ? ' Prepara. 3, 2, 1, vai!' : '';
  if(gr.mode==='esteira'){
    const kmh = gr.stepKmh;
    speak(prefix + `Próximo bloco: ${step.name}. Coloque a esteira em ${String(kmh).replace('.',',')} quilômetros por hora.` + countdown);
  }else{
    const paceLabel = paceRangeLabel(step);
    speak(prefix + `Próximo bloco: ${step.name}.` + (paceLabel ? ` Ritmo alvo: ${paceLabel} por quilômetro.` : '') + countdown);
  }
}
function gpsElapsedMs(sinceMs, pausedMs, pauseBeganAt, status){
  if(!sinceMs) return 0;
  const now = Date.now();
  const activePausedMs = (status==='paused' && pauseBeganAt) ? (now - pauseBeganAt) : 0;
  return Math.max(0, now - sinceMs - pausedMs - activePausedMs);
}
function gpsTotalElapsedSec(gr){ return gpsElapsedMs(gr.startedAt, gr.pausedMs, gr.pauseBeganAt, gr.status)/1000; }
function gpsStepElapsedSec(gr){ return gpsElapsedMs(gr.stepStartedAt, gr.stepPausedMs, gr.pauseBeganAt, gr.status)/1000; }
function gpsCurrentStep(){ const gr=state.gpsRun; return gr ? gr.steps[gr.stepIndex] : null; }

function openGpsIntro(day){
  const entry = treinoEntryForDay(day);
  if(!entry){ alert('Não achei o treino de corrida desse dia.'); return; }

  state.gpsRun = gpsNewRunState(day, entry);

}
async function gpsRequestWakeLock(){
  if(window.NativeBridge && window.NativeBridge.isNative()){
    await window.NativeBridge.requestWakeLock();
    if(state.gpsRun) state.gpsRun.wakeLockOk = true;
    return;
  }
  try{
    if('wakeLock' in navigator){
      gpsWakeLock = await navigator.wakeLock.request('screen');
      if(state.gpsRun) state.gpsRun.wakeLockOk = true;
    }else if(state.gpsRun){ state.gpsRun.wakeLockOk = false; }
  }catch(e){ if(state.gpsRun) state.gpsRun.wakeLockOk = false; }
}
async function gpsReleaseWakeLock(){
  if(window.NativeBridge && window.NativeBridge.isNative()){ await window.NativeBridge.releaseWakeLock(); return; }
  try{ if(gpsWakeLock){ await gpsWakeLock.release(); gpsWakeLock=null; } }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && state.gpsRun && state.gpsRun.status==='running' && !gpsWakeLock){
    gpsRequestWakeLock();
  }
});

async function startEsteiraRun(day){
  const gr = state.gpsRun;

  gpsAnnounceStep(gr, gpsCurrentStep(), true); // dispara dentro do clique — destrava a voz no iOS
  await gpsRequestWakeLock();
  gr.status = 'running';
  gr.startedAt = Date.now();
  gr.stepStartedAt = Date.now();

}
async function startGpsRun(day){
  const gr = state.gpsRun;
  if(!gr) return;
  // Anuncia o 1º bloco já no clique (não espera o GPS travar sinal) — também destrava a voz no iOS,
  // que só libera speechSynthesis quando o primeiro speak() acontece dentro de um gesto do usuário.
  gpsAnnounceStep(gr, gpsCurrentStep(), true);
  gr.status = 'permission';
  gr.denyReason = null;
  render();
  await gpsRequestWakeLock();
  gpsWatchId = await gpsStartWatch();
}
function gpsOnError(err){
  const gr = state.gpsRun;
  if(!gr) return;
  if(err.code === err.PERMISSION_DENIED){ gr.denyReason='negada'; }
  else if(err.code === err.TIMEOUT){ gr.denyReason='timeout'; }
  else { gr.denyReason='indisponivel'; }
  gr.status = 'denied';
  render();
}
function gpsOnPosition(pos){
  const gr = state.gpsRun;
  if(!gr || gr.status==='paused' || gr.status==='finished') return;
  const { latitude:lat, longitude:lng, accuracy } = pos.coords;
  const t = pos.timestamp || Date.now();
  gr.lastAccuracy = accuracy;
  if(gr.status==='permission' || gr.status==='denied'){
    gr.status = 'running';
    gr.startedAt = t;
    gr.stepStartedAt = t;
  }
  // Ponto com precisão fraca: descarta o ponto inteiro, não soma distância nem vira referência.
  if(accuracy!=null && accuracy > GPS_MAX_ACCURACY_M){ render(); return; }
  // Altitude só pra estimar ganho de elevação no resumo pós-corrida — nem todo navegador/dispositivo
  // entrega esse campo (fica null quando não tem), então o cálculo de elevação sempre tolera faltar.
  gr.points.push({ lat, lng, timestamp: t, alt: pos.coords.altitude });
  if(gr.lastPoint){
    const dtSec = (t - gr.lastPoint.t)/1000;
    const dKm = haversineKm(gr.lastPoint.lat, gr.lastPoint.lng, lat, lng);
    const speedKmh = dtSec>0 ? (dKm/dtSec)*3600 : 0;
    // Salto de velocidade fisicamente impossível = erro de GPS: descarta a distância E NÃO vira a nova
    // referência — se o ponto ruim virasse referência, o próximo ponto (válido) também pareceria um salto
    // enorme relativo a ele, numa cascata de falsos-positivos. Mantém a última referência boa conhecida;
    // como o intervalo de tempo até o próximo ponto só cresce, a velocidade calculada tende a normalizar.
    if(speedKmh <= GPS_MAX_SPEED_KMH){
      gr.totalDistKm += dKm;
      gr.stepDistKm += dKm;
      gr.lastPoint = { lat, lng, t };
      updateGpsMapPoint(lat, lng);
    }
  }else{
    gr.lastPoint = { lat, lng, t };
    updateGpsMapPoint(lat, lng);
  }
  gpsCheckAutoAdvance();
  gpsPersist();
  render();
}
function gpsFinalizeCurrentStep(){
  const gr = state.gpsRun;
  const step = gpsCurrentStep();
  if(!gr || !step) return;
  const stepSec = gpsStepElapsedSec(gr);
  gr.etapasExecutadas.push({
    tipo: step.name,
    duracao_alvo: step.tipo==='tempo' ? { segundos: step.metaSeg } : { km: step.km },
    duracao_real_seg: Math.round(stepSec),
    distancia_real_km: Math.round(gr.stepDistKm*1000)/1000,
    pace_medio_real: gr.stepDistKm>0 ? (stepSec/60)/gr.stepDistKm : null,
  });
}
function gpsAdvanceStep(){
  const gr = state.gpsRun;
  if(!gr) return;
  gpsFinalizeCurrentStep();
  if(gr.stepIndex >= gr.steps.length-1){ finishGpsRun(); return; }
  gr.stepIndex++;
  gr.stepDistKm = 0;
  gr.stepStartedAt = Date.now();
  gr.stepPausedMs = 0;
  if(gr.mode==='esteira'){
    const nextStep = gpsCurrentStep();
    const suggestedKmh = esteiraDefaultKmhForStep(nextStep);
    // Tiro na esteira: não troca a velocidade na hora — mostra o modal "coloque em X km/h" e só aplica
    // quando a pessoa confirmar (ou sozinho depois de 15s, pra não travar o treino se ninguém tocar).
    if(gpsIsTiroStep(nextStep) && suggestedKmh){
      gr.tiroModalKmh = suggestedKmh;
      gr.tiroModalUntil = Date.now()+15000;
    }else{
      gr.stepKmh = suggestedKmh;
    }
  }
  if(window.NativeBridge && window.NativeBridge.isNative()){ window.NativeBridge.vibrate(); }
  else if(navigator.vibrate){ try{ navigator.vibrate(120); }catch(e){} }
  gpsAnnounceStep(gr, gpsCurrentStep(), false);
}
function confirmTiroModal(){
  const gr = state.gpsRun;
  if(!gr || !gr.tiroModalUntil) return;
  gr.stepKmh = gr.tiroModalKmh;
  gr.tiroModalUntil = null;
  render();
}
// Estimativa simples (não é medição real, o app não tem sensor de FC/potência): ~1 kcal por kg de peso
// corporal por km percorrido, aproximação padrão usada por apps de corrida quando falta um sensor.
function estimateCaloriesKcal(distKm, pesoKg){
  return Math.round((distKm||0) * (parseFloat(pesoKg)||70));
}
function gpsLapStep(){
  const gr = state.gpsRun;
  const step = gpsCurrentStep();
  if(!gr || !step || step.tipo!=='aberta') return;
  gpsAdvanceStep();
  render();
}
function gpsCheckAutoAdvance(){
  const gr = state.gpsRun;
  const step = gpsCurrentStep();
  if(!gr || !step || gr.status!=='running') return;
  if(step.tipo==='distancia' && step.km && gr.stepDistKm >= step.km) gpsAdvanceStep();
  else if(step.tipo==='tempo' && step.metaSeg && gpsStepElapsedSec(gr) >= step.metaSeg) gpsAdvanceStep();
  // tipo==='aberta' só avança pelo botão de Lap.
}
async function gpsPersist(){
  const gr = state.gpsRun;
  if(!gr) return;
  await gpsDbPut({ id:'activeRun', ...gr });
}
function gpsPauseRun(){
  const gr = state.gpsRun;
  if(!gr || gr.status!=='running') return;
  gr.status = 'paused';
  gr.pauseBeganAt = Date.now();
  if(gpsWatchId!=null){ gpsStopWatch(gpsWatchId); gpsWatchId=null; }
  gpsReleaseWakeLock();
  gpsPersist();
  render();
}
async function gpsResumeRun(){
  const gr = state.gpsRun;
  if(!gr || gr.status!=='paused') return;
  const pausedFor = gr.pauseBeganAt ? (Date.now()-gr.pauseBeganAt) : 0;
  gr.pausedMs += pausedFor;
  gr.stepPausedMs += pausedFor;
  gr.pauseBeganAt = null;
  if(!gr.startedAt) gr.startedAt = Date.now();
  if(!gr.stepStartedAt) gr.stepStartedAt = Date.now();
  gr.status = 'running';
  gr.lastPoint = null; // evita contar a distância "pulada" entre o ponto de antes e depois da pausa
  gpsRequestWakeLock();
  if(gr.mode!=='esteira') gpsWatchId = await gpsStartWatch();
  render();
}
async function finishGpsRun(){
  const gr = state.gpsRun;
  if(!gr || gr.status==='finished') return;
  if(gr.etapasExecutadas.length <= gr.stepIndex) gpsFinalizeCurrentStep();
  speak('Treino concluído! Bom trabalho.');
  gr.status = 'finished';
  if(gpsWatchId!=null){ gpsStopWatch(gpsWatchId); gpsWatchId=null; }
  await gpsReleaseWakeLock();

  const totalElapsedSec = Math.round(gpsTotalElapsedSec(gr));
  const resultado = {
    etapas_executadas: gr.etapasExecutadas,
    pontos_gps: gr.points.map(p=>({ lat:p.lat, lng:p.lng, timestamp:p.timestamp })),
    distancia_total_km: Math.round(gr.totalDistKm*1000)/1000,
    tempo_total_seg: totalElapsedSec,
  };
  const runId = 'run_'+Date.now();
  await gpsDbPut({ id: runId, day: gr.day, finishedAt: Date.now(), ...resultado });
  await gpsDbDelete('activeRun');

  // Alimenta o mesmo registro que o log manual (pace/tempo/km) usa, pra aparecer no histórico normal.
  const paceSecPerKm = resultado.distancia_total_km>0 ? totalElapsedSec/resultado.distancia_total_km : null;
  const prev = corridaEntryProgress(gr.day) || {};
  if(prev.shoeCredit){
    const prevT = state.equipamentos.tenis.find(x=>x.id===prev.shoeCredit.tenisId);
    if(prevT) prevT.km = Math.max(0, Math.round((prevT.km-prev.shoeCredit.km)*10)/10);
  }
  const ativoTenis = state.equipamentos.tenis.find(t=>t.ativo);
  let shoeCredit = null;
  if(ativoTenis && resultado.distancia_total_km){
    ativoTenis.km = Math.round((ativoTenis.km+resultado.distancia_total_km)*10)/10;
    shoeCredit = {tenisId:ativoTenis.id, km:resultado.distancia_total_km};
  }
  saveEquipamentos();
  state.corridaProgress[corridaProgressKey(gr.day)] = {
    ...prev, done:true,
    pace: paceSecPerKm!=null ? formatPace(paceSecPerKm)+'/km' : '',
    tempo: formatClock(totalElapsedSec),
    km: String(resultado.distancia_total_km),
    data: todayISO(), shoeCredit, gpsRunId: runId,
  };
  if(isTodayDayAbbrev(gr.day)){ markChallengeCheckinToday(); markGroupCheckinsToday('fez corrida'+(resultado.distancia_total_km?' · '+fmtKm(resultado.distancia_total_km):'')); }
  saveCorridaProgress();
  render();
}
function gpsExitRun(){
  if(!confirm('Sair sem salvar essa corrida? O progresso registrado até agora vai se perder.')) return;
  if(gpsWatchId!=null){ gpsStopWatch(gpsWatchId); gpsWatchId=null; }
  gpsReleaseWakeLock();
  gpsDbDelete('activeRun');
  state.gpsRun = null;
  render();
}
function gpsCloseSummary(){ state.gpsRun = null; render(); }
const GPS_ZONE_ALERT_MIN_INTERVAL_MS = 45000; // não repete aviso de zona antes de 45s
const GPS_ZONE_TOLERANCE_SEC = 10; // margem além da faixa do bloco antes de avisar (seg/km)
// Compara o pace ATUAL suavizado (não o médio — senão o aviso reage devagar demais) com a faixa de
// ritmo do bloco em andamento. Só fala de novo depois do intervalo mínimo, pra não virar ladainha.
function gpsCheckZoneAlert(){
  const gr = state.gpsRun;
  if(!gr || gr.mode!=='gps' || gr.status!=='running') return;
  const step = gpsCurrentStep();
  const range = step && parsePaceRangeToSec(step.pace);
  if(!range) return;
  const paceAtual = movingWindowPaceSec(gr.points, Date.now());
  if(paceAtual==null) return;
  const now = Date.now();
  if(gr.lastZoneAlertAt && (now-gr.lastZoneAlertAt) < GPS_ZONE_ALERT_MIN_INTERVAL_MS) return;
  if(paceAtual < range.lo - GPS_ZONE_TOLERANCE_SEC){
    speak('Você está rápido demais, diminui um pouco o ritmo.');
    gr.lastZoneAlertAt = now;
  }else if(paceAtual > range.hi + GPS_ZONE_TOLERANCE_SEC){
    speak('Você está devagar, tenta acelerar um pouco.');
    gr.lastZoneAlertAt = now;
  }
}
function ensureGpsTicking(){
  if(gpsTickIntervalRef) return;
  gpsTickIntervalRef = setInterval(()=>{
    if(!state.gpsRun){ clearInterval(gpsTickIntervalRef); gpsTickIntervalRef=null; return; }
    if(state.gpsRun.status==='running'){
      if(state.gpsRun.mode==='esteira') esteiraUpdateDistance();
      if(state.gpsRun.tiroModalUntil && Date.now()>=state.gpsRun.tiroModalUntil) confirmTiroModal();
      gpsCheckAutoAdvance();
      gpsCheckZoneAlert();
      render();
    }
  }, 1000);
}

// "TIRO 1 DE 4" — conta a posição do bloco atual entre todos os blocos de tiro do treino (o nome do
// passo sozinho, tipo "Tiro", não diz qual repetição é essa).
function tiroPositionInfo(gr, step){
  if(!step || !gpsIsTiroStep(step)) return null;
  const tiroSteps = gr.steps.filter(s=>gpsIsTiroStep(s));
  const idx = tiroSteps.indexOf(step);
  return idx>=0 ? { idx:idx+1, total:tiroSteps.length } : null;
}
function esteiraTargetKmhRange(step){
  const range = step && parsePaceRangeToSec(step.pace);
  if(!range) return null;
  const a = paceSecToKmh(range.lo), b = paceSecToKmh(range.hi);
  return { lo: Math.min(a,b), hi: Math.max(a,b) };
}

// Faixa de cor na borda indicando dentro/fora da zona de ritmo — mesma comparação do aviso por voz
// (gpsCheckZoneAlert), só que sempre visível, com texto de apoio (nunca só a cor, pra quem não
// enxerga bem a cor com o sol forte).
function gpsZoneStatus(gr, step, paceAtualSec){
  if(!step || gr.status!=='running' || paceAtualSec==null) return { cls:'', label:'' };
  const range = parsePaceRangeToSec(step.pace);
  if(!range) return { cls:'', label:'' };
  if(paceAtualSec < range.lo - GPS_ZONE_TOLERANCE_SEC) return { cls:'zone-warn', label:'Rápido demais' };
  if(paceAtualSec > range.hi + GPS_ZONE_TOLERANCE_SEC) return { cls:'zone-warn', label:'Devagar' };
  return { cls:'zone-ok', label:'Dentro do ritmo' };
}

// Ganho de elevação (soma só das subidas entre pontos consecutivos) — aproximação com o GPS do celular,
// que é impreciso em altitude; fica null se o aparelho/navegador não entregou altitude em nenhum ponto.
function elevationGainM(points){
  const withAlt = (points||[]).filter(p=>p.alt!=null);
  if(withAlt.length<2) return null;
  let gain=0;
  for(let i=1;i<withAlt.length;i++){ const d=withAlt[i].alt-withAlt[i-1].alt; if(d>0) gain+=d; }
  return Math.round(gain);
}
// Compara o treino planejado (o que tava agendado pro dia) com o que foi realmente feito nesta corrida.
// "Certo" = dentro de ~10% do planejado; fora disso é "Acima" ou "Abaixo" do número planejado.
function corridaPlanVsReal(gr){
  const entry = treinoEntryForDay(gr.day) || null;
  const totalElapsedSec = Math.round(gpsTotalElapsedSec(gr));
  const distReal = gr.totalDistKm, durReal = totalElapsedSec;
  const paceReal = distReal>0.05 ? totalElapsedSec/distReal : null;
  const distPlan = entry && entry.totalKm || null;
  const durPlan = entry && entry.totalMin ? entry.totalMin*60 : null;
  let pacePlanSec = null;
  if(entry && entry.steps && entry.steps.length){
    let totalKm=0, totalSec=0;
    entry.steps.forEach(s=>{ const r=parsePaceRangeToSec(s.pace); if(r && s.km){ totalSec+=((r.lo+r.hi)/2)*s.km; totalKm+=s.km; } });
    if(totalKm>0) pacePlanSec = totalSec/totalKm;
  }
  const cmp = (real, plan, tolPct)=>{
    if(plan==null || real==null) return { status:'—', cor:'var(--mrt-dim)' };
    const diffPct = (real-plan)/plan;
    if(Math.abs(diffPct)<=tolPct) return { status:'Certo', cor:'var(--mrt-green)' };
    return diffPct>0 ? { status:'Acima', cor:'var(--mrt-amber)' } : { status:'Abaixo', cor:'var(--mrt-amber)' };
  };
  const rows = [
    { label:'Distância', plan: distPlan!=null?fmtKm(distPlan):'—', real: fmtKm(distReal), cmp: cmp(distReal, distPlan, 0.1) },
    { label:'Duração', plan: durPlan!=null?formatDuration(durPlan):'—', real: formatDuration(durReal), cmp: cmp(durReal, durPlan, 0.1) },
    { label:'Ritmo médio', plan: pacePlanSec!=null?formatPace(pacePlanSec)+'/km':'—', real: paceReal!=null?formatPace(paceReal)+'/km':'—', cmp: cmp(paceReal, pacePlanSec, 0.08) },
  ];
  const certos = rows.filter(r=>r.cmp.status==='Certo').length;
  const geral = !entry ? null : certos>=3 ? 'Ótimo' : certos>=1 ? 'Bom' : 'Revisar';
  return { rows, geral, entry, pacePlanSec, paceReal };
}
// Etapa executada (gr.etapasExecutadas[i]) e etapa planejada (gr.steps[i]) foram gravadas na mesma ordem
// — dá pra comparar par a par sem precisar casar por nome (dois blocos podem se chamar "Tiro").
function corridaBlockRows(gr){
  return gr.etapasExecutadas.map((e,i)=>{
    const plannedStep = gr.steps[i];
    const range = plannedStep && parsePaceRangeToSec(plannedStep.pace);
    const targetSec = range ? (range.lo+range.hi)/2 : null;
    const realSec = e.pace_medio_real!=null ? e.pace_medio_real*60 : null;
    return { nome:e.tipo, targetSec, realSec };
  }).filter(r=>r.targetSec && r.realSec);
}
function renderPaceBlockChart(gr){
  const rows = corridaBlockRows(gr);
  if(!rows.length) return '';
  const maxSec = Math.max(...rows.map(r=>Math.max(r.targetSec,r.realSec)));
  const bars = rows.map(r=>{
    const cor = r.realSec<=r.targetSec ? 'var(--mrt-green)' : 'var(--mrt-amber)';
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;">
      <div style="display:flex;align-items:flex-end;gap:3px;height:70px;">
        <div title="Alvo" style="width:9px;border-radius:3px 3px 0 0;background:var(--mrt-card2);height:${Math.max(4,Math.round(r.targetSec/maxSec*70))}px;"></div>
        <div title="Real" style="width:9px;border-radius:3px 3px 0 0;background:${cor};height:${Math.max(4,Math.round(r.realSec/maxSec*70))}px;"></div>
      </div>
      <div style="font-size:9.5px;color:var(--mrt-dim);text-align:center;line-height:1.3;">${r.nome}</div>
    </div>`;
  }).join('');
  return `

      <div style="display:flex;gap:6px;">${bars}</div>

}
// Texto gerado por regra simples (não é IA nem motor de treino) — compara só o ritmo médio de HOJE

function nextWorkoutAdjustmentText(pvr){
  const row = pvr.rows.find(r=>r.label==='Ritmo médio');
  if(!pvr.entry || !row || row.cmp.status==='—') return 'Sem um treino planejado pra comparar — nada a ajustar automaticamente.';
  if(row.cmp.status==='Certo') return 'Você seguiu o ritmo planejado certinho — a progressão do plano continua normalmente.';
  if(row.cmp.status==='Abaixo') return 'Você correu mais rápido que o ritmo planejado — o próximo treino de qualidade pode subir um pouco o alvo.';
  return 'Você ficou mais devagar que o ritmo planejado — vale manter o mesmo alvo por mais uma sessão antes de progredir.';
}

    : pvr.geral==='Ótimo' ? 'Você cumpriu o treino dentro do planejado em quase tudo. Excelente execução.'

function parsePaceToSec(pace){
  const m = String(pace||'').match(/(\d+)[:.](\d{1,2})/);
  if(!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}
function formatPace(secPerKm){
  let m = Math.floor(secPerKm/60), s = Math.round(secPerKm%60);
  if(s===60){ m++; s=0; }
  return m+':'+String(s).padStart(2,'0');
}
function formatDuration(totalSec){
  if(totalSec>=3600){
    const h = Math.floor(totalSec/3600), min = Math.round((totalSec%3600)/60);
    return h+'h'+(min>0?' '+min+'min':'');
  }
  return Math.round(totalSec/60)+'min';
}

/* ---------- Construtor de treino manual (blocos, estilo Garmin Connect) ---------- */
const BLOCK_KIND_META = {
  aquec:    { label:'Aquecimento',    cor:'var(--amber)' },
  continua: { label:'Corrida',        cor:'var(--blue)' },
  recup:    { label:'Recuperação',    cor:'var(--text-dim)' },
  desaq:    { label:'Desaquecimento', cor:'var(--teal)' },
};
function newBlockId(){ return 'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
// Campos de uma "etapa" — usados tanto por um bloco simples quanto por cada sub-etapa dentro de um grupo Repetir.
function newStepFields(kind){
  return { kind, durType:'km', km:'', kmUnit:'km', h:'', m:'', s:'',
    paceType:'none', paceLoM:'', paceLoS:'', paceHiM:'', paceHiS:'' };
}
function newBlock(kind){
  if(kind==='intervalado'){
    return { id:newBlockId(), isGroup:true, reps:'3', steps:[
      { id:newBlockId(), ...newStepFields('continua') },
      { id:newBlockId(), ...newStepFields('recup') },
    ]};
  }
  return { id:newBlockId(), isGroup:false, ...newStepFields(kind) };
}
// Sem pace, um trecho em tempo não tem como virar km (e vice-versa) — nesses casos a contribuição
// pro total fica 0 em vez de quebrar a conta toda.
function stepPaceSecPerKm(step){
  if(step.paceType!=='pace') return null;
  const lo = (parseInt(step.paceLoM)||0)*60 + (parseInt(step.paceLoS)||0);
  const hi = (parseInt(step.paceHiM)||0)*60 + (parseInt(step.paceHiS)||0);
  if(!lo && !hi) return null;
  if(lo && hi) return (lo+hi)/2;
  return lo||hi;
}
function stepPaceText(step){
  if(step.paceType!=='pace') return '';
  const lo = step.paceLoM!=='' ? `${step.paceLoM}:${String(step.paceLoS||0).padStart(2,'0')}` : '';
  const hi = step.paceHiM!=='' ? `${step.paceHiM}:${String(step.paceHiS||0).padStart(2,'0')}` : '';
  if(lo && hi && lo!==hi) return `${lo} a ${hi}/km`;
  return (lo||hi) ? (lo||hi)+'/km' : '';
}
function stepTimeSec(step){ return (parseInt(step.h)||0)*3600 + (parseInt(step.m)||0)*60 + (parseInt(step.s)||0); }
function stepKm(step){
  if(step.durType==='km') return parseFloat(String(step.km).replace(',','.'))||0;
  const totalSec = stepTimeSec(step), paceSec = stepPaceSecPerKm(step);
  if(!totalSec || !paceSec) return 0;
  return totalSec/paceSec;
}
function stepMin(step){
  if(step.durType==='time') return stepTimeSec(step)/60;
  const km = parseFloat(String(step.km).replace(',','.'))||0, paceSec = stepPaceSecPerKm(step);
  if(!km || !paceSec) return 0;
  return (km*paceSec)/60;
}
function durSummaryText(step){
  if(step.durType==='km') return step.km ? fmtKm(parseFloat(step.km)||0) : '—';
  const h=parseInt(step.h)||0, m=parseInt(step.m)||0, s=parseInt(step.s)||0;
  if(!h && !m && !s) return '—';
  return (h?h+'h ':'')+(m?m+'min ':'')+(s?s+'s':'');
}
function stepSummaryText(step){
  const dur = durSummaryText(step), pace = stepPaceText(step);
  const parts = [];
  if(dur && dur!=='—') parts.push(dur);
  if(pace) parts.push(pace);
  return parts.length ? parts.join(' · ') : 'Toca pra editar';
}
function blockToStep(b){
  if(b.isGroup){
    const reps = parseFloat(String(b.reps).replace(',','.')) || 0;
    const work = b.steps[0], rest = b.steps[1];
    const km = reps*(stepKm(work)+stepKm(rest));
    const min = reps*(stepMin(work)+stepMin(rest));
    const restTxt = durSummaryText(rest);
    const desc = `${b.reps||0}x${durSummaryText(work)}${restTxt!=='—' ? ', '+restTxt+' de descanso entre' : ''}`;
    return { name:'Intervalado', km, min, pace:stepPaceText(work), desc };
  }
  const meta = BLOCK_KIND_META[b.kind];
  return { name:meta.label, km:stepKm(b), min:stepMin(b), pace:stepPaceText(b), desc:durSummaryText(b) };
}
function blockSummaryText(b){
  const s = blockToStep(b);
  const parts = [];
  if(s.km) parts.push(fmtKm(Math.round(s.km*10)/10));
  if(s.pace) parts.push(s.pace);
  return parts.length ? parts.join(' · ') : 'Toca pra editar';
}
// Cor por palavra-chave no texto livre de "Tipo de treino" — só o gerador VDOT sabia categorizar
// automaticamente antes; assim um treino manual "Longão" ou "Intervalado" também fica com a cor certa.
function inferCorTipo(tipo){
  const t = String(tipo||'').toLowerCase();
  if(/long/.test(t)) return 'var(--green)';
  if(/limiar/.test(t)) return 'var(--amber)';
  if(/interval/.test(t)) return 'var(--danger)';
  if(/repeti|tiro/.test(t)) return 'var(--rep)';
  if(/prova/.test(t)) return 'var(--accent)';
  return 'var(--blue)';
}
// Mesma lógica de palavra-chave da cor, mas devolvendo a frase de objetivo — assim um treino
// criado na mão ("Intervalado", "Longão"...) ganha a mesma explicação que os gerados pelo VDOT.
function inferObjetivo(tipo){
  const t = String(tipo||'').toLowerCase();
  if(/long/.test(t)) return VDOT_OBJETIVO['Longão'];
  if(/limiar/.test(t)) return VDOT_OBJETIVO['Limiar'];
  if(/interval/.test(t)) return VDOT_OBJETIVO['Intervalado'];
  if(/repeti|tiro/.test(t)) return VDOT_OBJETIVO['Repetição'];
  if(/prova/.test(t)) return VDOT_OBJETIVO['Prova'];
  return VDOT_OBJETIVO['Fácil'];
}

      return b;

// Decide quantos dias de corrida/musculação cabem nos dias disponíveis, cedendo nesta ordem quando
// não cabe tudo (regra combinada com o usuário): 1) modelo de distribuição (alternado -> separado),
// 2) frequência da modalidade que NÃO é o foco principal. O dia de descanso total nunca cede — se
// mesmo assim não sobrar 1 dia livre, a geração é recusada (ok:false).
// A pessoa escolhe direto, dia a dia, o que quer (descanso/corrida/musc/os dois) — não tem mais cascata
// de "não coube, vou reduzir sozinho". Só o dia do longão é escolhido automaticamente, priorizando fim
// de semana, entre os dias de corrida que a pessoa já marcou.
// Substitui a grade manual dia-a-dia: a pessoa só diz quais dias tem disponível e se prefere
// corrida+musculação juntos no mesmo dia ou separados — isso decide sozinho quantos dias de cada
// modalidade cabem, distribuindo de forma espalhada pela semana (nunca empilhando tudo de um
// modo só no começo), usando o mesmo truque de distribuição uniforme de um gráfico de Bresenham.
function autoDistributeHybridDays(availableDays, focoPlanejamento, mesmoDia){
  const sorted = [...availableDays].sort((a,b)=>DAY_ABBR.indexOf(a)-DAY_ABBR.indexOf(b));
  const dayPicks = {};
  DAY_ABBR.forEach(d=>{ dayPicks[d] = 'descanso'; });
  if(mesmoDia){
    sorted.forEach(d=>{ dayPicks[d] = 'ambos'; });
    return dayPicks;
  }
  const n = sorted.length;
  if(n===0) return dayPicks;
  const ratioCorrida = focoPlanejamento==='corrida' ? 0.7 : focoPlanejamento==='musculacao' ? 0.3 : 0.5;
  // +1e-9 evita o clássico erro de ponto flutuante (5*0.7 dá 3.4999999999999996 em JS, não 3.5,
  // e arredondaria pra baixo sem essa margem).
  let corridaCount = Math.round(n*ratioCorrida + 1e-9);
  corridaCount = Math.max(0, Math.min(n, corridaCount));
  if(n>=2){
    if(corridaCount===0) corridaCount = 1;
    if(corridaCount===n) corridaCount = n-1;
  }
  const muscCount = n - corridaCount;
  // Preenche tudo com o modo MAJORITÁRIO e espalha o modo minoritário no CENTRO de cada fatia que
  // ele ocupa (não no início) — isso já evita empurrar o majoritário inteiro pra uma ponta só.
  const minorityIsCorrida = corridaCount <= muscCount;
  const minorityCount = Math.min(corridaCount, muscCount) || 0;
  const majorityLabel = minorityIsCorrida ? 'musc' : 'corrida';
  const minorityLabel = minorityIsCorrida ? 'corrida' : 'musc';
  sorted.forEach(d=>{ dayPicks[d] = majorityLabel; });
  for(let i=0;i<minorityCount;i++){
    const pos = Math.min(n-1, Math.round((i+0.5)*n/minorityCount));
    dayPicks[sorted[pos]] = minorityLabel;
  }
  // Prefere manter o fim de semana como corrida (é onde o longão naturalmente cai — ver
  // pickLongaoDay) — troca um dia de corrida do meio de semana pelo fim de semana quando disponível,
  // sem mudar a contagem total de cada modo.
  if(corridaCount>0){
    const weekendPick = sorted.includes('Dom') ? 'Dom' : sorted.includes('Sáb') ? 'Sáb' : null;
    if(weekendPick && dayPicks[weekendPick]!=='corrida'){
      const swapCandidate = sorted.find(d=>dayPicks[d]==='corrida' && d!=='Sáb' && d!=='Dom');
      if(swapCandidate){
        dayPicks[swapCandidate] = dayPicks[weekendPick];
        dayPicks[weekendPick] = 'corrida';
      }
    }
  }
  // Rede de segurança: SÓ pra corrida (é onde 3 dias seguidos sem descanso aumenta risco de lesão —
  // musculação não tem esse mesmo problema, sequência de dias de treino de força é normal). Se sobrou
  // 3 corridas seguidas DE VERDADE (sem descanso entre elas), quebra a do meio pra musculação.
  for(let guard=0; guard<14; guard++){
    let brokeSomething = false;
    for(let i=0;i+2<DAY_ABBR.length;i++){
      const d0=DAY_ABBR[i], d1=DAY_ABBR[i+1], d2=DAY_ABBR[i+2];
      const v0=dayPicks[d0], v1=dayPicks[d1], v2=dayPicks[d2];
      if(v0==='corrida' && v0===v1 && v1===v2){
        dayPicks[d1] = 'musc';
        brokeSomething = true;
      }
    }
    if(!brokeSomething) break;
  }
  return avoidHeavyLegsBeforeQuality(dayPicks);
}
// Regra anti-interferência (Meu Ritmo, fase 2): evita cair musculação na véspera do longão ou da sessão
// de qualidade de corrida (limiar/intervalado) — usa os MESMOS critérios que decidem qual dia vira longão
// (pickLongaoDay) e qual vira qualidade (1º dia de corrida que não é o longão, igual buildHybridCorridaWeek),
// pra ficar consistente com o plano de corrida que realmente vai ser gerado. Só mexe quando dá pra trocar
// sem afetar a contagem de cada modo (troca um 'musc' isolado por um dia de descanso disponível).
function avoidHeavyLegsBeforeQuality(dayPicks){
  const corridaDays = DAY_ABBR.filter(d=>dayPicks[d]==='corrida'||dayPicks[d]==='ambos');
  if(corridaDays.length<2) return dayPicks;
  const longaoDay = pickLongaoDay(corridaDays);
  const qualityDay = corridaDays.find(d=>d!==longaoDay);
  // As duas vésperas protegidas de uma vez, ANTES de mexer em qualquer uma — senão consertar a véspera
  // do longão pode "roubar" o dia de descanso liberado e reintroduzir musc na véspera da qualidade
  // (ou vice-versa), trocando um problema pelo outro em vez de resolver.
  const sensitiveSlots = [longaoDay, qualityDay].filter(Boolean).map(qDay=>DAY_ABBR[(DAY_ABBR.indexOf(qDay)+6)%7]);
  sensitiveSlots.forEach(dayBefore=>{
    if(dayPicks[dayBefore]==='musc'){
      const restCandidate = DAY_ABBR.find(d=>dayPicks[d]==='descanso' && d!==dayBefore && !sensitiveSlots.includes(d));
      if(restCandidate){ dayPicks[dayBefore]='descanso'; dayPicks[restCandidate]='musc'; }
    }
  });
  return dayPicks;
}
function pickLongaoDay(corridaDays){
  if(corridaDays.includes('Dom')) return 'Dom';
  if(corridaDays.includes('Sáb')) return 'Sáb';
  const sorted = [...corridaDays].sort((a,b)=>DAY_ABBR.indexOf(a)-DAY_ABBR.indexOf(b));
  return sorted[sorted.length-1];
}
// Aviso (não bloqueia) quando a própria escolha da pessoa empilha 3+ dias de corrida seguidos sem
// descanso entre eles — real reclamação de treino sem pausa que motivou essa simplificação.
function hybridConsecutiveRunWarning(corridaDays){
  const idxs = corridaDays.map(d=>DAY_ABBR.indexOf(d)).sort((a,b)=>a-b);
  let streak = 1, maxStreak = 1;
  for(let i=1;i<idxs.length;i++){
    if(idxs[i]===idxs[i-1]+1){ streak++; maxStreak = Math.max(maxStreak, streak); }
    else streak = 1;
  }
  return maxStreak>=3 ? `Você marcou ${maxStreak} dias de corrida seguidos sem descanso entre eles — isso aumenta risco de lesão. Considera intercalar com descanso ou musculação.` : null;
}
// Corrida do modo híbrido: gera 1 semana simples (sem periodização multi-semana), com km reduzido e
// no máximo 1 sessão de qualidade — reaproveita o VDOT/paces já calculados, sem mexer no gerador
// solo (que tem taper/progressão multi-semana e não devia ser usado com volume alterado).
// kmFactor: 1 = sem desconto (equivale ao solo); HYBRID_CONFIG.corridaKmFactor = desconto padrão de
// interferência; qualquer valor entre os dois = ponto intermediário de uma progressão multi-semana.
function buildHybridCorridaWeek(nivel, goal, currentLongKm, corridaDays, longaoDay, kmFactor, temLesao){
  if(!corridaDays.length) return [];
  const cv = state.corridaVdotData;
  const paces = cv.paces;
  const [minKm, maxKm] = VDOT_WEEKLY_KM_RANGE[nivel][goal] || VDOT_WEEKLY_KM_RANGE[nivel][10];
  // Com lesão/dor relatada, reduz o volume semanal ~15% por precaução — não substitui avaliação
  // profissional, só evita empurrar o mesmo volume de sempre em cima de uma queixa ativa.
  const weeklyKm = ((minKm+maxKm)/2) * kmFactor * (temLesao ? 0.85 : 1);
  const longMax = (VDOT_LONG_RUN_MAX_KM[nivel][goal] || VDOT_LONG_RUN_MAX_KM[nivel][10]) * kmFactor;
  const longKm = Math.min(longMax, Math.max(parseFloat(currentLongKm)||longMax*0.6, weeklyKm*VDOT_LONG_RUN_PCT));
  const n = corridaDays.length;
  const allowQuality = nivel!=='iniciante' && n>=2 && HYBRID_CONFIG.maxQualitySessions>0;
  // A sessão de qualidade tem duração fixa (~20min contínuos em T) — nunca deriva do "resto da
  // semana", senão ela vira gigante quando sobram poucos dias de corrida (bug real que apareceu no teste).
  const qualityKm = allowQuality ? roundToHalf(kmFromMinAtPace(20, paces.T)) : 0;
  const easyDaysCount = Math.max(0, n - 1 - (allowQuality?1:0));
  const remainingKm = Math.max(0, weeklyKm - longKm - qualityKm);
  const easyCeil = VDOT_EASY_CEIL_KM[nivel];
  const easyKmEach = easyDaysCount>0 ? roundToHalf(Math.min(easyCeil, Math.max(3, remainingKm/easyDaysCount))) : 0;
  const longKmRounded = roundToHalf(longKm);
  const easyPaceStr = `${daysToPaceStr(paces.Es)}–${daysToPaceStr(paces.Ef)}`;
  // Sessão de qualidade cai no primeiro dia de corrida (em ordem cronológica) que não é o longão.
  const qualityDay = allowQuality ? corridaDays.find(d=>d!==longaoDay) : null;
  return corridaDays.map(day=>{
    if(day===longaoDay){
      return { day, type:'Longão', mainDesc:`${fmtKm(longKmRounded)} contínuo`, mainPace:easyPaceStr+'/km', totalKm:longKmRounded, cor:'var(--green)', objetivo:VDOT_OBJETIVO['Longão'], modo:'hibrido' };
    }
    if(day===qualityDay){
      return { day, type:'Limiar', mainDesc:'20min ritmo forte contínuo', mainPace:paceRangeWithMargin(paces.T,3)+'/km', totalKm:qualityKm, cor:'var(--amber)', objetivo:VDOT_OBJETIVO['Limiar'], modo:'hibrido' };
    }
    return { day, type:'Rodagem Leve', mainDesc:`${fmtKm(easyKmEach)} fácil`, mainPace:easyPaceStr+'/km', totalKm:easyKmEach, cor:'var(--blue)', objetivo:VDOT_OBJETIVO['Fácil'], modo:'hibrido' };
  });
}
// Musculação do modo híbrido (só ele — o gerador solo, buildPlan, segue igual): cada dia tem SEMPRE o
// esqueleto BASE (multiarticular principal, força) → AUXILIAR (composto complementar, volume) → ISOLADO
// (monoarticular, refino), com exercícios limitados pelo TIER do nível: iniciante só Tier 1 (máquinas/
// guiados), intermediário Tier 1-2, Tier 3 (unilaterais/instáveis/complexos) exclusivo de avançado.
// seriesFactor: 1 = sem desconto de séries; HYBRID_CONFIG.muscVolumeFactor = desconto padrão; qualquer
// valor entre os dois = ponto intermediário de uma progressão multi-semana.
// Filtro de segurança simples por palavra-chave — não é avaliação clínica, só evita sugerir os
// exercícios classicamente contraindicados pra queixa relatada. Sempre some com um aviso na tela.
// Termos já sem acento (comparados contra o nome do exercício também sem acento) — evita bug de
// comparação onde um lado tem acento normalizado/removido e o outro não.
const LESAO_EXERCICIO_EVITAR = {
  joelho: ['extensora', 'extensao', 'afundo', 'avanco', 'agachamento livre'],
  ombro: ['desenvolvimento', 'elevacao lateral', 'elevacao frontal', 'atras da nuca'],
  lombar: ['terra', 'stiff', 'bom dia', 'remada curvada'],
  costas: ['terra', 'stiff', 'bom dia', 'remada curvada'],
  punho: ['flexao de punho', 'rosca punho'],
  tornozelo: ['panturrilha em pe', 'salto'],
};
function lesaoKeywordsFrom(lesaoText){
  const norm = (lesaoText||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  return Object.keys(LESAO_EXERCICIO_EVITAR).filter(k=>norm.includes(k));
}
// Tier pelo nome (e, se o nome não diz nada, pelo nível que o exercício já tinha no POOL):
// 3 = unilateral/instável/complexo; 2 = pesos livres e Smith; 1 = máquina/guiado.
function exercicioTier(e){
  const n = normalizeNoAccents(e.nome);
  if(/bulgaro|afundo|passada|step up|terra|crossover|unilateral|arqueiro|salto|bom dia|good morning/.test(n)) return 3;
  if(/smith/.test(n)) return 2;
  if(/leg press|extensora|flexora|adutora|abdutora|panturrilha|peck deck|voador|pulley|puxada|pulldown|na maquina|hack|hiperextensao|remada baixa/.test(n)) return 1;
  if(/barra|halter|cabo|corda/.test(n)) return 2;
  return { iniciante:1, intermediario:2, avancado:3 }[e.nivel] || 2;
}
const HYBRID_PAPEL_SCHEME = {
  base:     { iniciante:{series:3,reps:10,rpe:7,descanso:'90s'},    intermediario:{series:4,reps:8,rpe:8,descanso:'90–120s'},  avancado:{series:5,reps:5,rpe:9,descanso:'120–180s'} },
  auxiliar: { iniciante:{series:3,reps:12,rpe:7,descanso:'60–90s'}, intermediario:{series:3,reps:10,rpe:7,descanso:'60–90s'}, avancado:{series:4,reps:10,rpe:8,descanso:'90s'} },
  isolado:  { iniciante:{series:2,reps:15,rpe:6,descanso:'45–60s'}, intermediario:{series:3,reps:12,rpe:7,descanso:'45–60s'}, avancado:{series:3,reps:15,rpe:7,descanso:'45–60s'} },
};
// Monta o dia inteiro: escolhe BASE, AUXILIAR e ISOLADO a partir dos grupos que o split deu pra esse dia.
function buildHybridMuscDay(nivel, equip, spec, dayIdx, used, isSafe){
  const pool = POOL[equip] || POOL.academia;
  const allowed = nivel==='iniciante' ? [1] : nivel==='intermediario' ? [1,2] : [1,2,3];
  const cands = (g, tiers)=> (pool[g]||[]).filter(e=>tiers.includes(exercicioTier(e)) && isSafe(e.nome));
  // Iniciante sem nenhum Tier 1 no grupo (ex: treino em casa) cai pro Tier 2 — nunca pro Tier 3.
  const candsGrupo = (g)=>{ let c = cands(g, allowed); if(!c.length && nivel==='iniciante') c = cands(g, [1,2]); return c; };
  let groups = Object.keys(spec);
  if(groups.length >= 5){
    const grandes = ['Pernas','Peito','Costas'].filter(g=>groups.includes(g));
    const rot = grandes.length ? dayIdx % grandes.length : 0;
    groups = grandes.slice(rot).concat(grandes.slice(0,rot)).concat(groups.filter(g=>!grandes.includes(g)));
  }else{
    groups.sort((a,b)=>spec[b]-spec[a]);
  }
  const taken = new Set();
  const pick = (g, composto, preferTier, evitarPadroes)=>{
    let list = candsGrupo(g).filter(e=>!taken.has(e.nome) && (composto===null || (composto ? isExercicioComposto(e.nome)!==false : isExercicioComposto(e.nome)===false)));
    if(evitarPadroes) list = list.filter(e=>!evitarPadroes.has(padraoMovimento(e.nome)));
    if(preferTier){ const t = list.filter(e=>exercicioTier(e)===preferTier); if(t.length) list = t; }
    if(!list.length) return null;
    const e = list[(used[g]||0) % list.length];
    used[g] = (used[g]||0)+1;
    taken.add(e.nome);
    return e;
  };
  const out = [];
  let baseGrupo = null, baseEx = null;
  for(const g of groups){ const e = pick(g, true, 2, null); if(e){ out.push({ e, papel:'base', grupo:g }); baseGrupo = g; baseEx = e; break; } }
  // O auxiliar complementa o base em OUTRO padrão de movimento (não repete barra fixa + barra fixa supinada,
  // agachamento + agachamento frontal...); só repete o padrão se não sobrar nenhuma alternativa. Avançado
  // prefere Tier 3 aqui (unilateral/complexo), que é onde esse tier faz sentido.
  const ordemAux = groups.slice(1).concat(groups.slice(0,1));
  const evitar = new Set(baseEx ? [padraoMovimento(baseEx.nome)] : []);
  const tierAux = nivel==='avancado' ? 3 : 0;
  let aux = null, auxGrupo = null;
  for(const g of ordemAux){ aux = pick(g, true, tierAux, evitar); if(aux){ auxGrupo = g; break; } }
  if(!aux){ for(const g of ordemAux){ aux = pick(g, true, tierAux, null); if(aux){ auxGrupo = g; break; } } }
  if(aux) out.push({ e:aux, papel:'auxiliar', grupo:auxGrupo });
  const isoOrder = groups.filter(g=>g!==baseGrupo).concat(baseGrupo ? [baseGrupo] : []);
  for(const g of isoOrder){ const e = pick(g, false, 0, null); if(e){ out.push({ e, papel:'isolado', grupo:g }); break; } }
  if(!out.length){ for(const g of groups){ const e = pick(g, null, 0, null); if(e){ out.push({ e, papel:'base', grupo:g }); break; } } }
  return out;
}
// Agrupa variações do mesmo movimento (barra fixa / barra fixa supinada / puxada = "puxada vertical") pra
// o auxiliar não virar só uma cópia do base.
function padraoMovimento(nome){
  const n = normalizeNoAccents(nome);
  const mapa = [['agachamento','agachamento'],['hack','agachamento'],['leg press','leg press'],['afundo','unilateral perna'],['passada','unilateral perna'],['step up','unilateral perna'],['terra','dobradica'],['stiff','dobradica'],['bom dia','dobradica'],['elevacao de quadril','quadril'],['ponte','quadril'],['supino','supino'],['flexao','flexao'],['mergulho','mergulho'],['desenvolvimento','desenvolvimento'],['arnold','desenvolvimento'],['remada','remada'],['puxada','puxada vertical'],['pulldown','puxada vertical'],['barra fixa','puxada vertical'],['crossover','crucifixo'],['crucifixo','crucifixo'],['peck deck','crucifixo'],['voador','crucifixo']];
  const hit = mapa.find(([k])=>n.includes(k));
  return hit ? hit[1] : n;
}
function buildHybridMuscPlan(nivel, muscDays, equip, seriesFactor, lesaoText, tempoMaxMin){
  const keywords = lesaoKeywordsFrom(lesaoText);
  const isSafe = (nome)=>{
    if(!keywords.length) return true;
    const n = nome.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
    return !keywords.some(k => LESAO_EXERCICIO_EVITAR[k].some(term => n.includes(term)));
  };
  const templates = splitTemplate(nivel, muscDays.length);
  const used = {};
  const basePlan = {};
  muscDays.forEach((day, i)=>{
    const spec = templates[i] || templates[templates.length-1];
    basePlan[day] = buildHybridMuscDay(nivel, equip, spec, i, used, isSafe).map(({e, papel, grupo})=>{
      const sch = HYBRID_PAPEL_SCHEME[papel][nivel] || HYBRID_PAPEL_SCHEME[papel].intermediario;
      const series = Math.max(2, Math.round(sch.series * seriesFactor));
      return { nome:e.nome, series:String(series), reps:String(sch.reps), carga:'', grupo, repdbId:e.id, descanso:sch.descanso, modo:'hibrido', papel, tier:exercicioTier(e), rpe:sch.rpe };
    });
  });
  // Corta pelo tempo máximo de sessão — tira do fim da lista (isolado por último) até caber.
  if(tempoMaxMin){
    Object.keys(basePlan).forEach(day=>{
      let list = basePlan[day];
      while(list.length>1 && estimateWorkoutMinutes(list) > tempoMaxMin){ list = list.slice(0, -1); }
      basePlan[day] = list;
    });
  }
  return basePlan;
}
// Progressão multi-semana do Híbrido: bloco de 4 semanas que se repete. Semana 1 e 3 do bloco, a
// corrida sobe (em direção ao teto do VDOT solo); semana 2, a musculação sobe (em direção à série
// cheia do nível); semana 4 é descarga (os dois recuam ~25% em vez de segurar). Nunca sobe as duas
// modalidades na mesma semana — é exatamente a regra que a pessoa pediu.
// checkins: { [weekNumber]: 'facil'|'bom'|'dificil' } — resposta do check-in de cada semana já vivida.
// A resposta da semana W só afeta a semana W+1 em diante (não reescreve o passado): "difícil demais"
// segura a subida daquela modalidade na semana seguinte em vez de avançar; "fácil demais" 2 semanas
// seguidas acelera a subida; "bom" (ou sem check-in) segue a progressão normal.
// checkinDetails (fase 4, opcional): { [semana]: { severeReduce:bool, ... } } — quando o check-in rico
// aponta fadiga alta ou dor, aplica um corte extra de ~20% SÓ naquela semana (não acumula pra frente),
// além do "segura a progressão" que o check-in simples ('dificil') já fazia.
function buildHybridProgressionFactors(totalWeeks, checkins, checkinDetails){
  checkins = checkins || {};
  checkinDetails = checkinDetails || {};
  const corridaFactors = [], muscFactors = [];
  let corridaF = HYBRID_CONFIG.corridaKmFactor;
  let muscF = HYBRID_CONFIG.muscVolumeFactor;
  const corridaStep = (1 - HYBRID_CONFIG.corridaKmFactor) / Math.max(1, Math.ceil(totalWeeks/2));
  const muscStep = (1 - HYBRID_CONFIG.muscVolumeFactor) / Math.max(1, Math.ceil(totalWeeks/4));
  let facilStreak = 0;
  for(let w=1; w<=totalWeeks; w++){
    const pos = ((w-1) % 4) + 1;
    const prevCheckin = checkins[w-1] || null;
    facilStreak = prevCheckin==='facil' ? facilStreak+1 : 0;
    const boost = facilStreak>=2 ? 1.5 : 1;
    const hold = prevCheckin==='dificil';
    if(pos===4){
      corridaF = Math.max(HYBRID_CONFIG.corridaKmFactor, corridaF*0.75);
      muscF = Math.max(HYBRID_CONFIG.muscVolumeFactor, muscF*0.75);
    }else if(pos===1 || pos===3){
      if(!hold) corridaF = Math.min(1, corridaF + corridaStep*boost);
    }else{
      if(!hold) muscF = Math.min(1, muscF + muscStep*boost);
    }
    const prevDetail = checkinDetails[w-1];
    const extraCut = (prevDetail && prevDetail.severeReduce) ? 0.8 : 1;
    corridaFactors.push(Math.round(corridaF*extraCut*100)/100);
    muscFactors.push(Math.round(muscF*extraCut*100)/100);
  }
  return { corridaFactors, muscFactors };
}
// Gera o plano híbrido inteiro (todas as semanas de uma vez, como o VDOT solo já faz) — o dia de cada
// modalidade e o dia do longão são fixos no plano inteiro (são escolha estrutural da pessoa), só o
// volume/série de cada semana muda conforme a progressão (e conforme os check-ins semanais já dados).
function buildAllHybridWeeks(draft, sched, totalWeeks, checkins, checkinDetails){
  const { corridaFactors, muscFactors } = buildHybridProgressionFactors(totalWeeks, checkins, checkinDetails);
  const weeks = [];
  for(let w=1; w<=totalWeeks; w++){
    const pos = ((w-1) % 4) + 1;
    const phaseLabel = pos===4 ? 'Descarga' : pos===2 ? 'Semana da musculação' : 'Semana da corrida';
    const corridaKmFactor = sched.muscDays.length>0 ? corridaFactors[w-1] : 1;
    const muscSeriesFactor = sched.corridaDays.length>0 ? muscFactors[w-1] : 1;
    const corridaWeek = sched.corridaDays.length ? buildHybridCorridaWeek(draft.nivelCorrida||draft.nivel, draft.corridaGoal, draft.corridaCurrentLong, sched.corridaDays, sched.longaoDay, corridaKmFactor, !!draft.lesao) : [];
    const muscPlan = sched.muscDays.length ? buildHybridMuscPlan(draft.nivelMusc||draft.nivel, sched.muscDays, draft.equip, muscSeriesFactor, draft.lesao, draft.tempoMaxMin) : {};
    const legEasingNotes = applyHybridLegDayEasing(corridaWeek, muscPlan);
    annotateHybridJustifications(corridaWeek, muscPlan, focoFromObjetivo(draft.objetivo));
    weeks.push({ weekNumber:w, phaseLabel, totalWeeks, corridaWeek, muscPlan, legEasingNotes });
  }
  return weeks;
}
// Materializa uma semana do plano híbrido em state.treinos/state.musculacao — mesmo padrão que
// materializeVdotWeekIntoTreinos usa pro plano solo, só que cobre as duas coleções de uma vez.
function materializeHybridWeekIntoState(week, startMondayISO){
  const start = new Date(startMondayISO+'T00:00:00');
  const monday = new Date(start);
  monday.setDate(monday.getDate() + (week.weekNumber-1)*7);
  const activeCorridaDays = week.corridaWeek.map(w=>w.day);
  state.treinos = state.treinos.filter(t => !activeCorridaDays.includes(dayAbbrevOf(t.day)));
  week.corridaWeek.forEach(w=>{
    const idx = DAY_ABBR.indexOf(w.day);
    const dNew = new Date(monday);
    dNew.setDate(dNew.getDate()+idx);
    state.treinos.push({ day: w.day+' '+vdotFormatDDMM(dNew), type:w.type, mainDesc:w.mainDesc, mainPace:w.mainPace,
      totalKm:w.totalKm, cor:w.cor, objetivo:w.objetivo, modo:w.modo, justificativa:w.justificativa, warmupDesc:'', warmupPace:'', cooldownDesc:'', cooldownPace:'', steps:null });
  });
  Object.keys(week.muscPlan).forEach(d=>{
    state.musculacao[d] = week.muscPlan[d].map(e => ({ id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), done:false, ...e }));
    state.muscDayOrigin[d] = null;
  });
  state.isDemo = false;
  saveTreinos();
  saveMusc();
  saveMuscDayOrigin();
}
// Regra 1 da cascata híbrida: em vez de proibir longão e perna pesada no mesmo dia, reduz
// pernas pra manutenção (carga leve) nesse dia — só ocorre quando "separado" deixa os dois
// caírem no mesmo dia (em "alternado" os dias nunca coincidem, então isso não faz nada).
const CORRIDA_TIPOS_PESADOS = ['Longão','Intervalado','Repetição'];
function applyHybridLegDayEasing(corridaWeek, muscPlan){
  const notes = [];
  corridaWeek.filter(w=>CORRIDA_TIPOS_PESADOS.includes(w.type)).forEach(w=>{
    const dayPlan = muscPlan[w.day];
    if(!dayPlan || !dayPlan.length) return;
    const pernas = dayPlan.filter(e=>e.grupo==='Pernas');
    if(!pernas.length) return;
    pernas.forEach(e=>{ e.series = '2'; e.manutencao = true; e.rpe = Math.min(e.rpe||6, 6); });
    w.pernasEmManutencao = true;
    notes.push(`${w.day} tem ${w.type.toLowerCase()} essa semana — pernas ficou em modo manutenção (2 séries, esforço leve) em vez de empilhar dois treinos pesados de perna no mesmo dia.`);
  });
  return notes;
}
/* ---------- Dor nas pernas (DOMS) do dia ---------- */
// Nota ≥ 7 → só HOJE: a corrida vira regenerativa (E) e as séries de perna caem 25%. A musculação é
// guardada por dia da semana (recorrente), então o corte é desfeito sozinho assim que a data muda;
// a corrida é datada, então a troca fica só naquele dia e a original é restaurada se a nota baixar.
async function saveDomsPernas(){ try{ await window.storage.set('domsPernas', JSON.stringify(state.domsPernas||{}), false); }catch(e){} }
function restaurarDomsAntigos(){
  const hoje = todayISO(); let mudou = false;
  DAY_ABBR.forEach(d=>(state.musculacao[d]||[]).forEach(ex=>{
    if(ex._seriesOriginal!=null && ex._domsData!==hoje){ ex.series = ex._seriesOriginal; delete ex._seriesOriginal; delete ex._domsData; mudou = true; }
  }));
  if(mudou) saveMusc();
}
function aplicarDomsDeHoje(nota){
  const hoje = todayISO();
  const day = DAY_ABBR[(new Date().getDay()+6)%7];
  const alta = nota!=null && nota>=7;
  restaurarDomsAntigos();
  (state.musculacao[day]||[]).forEach(ex=>{
    if(ex.grupo!=='Pernas') return;
    if(alta && ex._seriesOriginal==null){
      ex._seriesOriginal = ex.series; ex._domsData = hoje;
      ex.series = String(Math.max(1, Math.round((parseInt(ex.series,10)||1)*0.75)));
    }else if(!alta && ex._seriesOriginal!=null){
      ex.series = ex._seriesOriginal; delete ex._seriesOriginal; delete ex._domsData;
    }
  });
  saveMusc();
  const entry = state.treinos.find(t=>dayAbbrevOf(t.day)===day && t.day.includes(vdotFormatDDMM(new Date())));
  if(entry){
    if(alta && !entry._domsOriginal){
      const paces = state.corridaVdotData && state.corridaVdotData.paces;
      const nivel = (state.hybridPlanData && state.hybridPlanData.draft && state.hybridPlanData.draft.nivelCorrida) || 'intermediario';
      const teto = (VDOT_EASY_CEIL_KM[nivel] || 8) * 0.5;
      const km = Math.max(2, roundToHalf(Math.min(entry.totalKm || teto, teto)));
      const paceStr = paces ? `${daysToPaceStr(paces.Es)}–${daysToPaceStr(paces.Ef)}/km` : (entry.mainPace || '');
      entry._domsOriginal = JSON.parse(JSON.stringify(entry));
      entry.type = 'Corrida Regenerativa';
      entry.mainDesc = `${fmtKm(km)} fácil`;
      entry.mainPace = paceStr;
      entry.totalKm = km;
      entry.totalMin = paces ? Math.round(minFromKmAtPace(km, paces.Es)) : undefined;
      entry.steps = [{ name:'Corrida fácil', km, pace:paceStr, tipo:'distancia' }];
      entry.objetivo = VDOT_OBJETIVO['Fácil'];
      entry.justificativa = `Dor nas pernas ${nota}/10: corrida trocada por regenerativo (E) só hoje.`;
    }else if(!alta && entry._domsOriginal){
      const original = entry._domsOriginal;
      Object.keys(entry).forEach(k=>delete entry[k]);
      Object.assign(entry, original);
    }
    saveTreinos();
  }
}
function setDomsPernas(nota){
  const hoje = todayISO();
  state.domsPernas = state.domsPernas || {};
  if(state.domsPernas[hoje]===nota) delete state.domsPernas[hoje]; else state.domsPernas[hoje] = nota;
  saveDomsPernas();
  aplicarDomsDeHoje(state.domsPernas[hoje]);
  render();
}
// Frase do dia mostrada no card: a dor nas pernas de hoje (se ≥ 7) tem prioridade sobre a justificativa do plano.
function justificativaDoDia(day, sub){
  const ehHoje = state.weekOffset===0 && day===DAY_ABBR[(new Date().getDay()+6)%7];
  const nota = ehHoje ? (state.domsPernas||{})[todayISO()] : null;
  if(nota!=null && nota>=7){
    if(sub==='corrida') return `Dor nas pernas ${nota}/10: corrida trocada por regenerativo (E) só hoje.`;
    if(muscListForDay(day).some(e=>e.grupo==='Pernas')) return `Dor nas pernas ${nota}/10: séries de perna −25% só hoje.`;
  }
  if(sub==='corrida'){ const e = treinoEntryForDay(day); return (e && e.justificativa) || ''; }
  const l = muscListForDay(day);
  return (l.length && l[0].justificativa) || '';
}
function zonaVdotDoTipo(tipo){
  const t = String(tipo||'').toLowerCase();
  if(/interval/.test(t)) return 'I';
  if(/repeti/.test(t)) return 'R';
  if(/limiar|tempo/.test(t)) return 'T';
  if(/prova/.test(t)) return 'M';
  return 'E';
}
const JUSTIFICATIVA_CORRIDA = {
  'Longão': 'Longão em ritmo fácil (E) constrói resistência e economia de corrida sem estresse extra — por isso não tem perna pesada no mesmo dia.',
  'Limiar': 'Limiar (T) empurra o ponto em que o lactato acumula; é a única sessão de qualidade da semana pra não competir com a recuperação da musculação.',
  'Rodagem Leve': 'Corrida fácil (E) reforça a base aeróbica e recupera ativamente entre os estímulos de força, sem somar fadiga.',
};
// Uma frase por dia explicando por que o treino encaixa daquele jeito — regra fixa em cima do que a
// geração de fato fez (não é texto solto): dia misto, perna em manutenção, corrida sozinha ou só musculação.
function annotateHybridJustifications(corridaWeek, muscPlan, foco){
  const dias = new Set([...corridaWeek.map(w=>w.day), ...Object.keys(muscPlan)]);
  dias.forEach(day=>{
    const run = corridaWeek.find(w=>w.day===day);
    const list = muscPlan[day];
    const temMusc = !!(list && list.length);
    let frase;
    if(run && temMusc){
      if(run.pernasEmManutencao){
        frase = `Dia de ${run.type.toLowerCase()} e musculação: pernas em manutenção (2 séries, esforço leve) pra não somar dois estímulos pesados de perna no mesmo dia.`;
      }else{
        const isQuality = run.type==='Limiar';
        const corridaFirst = foco==='corrida' || (foco==='equilibrado' && isQuality);
        frase = `Corrida e musculação no mesmo dia: ${corridaFirst ? 'corrida primeiro' : 'musculação primeiro'} (a prioridade do seu objetivo, com o corpo fresco), com ${isQuality ? '1–2h' : 'pelo menos 6h'} de intervalo pra a segunda não sair prejudicada.`;
      }
    }else if(run){
      frase = JUSTIFICATIVA_CORRIDA[run.type] || JUSTIFICATIVA_CORRIDA['Rodagem Leve'];
    }else if(temMusc){
      const base = list.find(e=>e.papel==='base') || list[0];
      frase = `${base.grupo} começa pelo multiarticular com o corpo fresco (força), completa o volume no auxiliar e fecha no isolado — máximo estímulo com o menor custo de recuperação pras corridas da semana.`;
    }

// Fase 4 (parcial): quando corrida e musc caem no mesmo dia, sugere ordem (prioridade primeiro,
// com o corpo fresco) e intervalo mínimo — baseado no artigo do Alex Viada (Stronger by Science):
// cardio longo/leve logo após musculação é pior (hormônios catabólicos), tiro curto/intenso tolera bem.
function buildHybridSameDayNotes(corridaWeek, muscPlan, foco){
  const notes = [];
  corridaWeek.forEach(w=>{
    const dayPlan = muscPlan[w.day];
    if(!dayPlan || !dayPlan.length) return;
    const isQuality = w.type === 'Limiar';
    const corridaFirst = foco==='corrida' || (foco==='equilibrado' && isQuality);
    const ordem = corridaFirst ? 'corrida antes da musculação' : 'musculação antes da corrida';
    const intervalo = isQuality ? 'pelo menos 1-2h de intervalo' : 'pelo menos 6h de intervalo';
    const motivo = isQuality
      ? 'treino de qualidade curto tolera ficar perto da musculação'
      : 'evite fazer essa corrida logo em seguida da musculação';
    notes.push(`${w.day}: corrida (${w.type}) e musculação no mesmo dia. Sugestão: ${ordem}, com ${intervalo} — ${motivo}.`);
  });

/* ---------- VDOT (Jack Daniels) plan generator ---------- */
function daysToPaceStr(days){ return formatPace(days*86400); }
function formatClock(totalSec){
  totalSec = Math.round(totalSec);
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
  return h>0 ? (h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')) : (m+':'+String(s).padStart(2,'0'));
}
function paceRangeWithMargin(days, marginSec){
  const baseSec = days*86400;
  return formatPace(baseSec)+' ~ '+formatPace(baseSec+marginSec);
}
const VDOT_TEST_COEF = {
  '1600': {a:0.129789983350069, b:0.887869998635982},
  '3000': {a:0.244695486277067, b:0.874272474653074},
  '5000': {a:0.389068343445441, b:0.853126398932773},
  '10000':{a:0.805659018769989, b:0.852425654240328},
};
function parseClockInput(str){
  const parts = String(str||'').trim().split(':').map(Number);
  if(parts.length<2 || parts.some(isNaN)) return null;
  if(parts.length===2) return parts[0]*60+parts[1];
  return parts[0]*3600+parts[1]*60+parts[2];
}
function vdotFromTest(distKey, timeSec){
  const {a,b} = VDOT_TEST_COEF[distKey];
  return Math.pow(a/(timeSec/86400), 1/b);
}
function computeVdotPaces(vdot){
  return {
    Es: 0.085520318486574 * Math.pow(vdot, -0.792315390174534),
    Ef: 0.084518313927415 * Math.pow(vdot, -0.819514952571011),
    M:  0.091387357177027 * Math.pow(vdot, -0.861123091751905),
    T:  0.06970165201477  * Math.pow(vdot, -0.808171304753095),
    I:  0.064668134797248 * Math.pow(vdot, -0.809903017017922),
    R:  2.5*0.027831623318271 * Math.pow(vdot, -0.849631537082224),
  };
}
function predictRaceTimeSec(vdot, distanceKm){
  const direct = {
    5: {a:0.389068343445441,b:0.853126398932773},
    10:{a:0.805659018769989,b:0.852425654240328},
    42.195:{a:3.49469956615132,b:0.837443821910625},
  };
  if(direct[distanceKm]){
    const {a,b}=direct[distanceKm];
    return a*Math.pow(vdot,-b)*86400;
  }
  const T08 = 0.056331814720638*Math.pow(vdot,-0.867275092353156);
  const dm = distanceKm*1000;
  const lnV = Math.log(vdot);
  const phi = (0.119087247839977*lnV + 0.229667205274457)*Math.log(Math.log(dm)) - (0.248452654018515*lnV - 0.647790153119859);
  return phi*(distanceKm/0.8)*T08*86400;
}

const VDOT_GOAL_NAME = { 5:'5km', 10:'10km', '21.0975':'21km (meia maratona)', '42.195':'42km (maratona)' };

const VDOT_QUALITY_BY_LEVEL = { iniciante:0, intermediario:1, avancado:2 };
const VDOT_I_VARIANTS = [

const VDOT_OBJETIVO = {

function minFromKmAtPace(km, paceDaysPerKm){ return (km*paceDaysPerKm*86400) / 60; }

// Longão máximo por prova-alvo e nível (km) — teto que a rampa de progressão nunca ultrapassa.
const VDOT_LONG_RUN_MAX_KM = {
  iniciante:    { 5:8,  10:10, '21.0975':14, '42.195':30 },
  intermediario:{ 5:12, 10:14, '21.0975':18, '42.195':32 },

};

// mínima antes de começar, então o início do longão depende também da distância da meta, não só do nível.
const VDOT_LONG_RUN_START_KM = {
  iniciante:    { 5:3, 10:4, '21.0975':6.5, '42.195':10 },

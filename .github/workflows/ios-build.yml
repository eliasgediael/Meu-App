name: Build iOS (.ipa sem assinatura)

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências do projeto
        run: npm ci

      - name: Garantir dependência nativa do iOS
        run: npm install @capacitor/ios

      - name: Build web (copia o app pra www/)
        run: npm run build

      - name: Adicionar plataforma iOS e gerar Podfile
        run: |
          rm -rf ios
          npx cap add ios

      - name: Instalar Pods do CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Compilar (sem assinatura)
        run: |
          cd ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=ios" \
            CODE_SIGNING_ALLOWED=NO

      - name: Montar o .ipa
        run: |
          APP_PATH="ios/App/build/Build/Products/Release-iphoneos/App.app"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r MeuRitmo.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MeuRitmo-ipa
          path: MeuRitmo.ipa
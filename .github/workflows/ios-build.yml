name: Build iOS (.ipa sem assinatura)

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências do projeto
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Recriar plataforma iOS
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Verificar Info.plist original
        run: |
          echo "===== INFO.PLIST ORIGINAL ====="
          head -30 ios/App/App/Info.plist

          echo "===== VALIDANDO ORIGINAL ====="
          plutil -lint ios/App/App/Info.plist

      # A pasta ios/ é recriada a cada build: nome e ícone precisam ser reaplicados aqui.
      - name: Nome e ícone do app (Forza Run)
        run: |
          PLIST="ios/App/App/Info.plist"
          PB=/usr/libexec/PlistBuddy
          "$PB" -c "Set :CFBundleDisplayName Forza Run" "$PLIST" || "$PB" -c "Add :CFBundleDisplayName string Forza Run" "$PLIST"
          # Número de build único por execução: o iOS/AltStore reconhece o IPA novo como atualização
          # e dá para conferir no aparelho qual execução está instalada (Ajustes > Geral > Armazenamento).
          "$PB" -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "$PLIST"
          if [ -f brand/icone-1024.png ]; then
            cp brand/icone-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          fi

      - name: Permissões de localização e segundo plano
        run: |
          PLIST="ios/App/App/Info.plist"
          PB=/usr/libexec/PlistBuddy

          "$PB" -c "Add :NSLocationWhenInUseUsageDescription string O Forza Run usa sua localização para medir distância, ritmo e traçar o percurso da sua corrida." "$PLIST"

          "$PB" -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string O Forza Run precisa da sua localização mesmo com a tela bloqueada para continuar registrando a corrida em segundo plano." "$PLIST"

          "$PB" -c "Add :NSLocationAlwaysUsageDescription string O Forza Run precisa da sua localização mesmo com a tela bloqueada para continuar registrando a corrida em segundo plano." "$PLIST"

          "$PB" -c "Add :NSPhotoLibraryAddUsageDescription string O Forza Run salva nas suas Fotos a arte do treino que você escolher compartilhar." "$PLIST"

          # Câmera e fotos: sem estas chaves o iOS encerra o app quando o seletor de foto abre a câmera.
          "$PB" -c "Add :NSCameraUsageDescription string O Forza Run usa a câmera para você tirar a foto da atividade e da arte de compartilhamento." "$PLIST"

          "$PB" -c "Add :NSPhotoLibraryUsageDescription string O Forza Run abre suas fotos para você escolher a imagem da atividade e da arte de compartilhamento." "$PLIST"

          "$PB" -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true

          "$PB" -c "Add :UIBackgroundModes array" "$PLIST"
          "$PB" -c "Add :UIBackgroundModes:0 string location" "$PLIST"
          "$PB" -c "Add :UIBackgroundModes:1 string audio" "$PLIST"

      # Relógio Garmin (plugins/relogio-garmin, Connect IQ Mobile SDK): o Garmin Connect devolve a lista de
      # relógios abrindo forzarun-ciq:// (precisa bater com urlScheme no plugin) e o SDK consulta gcm-ciq.
      - name: Relógio Garmin (Connect IQ)
        run: |
          PLIST="ios/App/App/Info.plist"
          PB=/usr/libexec/PlistBuddy
          "$PB" -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          "$PB" -c "Add :CFBundleURLTypes array" "$PLIST"
          "$PB" -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          "$PB" -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.meuritmo.app.relogio" "$PLIST"
          "$PB" -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          "$PB" -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string forzarun-ciq" "$PLIST"
          "$PB" -c "Delete :LSApplicationQueriesSchemes" "$PLIST" 2>/dev/null || true
          "$PB" -c "Add :LSApplicationQueriesSchemes array" "$PLIST"
          "$PB" -c "Add :LSApplicationQueriesSchemes:0 string gcm-ciq" "$PLIST"
          "$PB" -c "Add :NSBluetoothAlwaysUsageDescription string O Forza Run usa o Bluetooth para trocar treinos e corridas com o seu relógio Garmin." "$PLIST"
          "$PB" -c "Add :NSBluetoothPeripheralUsageDescription string O Forza Run usa o Bluetooth para trocar treinos e corridas com o seu relógio Garmin." "$PLIST"

      - name: Tema claro fixo (barra de status com texto escuro mesmo com o iPhone no modo escuro)
        run: |
          PLIST="ios/App/App/Info.plist"
          PB=/usr/libexec/PlistBuddy
          "$PB" -c "Delete :UIUserInterfaceStyle" "$PLIST" 2>/dev/null || true
          "$PB" -c "Add :UIUserInterfaceStyle string Light" "$PLIST"

      - name: Verificar Info.plist depois das alterações
        run: |
          echo "===== INFO.PLIST DEPOIS ====="
          head -40 ios/App/App/Info.plist

          echo "===== VALIDANDO ====="
          plutil -lint ios/App/App/Info.plist

          echo "===== CONTEÚDO ====="
          plutil -p ios/App/App/Info.plist

      - name: Resolver pacotes Swift
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj

      - name: Compilar sem assinatura
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -target App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            OTHER_LDFLAGS='$(inherited) -ObjC'             CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CONFIGURATION_BUILD_DIR="$(pwd)/build"

      - name: Montar o IPA
        run: |
          APP_PATH="build/App.app"

          rm -rf Payload
          mkdir -p Payload

          cp -r "$APP_PATH" Payload/

          echo "===== CONTEÚDO DO PAYLOAD ====="
          find Payload -maxdepth 2 -print

          zip -r MeuRitmo.ipa Payload

      - name: Verificar estrutura do IPA
        run: |
          echo "===== ESTRUTURA DO IPA ====="
          unzip -l MeuRitmo.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MeuRitmo-ipa
          path: MeuRitmo.ipa
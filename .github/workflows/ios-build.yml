name: Build iOS (.ipa sem assinatura)

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências do projeto
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Recriar plataforma iOS
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Verificar Info.plist original
        run: |
          echo "===== INFO.PLIST ORIGINAL ====="
          head -30 ios/App/App/Info.plist

          echo "===== VALIDANDO ORIGINAL ====="
          plutil -lint ios/App/App/Info.plist

      # A pasta ios/ é recriada a cada build: nome e ícone precisam ser reaplicados aqui.
      - name: Nome e ícone do app (Forza Run)
        run: |
          PLIST="ios/App/App/Info.plist"
          PB=/usr/libexec/PlistBuddy
          "$PB" -c "Set :CFBundleDisplayName Forza Run" "$PLIST" || "$PB" -c "Add :CFBundleDisplayName string Forza Run" "$PLIST"
          if [ -f brand/icone-1024.png ]; then
            cp brand/icone-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          fi

      - name: Permissões de localização e segundo plano
        run: |
          PLIST="ios/App/App/Info.plist"
          PB=/usr/libexec/PlistBuddy

          "$PB" -c "Add :NSLocationWhenInUseUsageDescription string O Forza Run usa sua localização para medir distância, ritmo e traçar o percurso da sua corrida." "$PLIST"

          "$PB" -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string O Forza Run precisa da sua localização mesmo com a tela bloqueada para continuar registrando a corrida em segundo plano." "$PLIST"

          "$PB" -c "Add :NSLocationAlwaysUsageDescription string O Forza Run precisa da sua localização mesmo com a tela bloqueada para continuar registrando a corrida em segundo plano." "$PLIST"

          "$PB" -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true

          "$PB" -c "Add :UIBackgroundModes array" "$PLIST"
          "$PB" -c "Add :UIBackgroundModes:0 string location" "$PLIST"
          "$PB" -c "Add :UIBackgroundModes:1 string audio" "$PLIST"

      - name: Tema claro fixo (barra de status com texto escuro mesmo com o iPhone no modo escuro)
        run: |
          PLIST="ios/App/App/Info.plist"
          PB=/usr/libexec/PlistBuddy
          "$PB" -c "Delete :UIUserInterfaceStyle" "$PLIST" 2>/dev/null || true
          "$PB" -c "Add :UIUserInterfaceStyle string Light" "$PLIST"

      - name: Verificar Info.plist depois das alterações
        run: |
          echo "===== INFO.PLIST DEPOIS ====="
          head -40 ios/App/App/Info.plist

          echo "===== VALIDANDO ====="
          plutil -lint ios/App/App/Info.plist

          echo "===== CONTEÚDO ====="
          plutil -p ios/App/App/Info.plist

      - name: Resolver pacotes Swift
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj

      - name: Compilar sem assinatura
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -target App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CONFIGURATION_BUILD_DIR="$(pwd)/build"

      - name: Montar o IPA
        run: |
          APP_PATH="build/App.app"

          rm -rf Payload
          mkdir -p Payload

          cp -r "$APP_PATH" Payload/

          echo "===== CONTEÚDO DO PAYLOAD ====="
          find Payload -maxdepth 2 -print

          zip -r MeuRitmo.ipa Payload

      - name: Verificar estrutura do IPA
        run: |
          echo "===== ESTRUTURA DO IPA ====="
          unzip -l MeuRitmo.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MeuRitmo-ipa
          path: MeuRitmo.ipa
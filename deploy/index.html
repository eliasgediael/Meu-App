<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Treino</title>
<link rel="icon" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Treino">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F6F8">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14161A">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#F5F6F8;
  --surface:#FFFFFF;
  --surface-2:#EDEFF3;
  --accent:#2D6CDF;
  --accent-soft:rgba(45,108,223,0.10);
  --blue:#2D6CDF;
  --blue-soft:rgba(45,108,223,0.10);
  --amber:#B7791F;
  --amber-soft:rgba(183,121,31,0.10);
  --text:#12151A;
  --text-dim:#6B7280;
  --border:#E3E6EB;
  --danger:#D5473A;
  --rep:#B23F82;
  --green:#1E9E6B;
  --green-soft:rgba(30,158,107,0.10);
}
/* Segue o modo claro/escuro do sistema automaticamente — mesma identidade (azul de destaque), só
   ajustada pro fundo escuro em vez de invertida ao contrário (branco->preto puro ficaria sem contraste). */
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14161A;
    --surface:#1C1F24;
    --surface-2:#262A30;
    --accent:#4F8DFF;
    --accent-soft:rgba(79,141,255,0.16);
    --blue:#4F8DFF;
    --blue-soft:rgba(79,141,255,0.16);
    --amber:#D9A44E;
    --amber-soft:rgba(217,164,78,0.16);
    --text:#F2F4F6;
    --text-dim:#9199A6;
    --border:#2E333A;
    --danger:#E86A5C;
    --rep:#D6699F;
    --green:#3FBE8A;
    --green-soft:rgba(63,190,138,0.16);
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100vh;
  display:flex; justify-content:center;
}
#app{ width:100%; max-width:440px; min-height:100vh; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); }

/* HEADER */
.header{ display:flex; justify-content:space-between; align-items:center; padding:20px 20px 4px; min-height:46px; }
.header-title{ font-size:22px; font-weight:800; letter-spacing:-0.3px; }
.header-sub{ font-size:12.5px; color:var(--text-dim); margin-top:2px; }
.icon-btn{
  width:38px; height:38px; border-radius:12px; background:var(--surface); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text); flex-shrink:0;
}
.icon-btn:hover{ border-color:var(--accent); }
.icon-btn svg{ width:18px; height:18px; }
.header-actions{ display:flex; gap:8px; }

/* DAY STRIP */
.day-strip{ display:flex; gap:6px; padding:16px 20px 6px; }
.day-pill{
  flex:1; text-align:center; padding:10px 2px 8px; border-radius:10px;
  background:var(--surface); border:1px solid var(--border); font-size:12.5px; font-weight:600; color:var(--text-dim); cursor:pointer;
}
.day-pill.active{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
.day-pill .day-date{ font-size:9px; font-weight:500; color:var(--text-dim); margin-top:2px; opacity:0.75; }
.day-pill.active .day-date{ color:var(--accent); opacity:0.85; }
.day-pill .dot{ width:4px; height:4px; border-radius:50%; background:var(--text-dim); margin:4px auto 0; box-sizing:border-box; }
.day-pill .dot.pending{ width:6px; height:6px; background:transparent; border:1.5px solid var(--text-dim); }
.day-pill .dot.done{ width:6px; height:6px; background:var(--accent); }
.day-pill.corrida-chip{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 2px 8px; }
.day-pill.corrida-chip .chip-label{ font-size:10.5px; font-weight:700; color:var(--text-dim); text-transform:uppercase; }
.day-pill.corrida-chip.active .chip-label{ color:var(--accent); }
.day-pill.corrida-chip .chip-dot{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; color:#fff; flex-shrink:0; }
.day-pill.corrida-chip .chip-dot.rest{ background:var(--surface-2); color:var(--text-dim); font-size:14px; }
.day-pill.corrida-chip .day-date{ margin-top:0; }
.day-pill.active .dot.pending{ border-color:var(--accent); }

.content{ flex:1; padding:14px 20px calc(84px + env(safe-area-inset-bottom)); }

/* GENERIC LEG/LIST CARDS */
.leg-card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:14px 16px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:10px;
}
.leg-left{ min-width:0; }
.leg-tag{ font-size:11px; color:var(--text-dim); font-weight:600; margin-bottom:3px; text-transform:uppercase; letter-spacing:0.3px; }
.leg-desc{ font-size:14.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.leg-pace{ font-size:15px; font-weight:700; color:var(--accent); white-space:nowrap; }

.phase-row{ background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--border); border-radius:10px; margin-bottom:9px; overflow:hidden; }
.phase-head{ display:grid; grid-template-columns:1fr 64px 15px; align-items:center; gap:10px; padding:11px 12px; cursor:pointer; }
.phase-head.summary-head{ grid-template-columns:1fr auto 21px auto 15px; }
.phase-check{ width:21px; height:21px; border-radius:50%; border:2.5px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer; color:#FFFFFF; }
.phase-check.done{ background:var(--accent); border-color:var(--accent); }
.phase-name{ font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.phase-name.done{ color:var(--text-dim); text-decoration:line-through; }
.phase-pace{ font-size:13px; font-weight:700; text-align:right; white-space:nowrap; }
.phase-chevron{ width:15px; height:15px; color:var(--text-dim); transition:transform .15s ease; justify-self:end; }
.phase-chevron.open{ transform:rotate(180deg); }
.phase-body{ padding:2px 14px 14px 14px; font-size:12.5px; color:var(--text-dim); line-height:1.5; }

/* CORRIDA WEEK CARDS */
.wk-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; margin-bottom:10px; overflow:hidden; }
.wk-head{ display:flex; align-items:center; gap:12px; padding:14px; cursor:pointer; }
.wk-bar{ width:4px; align-self:stretch; border-radius:3px; flex-shrink:0; }
.wk-body{ flex:1; min-width:0; }
.wk-tag{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.3px; margin-bottom:2px; }
.wk-title{ font-size:15px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.wk-title.done{ color:var(--text-dim); text-decoration:line-through; }
.wk-why{ font-size:12px; color:var(--text-dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.wk-km{ font-size:15px; font-weight:800; white-space:nowrap; color:var(--text); }

.ex-card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:13px 14px; margin-bottom:10px;
  display:flex; align-items:center; gap:12px;
}
.ex-check{ width:22px; height:22px; border-radius:50%; border:2.5px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer; color:#FFFFFF; flex-shrink:0; }
.ex-check.done{ background:var(--accent); border-color:var(--accent); }
.ex-name.done{ color:var(--text-dim); text-decoration:line-through; }
.ex-edit{ width:20px; height:20px; display:flex; align-items:center; justify-content:center; background:none; border:none; padding:0; color:var(--text-dim); cursor:pointer; flex-shrink:0; align-self:flex-start; margin-top:2px; }
.ex-edit:hover{ color:var(--accent); }
.ex-edit svg{ width:14px; height:14px; }

.ex-preview{ display:flex; justify-content:center; margin:2px 0 14px; }
.ex-preview img{ width:84px; height:84px; border-radius:12px; object-fit:cover; background:var(--surface-2); cursor:zoom-in; }

.ex-thumb{ width:46px; height:46px; border-radius:9px; object-fit:cover; background:var(--surface-2); cursor:zoom-in; flex-shrink:0; }
.zoom-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:40; display:flex; align-items:center; justify-content:center; padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom)); cursor:zoom-out; }
.zoom-overlay img{ max-width:100%; max-height:100%; border-radius:16px; }
.ex-thumb-empty{ background:var(--surface-2); }
.ex-left{ min-width:0; flex:1; }
.ex-group{ display:inline-block; font-size:10.5px; font-weight:700; color:var(--blue); background:var(--blue-soft); padding:2px 8px; border-radius:6px; margin-bottom:5px; }
.ex-name{ font-size:14.5px; font-weight:700; line-height:1.3; }
.ex-meta{ font-size:12px; color:var(--text-dim); margin-top:3px; }
.ex-right{ flex-shrink:0; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.ex-logbtn{ font-size:12.5px; font-weight:700; padding:6px 12px; border-radius:20px; border:none; cursor:pointer; font-family:inherit; white-space:nowrap; }
.ex-logbtn.empty{ background:var(--accent-soft); color:var(--accent); }
.ex-logbtn.filled{ background:var(--surface-2); color:var(--text); }

.hoje-summary{ font-size:12.5px; color:var(--text-dim); margin:0 0 14px; }
.hoje-card{ background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--border); border-radius:10px; margin-bottom:9px; overflow:hidden; }
.hoje-card-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; }
.hoje-card-label{ font-size:11px; color:var(--text-dim); font-weight:600; text-transform:uppercase; letter-spacing:0.3px; margin-bottom:2px; }
.hoje-card-label.done{ text-decoration:line-through; }
.hoje-card-main{ font-size:14.5px; font-weight:600; }

.act-card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:10px;
  display:grid; grid-template-columns:1fr 56px 20px; align-items:center; gap:10px;
}
.act-left{ min-width:0; }
.act-name{ font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.act-notes{ font-size:12.5px; color:var(--text-dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.act-dur{ font-size:13px; font-weight:700; color:var(--amber); text-align:right; white-space:nowrap; }

.del-btn{ background:none; border:none; color:var(--text-dim); font-size:18px; cursor:pointer; padding:12px; margin:-12px; line-height:1; }
.del-btn:hover{ color:var(--danger); }

.empty-state{ text-align:center; padding:60px 16px; color:var(--text-dim); font-size:13.5px; line-height:1.6; }
.fab-hint{ color:var(--accent); font-weight:600; }

.credit-line{ text-align:center; font-size:10.5px; color:var(--text-dim); margin:16px 0 4px; }
.credit-line a{ color:var(--text-dim); }

/* BOTTOM TAB BAR */
.bottom-tab-bar{
  position:fixed; left:0; right:0; bottom:0; max-width:440px; margin:0 auto;
  background:var(--surface); border-top:1px solid var(--border); z-index:15;
  display:flex; padding:8px 8px calc(8px + env(safe-area-inset-bottom));
}
.bottom-tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:6px 0; cursor:pointer; color:var(--text-dim); font-size:10.5px; font-weight:600;
}
.bottom-tab.active{ color:var(--accent); }
.bottom-tab svg{ width:22px; height:22px; }

/* MODAL */
.modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.55); display:flex; align-items:flex-end; justify-content:center; z-index:20; }
.modal{ background:var(--surface); border-top:1px solid var(--border); border-radius:20px 20px 0 0; padding:22px 20px calc(24px + env(safe-area-inset-bottom)); width:100%; max-width:440px; max-height:88vh; overflow-y:auto; }
.modal h3{ margin:0 0 4px; font-size:17px; font-weight:700; }
.modal .modal-sub{ font-size:12.5px; color:var(--text-dim); margin:0 0 16px; }
.field{ margin-bottom:12px; }
.field label{ display:block; font-size:12px; color:var(--text-dim); margin-bottom:5px; font-weight:600; }
.field input, .field select{ width:100%; padding:12px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-family:'Inter',sans-serif; font-size:14.5px; }
.field input:focus, .field select:focus{ outline:none; border-color:var(--accent); }
.field-row{ display:flex; gap:10px; }
.field-row .field{ flex:1; }
.modal-actions{ display:flex; gap:10px; margin-top:18px; }
button.primary{ flex:1; padding:13px; background:var(--accent); color:#FFFFFF; border:none; border-radius:10px; font-size:14.5px; font-weight:700; font-family:'Inter',sans-serif; cursor:pointer; }
button.secondary{ padding:13px 18px; background:transparent; color:var(--text-dim); border:1px solid var(--border); border-radius:10px; font-size:14.5px; font-weight:600; font-family:'Inter',sans-serif; cursor:pointer; }

/* CONSTRUTOR DE TREINO POR BLOCOS */
.blk-section-label{ font-size:11px; color:var(--text-dim); font-weight:700; text-transform:uppercase; letter-spacing:0.3px; margin:16px 0 8px; }
.blk-card{ background:var(--surface-2); border:1px solid var(--border); border-radius:12px; margin-bottom:8px; overflow:hidden; }
.blk-head{ display:flex; align-items:center; gap:10px; padding:11px 12px; cursor:pointer; }
.blk-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.blk-name{ flex:1; font-size:13.5px; font-weight:700; min-width:0; }
.blk-sum{ font-size:12px; color:var(--text-dim); white-space:nowrap; }
.blk-x{ width:20px; height:20px; display:flex; align-items:center; justify-content:center; color:var(--text-dim); font-size:16px; cursor:pointer; flex-shrink:0; }
.blk-group-head{ display:flex; align-items:center; gap:8px; padding:11px 12px; border-bottom:1px solid var(--border); font-size:13px; font-weight:600; color:var(--text-dim); }
.blk-reps-input{ width:40px; padding:6px 4px; border-radius:7px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-family:inherit; font-size:13.5px; text-align:center; font-weight:700; }
.blk-substep{ display:flex; align-items:center; gap:10px; padding:10px 12px; cursor:pointer; border-top:1px solid var(--border); }
.blk-substep:first-of-type{ border-top:none; }
.blk-addmenu{ display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
.blk-addopt{ flex:1; min-width:calc(50% - 4px); display:flex; align-items:center; gap:8px; padding:11px 12px; border-radius:10px; border:1.5px dashed var(--border); color:var(--text-dim); font-size:12.5px; font-weight:600; cursor:pointer; }
.blk-summary{ display:flex; justify-content:space-between; align-items:center; margin-top:16px; padding:12px 14px; background:var(--accent-soft); border-radius:10px; }
.blk-summary .k{ font-size:11px; color:var(--accent); font-weight:700; text-transform:uppercase; letter-spacing:0.3px; }
.blk-summary .v{ font-size:15px; color:var(--accent); font-weight:800; }

/* TABELA DE SÉRIES */
.sets-table{ width:100%; border-collapse:collapse; margin-bottom:8px; }
.sets-table th{ font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.3px; font-weight:700; text-align:center; padding:0 3px 8px; }
.sets-table th:first-child, .sets-table td:first-child{ text-align:left; padding-left:2px; }
.sets-table td{ padding:6px 3px; text-align:center; }
.sets-table tr.set-row td:first-child{ border-radius:9px 0 0 9px; }
.sets-table tr.set-row td:last-child{ border-radius:0 9px 9px 0; }
.sets-table tr.done td{ background:var(--accent-soft); }
.sets-table .set-num{ font-size:13px; font-weight:700; color:var(--text-dim); }
.sets-table tr.done .set-num{ color:var(--accent); }
.sets-table .prev-col{ font-size:12px; color:var(--text-dim); }
.sets-table input.set-cell{ width:56px; text-align:center; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:14px; font-weight:700; padding:8px 2px; font-family:inherit; }
.sets-table tr.done input.set-cell{ background:var(--surface); border-color:var(--accent-soft); }
.set-check{ width:25px; height:25px; border-radius:50%; border:2px solid var(--border); display:inline-flex; align-items:center; justify-content:center; color:#fff; cursor:pointer; }
.set-check svg{ width:12px; height:12px; }
.sets-table tr.done .set-check{ background:var(--accent); border-color:var(--accent); }

/* EXECUÇÃO DE TREINO */
.wex-root{
  position:fixed; inset:0; z-index:25; background:var(--bg); display:flex; flex-direction:column;
  padding:calc(18px + env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom));
  max-width:440px; margin:0 auto;
}
.wex-topbar{ display:flex; justify-content:space-between; align-items:center; }
.wex-exit{ width:32px; height:32px; border-radius:50%; background:var(--surface); border:1px solid var(--border); color:var(--text-dim); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px; }
.wex-progresslabel{ font-size:12px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.3px; }
.wex-progressbar{ height:4px; background:var(--surface-2); border-radius:3px; margin:14px 0 20px; overflow:hidden; }
.wex-progressbar .fill{ height:100%; background:var(--accent); border-radius:3px; transition:width .3s ease; }
.wex-grouptag{ display:inline-block; font-size:11px; font-weight:700; color:var(--accent); background:var(--accent-soft); padding:3px 9px; border-radius:6px; margin-bottom:8px; align-self:flex-start; }
.wex-title{ font-size:24px; font-weight:800; line-height:1.15; margin-bottom:4px; }
.wex-serielabel{ font-size:15px; font-weight:700; color:var(--accent); margin-bottom:16px; }
.wex-giframe{ width:100%; height:190px; background:var(--surface); border:1px solid var(--border); border-radius:16px; margin-bottom:16px; overflow:hidden; display:flex; align-items:center; justify-content:center; }
.wex-giframe img{ max-width:100%; max-height:100%; object-fit:contain; }
.wex-fieldgrid{ display:flex; gap:14px; margin-bottom:10px; }
.wex-bigfield{ flex:1; background:var(--surface); border:1.5px solid var(--border); border-radius:16px; padding:16px 12px; text-align:center; }
.wex-bigfield label{ display:block; font-size:11px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:8px; }
.wex-stepper{ display:flex; align-items:center; justify-content:center; gap:10px; }
.wex-stepper button{ width:32px; height:32px; border-radius:50%; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:17px; font-weight:700; cursor:pointer; }
.wex-stepper .val{ font-size:26px; font-weight:800; min-width:56px; }
.wex-prevhint{ font-size:12px; color:var(--text-dim); text-align:center; margin:6px 0; flex:1; }
.wex-concluirbtn{ width:100%; padding:16px; background:var(--accent); color:#fff; border:none; border-radius:14px; font-size:15.5px; font-weight:800; cursor:pointer; margin-top:auto; }

.wex-rest{ align-items:center; justify-content:center; text-align:center; }
.wex-restlabel{ font-size:13px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px; }
.wex-resttimer{ font-size:58px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--accent); }
.wex-restring{ width:220px; height:220px; margin:0 auto 22px; position:relative; }
.wex-restring svg{ transform:rotate(-90deg); }
.wex-restring .bg{ fill:none; stroke:var(--surface-2); stroke-width:10; }
.wex-restring .fg{ fill:none; stroke:var(--accent); stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset 1s linear; }
.wex-restring .center{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.wex-nexthint{ font-size:13px; color:var(--text-dim); margin-bottom:26px; }
.wex-nexthint b{ color:var(--text); }
.wex-restactions{ display:flex; gap:10px; width:100%; }
.wex-restactions button{ flex:1; padding:14px; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
.wex-btnskip{ background:var(--surface-2); border:none; color:var(--text); }
.wex-btnadd15{ background:none; border:1.5px solid var(--border); color:var(--text-dim); }

.wex-summary{ align-items:center; text-align:center; padding-top:50px; }

const NIVEL_RANK = { iniciante:1, intermediario:2, avancado:3 };
const SETREPS = {
  iniciante:     { series:3, reps:12, descanso:'60–90s' },
  intermediario: { series:4, reps:10, descanso:'60–90s' },
  avancado: {
    forca:       { series:5, reps:8,  descanso:'90–120s' },
    hipertrofia: { series:4, reps:15, descanso:'90–120s' },
  },
};

function splitTemplate(nivel, diasCount){
  const fullBody = { Peito:1, Costas:1, Pernas:1, Ombro:1, Braço:1, Core:1 };
  if(diasCount <= 2) return Array(diasCount).fill(fullBody);
  if(diasCount === 3 && nivel === 'iniciante') return Array(3).fill(fullBody);
  if(diasCount === 3) return [
    { Peito:2, Ombro:2, Braço:1 },
    { Costas:3, Braço:1, Core:1 },
    { Pernas:4, Core:1 },
  ];
  if(diasCount === 4) return [
    { Peito:2, Costas:2, Ombro:1 },
    { Pernas:3, Core:1 },
    { Peito:1, Costas:1, Ombro:1, Braço:2 },
    { Pernas:3, Core:1 },
  ];
  const five = [
    { Peito:4 },
    { Costas:4 },
    { Pernas:4 },
    { Ombro:4 },
    { Braço:3, Core:1 },
  ];
  if(diasCount === 5) return five;
  const extended = [];
  for(let i=0;i<diasCount;i++) extended.push(five[i % 5]);
  return extended;
}
function buildPlan(nivel, diasArr, equip, objetivo){
  const pool = POOL[equip];
  const sr = nivel==='avancado' ? SETREPS.avancado[objetivo||'forca'] : SETREPS[nivel];
  const maxRank = NIVEL_RANK[nivel] || 1;
  const used = {};
  function pick(group, count){
    const full = pool[group] || [];
    const filtered = full.filter(e => (NIVEL_RANK[e.nivel] || 1) <= maxRank);
    const arr = filtered.length ? filtered : full;
    if(arr.length === 0) return [];
    // Prioriza exercícios do próprio nível pedido — só recorre a nível mais baixo pra completar
    // a contagem quando não há exercícios suficientes daquele nível nesse grupo (evita repetir
    // o mesmo exercício várias vezes só pra "forçar" o nível exato).
    const exact = arr.filter(e => e.nivel === nivel);
    const ordered = exact.length >= count ? exact : exact.concat(arr.filter(e => e.nivel !== nivel));
    const res = [];
    for(let i=0;i<count;i++){
      const idx = ((used[group]||0) + i) % ordered.length;
      res.push(ordered[idx]);
    }
    used[group] = (used[group]||0) + count;
    return res.map(e => ({ nome:e.nome, series:String(sr.series), reps:String(sr.reps), carga:'', grupo:group, repdbId:e.id, descanso:sr.descanso }));
  }
  const templates = splitTemplate(nivel, diasArr.length);
  const plan = {};
  diasArr.forEach((day, i)=>{
    const spec = templates[i] || templates[templates.length-1];
    let list = [];
    Object.keys(spec).forEach(g => list = list.concat(pick(g, spec[g])));
    plan[day] = list;
  });
  return plan;
}

async function init(){
  try{
    const t = await window.storage.get('treinos', false);
    const z = await window.storage.get('zonas', false);
    if(t && t.value){
      state.treinos = JSON.parse(t.value);
      state.zonas = (z && z.value) ? JSON.parse(z.value) : DEMO_ZONAS;
      state.isDemo = false;
    }else{ state.treinos = JSON.parse(JSON.stringify(DEMO_TREINOS)); state.zonas = DEMO_ZONAS; state.isDemo = true; }
  }catch(e){ state.treinos = JSON.parse(JSON.stringify(DEMO_TREINOS)); state.zonas = DEMO_ZONAS; state.isDemo = true; }

  try{
    const m = await window.storage.get('musculacao', false);
    state.musculacao = (m && m.value) ? JSON.parse(m.value) : JSON.parse(JSON.stringify(DEMO_MUSC));
  }catch(e){ state.musculacao = JSON.parse(JSON.stringify(DEMO_MUSC)); }

  try{
    const o = await window.storage.get('outros', false);
    state.outros = (o && o.value) ? JSON.parse(o.value) : JSON.parse(JSON.stringify(DEMO_OUTROS));
  }catch(e){ state.outros = JSON.parse(JSON.stringify(DEMO_OUTROS)); }

  try{
    const hc = await window.storage.get('historicoCarga', false);
    state.historicoCarga = (hc && hc.value) ? JSON.parse(hc.value) : {};
  }catch(e){ state.historicoCarga = {}; }

  try{
    const p = await window.storage.get('corridaProgress', false);
    state.corridaProgress = (p && p.value) ? JSON.parse(p.value) : {};
  }catch(e){ state.corridaProgress = {}; }

  try{
    const pf = await window.storage.get('perfil', false);
    state.perfil = (pf && pf.value) ? JSON.parse(pf.value) : { nome:'', idade:'', peso:'', altura:'', foto:'' };
  }catch(e){ state.perfil = { nome:'', idade:'', peso:'', altura:'', foto:'' }; }

  try{
    const hm = await window.storage.get('historicoMedidas', false);
    state.historicoMedidas = (hm && hm.value) ? JSON.parse(hm.value) : {};
  }catch(e){ state.historicoMedidas = {}; }

  try{
    const eq = await window.storage.get('equipamentos', false);
    state.equipamentos = (eq && eq.value) ? JSON.parse(eq.value) : { relogio:'', tenis:[] };
  }catch(e){ state.equipamentos = { relogio:'', tenis:[] }; }

  try{
    const cv = await window.storage.get('corridaVdotData', false);
    state.corridaVdotData = (cv && cv.value) ? JSON.parse(cv.value) : null;
    state.vdotStep = (state.corridaVdotData && state.corridaVdotData.plan) ? 4 : 1;
  }catch(e){ state.corridaVdotData = null; }

  // Planos materializados antes da cor-por-tipo existir ficaram sem "cor" salva, então toda a semana
  // aparecia azul mesmo tendo Limiar/Longão/etc — recompleta a cor da semana atual a partir do plano já salvo.
  if(state.corridaVdotData && state.corridaVdotData.plan && state.corridaVdotData.startMonday){
    const diasArr = state.corridaVdotData.diasArr || [];
    const missingCor = state.treinos.some(t => diasArr.includes(dayAbbrevOf(t.day)) && !t.cor);
    if(missingCor){
      const curWeek = state.corridaVdotData.plan.find(w=>w.weekNumber===(state.corridaVdotData.currentWeekIndex||1));
      if(curWeek) materializeVdotWeekIntoTreinos(curWeek, state.corridaVdotData.startMonday);
    }
  }

  let onboardingSeen = false;
  try{
    const ob = await window.storage.get('onboardingDone', false);
    onboardingSeen = !!(ob && ob.value);
  }catch(e){ onboardingSeen = false; }

  // Musculação não tem data por exercício (é "o treino de tal dia da semana"), então quando a semana
  // vira, os "feitos" precisam resetar sozinhos — senão fica tudo marcado desde a semana passada.
  try{
    const wm = await window.storage.get('weekTrackMonday', false);
    const storedMonday = (wm && wm.value) || null;
    const currentMonday = vdotISODate(vdotMondayOf(new Date()));
    if(storedMonday && storedMonday !== currentMonday){
      DAY_ABBR.forEach(d=>{ (state.musculacao[d]||[]).forEach(ex=>{ ex.done = false; }); });
      saveMusc();
    }
    if(storedMonday !== currentMonday){
      await window.storage.set('weekTrackMonday', currentMonday, false);
    }
  }catch(e){}

  try{
    const wl = await window.storage.get('workoutSessionsLog', false);
    state.workoutSessionsLog = (wl && wl.value) ? JSON.parse(wl.value) : [];
  }catch(e){ state.workoutSessionsLog = []; }

  // O treino em execução (e o cronômetro de descanso) precisa sobreviver a fechar/reabrir o app — se o
  // descanso já zerou enquanto o app estava fechado, avança direto pro próximo passo assim que reabre.
  try{
    const ws = await window.storage.get('workoutSession', false);
    state.workoutSession = (ws && ws.value) ? JSON.parse(ws.value) : null;
    if(state.workoutSession && state.workoutSession.phase==='rest' && Date.now() >= state.workoutSession.restEndAt){
      advanceAfterRest();
    }
  }catch(e){ state.workoutSession = null; }

  render();
  if(state.workoutSession && state.workoutSession.phase==='rest') ensureRestTicking();
  if(!onboardingSeen){
    state.modalType = 'onboarding'; state.modalOpen = true; render();
  }
}

function dayAbbrevOf(dayStr){
  const first = (dayStr||'').split(' ')[0].trim();
  const norm = first.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const found = DAY_ABBR.find(d => d.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase() === norm);
  return found || first;
}

function findByHeaderRow(rows, mustHave){
  for(let i=0;i<rows.length;i++){
    const row = (rows[i]||[]).map(c=> (c===undefined||c===null)?'':String(c).trim().toLowerCase());
    if(mustHave.every(h => row.includes(h))) return i;
  }
  return -1;
}
function parseWorkbook(wb){
  const sheetTreinos = wb.SheetNames.find(n => n.toLowerCase().includes('trein'));
  const sheetZonas = wb.SheetNames.find(n => n.toLowerCase().includes('zona'));
  let treinos = []; let zonas = [];
  if(sheetTreinos){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetTreinos], {header:1, defval:''});
    const hIdx = findByHeaderRow(rows, ['dia/data','tipo de treino']);
    if(hIdx >= 0){
      const headerRow = rows[hIdx].map(c=>String(c).trim().toLowerCase());
      const col = name => headerRow.indexOf(name);
      const idx = { day:col('dia/data'), type:col('tipo de treino'), warmupDesc:col('aquecimento'),
        warmupPace:col('pace aquecimento'), mainDesc:col('treino principal'), mainPace:col('pace principal'),
        cooldownDesc:col('desaquecimento'), cooldownPace:col('pace desaquecimento'),
        totalKm:col('distância total (km)'), zone:col('zona') };
      for(let r=hIdx+1; r<rows.length; r++){
        const row = rows[r];
        if(!row || row.every(c=>String(c).trim()==='')) break;
        if(String(row[idx.day]||'').trim().toLowerCase()==='legenda:') break;
        if(String(row[idx.day]||'').trim()==='') continue;
        treinos.push({
          day:String(row[idx.day]||'').trim(), type:String(row[idx.type]||'').trim(),
          warmupDesc:String(row[idx.warmupDesc]||'').trim(), warmupPace:String(row[idx.warmupPace]||'').trim(),
          mainDesc:String(row[idx.mainDesc]||'').trim(), mainPace:String(row[idx.mainPace]||'').trim(),
          cooldownDesc:String(row[idx.cooldownDesc]||'').trim(), cooldownPace:String(row[idx.cooldownPace]||'').trim(),
          totalKm:row[idx.totalKm]||'', zone:String(row[idx.zone]||'').trim(),
        });
      }
    }
  }
  if(sheetZonas){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetZonas], {header:1, defval:''});
    const hIdx = findByHeaderRow(rows, ['zona','nome']);
    if(hIdx >= 0){
      const headerRow = rows[hIdx].map(c=>String(c).trim().toLowerCase());
      const col = name => headerRow.indexOf(name);
      const idx = { zone:col('zona'), nome:col('nome'), pace:col('pace (min/km)'), fcmax:col('% fc máx') };
      for(let r=hIdx+1; r<rows.length; r++){
        const row = rows[r];
        if(!row || row.every(c=>String(c).trim()==='')) break;
        if(String(row[idx.zone]||'').trim().toLowerCase()==='legenda:') break;
        if(String(row[idx.zone]||'').trim()==='') continue;
        zonas.push({ zone:String(row[idx.zone]||'').trim(), nome:String(row[idx.nome]||'').trim(),
          pace:String(row[idx.pace]||'').trim(), fcmax:String(row[idx.fcmax]||'').trim() });
      }
    }
  }
  return { treinos, zonas: zonas.length ? zonas : DEMO_ZONAS };
}

/* ---------- FIT file parser (minimal, records+session only) ---------- */
function parseFitFile(buffer){
  const view = new DataView(buffer);
  const headerSize = view.getUint8(0);
  const dataSize = view.getUint32(4, true);
  let offset = headerSize;
  const end = headerSize + dataSize;
  const localDefs = {};
  let session = null;
  const records = [];

  function readField(off, size, base, littleEndian){
    switch(base){
      case 0x00: case 0x02: case 0x0A: { const v = view.getUint8(off); return { v, invalid: v===0xFF }; }
      case 0x01: { const v = view.getInt8(off); return { v, invalid: v===0x7F }; }
      case 0x83: { const v = view.getInt16(off, littleEndian); return { v, invalid: v===0x7FFF }; }
      case 0x84: case 0x8B: { const v = view.getUint16(off, littleEndian); return { v, invalid: v===0xFFFF }; }
      case 0x85: { const v = view.getInt32(off, littleEndian); return { v, invalid: v===0x7FFFFFFF }; }
      case 0x86: case 0x8C: { const v = view.getUint32(off, littleEndian); return { v, invalid: v===0xFFFFFFFF }; }
      case 0x88: return { v: view.getFloat32(off, littleEndian), invalid:false };
      case 0x89: return { v: view.getFloat64(off, littleEndian), invalid:false };
      case 0x0D: return { v: view.getUint8(off), invalid:false };
      default: return { v: null, invalid:true };
    }
  }

  function readDefinition(startOffset, hasDev){
    let off = startOffset + 1; // skip reserved byte
    const arch = view.getUint8(off); off += 1;
    const littleEndian = arch === 0;
    const globalNum = view.getUint16(off, littleEndian); off += 2;
    const numFields = view.getUint8(off); off += 1;
    const fields = [];
    for(let i=0;i<numFields;i++){
      fields.push({ num: view.getUint8(off), size: view.getUint8(off+1), base: view.getUint8(off+2) });
      off += 3;
    }
    const devFields = [];
    if(hasDev){
      const numDev = view.getUint8(off); off += 1;
      for(let i=0;i<numDev;i++){
        devFields.push({ size: view.getUint8(off+1) });
        off += 3;
      }
    }
    return { def: { globalNum, littleEndian, fields, devFields }, nextOffset: off };
  }

  function readDataMessage(startOffset, def){
    let off = startOffset;
    const msg = {};
    for(const f of def.fields){
      if(off + f.size > end) throw new Error('truncated');
      const r = readField(off, f.size, f.base, def.littleEndian);
      if(!r.invalid) msg[f.num] = r.v;
      off += f.size;
    }
    for(const f of def.devFields){ off += f.size; }
    return { msg, nextOffset: off };
  }

  while(offset < end){
    const headerByte = view.getUint8(offset); offset += 1;
    if(headerByte & 0x80){
      const localType = (headerByte >> 5) & 0x03;
      const def = localDefs[localType];
      if(!def) break;
      const { msg, nextOffset } = readDataMessage(offset, def);
      offset = nextOffset;
      if(def.globalNum === 18 && !session) session = msg;
      else if(def.globalNum === 20) records.push(msg);
      continue;
    }
    const isDefinition = (headerByte & 0x40) !== 0;
    const localType = headerByte & 0x0F;
    if(isDefinition){
      const hasDev = (headerByte & 0x20) !== 0;
      const { def, nextOffset } = readDefinition(offset, hasDev);
      localDefs[localType] = def;
      offset = nextOffset;
    }else{
      const def = localDefs[localType];
      if(!def) break;
      const { msg, nextOffset } = readDataMessage(offset, def);
      offset = nextOffset;
      if(def.globalNum === 18 && !session) session = msg;
      else if(def.globalNum === 20) records.push(msg);
    }
  }

  const FIT_EPOCH = 631065600;
  const toDate = (ts)=> ts!=null ? new Date((ts+FIT_EPOCH)*1000) : null;

  let totalDistanceM = null, totalElapsedTimeS = null, startTime = null;
  if(session){
    if(session[9]!=null) totalDistanceM = session[9]/100;
    if(session[8]!=null) totalElapsedTimeS = session[8]/1000;
    else if(session[7]!=null) totalElapsedTimeS = session[7]/1000;
    startTime = toDate(session[2] != null ? session[2] : session[253]);
  }
  if(records.length>1){
    const first = records[0], last = records[records.length-1];
    if(totalElapsedTimeS==null && first[253]!=null && last[253]!=null) totalElapsedTimeS = last[253]-first[253];
    if(totalDistanceM==null && last[5]!=null) totalDistanceM = last[5]/100;
    if(!startTime && first[253]!=null) startTime = toDate(first[253]);
  }
  return { totalDistanceM, totalElapsedTimeS, startTime };
}

const STOPWORDS = new Set(['com','de','da','do','na','no','em','a','o','e','para','sem','ao','à','um','uma']);
const ACCENT_MAP = {'á':'a','à':'a','â':'a','ã':'a','ä':'a','é':'e','è':'e','ê':'e','ë':'e','í':'i','ì':'i','î':'i','ï':'i','ó':'o','ò':'o','ô':'o','õ':'o','ö':'o','ú':'u','ù':'u','û':'u','ü':'u','ç':'c'};
function normalizeWords(s){
  let out = String(s||'').toLowerCase();
  out = out.replace(/[áàâãäéèêëíìîïóòôõöúùûüç]/g, ch => ACCENT_MAP[ch] || ch);
  return out.replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w && !STOPWORDS.has(w));
}
function guessRepdbId(grupo, typedName){
  const words = normalizeWords(typedName);
  if(words.length===0) return null;
  let best = null, bestScore = 0;
  exercisesForGroup(grupo).forEach(c=>{
    const shared = normalizeWords(c.nome).filter(w=>words.includes(w)).length;
    if(shared > bestScore){ bestScore = shared; best = c; }
  });
  return (best && bestScore >= 1) ? best.id : null;
}
function exercisesForGroup(grupo){
  const map = new Map();
  ['academia','halteres','corpo'].forEach(tier=>{
    (POOL[tier][grupo]||[]).forEach(e=>{ if(!map.has(e.id)) map.set(e.id, e.nome); });
  });
  return Array.from(map, ([id,nome])=>({id,nome}));
}

function todayISO(){ return new Date().toISOString().slice(0,10); }
// Progresso de corrida é guardado pela data completa do treino (ex: "Sex 04/09"), não só pelo dia da
// semana — assim marcar sexta como feito não fica "grudado" quando chega a sexta de outra semana.
function corridaProgressKey(dayAbbrev){
  const entry = state.treinos.find(t=>dayAbbrevOf(t.day)===dayAbbrev);
  return entry ? entry.day : dayAbbrev;
}
function corridaEntryProgress(day){
  const v = state.corridaProgress[corridaProgressKey(day)];
  if(!v) return null;
  return typeof v === 'object' ? v : { done:true };
}
function isCorridaDone(day){ const v = corridaEntryProgress(day); return !!(v && v.done); }
function parsePaceToSec(pace){
  const m = String(pace||'').match(/(\d+)[:.](\d{1,2})/);
  if(!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}
function formatPace(secPerKm){
  let m = Math.floor(secPerKm/60), s = Math.round(secPerKm%60);
  if(s===60){ m++; s=0; }
  return m+':'+String(s).padStart(2,'0');
}
function formatDuration(totalSec){
  if(totalSec>=3600){
    const h = Math.floor(totalSec/3600), min = Math.round((totalSec%3600)/60);
    return h+'h'+(min>0?' '+min+'min':'');
  }
  return Math.round(totalSec/60)+'min';
}

/* ---------- Construtor de treino manual (blocos, estilo Garmin Connect) ---------- */
const BLOCK_KIND_META = {
  aquec:    { label:'Aquecimento',    cor:'var(--danger)' },
  continua: { label:'Corrida',        cor:'var(--blue)' },
  recup:    { label:'Recuperação',    cor:'var(--text-dim)' },
  desaq:    { label:'Desaquecimento', cor:'var(--accent)' },
};
function newBlockId(){ return 'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
// Campos de uma "etapa" — usados tanto por um bloco simples quanto por cada sub-etapa dentro de um grupo Repetir.
function newStepFields(kind){
  return { kind, durType:'km', km:'', h:'', m:'', s:'',
    paceType:'none', paceLoM:'', paceLoS:'', paceHiM:'', paceHiS:'' };
}
function newBlock(kind){
  if(kind==='intervalado'){
    return { id:newBlockId(), isGroup:true, reps:'3', steps:[
      { id:newBlockId(), ...newStepFields('continua') },
      { id:newBlockId(), ...newStepFields('recup') },
    ]};
  }
  return { id:newBlockId(), isGroup:false, ...newStepFields(kind) };
}
// Sem pace, um trecho em tempo não tem como virar km (e vice-versa) — nesses casos a contribuição
// pro total fica 0 em vez de quebrar a conta toda.
function stepPaceSecPerKm(step){
  if(step.paceType!=='pace') return null;
  const lo = (parseInt(step.paceLoM)||0)*60 + (parseInt(step.paceLoS)||0);
  const hi = (parseInt(step.paceHiM)||0)*60 + (parseInt(step.paceHiS)||0);
  if(!lo && !hi) return null;
  if(lo && hi) return (lo+hi)/2;
  return lo||hi;
}
function stepPaceText(step){
  if(step.paceType!=='pace') return '';
  const lo = step.paceLoM!=='' ? `${step.paceLoM}:${String(step.paceLoS||0).padStart(2,'0')}` : '';
  const hi = step.paceHiM!=='' ? `${step.paceHiM}:${String(step.paceHiS||0).padStart(2,'0')}` : '';
  if(lo && hi && lo!==hi) return `${lo} a ${hi}/km`;
  return (lo||hi) ? (lo||hi)+'/km' : '';
}
function stepTimeSec(step){ return (parseInt(step.h)||0)*3600 + (parseInt(step.m)||0)*60 + (parseInt(step.s)||0); }
function stepKm(step){
  if(step.durType==='km') return parseFloat(String(step.km).replace(',','.'))||0;
  const totalSec = stepTimeSec(step), paceSec = stepPaceSecPerKm(step);
  if(!totalSec || !paceSec) return 0;
  return totalSec/paceSec;
}
function stepMin(step){
  if(step.durType==='time') return stepTimeSec(step)/60;
  const km = parseFloat(String(step.km).replace(',','.'))||0, paceSec = stepPaceSecPerKm(step);
  if(!km || !paceSec) return 0;
  return (km*paceSec)/60;
}
function durSummaryText(step){
  if(step.durType==='km') return step.km ? fmtKm(parseFloat(step.km)||0) : '—';
  const h=parseInt(step.h)||0, m=parseInt(step.m)||0, s=parseInt(step.s)||0;
  if(!h && !m && !s) return '—';
  return (h?h+'h ':'')+(m?m+'min ':'')+(s?s+'s':'');
}
function stepSummaryText(step){
  const dur = durSummaryText(step), pace = stepPaceText(step);
  const parts = [];
  if(dur && dur!=='—') parts.push(dur);
  if(pace) parts.push(pace);
  return parts.length ? parts.join(' · ') : 'Toca pra editar';
}
function blockToStep(b){
  if(b.isGroup){
    const reps = parseFloat(String(b.reps).replace(',','.')) || 0;
    const work = b.steps[0], rest = b.steps[1];
    const km = reps*(stepKm(work)+stepKm(rest));
    const min = reps*(stepMin(work)+stepMin(rest));
    const restTxt = durSummaryText(rest);
    const desc = `${b.reps||0}x${durSummaryText(work)}${restTxt!=='—' ? ', '+restTxt+' de descanso entre' : ''}`;
    return { name:'Intervalado', km, min, pace:stepPaceText(work), desc };
  }
  const meta = BLOCK_KIND_META[b.kind];
  return { name:meta.label, km:stepKm(b), min:stepMin(b), pace:stepPaceText(b), desc:durSummaryText(b) };
}
function blockSummaryText(b){
  const s = blockToStep(b);
  const parts = [];
  if(s.km) parts.push(fmtKm(Math.round(s.km*10)/10));
  if(s.pace) parts.push(s.pace);
  return parts.length ? parts.join(' · ') : 'Toca pra editar';
}
// Cor por palavra-chave no texto livre de "Tipo de treino" — só o gerador VDOT sabia categorizar
// automaticamente antes; assim um treino manual "Longão" ou "Intervalado" também fica com a cor certa.
function inferCorTipo(tipo){
  const t = String(tipo||'').toLowerCase();
  if(/long/.test(t)) return 'var(--green)';
  if(/limiar/.test(t)) return 'var(--amber)';
  if(/interval/.test(t)) return 'var(--danger)';
  if(/repeti|tiro/.test(t)) return 'var(--rep)';
  if(/prova/.test(t)) return 'var(--accent)';
  return 'var(--blue)';
}
function getEditingStep(){
  const ctx = state.corridaStepEdit;
  if(!ctx || !state.corridaBuilderDraft) return null;
  const block = state.corridaBuilderDraft.blocks.find(x=>x.id===ctx.blockId);
  if(!block) return null;
  return ctx.subIdx==null ? block : block.steps[ctx.subIdx];
}
function openCorridaBuilder(day){
  const entry = state.treinos.find(t=>dayAbbrevOf(t.day)===day);
  let blocks = [];
  if(entry && entry.builderBlocks && entry.builderBlocks.length && entry.builderBlocks[0].isGroup !== undefined){
    blocks = entry.builderBlocks.map(b=> b.isGroup ? { ...b, steps: b.steps.map(s=>({...s})) } : {...b});
  }else if(entry && entry.steps && entry.steps.length){
    // Sem os blocos originais salvos, reconstrói só km/pace (vira uma sequência de etapas simples).
    blocks = entry.steps.map((s,i)=>{
      const kind = s.name==='Aquecimento' ? 'aquec' : s.name==='Desaquecimento' ? 'desaq' : 'continua';
      const b = { id:newBlockId(), isGroup:false, ...newStepFields(kind) };
      if(s.km) b.km = String(Math.round(s.km*100)/100);
      const sec = s.pace ? parsePaceToSec(s.pace) : null;
      if(sec!=null){ b.paceType='pace'; b.paceLoM=String(Math.floor(sec/60)); b.paceLoS=String(sec%60).padStart(2,'0'); b.paceHiM=b.paceLoM; b.paceHiS=b.paceLoS; }
      return b;
    });
  }
  state.corridaBuilderDraft = { tipo: entry ? entry.type||'' : '', blocks };
}
/* ---------- VDOT (Jack Daniels) plan generator ---------- */
function daysToPaceStr(days){ return formatPace(days*86400); }
function formatClock(totalSec){
  totalSec = Math.round(totalSec);
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
  return h>0 ? (h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')) : (m+':'+String(s).padStart(2,'0'));
}
function paceRangeWithMargin(days, marginSec){
  const baseSec = days*86400;
  return formatPace(baseSec)+' ~ '+formatPace(baseSec+marginSec);
}
const VDOT_TEST_COEF = {
  '1600': {a:0.129789983350069, b:0.887869998635982},
  '3000': {a:0.244695486277067, b:0.874272474653074},
  '5000': {a:0.389068343445441, b:0.853126398932773},
  '10000':{a:0.805659018769989, b:0.852425654240328},
};
function parseClockInput(str){
  const parts = String(str||'').trim().split(':').map(Number);
  if(parts.length<2 || parts.some(isNaN)) return null;
  if(parts.length===2) return parts[0]*60+parts[1];
  return parts[0]*3600+parts[1]*60+parts[2];
}
function vdotFromTest(distKey, timeSec){
  const {a,b} = VDOT_TEST_COEF[distKey];
  return Math.pow(a/(timeSec/86400), 1/b);
}
function computeVdotPaces(vdot){
  return {
    Es: 0.085520318486574 * Math.pow(vdot, -0.792315390174534),
    Ef: 0.084518313927415 * Math.pow(vdot, -0.819514952571011),
    M:  0.091387357177027 * Math.pow(vdot, -0.861123091751905),
    T:  0.06970165201477  * Math.pow(vdot, -0.808171304753095),
    I:  0.064668134797248 * Math.pow(vdot, -0.809903017017922),
    R:  2.5*0.027831623318271 * Math.pow(vdot, -0.849631537082224),
  };
}
function predictRaceTimeSec(vdot, distanceKm){
  const direct = {
    5: {a:0.389068343445441,b:0.853126398932773},
    10:{a:0.805659018769989,b:0.852425654240328},
    42.195:{a:3.49469956615132,b:0.837443821910625},
  };
  if(direct[distanceKm]){
    const {a,b}=direct[distanceKm];
    return a*Math.pow(vdot,-b)*86400;
  }
  const T08 = 0.056331814720638*Math.pow(vdot,-0.867275092353156);
  const dm = distanceKm*1000;
  const lnV = Math.log(vdot);
  const phi = (0.119087247839977*lnV + 0.229667205274457)*Math.log(Math.log(dm)) - (0.248452654018515*lnV - 0.647790153119859);
  return phi*(distanceKm/0.8)*T08*86400;
}

// fácil, via isStrideDay abaixo); intermediário no máximo 1 sessão de intensidade por semana; avançado até 2.
const VDOT_QUALITY_BY_LEVEL = { iniciante:0, intermediario:1, avancado:2 };

  { label:'5km contínuo', km:5 },

const VDOT_OBJETIVO = {
  'Fácil': 'Constrói base aeróbica e recuperação ativa, sem estresse — o ritmo deve permitir conversar.',
  'Longão': 'Desenvolve resistência e economia de corrida, preparando o corpo pra sustentar esforço por mais tempo.',

function minFromKmAtPace(km, paceDaysPerKm){ return (km*paceDaysPerKm*86400) / 60; }
function fmtKm(km){ return (Math.round(km*10)/10).toString().replace('.0','')+'km'; }
function roundToHalf(km){ return Math.round(km*2)/2; }
// Longão máximo por prova-alvo e nível (km) — teto que a rampa de progressão nunca ultrapassa.
const VDOT_LONG_RUN_MAX_KM = {
  iniciante:    { 5:8,  10:10, '21.0975':14, '42.195':30 },
  intermediario:{ 5:12, 10:14, '21.0975':18, '42.195':32 },
  avancado:     { 5:16, 10:18, '21.0975':26, '42.195':36 },
};
// Ninguém treina pra 21/42km "do zero" — todo plano real (Higdon Novice 1 incluso) já exige uma base
// mínima antes de começar, então o início do longão depende também da distância da meta, não só do nível.
const VDOT_LONG_RUN_START_KM = {
  iniciante:    { 5:3, 10:4, '21.0975':6.5, '42.195':10 },
  intermediario:{ 5:4, 10:5, '21.0975':8,   '42.195':13 },
  avancado:     { 5:5, 10:6, '21.0975':10,  '42.195':16 },
};
// Faixa de volume semanal (km) por prova-alvo e nível — a progressão semanal nunca sai dessa faixa.
const VDOT_WEEKLY_KM_RANGE = {
  iniciante:    { 5:[15,25], 10:[20,30], '21.0975':[25,35], '42.195':[30,45] },
  intermediario:{ 5:[25,40], 10:[30,45], '21.0975':[35,55], '42.195':[45,70] },
  avancado:     { 5:[40,60], 10:[45,65], '21.0975':[55,80], '42.195':[70,110] },
};
// Daniels: o longão fica entre ~30-35% do volume semanal total — usa o meio da faixa como teto de conversão.
const VDOT_LONG_RUN_PCT = 0.32;
const VDOT_EASY_WOBBLE_PCT = [0, -0.15, 0.12, -0.08, 0.18, 0.05, -0.12];
// Teto por nível pro dia fácil — evita que escolher poucos dias de treino por semana infle
// demais cada corrida fácil só pra "encaixar" o volume da semana.
const VDOT_EASY_CEIL_KM = { iniciante:6, intermediario:10, avancado:14 };
// Aquecimento/desaquecimento em MINUTOS por nível (não km fixo) — assim a duração não encolhe/cresce
// sozinha conforme o pace melhora, e cada nível aquece pelo tempo que faz sentido pra ele.
const VDOT_WARMUP_MIN = { iniciante:7, intermediario:13, avancado:17 };
const VDOT_COOLDOWN_MIN = { iniciante:5, intermediario:10, avancado:12 };
function kmFromMinAtPace(min, paceDaysPerKm){ return (min*60) / (paceDaysPerKm*86400); }
// Duração do polimento depende da prova (não é uma fatia proporcional do total de semanas), e cada
// semana de polimento reduz uma % fixa em relação ao pico — nunca ao longão de treino que ela mesma teria.
const VDOT_TAPER_WEEKS_BY_GOAL = { 5:1, 10:1, '21.0975':2, '42.195':3 };
const VDOT_TAPER_PCT = { 1:[-35], 2:[-20,-45], 3:[-20,-35,-55] };

function buildVdotPhases(totalWeeks, goal){
  const desiredTaper = VDOT_TAPER_WEEKS_BY_GOAL[goal] || 1;
  const taper = Math.min(desiredTaper, Math.max(1, totalWeeks-3));
  const remaining = totalWeeks - taper;
  let base = Math.round(remaining*0.35);
  let intro = Math.round(remaining*0.30);
  let peak = remaining - base - intro;
  if(peak < 1){ peak = 1; intro = Math.max(1, remaining - base - peak); }
  if(intro < 1) intro = 1;
  base = Math.max(1, remaining - intro - peak);
  return [
    { key:'base', nome:'Base', weeks:base, cor:'var(--blue)', foco:'Só corrida fácil + longão crescendo aos poucos' },
    { key:'intro', nome:'Introdução', weeks:intro, cor:'var(--accent)', foco:'Entra repetição leve (R), mantém longão' },
    { key:'peak', nome:'Pico', weeks:peak, cor:'var(--amber)', foco:'Entra limiar (T) e intervalado (I)' },
    { key:'taper', nome:'Polimento', weeks:taper, cor:'var(--danger)', foco:'Reduz volume, ritmo de prova, chega descansado' },
  ];
}
// Volume semanal total: cresce no máx +10%/semana a partir do piso da faixa, nunca passa do teto, e a
// cada 4 semanas dá uma semana de descarga (-25%, dentro dos 20-30% pedidos) antes de seguir subindo.
function buildWeeklyVolumeProgression(buildWeeks, minKm, maxKm){
  const targets = [];
  let current = minKm;
  for(let w=1; w<=buildWeeks; w++){
    const isDeload = (w % 4 === 0) && w < buildWeeks;
    if(isDeload) current = current * 0.75;
    else if(w > 1) current = Math.min(current * 1.10, maxKm);
    targets.push(Math.max(minKm*0.5, current));
  }
  return targets;
}
const VDOT_EASY_NAMES = ['Rodagem Leve', 'Corrida Regenerativa', 'Rodagem Base', 'Corrida Solta'];
function shortOf(label){ return label.split(',')[0]; }
function pickVariantWithCap(variants, weekNumber, maxKm){
  const eligible = variants.filter(v=>v.km <= maxKm);
  if(!eligible.length) return null;
  return eligible[weekNumber % eligible.length];
}
// Escolhe quais dias (índices, sempre excluindo o último — reservado pro longão) recebem sessão de
// qualidade, sem deixar 2 seguidos. "Longão nunca ao lado de treino intenso" é regra dura — o slot colado
// nele só entra em jogo se não sobrar nenhum outro jeito de encaixar nem 1 sessão de qualidade na semana;
// nesses casos preferimos entregar menos sessões de qualidade a violar essa regra.
function pickQualityIndices(numDays, qCount){
  if(qCount <= 0) return [];
  const candidates = [];
  for(let i=0;i<numDays-1;i++) candidates.push(i);
  const avoidLast = numDays-2;
  const safeCandidates = candidates.length>1 ? candidates.filter(i=>i!==avoidLast) : candidates;
  const chosen = [];
  for(let i=0; i<safeCandidates.length && chosen.length<qCount; i++){
    const idx = safeCandidates[i];
    if(chosen.some(c=>Math.abs(c-idx)<=1)) continue;
    chosen.push(idx);
  }
  return chosen.sort((a,b)=>a-b);
}
function buildVdotWeekDays(weekMeta, nivel, paces, goal, diasArr, isLastWeek, raceTimeSec, weeklyTotalKm, longKm){
  const { phaseKey, weekNumber } = weekMeta;
  const days = diasArr;
  const otherDaysCount = Math.max(1, days.length - 1);
  // Com poucos dias de corrida (3-4/semana) não sobra espaço pra "dia de enchimento" — sobe 1 sessão de
  // qualidade extra, mas só pro avançado (intermediário nunca passa de 1/semana, iniciante nunca tem
  // sessão de intensidade de verdade) — e nunca estoura o teto do próprio nível.
  const baseQCount = phaseKey==='base' ? 0 : phaseKey==='peak' ? VDOT_QUALITY_BY_LEVEL[nivel] : Math.min(1, VDOT_QUALITY_BY_LEVEL[nivel]);
  const freqBonus = (nivel==='avancado' && phaseKey!=='taper' && phaseKey!=='base' && days.length<=4) ? 1 : 0;
  const qCount = nivel==='iniciante' ? 0 : Math.min(otherDaysCount, VDOT_QUALITY_BY_LEVEL[nivel], baseQCount + freqBonus);
  const easyPaceStr = `${daysToPaceStr(paces.Ef)} ~ ${daysToPaceStr(paces.Es)}/km`;

  function easyStep(km, pace, name){ return { name, km, pace, desc:`Trote leve, ${fmtKm(km)}` }; }

  // Na semana da prova, os outros dias precisam ser leves em relação à PROVA (não ao longão de treino
  // que a fórmula de polimento calcularia) — ninguém treina mais forte que a própria prova na semana dela.
  const derivationLongKm = isLastWeek ? Math.min(longKm, Math.max(3, goal*0.5)) : longKm;
  const easyDaysCount = Math.max(1, days.length - 1);
  const easyBaseThisWeek = Math.min(VDOT_EASY_CEIL_KM[nivel], Math.max(2, (weeklyTotalKm - derivationLongKm) / easyDaysCount));

  // O longão precisa continuar sendo o maior treino da semana — mesmo que isso signifique não bater
  // o piso da faixa de volume logo nas primeiras semanas (o longão ainda está subindo do que a pessoa
  // já corre hoje). O volume real alcança a faixa conforme o longão cresce ao longo do plano.
  const workouts = days.map((d,i)=>{
    const wobblePct = VDOT_EASY_WOBBLE_PCT[(weekNumber+i) % VDOT_EASY_WOBBLE_PCT.length];
    let km = roundToHalf(Math.max(2, easyBaseThisWeek * (1+wobblePct)));
    km = Math.min(km, derivationLongKm - 0.5);
    // Tiros introdutórios: a única forma de "velocidade" do iniciante (nunca R/T/I de verdade) — e uma
    // variação leve pros demais níveis nos dias fora da sessão de qualidade da semana.
    const isStrideDay = (weekNumber+i) % 3 === 0 && phaseKey !== 'taper';
    const baseName = VDOT_EASY_NAMES[(weekNumber+i) % VDOT_EASY_NAMES.length];
    const title = isStrideDay ? `${baseName} + Tiros` : baseName;
    const mainDesc = `${fmtKm(km)} fácil${isStrideDay ? ' + 4-6 tiros de 20s soltos no final' : ''}`;
    return {
      type:'Fácil', cor:'var(--blue)', label:'Fácil', title,
      mainDesc, mainPace: easyPaceStr,
      warmupDesc:'', warmupPace:'', cooldownDesc:'', cooldownPace:'',
      totalKm: km, totalMin: minFromKmAtPace(km, (paces.Es+paces.Ef)/2),
      steps: [{ name:'Corrida', km, pace:easyPaceStr, desc:mainDesc }],
    };
  });

  workouts[workouts.length-1] = {
    type:'Longão', cor:'var(--green)', label:'Longão', title:`Longão ${fmtKm(longKm)}`,
    mainDesc:`Corrida longa, ${fmtKm(longKm)}`,
    mainPace:`${daysToPaceStr(paces.Es)}/km`,
    warmupDesc:'', warmupPace:'', cooldownDesc:'', cooldownPace:'',
    totalKm: longKm, totalMin: minFromKmAtPace(longKm, paces.Es),
    steps: [{ name:'Corrida longa', km:longKm, pace:`${daysToPaceStr(paces.Es)}/km`, desc:`${fmtKm(longKm)} contínuos` }],
  };

  // Intermediário só revezA T/I (nunca R como foco). Avançado pode revezar T/I/R quando tem 2 sessões
  // na semana. No polimento reduz pra só Limiar (ritmo de prova, sem estímulo novo tão perto da prova).
  const qTypes = phaseKey==='taper' ? ['T'] : nivel==='avancado' && qCount>=2 ? ['T','I','R'] : ['T','I'];
  function tryQualitySession(t){
    const isR = t==='R';
    const warmMin = isR ? Math.round(VDOT_WARMUP_MIN[nivel]*0.6) : VDOT_WARMUP_MIN[nivel];
    const coolMin = isR ? Math.round(VDOT_COOLDOWN_MIN[nivel]*0.6) : VDOT_COOLDOWN_MIN[nivel];
    const wKm = roundToHalf(kmFromMinAtPace(warmMin, paces.Ef));
    const cKm = roundToHalf(kmFromMinAtPace(coolMin, paces.Ef));
    const wStep = easyStep(wKm, easyPaceStr, 'Aquecimento');
    const cStep = easyStep(cKm, easyPaceStr, 'Desaquecimento');
    const maxMainKm = derivationLongKm - wKm - cKm - 0.5;
    let v, type, label, mainPace, titlePrefix, pace;
    if(t==='T'){ v = pickVariantWithCap(VDOT_T_VARIANTS, weekNumber, maxMainKm); type='Limiar'; label='Limiar'; titlePrefix='Limiar'; mainPace = paceRangeWithMargin(paces.T,3)+'/km'; pace = paces.T; }
    else if(t==='I'){ v = pickVariantWithCap(VDOT_I_VARIANTS, weekNumber, maxMainKm); type='Intervalado'; label='Intervalado'; titlePrefix='Intervalado'; mainPace = paceRangeWithMargin(paces.I,3)+'/km'; pace = paces.I; }
    else { v = pickVariantWithCap(VDOT_R_VARIANTS, weekNumber, maxMainKm); type='Repetição'; label='Repetição'; titlePrefix='Repetição'; mainPace = paceRangeWithMargin(paces.R,3)+'/km'; pace = paces.R; }
    if(!v) return null;
    const cor = type==='Limiar' ? 'var(--amber)' : type==='Intervalado' ? 'var(--danger)' : 'var(--rep)';
    const title = `${titlePrefix} ${shortOf(v.label)}`;
    const mStep = { name:'Principal', km:v.km, pace:mainPace, desc:v.label };
    const totalKm = roundToHalf(wStep.km + v.km + cStep.km);
    const totalMin = minFromKmAtPace(wStep.km, paces.Ef) + minFromKmAtPace(cStep.km, paces.Ef) + minFromKmAtPace(v.km, pace);
    return { type, cor, label, title,
      warmupDesc:wStep.desc, warmupPace:wStep.pace, mainDesc:v.label, mainPace, cooldownDesc:cStep.desc, cooldownPace:cStep.pace,
      totalKm, totalMin, steps:[wStep, mStep, cStep] };
  }
  const qIndices = pickQualityIndices(workouts.length, qCount);
  qIndices.forEach((idx, qi)=>{
    const t = qTypes[(weekNumber+qi) % qTypes.length];
    const session = tryQualitySession(t) || tryQualitySession('T');
    if(session) workouts[idx] = session;
  });
  if(isLastWeek){
    workouts[workouts.length-1] = { type:'Prova', cor:'var(--accent)', label:'Dia da prova', title:`Prova · ${VDOT_GOAL_NAME[goal]}`,
      mainDesc:`${VDOT_GOAL_NAME[goal]}`, mainPace:`ritmo alvo ${daysToPaceStr(paces.M)}/km`,
      warmupDesc:'', warmupPace:'', cooldownDesc:'', cooldownPace:'',
      totalKm: goal, totalMin: raceTimeSec/60,
      steps: [{ name:'Prova', km:goal, pace:`${daysToPaceStr(paces.M)}/km`, desc:`${VDOT_GOAL_NAME[goal]} — tempo estimado ${formatClock(raceTimeSec)}` }] };
  }
  return days.map((d,i)=>({ day:d, ...workouts[i] }));
}
function buildAllVdotWeeks(phases, nivel, paces, goal, diasArr, raceTimeSec, startLongKm){
  const weeks = [];
  let weekNumber = 1;
  const totalWeeks = phases.reduce((s,p)=>s+p.weeks,0);
  const taperWeeks = phases[phases.length-1].weeks;
  const buildWeeks = totalWeeks - taperWeeks;
  phases.forEach(p=>{
    for(let w=0; w<p.weeks; w++){
      weeks.push({ weekNumber, phaseKey:p.key, phaseName:p.nome, cor:p.cor, totalWeeks, taperWeeks });
      weekNumber++;
    }
  });

  // Volume semanal: faixa por prova+nível, crescendo no máx 10%/semana com descarga a cada 4 semanas.
  const [minKm, maxKm] = VDOT_WEEKLY_KM_RANGE[nivel][goal] || VDOT_WEEKLY_KM_RANGE[nivel][10];
  const weeklyBuildTargets = buildWeeklyVolumeProgression(buildWeeks, minKm, maxKm);

  // Longão: rampa do que a pessoa já corre hoje até o teto por prova+nível, mas nunca passa de ~32%
  // do volume semanal daquela semana (Daniels) — os dois tetos valem, prevalece o menor.
  const freqFactor = diasArr.length>=5 ? 1 : diasArr.length===4 ? 0.95 : 0.88;
  const longMaxTable = (VDOT_LONG_RUN_MAX_KM[nivel][goal] || VDOT_LONG_RUN_MAX_KM[nivel][10]) * freqFactor;
  const longStart = startLongKm || VDOT_LONG_RUN_START_KM[nivel][goal] || VDOT_LONG_RUN_START_KM[nivel][10];
  const longMax = Math.max(longMaxTable, longStart);
  const longBuildTargets = [];
  for(let w=1; w<=buildWeeks; w++){
    const t = buildWeeks<=1 ? 1 : (w-1)/(buildWeeks-1);
    const ramped = longStart + t*(longMax-longStart);
    longBuildTargets.push(Math.min(ramped, weeklyBuildTargets[w-1]*VDOT_LONG_RUN_PCT));
  }

  const peakWeekly = weeklyBuildTargets[buildWeeks-1];
  const peakLong = longBuildTargets[buildWeeks-1];
  const taperPcts = VDOT_TAPER_PCT[taperWeeks] || VDOT_TAPER_PCT[1];

  return weeks.map(w=>{
    let weeklyTotalKm, longKm;
    if(w.weekNumber <= buildWeeks){
      weeklyTotalKm = weeklyBuildTargets[w.weekNumber-1];
      longKm = longBuildTargets[w.weekNumber-1];
    }else{
      const taperIdx = w.weekNumber - buildWeeks;
      const pct = taperPcts[Math.min(taperIdx-1, taperPcts.length-1)] / 100;
      weeklyTotalKm = Math.max(minKm*0.4, peakWeekly*(1+pct));
      longKm = Math.max(3, peakLong*(1+pct));
    }
    weeklyTotalKm = roundToHalf(weeklyTotalKm);
    longKm = roundToHalf(longKm);
    return { ...w, days: buildVdotWeekDays(w, nivel, paces, goal, diasArr, w.weekNumber===totalWeeks, raceTimeSec, weeklyTotalKm, longKm) };
  });
}
function vdotMondayOf(date){
  const d = new Date(date);
  const dow = (d.getDay()+6)%7; // 0=Mon..6=Sun
  d.setDate(d.getDate()-dow);
  d.setHours(0,0,0,0);
  return d;
}
function vdotFormatDDMM(date){
  return String(date.getDate()).padStart(2,'0')+'/'+String(date.getMonth()+1).padStart(2,'0');
}
function vdotISODate(date){
  return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
}
function materializeVdotWeekIntoTreinos(week, startMondayISO){
  const start = new Date(startMondayISO+'T00:00:00');
  const monday = new Date(start);
  monday.setDate(monday.getDate() + (week.weekNumber-1)*7);
  const newEntries = week.days.map(w=>{
    const idx = DAY_ABBR.indexOf(w.day);
    const d = new Date(monday);
    d.setDate(d.getDate()+idx);
    return {
      day: w.day+' '+vdotFormatDDMM(d),
      type: w.title || w.type,
      warmupDesc: w.warmupDesc||'', warmupPace: w.warmupPace||'',
      mainDesc: w.mainDesc||'', mainPace: w.mainPace||'',
      cooldownDesc: w.cooldownDesc||'', cooldownPace: w.cooldownPace||'',
      totalKm: w.totalKm ? Math.round(w.totalKm*10)/10 : '',
      zone: '', objetivo: VDOT_OBJETIVO[w.type] || '', cor: w.cor || 'var(--blue)',
      steps: w.steps || null, totalMin: w.totalMin || null,
    };
  });
  const activeDays = week.days.map(w=>w.day);
  state.treinos = state.treinos.filter(t => !activeDays.includes(dayAbbrevOf(t.day)));
  state.treinos = state.treinos.concat(newEntries);
  state.isDemo = false;
  saveTreinos();
}

// Um registro por dia (não só quando o valor muda) — assim toda vez que você loga vira um ponto na
// evolução, mesmo repetindo o mesmo peso/medida de antes.
function logCargaHistory(key, carga){
  if(!key || carga === '' || carga == null) return;
  if(!state.historicoCarga) state.historicoCarga = {};
  const hist = state.historicoCarga[key] || (state.historicoCarga[key]=[]);
  const today = todayISO();
  const last = hist[hist.length-1];
  if(last && last.data === today) last.carga = carga;
  else hist.push({ data: today, carga });
  if(hist.length>200) hist.shift();
  saveHistoricoCarga();
}
// Registro por série (peso+reps de cada uma), igual apps de treino de força de verdade — substitui um
// único valor de carga por sessão. Entradas antigas com só "carga" continuam legíveis (compatibilidade).
function logSetsHistory(key, sets){
  if(!key || !sets || !sets.length) return;
  if(!state.historicoCarga) state.historicoCarga = {};
  const hist = state.historicoCarga[key] || (state.historicoCarga[key]=[]);
  const today = todayISO();
  const last = hist[hist.length-1];
  if(last && last.data === today){ last.sets = sets; delete last.carga; }
  else hist.push({ data: today, sets });
  if(hist.length>200) hist.shift();
  saveHistoricoCarga();
}
function topSetWeight(entry){
  if(entry.sets && entry.sets.length) return Math.max(...entry.sets.map(s=>parseFloat(s.peso)||0));
  return parseFloat(entry.carga)||0;
}
function setsSummaryText(entry){
  if(entry.sets && entry.sets.length) return entry.sets.map(s=>`${s.peso}kg${s.reps?'×'+s.reps:''}`).join(', ');
  return entry.carga ? entry.carga+'kg' : '—';
}
function cargaHistFor(ex){
  const key = ex.repdbId || ex.nome;
  const hist = key ? state.historicoCarga[key] : null;
  return hist && hist.length ? hist : null;
}
// Junta o texto "Meta NxM · ..." e o botão de registrar num só lugar pra não repetir a busca no histórico.
function exCardInfo(ex){
  const hist = cargaHistFor(ex);
  const today = todayISO();
  const last = hist ? hist[hist.length-1] : null;
  const meta = `Meta ${ex.series}×${ex.reps}${ex.descanso ? ' · descanso '+ex.descanso : ''}`;
  if(last && last.data === today){
    const n = last.sets ? last.sets.length : (last.carga!=null && last.carga!=='' ? 1 : 0);
    const w = topSetWeight(last);
    return { metaText: `${meta} · ${n} série${n===1?'':'s'} feita${n===1?'':'s'}`, btnText: w ? w+' kg' : 'Feito', filled:true };
  }
  if(last){
    const w = topSetWeight(last);
    return { metaText: w ? `${meta} · Última vez: ${w}kg` : `${meta} · sem histórico ainda`, btnText:'Registrar', filled:false };
  }
  return { metaText: `${meta} · sem histórico ainda`, btnText:'Registrar', filled:false };
}

/* ---------- Execução de treino guiada ---------- */
async function saveWorkoutSession(){
  try{ await window.storage.set('workoutSession', state.workoutSession ? JSON.stringify(state.workoutSession) : '', false); }catch(e){}
}
async function saveWorkoutSessionsLog(){
  if(state.workoutSessionsLog.length>200) state.workoutSessionsLog = state.workoutSessionsLog.slice(-200);
  try{ await window.storage.set('workoutSessionsLog', JSON.stringify(state.workoutSessionsLog), false); }catch(e){}
}
// Registra uma série de cada vez (não o dia inteiro de uma vez) — é assim que a execução guiada anota,
// diferente do modal de registro rápido que grava o dia inteiro junto.
function logSingleSet(key, set){
  if(!key) return;
  if(!state.historicoCarga) state.historicoCarga = {};
  const hist = state.historicoCarga[key] || (state.historicoCarga[key]=[]);
  const today = todayISO();
  let last = hist[hist.length-1];
  if(!last || last.data !== today){ last = { data:today, sets:[] }; hist.push(last); }
  if(!last.sets) last.sets = [];
  last.sets.push(set);
  if(hist.length>200) hist.shift();
  saveHistoricoCarga();
}
function parseDescansoSec(descanso){
  const nums = String(descanso||'').match(/\d+/g);
  if(!nums || !nums.length) return 90;
  const vals = nums.map(Number);
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}
// 1ª vez no exercício: usa a meta (carga/reps sugeridas por outra parte do sistema). Da 2ª vez em diante,
// puxa a última carga realizada — só sobe ~2.5% se TODAS as séries da última vez bateram a meta de reps;
// se não bateu, mantém a mesma carga (nunca sobe sozinho quando a pessoa não completou a série).
function suggestedForExercise(ex){
  const hist = cargaHistFor(ex);
  const metaReps = parseFloat(ex.reps) || 0;
  if(!hist) return { peso: ex.carga || 0, reps: ex.reps || 0 };
  const last = hist[hist.length-1];
  const lastSets = last && last.sets && last.sets.length ? last.sets
    : (last && last.carga!=null && last.carga!=='' ? [{ peso:last.carga, reps:ex.reps }] : null);
  if(!lastSets || !lastSets.length) return { peso: ex.carga || 0, reps: ex.reps || 0 };
  const lastPeso = Math.max(...lastSets.map(s=>parseFloat(s.peso)||0));
  const allMetTarget = lastSets.every(s => (parseFloat(s.reps)||0) >= metaReps);
  const nextPeso = allMetTarget ? Math.round(lastPeso*1.025*2)/2 : lastPeso;
  return { peso: nextPeso || ex.carga || 0, reps: ex.reps || metaReps };
}
function startWorkoutSession(day){
  const list = state.musculacao[day] || [];
  if(!list.length) return;
  const sug = suggestedForExercise(list[0]);
  state.workoutSession = {
    day, exIdx:0, serieIdx:0, phase:'exercise',
    curPeso: sug.peso, curReps: sug.reps, restEndAt:null, restTotalSec:0,
    startedAt: Date.now(), doneSeries:0, totalVolume:0,
  };
  saveWorkoutSession();
  render();
}
function currentWorkoutExercise(){
  const ws = state.workoutSession;
  if(!ws) return null;
  return (state.musculacao[ws.day]||[])[ws.exIdx] || null;
}
// Contexto de áudio só pode "destravar" com um gesto do usuário — cria/retoma aqui (chamado a partir de
// um clique real) pra já estar pronto quando o descanso zerar sozinho, sem interação nenhuma.
let __audioCtx = null;
function getAudioCtx(){
  if(!__audioCtx){
    try{ __audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(__audioCtx.state === 'suspended') __audioCtx.resume().catch(()=>{});
  return __audioCtx;
}
// Som de "descanso acabou" — dois tons curtos ascendentes (tipo "pliiinnn"), mais uma vibração como
// reforço caso o volume esteja baixo/mudo.
function playRestEndSound(){
  const ctx = getAudioCtx();
  if(ctx){
    const now = ctx.currentTime;
    [[880, now, 0.15], [1320, now+0.13, 0.22]].forEach(([freq, start, dur])=>{
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.25, start+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start+dur);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(start); osc.stop(start+dur+0.02);
    });
  }
  if(navigator.vibrate){ try{ navigator.vibrate([80,40,80]); }catch(e){} }
}
function concluirSerieAction(peso, reps){
  getAudioCtx();
  const ws = state.workoutSession;
  if(!ws) return;
  const ex = currentWorkoutExercise();
  if(!ex) return;
  const pesoNum = parseFloat(peso)||0, repsNum = parseFloat(reps)||0;
  logSingleSet(ex.repdbId || ex.nome, { peso:pesoNum, reps:repsNum });
  ws.doneSeries++;
  ws.totalVolume += pesoNum*repsNum;
  const seriesCount = parseInt(ex.series,10)||1;
  const list = state.musculacao[ws.day]||[];
  const isLastSerieOfEx = ws.serieIdx >= seriesCount-1;
  const isLastEx = ws.exIdx >= list.length-1;
  if(isLastSerieOfEx){ ex.done = true; saveMusc(); }
  if(isLastSerieOfEx && isLastEx){ finishWorkoutSession(); return; }
  const restSec = parseDescansoSec(ex.descanso);
  ws.phase = 'rest';
  ws.restTotalSec = restSec;
  ws.restEndAt = Date.now() + restSec*1000;
  saveWorkoutSession();
  render();
  ensureRestTicking();
}
let workoutRestInterval = null;
function ensureRestTicking(){
  if(workoutRestInterval) return;
  workoutRestInterval = setInterval(()=>{
    if(!state.workoutSession || state.workoutSession.phase!=='rest'){ stopRestTicking(); return; }
    if(Date.now() >= state.workoutSession.restEndAt){ playRestEndSound(); advanceAfterRest(); }
    else render();
  }, 1000);
}
function stopRestTicking(){ if(workoutRestInterval){ clearInterval(workoutRestInterval); workoutRestInterval=null; } }
function advanceAfterRest(){
  const ws = state.workoutSession;
  if(!ws) return;
  stopRestTicking();
  const list = state.musculacao[ws.day]||[];
  const ex = list[ws.exIdx];
  const seriesCount = ex ? (parseInt(ex.series,10)||1) : 1;
  const movingToNewExercise = ws.serieIdx >= seriesCount-1;
  if(!movingToNewExercise){ ws.serieIdx++; }
  else{ ws.exIdx++; ws.serieIdx=0; }
  ws.phase = 'exercise';
  ws.restEndAt = null;
  // Só recalcula a sugestão ao trocar de exercício — dentro do mesmo exercício, mantém a carga/reps que
  // a pessoa acabou de usar na série anterior (senão a sugestão subiria sozinha a cada série do treino,
  // já que a série recém-concluída passa a contar como "última carga registrada").
  if(movingToNewExercise){
    const nextEx = list[ws.exIdx];
    if(nextEx){
      const sug = suggestedForExercise(nextEx);
      ws.curPeso = sug.peso; ws.curReps = sug.reps;
    }
  }
  saveWorkoutSession();
  render();
}
function skipRest(){ advanceAfterRest(); }
function addRestTime(sec){
  const ws = state.workoutSession;
  if(!ws || ws.phase!=='rest') return;
  ws.restEndAt += sec*1000;
  ws.restTotalSec += sec;
  saveWorkoutSession();
  render();
}
function finishWorkoutSession(){
  const ws = state.workoutSession;
  if(!ws) return;
  stopRestTicking();
  const elapsedSec = Math.round((Date.now()-ws.startedAt)/1000);
  state.workoutSessionsLog.push({ day:ws.day, data:todayISO(), volume:Math.round(ws.totalVolume), series:ws.doneSeries, duracaoSeg:elapsedSec });
  saveWorkoutSessionsLog();
  ws.phase = 'summary';
  ws.elapsedSec = elapsedSec;
  saveWorkoutSession();
  render();
}
function exitWorkoutSession(){
  if(state.workoutSession && state.workoutSession.phase!=='summary'){
    if(!confirm('Sair do treino agora? As séries já registradas ficam salvas, mas o cronômetro é interrompido.')) return;
  }
  stopRestTicking();
  state.workoutSession = null;
  saveWorkoutSession();
  render();
}
// Compara com a última vez que esse MESMO dia da semana foi treinado (o app não tem um conceito de
// "tipo de treino" separado do dia da semana) — ignora a entrada de hoje mesma.
function lastVolumeForDay(day, excludeDate){
  const entries = state.workoutSessionsLog.filter(e=>e.day===day && e.data!==excludeDate);
  return entries.length ? entries[entries.length-1] : null;
}
function renderWorkoutSession(){
  const ws = state.workoutSession;
  const list = state.musculacao[ws.day] || [];
  if(ws.phase === 'summary'){
    const prev = lastVolumeForDay(ws.day, todayISO());
    let compareHtml = '';

      compareHtml = `<div class="wex-comparecard ${up?'':'down'}">
        <div class="k">vs. última ${ws.day}</div>
        <div class="v">${up?'↑ +':'↓ '}${Math.abs(diff)}kg (${up?'+':''}${pct}%)</div>
      </div>`;
    }
    const min = Math.floor((ws.elapsedSec||0)/60);
    return `
      <div class="wex-root wex-summary">
        <div class="wex-summarycheck"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>

        </div>

      </div>`;
  }
  if(ws.phase === 'rest'){
    const remaining = Math.max(0, Math.round((ws.restEndAt - Date.now())/1000));
    const m = Math.floor(remaining/60), s = remaining%60;
    const pct = ws.restTotalSec>0 ? remaining/ws.restTotalSec : 0;
    const circumference = 615.75;
    const offset = circumference*(1-pct);
    const ex = list[ws.exIdx];
    const seriesCount = ex ? (parseInt(ex.series,10)||1) : 1;
    let nextLabel = '';
    if(ex && ws.serieIdx < seriesCount-1) nextLabel = `${ex.nome} · Série ${ws.serieIdx+2} de ${seriesCount}`;
    else if(list[ws.exIdx+1]) nextLabel = `${list[ws.exIdx+1].nome} · Série 1 de ${list[ws.exIdx+1].series}`;
    return `
      <div class="wex-root wex-rest">
        <div class="wex-restlabel">Descanso</div>
        <div class="wex-restring">
          <svg width="220" height="220" viewBox="0 0 220 220">

            <circle class="fg" cx="110" cy="110" r="98" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"></circle>
          </svg>
          <div class="center"><div class="wex-resttimer">${m}:${String(s).padStart(2,'0')}</div></div>
        </div>
        ${nextLabel ? `<div class="wex-nexthint">Próximo: <b>${nextLabel}</b></div>` : '<div class="wex-nexthint">&nbsp;</div>'}
        <div class="wex-restactions">

  const ex = list[ws.exIdx];

  const seriesCount = parseInt(ex.series,10)||1;

  const prevText = lastSets && lastSets.length ? `Última vez: ${Math.max(...lastSets.map(s=>parseFloat(s.peso)||0))}kg × ${lastSets[lastSets.length-1].reps}` : 'Primeira vez nesse exercício';
  return `

    </div>`;

function wireWorkoutSession(){
  const exitEl = document.querySelector('[data-wexexit]');
  if(exitEl) exitEl.onclick = exitWorkoutSession;
  document.querySelectorAll('[data-wexadj]').forEach(el=>{
    el.onclick = ()=>{
      const ws = state.workoutSession; if(!ws) return;
      const field = el.getAttribute('data-wexadj');
      const delta = parseFloat(el.getAttribute('data-wexdelta'));
      if(field==='peso') ws.curPeso = Math.max(0, Math.round(((parseFloat(ws.curPeso)||0)+delta)*10)/10);
      else ws.curReps = Math.max(0, (parseInt(ws.curReps,10)||0)+delta);
      render();
    };
  });
  const concluirEl = document.querySelector('[data-wexconcluir]');
  if(concluirEl) concluirEl.onclick = ()=>{
    const ws = state.workoutSession; if(!ws) return;
    concluirSerieAction(ws.curPeso, ws.curReps);
  };
  const addRestEl = document.querySelector('[data-wexaddrest]');
  if(addRestEl) addRestEl.onclick = ()=> addRestTime(15);
  const skipRestEl = document.querySelector('[data-wexskiprest]');
  if(skipRestEl) skipRestEl.onclick = ()=> skipRest();
  const finishEl = document.querySelector('[data-wexfinish]');
  if(finishEl) finishEl.onclick = ()=>{ state.workoutSession=null; saveWorkoutSession(); render(); };
}

// Recorta em quadrado e reduz a imagem antes de guardar — uma foto de câmera direto passaria de vários
// MB em base64, o que pesaria demais salva no localStorage.
function readAndResizeImage(file, size, cb){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const cropSize = Math.min(img.width, img.height);
      const sx = (img.width-cropSize)/2, sy = (img.height-cropSize)/2;
      ctx.drawImage(img, sx, sy, cropSize, cropSize, 0, 0, size, size);
      cb(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

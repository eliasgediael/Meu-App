async function importBackupFile(file){
  let obj;
  try{ obj = JSON.parse(await file.text()); }catch(e){ alert('Arquivo inválido.'); return; }
  if(!confirm('Isso substitui todos os dados atuais do app pelos do backup. Continuar?')) return;
  for(const k of Object.keys(obj)){
    try{ await window.storage.set(k, obj[k], false); }catch(e){}
  }
  alert('Backup importado! O app vai recarregar.');
  location.reload();
}
function apagarTudo(){
  if(!confirm('Isso apaga TODOS os dados do app (treinos, histórico, perfil, tudo) e não pode ser desfeito. Continuar?')) return;
  if(!confirm('Tem certeza mesmo? Essa ação é definitiva.')) return;
  BACKUP_KEYS.forEach(k=>{ try{ localStorage.removeItem('treinoapp:'+k); }catch(e){} });
  location.reload();
}
function toggleCorridaDone(day){
  const key = corridaProgressKey(day);
  const prev = corridaEntryProgress(day) || {};
  const willBeDone = !isCorridaDone(day);
  if(willBeDone){
    const entry = state.treinos.find(t=>dayAbbrevOf(t.day)===day);
    const km = entry && entry.totalKm ? parseFloat(entry.totalKm) : 0;
    const ativo = state.equipamentos.tenis.find(t=>t.ativo);
    if(ativo && km){
      ativo.km = Math.round((ativo.km+km)*10)/10;
      saveEquipamentos();
    }
    state.corridaProgress[key] = { ...prev, done:true, shoeCredit: (ativo && km) ? {tenisId:ativo.id, km} : null };
  }else{
    const credit = prev.shoeCredit;
    if(credit){
      const t = state.equipamentos.tenis.find(x=>x.id===credit.tenisId);
      if(t){ t.km = Math.max(0, Math.round((t.km-credit.km)*10)/10); saveEquipamentos(); }
    }
    state.corridaProgress[key] = { ...prev, done:false, shoeCredit:null };
  }
  saveCorridaProgress(); render();
}
function delTreinoCorrida(day){
  if(!confirm('Excluir esse treino de corrida? Não dá pra desfazer.')) return;
  state.treinos = state.treinos.filter(t=>dayAbbrevOf(t.day)!==day);
  state.isDemo = false;
  state.expandedPhase = null;
  saveTreinos();
  render();
}
function addExercicio(day, ex){
  if(!state.musculacao[day]) state.musculacao[day] = [];
  state.musculacao[day].push({ id: Date.now().toString(), done:false, ...ex });
  saveMusc(); render();
}
function updateExercicio(day, id, fields){
  const list = state.musculacao[day] || [];
  const idx = list.findIndex(e=>e.id===id);
  if(idx > -1) list[idx] = { ...list[idx], ...fields };
  saveMusc(); render();
}

  const ex = (state.musculacao[day]||[]).find(e=>e.id===id);
  if(ex) ex.done = !ex.done;
  saveMusc(); render();
}
function delExercicio(day, id){

}
function addAtividade(day, at){

}

// 'done' = tem algo feito naquele dia, 'pending' = tem treino agendado mas ainda não feito, 'none' = dia livre.
function dayStatus(d, tab){
  const hasCorrida = state.treinos.some(t=>dayAbbrevOf(t.day)===d);
  const hasMusc = (state.musculacao[d]||[]).length>0;
  const hasOutros = (state.outros[d]||[]).length>0;
  const outrosDone = hasOutros && (state.outros[d]||[]).some(a=>a.done);
  if(tab==='corrida') return !hasCorrida ? 'none' : (isCorridaDone(d) ? 'done' : 'pending');
  if(tab==='musculacao') return !hasMusc ? 'none' : ((state.musculacao[d]||[]).some(e=>e.done) ? 'done' : 'pending');
  if(!hasCorrida && !hasMusc && !hasOutros) return 'none';
  const corridaDone = hasCorrida && isCorridaDone(d);
  const muscDone = hasMusc && (state.musculacao[d]||[]).some(e=>e.done);
  return (corridaDone || muscDone || outrosDone) ? 'done' : 'pending';
}
// Data real do dia da semana pra mostrar na faixa — usa a data do treino de corrida quando existe
// (assim acompanha a semana certa do plano), senão calcula a partir da semana corrente de verdade.
function dayDateLabel(d){
  const entry = state.treinos.find(t=>dayAbbrevOf(t.day)===d);
  if(entry){
    const m = entry.day.match(/(\d{2}\/\d{2})/);
    if(m) return m[1];
  }
  const monday = vdotMondayOf(new Date());
  const idx = DAY_ABBR.indexOf(d);
  const dt = new Date(monday);
  dt.setDate(dt.getDate()+idx);
  return vdotFormatDDMM(dt);
}
function weekSummaryText(){
  let scheduled = 0, done = 0;
  DAY_ABBR.forEach(d=>{
    const st = dayStatus(d);
    if(st !== 'none') scheduled++;
    if(st === 'done') done++;
  });
  if(scheduled === 0) return 'Nenhum treino agendado ainda';
  return done+' de '+scheduled+' dias treinados essa semana';
}
// Sequência dentro da semana atual (não temos histórico de dia-a-dia de semanas passadas pra musculação,
// então só conta de forma honesta o que dá pra verificar: os dias seguidos até hoje, nesta semana).
function currentStreakDays(){
  const todayIdx = (new Date().getDay()+6)%7;
  let streak = 0;
  for(let i=todayIdx; i>=0; i--){
    const st = dayStatus(DAY_ABBR[i]);
    if(st === 'done') streak++;
    else if(st === 'pending') break;
  }
  return streak;
}

function goBack(){
  if(state.tab==='vdot' && (state.vdotStep === 2 || state.vdotStep === 3)){ state.vdotStep--; render(); return; }
  if(PRIMARY_TABS.includes(state.tab)) return;
  state.tab = BACK_TARGET[state.tab] || 'hoje';
  render();
}
// Arrastar da borda esquerda pra direita volta uma tela, igual o gesto nativo do iOS — registrado uma
// única vez (fora do render) já que não depende de nenhum elemento do DOM recriado a cada render.
(function setupSwipeBack(){
  let startX=null, startY=null;
  document.addEventListener('touchstart', (e)=>{
    if(e.touches.length!==1){ startX=null; return; }
    const t = e.touches[0];
    if(t.clientX > 24){ startX=null; return; }
    startX = t.clientX; startY = t.clientY;
  }, {passive:true});
  document.addEventListener('touchend', (e)=>{
    if(startX==null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - startX, dy = t.clientY - startY;
    startX = null;
    if(dx > 80 && Math.abs(dy) < 60 && !PRIMARY_TABS.includes(state.tab) && !state.modalOpen) goBack();
  }, {passive:true});
})();

      const goalEl = document.querySelector('#vdotGoalPills .day-pill.active');
      const nivelEl = document.querySelector('#vdotNivelPills .day-pill.active');
      const raceEl = document.querySelector('#vdotRaceToggle .day-pill.active');
      const diasArr = DAY_ABBR.filter(d => document.querySelector(`[data-vdotdia="${d}"]`).classList.contains('active'));
      if(diasArr.length === 0){ alert('Escolhe pelo menos um dia da semana.'); return; }
      const goal = parseFloat(goalEl.getAttribute('data-goal'));
      const nivel = nivelEl.getAttribute('data-nivel');
      const hasRace = raceEl.getAttribute('data-race')==='yes';
      const currentLongInput = parseFloat(document.getElementById('vdotCurrentLong').value);
      const currentLongKm = (currentLongInput > 0) ? currentLongInput : (VDOT_LONG_RUN_START_KM[nivel][goal] || VDOT_LONG_RUN_START_KM[nivel][10]);
      let totalWeeks, raceDate = null;
      state.vdotPlanWarnMsg = null;
      if(hasRace){
        raceDate = document.getElementById('vdotRaceDate').value;
        if(!raceDate){ alert('Escolhe a data da prova.'); return; }
        const today = new Date();
        const race = new Date(raceDate+'T00:00:00');
        const diffWeeks = Math.ceil((race-today)/(1000*60*60*24*7));
        totalWeeks = Math.max(6, Math.min(20, diffWeeks));
        if(diffWeeks<6 || diffWeeks>20){
          state.vdotPlanWarnMsg = `Sua prova está a ${diffWeeks} semanas — ajustei o plano pra ${totalWeeks} semanas (faixa recomendada), mas o ideal seria mais tempo de preparo.`;
        }
      }else{
        const weeksEl = document.querySelector('#vdotWeeksPills .day-pill.active');
        totalWeeks = parseInt(weeksEl.getAttribute('data-weeks'),10);
      }
      if(!state.vdotPlanWarnMsg && diasArr.length <= 3 && goal >= 21.0975){
        state.vdotPlanWarnMsg = `Com só ${diasArr.length} dia${diasArr.length>1?'s':''} de treino por semana pra ${VDOT_GOAL_NAME[goal]}, o longão acaba sendo uma fatia bem grande do volume total (não tem como dividir entre poucos dias). Se puder encaixar mais um dia de corrida, o treino fica mais equilibrado.`;
      }
      const paces = state.corridaVdotData.paces;
      const raceTimeSec = predictRaceTimeSec(state.corridaVdotData.vdot, goal);
      const phases = buildVdotPhases(totalWeeks, goal);
      const plan = buildAllVdotWeeks(phases, nivel, paces, goal, diasArr, raceTimeSec, currentLongKm);
      const startMonday = vdotISODate(vdotMondayOf(new Date()));
      state.corridaVdotData = { ...state.corridaVdotData, goal, nivel, hasRace, raceDate, weeksChoice: totalWeeks, diasArr, currentLongKm, plan, startMonday, currentWeekIndex: 1 };
      saveCorridaVdotData();
      materializeVdotWeekIntoTreinos(plan[0], startMonday);
      state.vdotStep = 4;
      state.tab = 'corrida';
      state.selectedDayCorrida = diasArr[0];
      render();
    };

        if(!nome){ document.getElementById('inNomeAt').focus(); return; }
        if(state.editingAtId) updateAtividade(state.selectedDayOutros, state.editingAtId, { nome, duracao, notas });
        else addAtividade(state.selectedDayOutros, { nome, duracao, notas });
        state.editingAtId = null;
      }else if(state.modalType === 'gerar'){
        const nivel = document.getElementById('inNivel').value;
        const diasArr = DAY_ABBR.filter(d => document.querySelector(`[data-gerardia="${d}"]`).classList.contains('active'));
        if(diasArr.length === 0){ alert('Escolha pelo menos um dia da semana.'); return; }
        const equip = document.getElementById('inEquip').value;
        const objetivoEl = document.getElementById('inObjetivoAvancado');
        const objetivo = objetivoEl ? objetivoEl.value : 'forca';
        const plan = buildPlan(nivel, diasArr, equip, objetivo);
        const hasExisting = DAY_ABBR.some(d => (state.musculacao[d]||[]).length > 0);
        if(hasExisting){
          const ok = confirm('Isso substitui a semana inteira de musculação (todos os dias) pelo novo treino gerado. Continuar?');
          if(!ok) return;
        }
        DAY_ABBR.forEach(d=>{ state.musculacao[d] = []; });
        Object.keys(plan).forEach(d=>{
          state.musculacao[d] = plan[d].map(e => ({ id: Date.now().toString()+Math.random().toString(36).slice(2), ...e }));
        });
        saveMusc();
        state.modalOpen = false;
        render();
        return;
      }else if(state.modalType === 'editCorrida'){
        const day = state.selectedDayCorrida;
        const draft = state.corridaBuilderDraft;
        const type = (draft.tipo||'').trim();
        if(!type){ document.getElementById('ecTipo').focus(); return; }
        const steps = draft.blocks.map(blockToStep);
        const totalKmSum = steps.reduce((s,x)=>s+x.km, 0);
        const totalMinSum = steps.reduce((s,x)=>s+x.min, 0);
        const fields = {
          type,
          totalKm: totalKmSum ? Math.round(totalKmSum*10)/10 : '',
          totalMin: totalMinSum ? Math.round(totalMinSum) : null,
          steps: steps.length ? steps.map(s=>({ name:s.name, km:Math.round(s.km*100)/100, pace:s.pace, desc:s.desc })) : null,
          cor: inferCorTipo(type),
          objetivo: '',
          builderBlocks: draft.blocks,
          warmupDesc:'', warmupPace:'', mainDesc:'', mainPace:'', cooldownDesc:'', cooldownPace:'',
        };
        const idx = state.treinos.findIndex(t=>dayAbbrevOf(t.day)===day);
        if(idx > -1) state.treinos[idx] = { ...state.treinos[idx], ...fields };
        else{
          // Treino criado na mão também ganha uma data real (não só o dia da semana abstrato) — assim
          // o rótulo de data e o histórico por-dia funcionam igual aos treinos gerados pelo plano.
          const dNew = vdotMondayOf(new Date());
          dNew.setDate(dNew.getDate() + DAY_ABBR.indexOf(day));
          state.treinos.push({ day: day+' '+vdotFormatDDMM(dNew), ...fields });
        }
        state.isDemo = false;
        saveTreinos();
        state.modalOpen = false;
        state.corridaBuilderDraft = null;
        render();
        return;
      }else if(state.modalType === 'corridaLog'){
        const daySel = state.corridaLogDay || document.getElementById('inCorridaDay').value;
        const pace = document.getElementById('inPaceReal').value.trim();
        const tempo = document.getElementById('inTempoReal').value.trim();
        const km = document.getElementById('inKmReal').value.trim();
        const prev = corridaEntryProgress(daySel) || {};
        const dataField = (state.corridaLogPrefill && state.corridaLogPrefill.data) || prev.data || todayISO();
        // desfaz um crédito de tênis de um log anterior dessa mesma data, pra não contar km em dobro
        if(prev.shoeCredit){
          const prevT = state.equipamentos.tenis.find(x=>x.id===prev.shoeCredit.tenisId);
          if(prevT) prevT.km = Math.max(0, Math.round((prevT.km-prev.shoeCredit.km)*10)/10);
        }
        const entryForShoe = state.treinos.find(t=>dayAbbrevOf(t.day)===daySel);
        const realKm = parseFloat(km) || (entryForShoe && entryForShoe.totalKm ? parseFloat(entryForShoe.totalKm) : 0);
        const ativoTenis = state.equipamentos.tenis.find(t=>t.ativo);
        let shoeCredit = null;
        if(ativoTenis && realKm){ ativoTenis.km = Math.round((ativoTenis.km+realKm)*10)/10; shoeCredit = {tenisId:ativoTenis.id, km:realKm}; }
        saveEquipamentos();
        state.corridaProgress[corridaProgressKey(daySel)] = { ...prev, done:true, pace, tempo, km, data: dataField, shoeCredit };
        saveCorridaProgress();
        state.selectedDayCorrida = daySel;
        state.corridaLogDay = null; state.corridaLogPrefill = null;
        state.modalOpen = false;
        render();
        return;
      }
      state.modalOpen = false;
      render();
    };
  }
}

function svgLineChart(points, opts){
  const { width=300, height=140, color='var(--accent)', formatY=(v)=>v } = opts || {};
  if(!points || points.length===0) return `<div class="empty-state">Sem dados ainda.</div>`;
  const pad = 30;
  const ys = points.map(p=>p.y);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const rangeY = (maxY-minY) || 1;
  const stepX = points.length>1 ? (width-2*pad)/(points.length-1) : 0;
  const coord = (i,y)=>{
    const px = pad + i*stepX;
    const t = (y-minY)/rangeY;
    const py = height-pad - t*(height-2*pad);
    return [px,py];
  };
  const pathD = points.map((p,i)=>{ const [x,y]=coord(i,p.y); return (i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1); }).join(' ');
  const dots = points.map((p,i)=>{ const [x,y]=coord(i,p.y); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${color}"></circle>`; }).join('');
  const showEvery = points.length > 8 ? Math.ceil(points.length/8) : 1;
  const labels = points.map((p,i)=>{
    if(i % showEvery !== 0 && i !== points.length-1) return '';
    const [x] = coord(i,p.y);
    return `<text x="${x.toFixed(1)}" y="${height-8}" font-size="9" fill="var(--text-dim)" text-anchor="middle">${p.x}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" style="overflow:visible;">
    <path d="${pathD}" fill="none" stroke="${color}" stroke-width="2"/>
    ${dots}
    ${labels}
    <text x="${pad}" y="14" font-size="10" fill="var(--text-dim)">${formatY(maxY)}</text>
    <text x="${pad}" y="${height-pad+4}" font-size="10" fill="var(--text-dim)">${formatY(minY)}</text>
  </svg>`;
}

function renderProgresso(){
  const hist = state.historicoCarga || {};
  const keys = Object.keys(hist).filter(k=>hist[k] && hist[k].length>0);
  const selectedKey = (state.progressoExKey && keys.includes(state.progressoExKey)) ? state.progressoExKey : keys[0];
  const nameFor = (key)=>{
    for(const day of DAY_ABBR){
      const ex = (state.musculacao[day]||[]).find(e=>(e.repdbId||e.nome)===key);
      if(ex) return ex.nome;
    }
    return key;
  };
  let cargaSection;
  if(keys.length===0){
    cargaSection = `<div class="empty-state">Ainda sem histórico de carga.<br>Toca no peso de um exercício pra começar a registrar.</div>`;
  }else{
    const points = hist[selectedKey].map(h=>({ x: h.data.slice(5).replace('-','/'), y: topSetWeight(h) })).filter(p=>!isNaN(p.y) && p.y>0);
    const historyRows = hist[selectedKey].map((h,i)=>`
      <div class="leg-card" style="padding:9px 12px;margin-bottom:6px;">
        <div class="leg-left"><div class="leg-desc">${h.data.split('-').reverse().join('/')}</div></div>
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="leg-pace" style="white-space:normal;text-align:right;font-size:12.5px;">${setsSummaryText(h)}</div>
          <button class="del-btn" data-delhist="${selectedKey}|${i}" title="Remover registro">×</button>
        </div>
      </div>
    `).join('');
    cargaSection = `
      <div class="field"><label>Exercício</label>
        <select id="progExSelect">${keys.map(k=>`<option value="${k}" ${k===selectedKey?'selected':''}>${nameFor(k)}</option>`).join('')}</select>
      </div>
      ${svgLineChart(points, { formatY:v=>v+'kg' })}
      <div style="margin-top:10px;">${historyRows}</div>
    `;
  }

  const medHist = state.historicoMedidas || {};
  const medKeys = MEDIDAS_FIELDS.filter(m=>medHist[m.key] && medHist[m.key].length>0);
  const selectedMed = (state.progressoMedidaKey && medKeys.some(m=>m.key===state.progressoMedidaKey)) ? state.progressoMedidaKey : (medKeys[0] ? medKeys[0].key : null);
  let medidasSection;
  if(!selectedMed){
    medidasSection = `<div class="empty-state">Ainda sem medidas registradas.<br>Salve uma medida no menu (Perfil › Medidas corporais) pra começar.</div>`;
  }else{
    const medPoints = medHist[selectedMed].map(h=>({ x: h.data.slice(5).replace('-','/'), y: parseFloat(h.valor) })).filter(p=>!isNaN(p.y));
    const medRows = medHist[selectedMed].map((h,i)=>`
      <div class="leg-card" style="padding:9px 12px;margin-bottom:6px;">
        <div class="leg-left"><div class="leg-desc">${h.data.split('-').reverse().join('/')}</div></div>
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="leg-pace">${h.valor}cm</div>
          <button class="del-btn" data-delmedhist="${selectedMed}|${i}" title="Remover registro">×</button>
        </div>
      </div>
    `).join('');
    medidasSection = `
      <div class="field"><label>Medida</label>
        <select id="progMedSelect">${medKeys.map(m=>`<option value="${m.key}" ${m.key===selectedMed?'selected':''}>${m.label}</option>`).join('')}</select>
      </div>
      ${svgLineChart(medPoints, { formatY:v=>v+'cm', color:'var(--amber)' })}
      <div style="margin-top:10px;">${medRows}</div>
    `;
  }

  const corridaPts = [];
  DAY_ABBR.forEach(d=>{
    const p = corridaEntryProgress(d);
    if(p && p.done && p.pace){
      const sec = parsePaceToSec(p.pace);
      if(sec) corridaPts.push({ x: p.data ? p.data.slice(5).replace('-','/') : d, y: sec });
    }
  });
  corridaPts.sort((a,b)=> a.x>b.x?1:(a.x<b.x?-1:0));
  const paceSection = corridaPts.length
    ? svgLineChart(corridaPts, { formatY:v=>Math.floor(v/60)+':'+String(Math.round(v%60)).padStart(2,'0') })
    : `<div class="empty-state">Ainda sem corridas com pace real registrado.<br>Marque um treino como concluído ou importe um .FIT.</div>`;

  const kmPts = [];
  DAY_ABBR.forEach(d=>{
    const p = corridaEntryProgress(d);
    if(p && p.done && p.km){ kmPts.push({ x: p.data ? p.data.slice(5).replace('-','/') : d, y: parseFloat(p.km) }); }
  });
  kmPts.sort((a,b)=> a.x>b.x?1:(a.x<b.x?-1:0));

  return `
    <div class="leg-tag" style="margin-bottom:8px;">Musculação — evolução de carga</div>
    ${cargaSection}
    <div class="leg-tag" style="margin:22px 0 8px;">Medidas corporais — evolução</div>
    ${medidasSection}
    <div class="leg-tag" style="margin:22px 0 8px;">Corrida — evolução de pace real</div>
    ${paceSection}
    ${kmPts.length ? `<div class="leg-tag" style="margin:22px 0 8px;">Corrida — distância por treino</div>${svgLineChart(kmPts, { formatY:v=>v+'km', color:'var(--blue)' })}` : ''}
  `;
}

function renderComparativo(){
  const rows = [];
  DAY_ABBR.forEach(d=>{
    const entry = state.treinos.find(t=>dayAbbrevOf(t.day)===d);
    const prog = corridaEntryProgress(d);
    if(!entry || !prog || !(prog.pace || prog.tempo || prog.km)) return;
    const plannedPaceSec = parsePaceToSec(entry.mainPace);
    const realPaceSec = parsePaceToSec(prog.pace);
    let deltaHtml = '';
    if(plannedPaceSec && realPaceSec){
      const diff = realPaceSec - plannedPaceSec;
      const diffAbs = Math.abs(diff);
      const diffStr = Math.floor(diffAbs/60)+':'+String(Math.round(diffAbs%60)).padStart(2,'0');
      deltaHtml = diff<0
        ? `<div style="font-size:12px;font-weight:700;color:var(--accent);">${diffStr}/km mais rápido</div>`
        : diff>0
          ? `<div style="font-size:12px;font-weight:700;color:var(--amber);">${diffStr}/km mais lento</div>`
          : `<div style="font-size:12px;font-weight:700;color:var(--text-dim);">no ritmo planejado</div>`;
    }
    rows.push(`
      <div class="leg-card" style="flex-direction:column;align-items:stretch;gap:8px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div class="leg-tag">${entry.day} · ${entry.type||'Treino'}</div>
          ${deltaHtml}
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div>
            <div style="font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.3px;">Planejado</div>
            <div style="font-weight:700;font-size:15px;">${entry.totalKm ? entry.totalKm+'km' : '—'}</div>
            <div style="font-size:12px;color:var(--text-dim);">${entry.mainPace||'—'}</div>
          </div>
          <div>
            <div style="font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.3px;">Real</div>
            <div style="font-weight:700;font-size:15px;color:var(--accent);">${prog.km ? prog.km+'km' : '—'}</div>
            <div style="font-size:12px;color:var(--accent);">${prog.pace ? prog.pace+'/km' : (prog.tempo||'—')}</div>
          </div>
        </div>
      </div>
    `);
  });
  if(rows.length===0){
    return `<div class="empty-state">Ainda sem treinos com dado real registrado essa semana.<br>Marque um treino como concluído ou importe um .FIT pra comparar com o planejado.</div>`;
  }
  return rows.join('');
}

function renderVdot(){
  const cv = state.corridaVdotData || {};
  const step = state.vdotStep;

  if(step===1){
    return `
      <div class="field"><label>Distância do teste (prova curta recente, esforço máximo)</label>
        <select id="vdotTestDist">
          <option value="1600" ${cv.testDist==='1600'?'selected':''}>1600m (1 milha)</option>
          <option value="3000" ${cv.testDist==='3000'?'selected':''}>3km</option>
          <option value="5000" ${!cv.testDist||cv.testDist==='5000'?'selected':''}>5km</option>
          <option value="10000" ${cv.testDist==='10000'?'selected':''}>10km</option>
        </select>
      </div>
      <div class="field"><label>Seu tempo nessa distância</label>
        <input type="text" id="vdotTestTime" placeholder="ex: 24:30" value="${cv.testTime||''}">
      </div>
      <button class="primary" id="vdotBtnCalc">Calcular VDOT</button>
    `;
  }

  if(step===2){
    const p = cv.paces;
    const tiles = [
      { cor:'var(--blue)', label:'Fácil', value:`${daysToPaceStr(p.Ef)} ~ ${daysToPaceStr(p.Es)}`, wide:true },
      { cor:'var(--accent)', label:'Maratona', value:paceRangeWithMargin(p.M,3) },
      { cor:'var(--amber)', label:'Limiar', value:paceRangeWithMargin(p.T,3) },
      { cor:'var(--danger)', label:'Intervalado', value:paceRangeWithMargin(p.I,3) },
      { cor:'var(--rep)', label:'Repetição', value:paceRangeWithMargin(p.R,3) },
    ];
    return `
      <div class="leg-card" style="flex-direction:column;align-items:flex-start;gap:2px;background:var(--accent-soft);border:1px solid var(--accent);margin-bottom:14px;">
        <div style="font-size:28px;font-weight:800;color:var(--accent);">${cv.vdot.toFixed(1)}</div>
        <div style="font-size:12px;color:var(--text-dim);">VDOT (sua capacidade aeróbica atual)</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px;">
        ${tiles.map(t=>`
          <div class="leg-card" style="${t.wide?'grid-column:1/-1;':''}border-left:3px solid ${t.cor};margin-bottom:0;">
            <div class="leg-left" style="width:100%;">
              <div class="leg-tag" style="color:${t.cor};">${t.label}</div>
              <div class="leg-desc" style="font-size:15px;font-weight:700;color:var(--text);white-space:normal;">${t.value}/km</div>
            </div>
          </div>
        `).join('')}
      </div>
      <button class="primary" id="vdotBtnContinue">Continuar</button>
    `;
  }

  if(step===3){
    const f = state.corridaVdotData || {};
    const goal = f.goal || 10;
    const nivel = f.nivel || 'intermediario';
    const hasRace = !!f.hasRace;
    const weeksChoice = f.weeksChoice || 8;
    return `
      <div class="field"><label>Distância da meta</label>
        <div style="display:flex;gap:8px;" id="vdotGoalPills">
          <div class="day-pill ${goal==5?'active':''}" data-goal="5">5km</div>
          <div class="day-pill ${goal==10?'active':''}" data-goal="10">10km</div>
          <div class="day-pill ${goal==21.0975?'active':''}" data-goal="21.0975">21km</div>
          <div class="day-pill ${goal==42.195?'active':''}" data-goal="42.195">42km</div>
        </div>
      </div>
      <div class="field"><label>Nível</label>
        <div style="display:flex;gap:8px;" id="vdotNivelPills">
          <div class="day-pill ${nivel==='iniciante'?'active':''}" data-nivel="iniciante">Iniciante</div>
          <div class="day-pill ${nivel==='intermediario'?'active':''}" data-nivel="intermediario">Intermediário</div>
          <div class="day-pill ${nivel==='avancado'?'active':''}" data-nivel="avancado">Avançado</div>
        </div>
      </div>
      <div class="field"><label>Sua rodagem mais longa hoje em dia (km)</label>
        <input type="text" id="vdotCurrentLong" inputmode="decimal" value="${f.currentLongKm||''}" placeholder="ex: ${VDOT_LONG_RUN_START_KM[nivel][goal] || VDOT_LONG_RUN_START_KM[nivel][10]}">
        <div class="leg-desc" style="white-space:normal;font-size:12px;color:var(--text-dim);margin-top:4px;">O plano parte daqui, não de um valor genérico — se você já corre 15km, começa perto disso.</div>
      </div>
      <div class="field"><label>Dias da semana</label>
        <div class="day-strip" style="padding:0;" id="vdotDiasPicker">
          ${DAY_ABBR.map(d=>`<div class="day-pill ${(f.diasArr||['Seg','Qua','Sex']).includes(d)?'active':''}" data-vdotdia="${d}">${d}</div>`).join('')}
        </div>
      </div>
      <div class="field"><label>Prova marcada?</label>
        <div style="display:flex;gap:8px;" id="vdotRaceToggle">
          <div class="day-pill ${!hasRace?'active':''}" data-race="no">Sem prova marcada</div>
          <div class="day-pill ${hasRace?'active':''}" data-race="yes">Tenho prova marcada</div>
        </div>
      </div>
      <div class="field" id="vdotRaceDateField" style="display:${hasRace?'block':'none'};">
        <label>Data da prova</label>
        <input type="date" id="vdotRaceDate" value="${f.raceDate||''}">
      </div>
      <div class="field" id="vdotWeeksField" style="display:${hasRace?'none':'block'};">
        <label>Duração do plano</label>
        <div style="display:flex;gap:8px;" id="vdotWeeksPills">
          <div class="day-pill ${weeksChoice==4?'active':''}" data-weeks="4">4 sem</div>
          <div class="day-pill ${weeksChoice==8?'active':''}" data-weeks="8">8 sem</div>
          <div class="day-pill ${weeksChoice==12?'active':''}" data-weeks="12">12 sem</div>
          <div class="day-pill ${weeksChoice==16?'active':''}" data-weeks="16">16 sem</div>
        </div>
      </div>
      <div id="vdotPlanWarn"></div>
      <button class="primary" id="vdotBtnPlan">Gerar plano</button>
    `;
  }

  // step 4 — plano já existe: a navegação por semana e os treinos ficam na aba Corrida.
  if(!cv.plan) return `<div class="empty-state">Nenhum plano gerado ainda.</div>`;
  const totalWeeks = cv.plan.length;
  const currentIdx = cv.currentWeekIndex||1;
  const currentWeek = cv.plan.find(w=>w.weekNumber===currentIdx);
  return `
    ${state.vdotPlanWarnMsg ? `<div class="leg-desc" style="background:var(--amber-soft);color:var(--amber);padding:9px 12px;border-radius:8px;margin-bottom:12px;white-space:normal;">${state.vdotPlanWarnMsg}</div>` : ''}
    <div class="leg-card" style="flex-direction:column;align-items:flex-start;gap:6px;background:var(--accent-soft);border:1px solid var(--accent);margin-bottom:14px;">
      <div class="leg-tag" style="color:var(--accent);">Plano ativo · ${VDOT_GOAL_NAME[cv.goal]||''}</div>
      <div style="font-size:16px;font-weight:800;">Semana ${currentIdx} de ${totalWeeks} · ${currentWeek.phaseName}</div>
      <div style="font-size:12px;color:var(--text-dim);">VDOT ${cv.vdot.toFixed(1)}</div>
    </div>
    <div class="leg-tag" style="margin-bottom:8px;">O que o plano indica pra semana ${currentIdx}</div>
    ${currentWeek.days.map(w=>`
      <div class="leg-card" style="border-left:3px solid ${w.cor};">
        <div class="leg-left"><div class="leg-tag" style="color:${w.cor};">${w.day}</div><div class="leg-desc">${w.title}</div></div>
        <div class="leg-pace">${fmtKm(w.totalKm)}</div>
      </div>
    `).join('')}
    <div class="leg-desc" style="white-space:normal;margin:10px 0 16px;">Isso é o valor original do plano. O que está de fato salvo (e que dá pra editar) fica na aba Corrida — se você mudar um treino por lá, ele passa a valer, mesmo que diferente do que está aqui.</div>
    <button class="primary" id="vdotBtnRestart" style="background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border);">Recalcular do zero</button>
  `;
}

          <div class="blk-card">
            <div class="blk-group-head">
              <span>Repetir</span>
              <input type="text" inputmode="numeric" class="blk-reps-input" data-blkreps="${b.id}" value="${b.reps}">
              <span style="flex:1;">vezes</span>
              <div class="blk-x" data-blkdel="${b.id}">×</div>
            </div>
            <div class="blk-substep" data-blkopenstep="${b.id}" data-blksub="0">
              <div class="blk-dot" style="background:${BLOCK_KIND_META.continua.cor};"></div>
              <div class="blk-name">Corrida</div>
              <div class="blk-sum">${stepSummaryText(work)}</div>
            </div>
            <div class="blk-substep" data-blkopenstep="${b.id}" data-blksub="1">
              <div class="blk-dot" style="background:${BLOCK_KIND_META.recup.cor};"></div>
              <div class="blk-name">Recuperação</div>
              <div class="blk-sum">${stepSummaryText(rest)}</div>
            </div>
          </div>`;
      }
      const meta = BLOCK_KIND_META[b.kind];
      return `
        <div class="blk-card">
          <div class="blk-head" data-blkopenstep="${b.id}">
            <div class="blk-dot" style="background:${meta.cor};"></div>
            <div class="blk-name">${meta.label}</div>
            <div class="blk-sum">${stepSummaryText(b)}</div>
            <div class="blk-x" data-blkdel="${b.id}">×</div>
          </div>
        </div>`;
    }).join('');
    const addMenu = ['aquec','continua','intervalado','desaq'].map(kind=>{
      const meta = kind==='intervalado' ? { label:'Intervalado', cor:'var(--amber)' } : BLOCK_KIND_META[kind];
      return `<div class="blk-addopt" data-blkadd="${kind}"><span class="blk-dot" style="background:${meta.cor};"></span>${meta.label}</div>`;
    }).join('');
    return `
      <div class="modal-overlay">
        <div class="modal">
          <h3>Editar treino · ${day}</h3>
          <div class="field"><label>Tipo de treino</label><input type="text" id="ecTipo" value="${draft.tipo}" placeholder="Intervalado" autofocus></div>

          <div class="blk-section-label">Blocos do treino</div>
          ${blocksHtml || `<div style="font-size:12.5px;color:var(--text-dim);margin-bottom:8px;">Nenhum bloco ainda — adiciona um abaixo.</div>`}

          <div class="blk-section-label">Adicionar bloco</div>
          <div class="blk-addmenu">${addMenu}</div>

          ${draft.blocks.length ? `<div class="blk-summary"><div class="k">Total do treino</div><div class="v">${fmtKm(Math.round(totalKm*10)/10)}${totalMin?' · ~'+formatDuration(totalMin*60):''}</div></div>` : ''}

          <div class="modal-actions"><button class="secondary" id="modalCancel">Cancelar</button><button class="primary" id="modalSave">Salvar</button></div>
          ${entry.type ? `<button id="modalRemove" style="width:100%;background:none;border:none;color:var(--danger);font-size:13px;font-weight:600;padding:14px 0 0;cursor:pointer;">Remover treino</button>` : ''}
        </div>
      </div>`;
  }
  if(state.modalType === 'corridaStepEditor'){
    const step = getEditingStep();
    if(!step) return '';
    const insideGroup = state.corridaStepEdit.subIdx != null;
    const kindOptions = insideGroup
      ? [['continua','Corrida'],['recup','Recuperação']]
      : [['aquec','Aquecimento'],['continua','Corrida'],['desaq','Desaquecimento']];
    return `
      <div class="modal-overlay">
        <div class="modal">
          <h3>Editando etapa</h3>
          <div class="field">
            <label>Tipo de etapa</label>
            <select id="stepKindSel">${kindOptions.map(([v,l])=>`<option value="${v}" ${step.kind===v?'selected':''}>${l}</option>`).join('')}</select>
          </div>

          <div class="blk-section-label">Duração</div>
          <div class="field-row">
            <div class="field"><label>Tipo</label>
              <select id="stepDurTypeSel">
                <option value="km" ${step.durType==='km'?'selected':''}>Distância</option>
                <option value="time" ${step.durType==='time'?'selected':''}>Tempo</option>
              </select>
            </div>
            ${step.durType==='km' ? `
              <div class="field"><label>Distância (km)</label><input type="text" inputmode="decimal" id="stepKmInput" value="${step.km}"></div>
            ` : `
              <div class="field"><label>Duração</label>
                <div style="display:flex;gap:6px;align-items:center;">
                  <input type="text" inputmode="numeric" id="stepHInput" value="${step.h}" placeholder="h" style="width:44px;text-align:center;padding:12px 4px;">
                  <span>:</span>
                  <input type="text" inputmode="numeric" id="stepMInput" value="${step.m}" placeholder="m" style="width:44px;text-align:center;padding:12px 4px;">
                  <span>:</span>
                  <input type="text" inputmode="numeric" id="stepSInput" value="${step.s}" placeholder="s" style="width:44px;text-align:center;padding:12px 4px;">
                </div>
              </div>
            `}
          </div>

          <div class="blk-section-label">Meta de intensidade</div>
          <div class="field">
            <label>Tipo</label>
            <select id="stepPaceTypeSel">
              <option value="none" ${step.paceType==='none'?'selected':''}>Sem objetivo</option>
              <option value="pace" ${step.paceType==='pace'?'selected':''}>Ritmo</option>
            </select>
          </div>
          ${step.paceType==='pace' ? `
            <div class="field-row">
              <div class="field"><label>De</label>
                <div style="display:flex;gap:4px;align-items:center;">
                  <input type="text" inputmode="numeric" id="paceLoM" value="${step.paceLoM}" placeholder="m" style="width:44px;text-align:center;">
                  <span>:</span>
                  <input type="text" inputmode="numeric" id="paceLoS" value="${step.paceLoS}" placeholder="s" style="width:44px;text-align:center;">
                </div>
              </div>
              <div class="field"><label>Até</label>
                <div style="display:flex;gap:4px;align-items:center;">
                  <input type="text" inputmode="numeric" id="paceHiM" value="${step.paceHiM}" placeholder="m" style="width:44px;text-align:center;">
                  <span>:</span>
                  <input type="text" inputmode="numeric" id="paceHiS" value="${step.paceHiS}" placeholder="s" style="width:44px;text-align:center;">
                  <span style="font-size:12.5px;color:var(--text-dim);white-space:nowrap;">min/km</span>
                </div>
              </div>
            </div>
          ` : ''}

          <div class="modal-actions"><button class="secondary" id="modalCancel">Voltar</button><button class="primary" id="stepDone">Concluído</button></div>
        </div>
      </div>`;
  }
  if(state.modalType === 'vdotWeekPicker'){
    const cv = state.corridaVdotData;
    const currentIdx = cv.currentWeekIndex||1;
    return `
      <div class="modal-overlay">
        <div class="modal">
          <h3>Trocar de semana</h3>
          <p class="modal-sub">Plano de ${cv.plan.length} semanas · objetivo ${VDOT_GOAL_NAME[cv.goal]||''}</p>
          <div style="max-height:50vh;overflow-y:auto;">
            ${cv.plan.map(w=>`
              <div class="leg-card" data-vdotweek="${w.weekNumber}" style="cursor:pointer;${w.weekNumber===currentIdx?'border-color:var(--accent);background:var(--accent-soft);':''}">
                <div class="leg-left"><div class="leg-tag">Semana ${w.weekNumber}</div><div class="leg-desc">${w.phaseName}</div></div>
                ${w.weekNumber===currentIdx ? `<div style="color:var(--accent);">${CHECK_SVG}</div>` : ''}
              </div>
            `).join('')}
          </div>
          <div class="modal-actions"><button class="secondary" id="modalCancel" style="flex:1;">Fechar</button></div>
        </div>
      </div>`;
  }
  if(state.modalType === 'corridaLog'){
    const day = state.corridaLogDay;
    const entry = day ? (state.treinos.find(t=>dayAbbrevOf(t.day)===day) || {}) : {};
    const pre = state.corridaLogPrefill || {};
    const needsDaySelect = !day;
    return `
      <div class="modal-overlay">
        <div class="modal">
          <h3>${pre.fromFit ? 'Corrida importada (.FIT)' : 'Concluir treino'}${day ? ' · '+day : ''}</h3>
          ${pre.fromFit ? `<p class="modal-sub">${entry.type ? entry.type+' — ' : ''}confira os dados antes de salvar</p>` : (entry.type ? `<p class="modal-sub">${entry.type}</p>` : '')}
          ${needsDaySelect ? `<div class="field"><label>Não achei a data no seu plano — em qual dia lançar?</label>
            <select id="inCorridaDay">${state.treinos.map(t=>{const d=dayAbbrevOf(t.day);return `<option value="${d}">${t.day} — ${t.type||'Treino'}</option>`;}).join('')}</select>
          </div>` : ''}
          <div class="field-row">
            <div class="field"><label>Pace real (min/km)</label><input type="text" id="inPaceReal" value="${pre.pace||''}" placeholder="5:20"></div>
            <div class="field"><label>Tempo real</label><input type="text" id="inTempoReal" value="${pre.tempo||''}" placeholder="45min"></div>
          </div>
          <div class="field"><label>Distância real (km)</label><input type="text" id="inKmReal" value="${pre.km||''}" inputmode="decimal" placeholder="${entry.totalKm||''}"></div>
          <div class="modal-actions"><button class="secondary" id="modalCancel">Cancelar</button><button class="primary" id="modalSave">Salvar</button></div>
        </div>
      </div>`;
  }
  if(state.modalType === 'gerar'){
    return `
      <div class="modal-overlay">
        <div class="modal">
          <h3>Gerar treino automático</h3>
          <p class="modal-sub">Monta a semana inteira de musculação pra você, com fotos incluídas.</p>
          <div class="field"><label>Nível</label>
            <select id="inNivel">
              <option value="iniciante">Iniciante (nunca treinei ou &lt; 6 meses)</option>
              <option value="intermediario">Intermediário (6 meses a 2 anos)</option>
              <option value="avancado">Avançado (2+ anos)</option>
            </select>
          </div>
          <div class="field" id="fieldObjetivoAvancado" style="display:none;"><label>Foco</label>
            <select id="inObjetivoAvancado">
              <option value="forca">Força (5×6–10, descanso maior)</option>
              <option value="hipertrofia">Hipertrofia/resistência (4×12–20)</option>
            </select>
          </div>
          <div class="field"><label>Dias da semana</label>
            <div class="day-strip" style="padding:0;">
              ${DAY_ABBR.map(d=>`<div class="day-pill ${['Seg','Qua','Sex'].includes(d)?'active':''}" data-gerardia="${d}">${d}</div>`).join('')}
            </div>
          </div>
          <div class="field"><label>Onde vai treinar</label>
            <select id="inEquip">
              <option value="academia">Academia completa</option>
              <option value="halteres">Casa com halteres</option>
              <option value="corpo">Só peso do corpo</option>
            </select>
          </div>
          <div class="modal-actions"><button class="secondary" id="modalCancel">Cancelar</button><button class="primary" id="modalSave">Gerar treino</button></div>
        </div>
      </div>`;
  }
  const editingAt = state.editingAtId ? (state.outros[state.selectedDayOutros]||[]).find(a=>a.id===state.editingAtId) : null;
  return `
    <div class="modal-overlay">
      <div class="modal">
        <h3>${editingAt ? 'Editar atividade' : 'Nova atividade'} · ${state.selectedDayOutros}</h3>
        <div class="field"><label>Nome da atividade</label><input type="text" id="inNomeAt" value="${editingAt?editingAt.nome:''}" placeholder="Muay Thai" autofocus></div>
        <div class="field"><label>Duração</label><input type="text" id="inDuracao" value="${editingAt?(editingAt.duracao||''):''}" placeholder="1h"></div>
        <div class="field"><label>Notas (opcional)</label><input type="text" id="inNotas" value="${editingAt?(editingAt.notas||''):''}" placeholder="Sparring leve"></div>
        <div class="modal-actions"><button class="secondary" id="modalCancel">Cancelar</button><button class="primary" id="modalSave">Salvar</button></div>
      </div>
    </div>`;
}

init();
</script>
</body>
</html>
